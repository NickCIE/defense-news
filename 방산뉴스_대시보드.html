"}, {"title": "김승원 법무장관 후보자, 수원 아파트 등 재산 6.8억원 신고", "url": "https://www.newsis.com/view/NISX20260904_0003776367", "source": "뉴시스", "published": "2026-09-04T02:09:47+00:00", "summary": "[서울=뉴시스] 이승재 기자 = 김승원 법무부 장관 후보자는 4일 국회에 약 6억8500만원의 재산을 보유 중이라고 신고했다. 국회가 정부로부터 제출받은 인사청문요청안에 따르면 김 후보자 본인 명의의 재산 2억1181만원 가운데 예금은 1억3451만원이다. 부동산은 경기도 수원시 장안구 사무실 임차권 3000만원을 보유 중이다. 사인간 채권 2억5000만원과 금융채무 2억7446만원도 신고했다. 배우자는 5억1559만원의 재산을 보유 중이다. 경기도 수원시 장안구 아파트 전세(임차)권 3억5700만원과 같은 지역 아파트 분양권 3억", "language": "ko"}, {"title": "TS, 전남광주미래산업박람회서 친환경차 핵심기술 선보인다", "url": "https://www.newsis.com/view/NISX20260904_0003776308", "source": "뉴시스 경제", "published": "2026-09-04T01:47:32+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 한국교통안전공단 자동차안전연구원(KATRI)은 2~5일 나흘간 열리는 '2026 전남광주미래산업박람회'에서 홍보·상담 부스를 운영한다고 4일 밝혔다. 이번 박람회는 모빌리티·로봇·드론 분야 최첨단 기술을 한 눈에 살펴볼 수 있는 호남권 최대 규모의 행사다. 전남광주통합특별시가 주최하고 국내 300개 기업이 참가한다. 연구원은 홍보 부스에서 TS 광주친환경자동차인증센터의 자동차 인증·시험 인프라를 비롯해 친환경차 안전성 평가제도, 핵심장치(배터리) 안전성 인증제 등 역점 사업을 알린다. 2025년 자동", "language": "ko"}, {"title": "러 외무 \"한미일 군사협력 확대 우려…대량살상무기 위험 높여\"", "url": "https://www.newsis.com/view/NISX20260904_0003776016", "source": "뉴시스", "published": "2026-09-04T01:29:27+00:00", "summary": "[서울=뉴시스]신정원 기자 = 세르게이 라브로프 러시아 외무장관은 3일(현지 시간) 한·미·일 군사협력 확대에 우려를 나타내며 동북아에서 대량살상무기 확산 위험이 커질 수 있다고 주장했다.  타스통신에 따르면 라브로프 장관은 이날 블라디보스토크에서 열린 동방경제포럼(EEF) 중 즈나니예(지식) 소사이어티가 주최한 강연에서 우크라이나 전쟁과 유럽의 군사력 증강, 북대서양조약기구(NATO·나토) 및 유럽연합(EU) 정책 등에 대해 발언했다. 그는 특히 아시아·태평양 지역 정세와 관련해 \"미국과 일본, 한국 간 군사협력이 확대되고 있다\"", "language": "ko"}, {"title": "해체 인허가 절반 줄었는데…1천건당 사고는 57% 증가", "url": "https://www.newsis.com/view/NISX20260904_0003776074", "source": "뉴시스 경제", "published": "2026-09-04T01:28:30+00:00", "summary": "[서울=뉴시스]정유선 기자 = 최근 5년 사이 건축물 해체 인허가 물량이 절반으로 줄었지만 사고 감소 폭은 이에 미치지 못한 것으로 나타났다.  4일 국회 국토교통위원회 소속 김미애 국민의힘 의원이 국토교통부로부터 제출받은 국정감사 자료에 따르면 건축물 해체 허가·신고 건수는 2021년 7만5349동에서 2022년 5만5585동, 2023년 3만9275동, 2024년 3만7718동, 2025년 3만7639동으로 지속적으로 줄었다. 감소율로 따지면 5년 새 50.0% 급감했다.  그러나 해체 공사 사고는 2021년 56건에서 2022", s-air-force-pushes-to-replace-reaper-faster/", "source": "Breaking Defense", "published": "2026-09-03T22:54:38+00:00", "summary": "“There’s no doubt if we try and pursue the exact same approach that we had with things like the MQ-9, we’re going to get something that costs about the same as an MQ-9,” said Air Force Lt. Gen. Christopher Niemi.", "language": "en"}, {"title": "\"북미회담 이르면 11~12월…트럼프, 김정은 G20 초청할수도\"", "url": "https://www.newsis.com/view/NISX20260904_0003775813", "source": "뉴시스", "published": "2026-09-03T22:46:31+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 연내 북미정상회담에 나서겠다는 의중을 드러낸 가운데, 트럼프 대통령이 올해 12월 미국에서 열리는 주요 20개국(G20) 정상회의에 김정은 북한 국무위원장을 초청할 수도 있다는 전망이 나왔다. 빈센트 브룩스 전 주한미군사령관은 3일(현지 시간) 워싱턴DC 싱크탱크 전략국제문제연구소(CSIS) 팟캐스트에서 북미정상회담 일정에 대해 \"제 견해로는 가장 이른 창은 11월과 G20 사이다. 그것이 가장 빠른 가능성\"이라며 \"그보다 더 가능성이 높은 것은 두 행사가 모두 이뤄진", "language": "ko"}, {"title": "The Three Foreign Frigates Being Studied For Possible U.S. Navy Service", "url": "https://www.twz.com/sea/the-three-foreign-frigates-being-studied-for-possible-u-s-navy-service", "source": "The War Zone", "published": "2026-09-03T21:02:28+00:00", "summary": "Modern Japanese, South Korean, and Turkish frigate designs have emerged as possible contenders to meet increasingly urgent Navy demands. \n The post  The Three Foreign Frigates Being Studied For Possible U.S. Navy Service  appeared first on  TWZ .", "language": "en"}, {"title": "美 반도체 관세 韓 겨누나…통상전문가 \"실제 부과 쉽지 않아\"", "url": "https://www.newsis.com/view/NISX20260903_0003774592", "source": "뉴시스", "published": "2026-09-03T21:00:00+00:00", "summary": "[세종=뉴시스]김동현 기자 = 트럼프 행정부가 반도체에 대한 새로운 관세 부과 방안을 검토하고 있는 것과 관련해 인공지능(AI) 데이터센터 건립 수요와 맞물려 우리나라 반도체 수출 호조세에 찬물을 끼얹는 것 아니냐는 우려가 제기되고 있다.  이와관련, 통상전문가들은 트럼프 행정부의 반도체 관세 부과는 정치적 의도가 담겨 있는 것으로 볼 수 있는데다 관세를 부과하면 자국 기업들의 피해가 적지 않아 실제 실행 여부는 적을 수 있다고 한 목소리를 냈다.  4일 외신에 따르면 하워드 러트닉 미국 상무장관은 지난 2일(현지시간) 미국 정부가", "language": "ko"}, {"title": "인천경제청장에 김종철 산업부 국장 내정…\"외투·첨단산업 발전 적임자\"", "url": "https://www.newsis. const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
