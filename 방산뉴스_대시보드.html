 "[서울=뉴시스] 옥승욱 기자 = 감사원이 문재인 정부의 '서해 공무원 피살 사건 왜곡 의혹' 감사에 참여했던 실무 감사관의 육아휴직 신청을 불허한 것으로 확인됐다.  18일 정치권 등에 따르면 서해 사건 감사에 참여했던 감사관 A씨는 2024년 8월 공무원 국외 장기훈련 제도를 통해 1년 10개월간 영국으로 유학을 떠났고 지난 6월 귀국할 예정이었다. A씨는 영국에 머물고 있는 자녀를 돌보기 위해 올해 말까지 6개월간 육아휴직을 신청했다. 하지만 감사원은 '수사 회피 목적'으로 보인다며 승인을 '일부 거부'하고 휴직을 이달 1일부터", "language": "ko"}, {"title": "민주당 \"국힘, 안보 발목잡기 멈추고 국군사관학교 창설 협조하라\"", "url": "https://www.newsis.com/view/NISX20260718_0003713692", "source": "뉴시스", "published": "2026-07-18T06:10:18+00:00", "summary": "[서울=뉴시스]박지혁 기자 = 더불어민주당이 18일 \"국민의힘은 안보 발목잡기를 멈추고, 미래 강군을 위한 국군사관학교 창설에 협조하라\"고 촉구했다. 김성회 민주당 원내대변인은 이날 서면브리핑을 통해 \"당정이 16일 미래전 대비와 합동전투능력 향상을 위한 국군사관학교 창설 기본계획을 발표하자 국민의힘은 기다렸다는 듯 반대 구호부터 외치고 나섰다\"며 이같이 전했다. 이어 \"통합을 말하면 전통 해체, 자운대를 말하면 정치적 계산, 공론화를 말하면 요식행위라고 한다\"며 \"대안 제시도 없이 국가 안보의 미래를 향한 결단마저 정쟁의 도구로 ", "language": "ko"}, {"title": "이번주 국회에는 무슨 일이? [뉴시스국회토pic]", "url": "https://www.newsis.com/view/NISX20260717_0003713280", "source": "뉴시스", "published": "2026-07-17T22:20:00+00:00", "summary": "[서울=뉴시스]최진석 기자 = 7월 11일부터 7월 17일까지의 국회 이슈를 사진으로 풀어본다. [뉴시스국회토pic]은 국회에서 일어난 중요 이슈를 사진으로 풀어보는 '이번주 국회에는 무슨 일이?'로 매주 토요일 여러분을 찾아 갑니다. ◆제헌절 경축식 국회 여야 대표와 원내대표 날인 제헌헌법 ◆한동훈 무소속 의원 복당 반대 기자회견하는 안철수 의원  ◆더불어민주당 당권주자 김민석·송영길·정청래·고민정·김보미, 전국자치분권민주지도자회의 참석 ◆더불어민주당 2026 하반기 경제성장전략 당정협의 ◆국민의힘 최고위원회의  ◆개혁신당 최고위", "language": "ko"}, {"title": "미군 정찰기 한반도 상공 비행 부쩍 증가", "url": "https://www.newsis.com/view/NISX20260718_0003713488", "source": "뉴시스", "published": "2026-07-17T21:22:46+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 미국의 해군 고고도 무인정찰기 MQ-4C '트라이튼'이 지난 14일에 이어 17일에도 한반도 상공에서 장시간 정찰 비행을 했으며 미 육군 정찰기 아레스도 한반도 상공을 자주 정찰하고 있다고 미국의 소리(VOA)가 18일 보도했다.  항공기 추적 사이트 '플라이트레이더24(Flightradar24)'에 따르면 트라이튼은 한반도 시각 17일 오전 5시21분쯤 대한해협 인근에서 처음 포착됐다. 이후 오전 6시20분쯤 부산 인근 상공을 통해 한반도 상공으로 진입한 뒤 오전 6시55분부터 강릉과 양양, 평택,", "language": "ko"}, {"title": "Navy, Army risk wasting money, time without unified hypersonic missile strategy: GAO - Breaking Defense", "url": "https://news.google.com/rss/articles/CBMiugFBVV95c const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
