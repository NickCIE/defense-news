d": "2026-08-21T00:38:47+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 김여정 북한 노동당 총무부장이 이틀간 내놓은 담화와 입장에는 미국과 대화 재개를 둘러싸고 주도권 다툼을 벌이는 한편, 한국은 철저히 배제하려는 북한의 기조가 고스란히 드러났다. 한미동맹을 '주종관계'라고 비하한 배경에는 한미동맹을 이간하려는 이른바 '갈라치기' 의도가 있다고 보인다.  김정은 북한 국무위원장 동생인 김 부장은 20일 오후 9시께 담화를 내고 도널드 트럼프 미국 대통령 지시로 정례 한미 연합훈련인 '을지자유의방패(UFS)' 연습이 축소된 데 대해 서울이 \"가긍한 처지에 놓이게 되였다\"", "language": "ko"}, {"title": "정점식, 李대통령에 \"美에 훈련 일정 축소 패싱당하고 환호작약\"", "url": "https://www.yna.co.kr/view/AKR20260821040900001", "source": "연합뉴스", "published": "2026-08-21T00:38:32+00:00", "summary": "(서울=연합뉴스) 김연정 이율립 기자 = 국민의힘 정점식 원내대표는 21일 이재명 대통령이 한미연합훈련 축소를 지시한 도널드 트럼프 미국 대통령...", "language": "ko"}, {"title": "쿨링조끼·드론 띄웠지만…농작업 온열질환 4년 새 3.4배", "url": "https://www.newsis.com/view/NISX20260821_0003756892", "source": "뉴시스 경제", "published": "2026-08-21T00:32:14+00:00", "summary": "[세종=뉴시스]임소현 기자 = 폭염 속 농업인의 인명 피해를 막기 위해 정부가 쿨링조끼를 보급하고 드론까지 동원했지만 논밭과 비닐하우스에서 발생한 온열질환자는 4년 새 3배 넘게 증가한 것으로 나타났다. 농작업은 생육 시기와 수확 적기를 놓치기 어려운 만큼 일률적인 작업중지 권고에서 벗어나 작업 종류와 강도에 따른 세부 안전기준을 마련해야 한다는 지적이 나온다. 21일 한국농촌경제연구원의 '농촌 주민을 위한 폭염 대응 과제' 보고서에 따르면 논밭과 비닐하우스에서 발생한 온열질환자는 2021년 177명에서 지난해 595명으로 4년 만", "language": "ko"}, {"title": "경남 무역수지 46개월 연속 흑자…승용차·선박·무기류 호조", "url": "https://www.yna.co.kr/view/AKR20260821037300052", "source": "연합뉴스 경제", "published": "2026-08-21T00:19:09+00:00", "summary": "(창원=연합뉴스) 이정훈 기자 = 경남 무역수지가 지난 7월 기준으로 46개월 연속 흑자 기조를 이어갔다.", "language": "ko"}, {"title": "김제시, 특장차 산업 연계 ‘김제형 방위산업’ 육성전략 구체화 - 전북제일신문", "url": "https://news.google.com/rss/articles/CBMiakFVX3lxTE9WMktBOEwtWno1RHQ5V0JxOW5XZzl1UnQwTXVtOTlYYW00b3AxY0xZMTZJbFo2cmpHQTZYRmZGTy1fb3luc3BhUnUxMDFqZXZteGpVMkpvQmd5bDhhQjhwdXpVNkF0ckhZUUE?oc=5", "source": "방산 뉴스", "published": "2026-08-21T00:16:19+00:00", "summary": "김제시, 특장차 산업 연계 ‘김제형 방위산업’ 육성전략 구체화    전북제일신문", "language": "ko"}, {"title": "한미 UFS연습 오늘 종료…1부 방어훈련만 하고 반쪽 마무리", "url": "https://www.newsis.com/view/NISX20260821_0003756995", "source": "뉴시스", "published": "2026-08-21T00:00:09+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 한미 연합연습인 '을지 자유의 방패(UFS)'가 21일 1부 대북 방어 훈련만 실시한 채 반쪽으로 마무리된다.  합동참모본부는 '을지 자유의 방패(UFS)'가 이날 오후 종료된다고 밝혔다. 훈련이 끝나는 시점은 정확하게 정해지지 않았다.  UFS 연습은 한미가 연례적으로 실시하는 방어적 성격의 훈련이다. 당초 올해 훈련은 지난 17일부터 오는 27일까지 실시될 예정이었다. UFS는 통상적으로 다양한 상황에 대한 시나리오를 세워 새 전략을 수립하는 컴퓨터 시뮬레이션 훈련과, 한미 병력이 실제 기동훈련(", "language": "ko"}, {"title": "The US Navy has battled operational tempo ordeals for years. The Iran war exposed the flaws.", "url": "https://www.defensenews.com/news/your-navy/2026/08/20/the-us-navy-has-battled-operational-tempo-ordeals-for-years-the-iran-war-exposed-the-flaws/", "source": "Defense News", "published": "2026-08-20T23:20:57+00:00", "summary": "Carrier availability and decisions made during the Iran war have exacerbated the US Navy's longstanding struggles with a frenzied operational tempo.", "language": "en"}, {"title": "USS George Washington’s Mideast Arrival Highlights Strain On Carrier Force", "url": "https://www.twz.com/sea/uss-george-washingtons-mideast-arrival-highlights-strain-on-carrier-force", "source": "The War Zone", "published": "2026-08-20T23:10:13+00:00", "summary": "The Washington's replacement of the Lincoln leaves no carrier in the Western Pacific and the Navy's struggle to meet demand may get far worse before it gets better. \n The post  USS George Washington’s Mideast Arrival Highlights Strain On Carrier Force  appeared first on  TWZ .", "language": "en"}, {"title": "트럼프 대화 손짓에도 北 미사일 발사…美 \"본토·동맹 방어 전념\"", "url": "https://www.newsis.com/view/NISX20260821_0003756835", "source": "뉴시스", "published": "2026-08-20T22:59:12+00:00", "summary": "[서울=뉴시스] 신효령 기자 = 미군이 북한의 단거리 탄도미사일 무더기 발사와 관련해 미국 본토와 동맹국 방어 의지를 재확인했다. 도널드 트럼프 미국 대통령이 김정은 북한 국무위원장과의 연내 회동 가능성을 밝힌 직후 나온 입장이다. 미 태평양사령부는 20일(현지시간) '북한 미사일 발사에 관한 성명'에서 \"최근 미사일 발사를 인지하고 있다\"며 \"동맹 및 파트너들과 긴밀히 협의하고 있다\"고 밝혔다. 이어 이번 발사가 미국 인력이나 영토, 동맹국에 즉각적인 위협이 되지 않는다며 미국 본토와 역내 동맹국 방어에 계속 전념하겠다고 강조했다", "language": "ko"}, {"title": "[연합뉴스 이 시각 헤드라인] - 07:30", "url": "https://www.yna.co.kr/view/AKR202608210 let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
