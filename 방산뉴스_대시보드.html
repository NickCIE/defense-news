VHZoby1Lb2RQQVNhcw?oc=5", "source": "방산 뉴스", "published": "2026-07-07T23:06:27+00:00", "summary": "이재명 대통령, NATO서 '방산 파트너십 2.0' 제안    뉴스프리존", "language": "ko"}, {"title": "[외신 에스프레소]“방위비 더 쓸 테니 미군 빼지 마라”…'유럽 철수 위협' 멈추지 않는 트럼프", "url": "https://www.hankyung.com/article/202607081619i", "source": "한국경제 경제", "published": "2026-07-07T23:02:18+00:00", "summary": "", "language": "ko"}, {"title": "이 대통령, 나토 사무총장과 면담…\"우크라이나 평화 조속히 회복\"(종합2보)", "url": "https://www.newsis.com/view/NISX20260708_0003699950", "source": "뉴시스", "published": "2026-07-07T22:43:22+00:00", "summary": "[앙카라·서울=뉴시스]조재완 김지은 기자 = 튀르키예를 방문 중인 이재명 대통령이 7일(현지시간) 마르크 뤼터 북대서양조약기구(NATO·나토) 사무총장과 면담을 갖고 한·나토 조달 기본협정을 추진하고 방산 공급망 협력을 확대하기로 했다. 이어진 인도·태평양 파트너국(IP4) 소인수회담에서는 나토와 인태 지역 간 방산·안보 협력 강화 방안을 논의하는 한편, 우크라이나 전쟁이 조기 종결돼야 한다고 강조했다.  이 대통령은 이날 오후 앙카라에 도착한 뒤 곧바로 뤼터 사무총장과 회담을 시작했다. 면담으로 닷새 간의 정상외교 일정에 돌입했다", "language": "ko"}, {"title": "지난해 외국인의 대미 순투자 오히려 줄었다", "url": "https://www.newsis.com/view/NISX20260708_0003699934", "source": "뉴시스 경제", "published": "2026-07-07T22:21:18+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 도널드 트럼프 미 대통령이 지난해 관세 정책으로 다른 나라들의 미국 투자를 크게 늘리겠다고 장담했으나 지난해 외국인의 대미 순투자가 오히려 줄었다고 미 뉴욕타임스(NYT)가 7일(현지시각) 보도했다.  미 경제분석국에 따르면 지난해 미국에 대한 신규 외국인 직접 투자가 크게 반등했다. 2024년 1550억 달러에서 지난해 2320억 달러로 증가해 3년 동안 이어진 하락세를 반전시켰다.  이 데이터에는 외국기업의 미국 기업 인수와 외국기업이 새 회사를 설립하고 기존 회사를 확장하는데 쓴 돈도 포함된다.", "language": "ko"}, {"title": "김정은, 김일성 사망 32주기 맞아 금수산태양궁전 참배", "url": "https://www.newsis.com/view/NISX20260708_0003699925", "source": "뉴시스", "published": "2026-07-07T22:02:21+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 김정은 북한 국무위원장이 할아버지인 김일성 주석 사망 32주기를 맞은 8일 선대 시신이 안치된 금수산태양궁전을 참배했다. 북한 노동신문은 김 위원장이 8일 오전 0시 금수산태양궁전을 찾았다고 이날 보도했다.  북한 매체는 통상 김 위원장의 공개 활동을 다음날 보도하지만, 참배 소식은 비교적 빠르게 당일 보도했다. 김 위원장은 \"참가자들과 함께 위대한 수령님과 위대한 장군님의 입상을 우러러 숭고한 경의를 표시했다\"고 신문은 전했다. 또 김일성 주석·김정일 국방위원장 시신이 안치된 영생홀들을 찾아 \"위", "language": "ko"}, {"title": "북한 주요 도시 중심에 김정은 찬양 벽화 설치", "url": "https://www.newsis.com/view/NISX20260708_0003699916", "source": "뉴시스", "published": "2026-07-07T21:39:24+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 북한이 김정은 국무위원장을 찬양하는 대형 벽화를 전국 도시 중심부에 세우는 등 개인 숭배를 강화하고 있다고 미국의 북한 전문 매체 NK뉴스(NK NEWS)가 7일(현지시각) 보도했다.  북한은 벽화가 위치한 광장에서 대규모 관제 집회를 열고 있으며 일부 도시의 경우 과거 지도자들의 동상이 있는 광장에서 김정은 찬양 벽화가 있는 광장으로 집회 장소를 옮겼다.   김정은이 미소를 지으며 인민을 이끄는 모습을 담은 이 벽화들은 2024년 이후 14개 도 소재지 및 특별시 가운데 8곳의 번화한 지역 공공 거", "language": "ko"}, {"title": "상반기 수출 반도체·비반도체 '질주'…하반기도 청신호", "url": "https://www.newsis.com/view/NISX20260706_0003696791", "source": "뉴시스 경제", "published": "2026-07-07T21:03:00+00:00", "summary": "[세종=뉴시스]김동현 기자 = 올해 하반기 수출 전망도 맑음이라는 분석이다. 하반기에도 빅테크 기업들의 인공지능(AI) 인프라 투자 확대에 따른 반도체, 정보기술(IT) 품목의 호조세가 예상되는 가운데 반도체 외 품목들의 수출도 양호한 흐름이 기대된다는 관측이 제기된다. 특히 중동전쟁이 마무리 국면에 돌입한 것도 우리나라 수출에 호재다. 중동 전쟁 이후 뚜렷한 감소세를 보였던 중동 지역 수출이 회복될 수 있는데다, 전후 재건이 본격화될 경우 또 다른 수출 기회를 얻을 수 있다는 예상도 나온다. 8일 산업통상부가 발표한 2026년 상", "language": "ko"}, {"title": "뉴욕증시, 반도체 조정에 일제 하락…국제유가는 5%대 상승", "url": "https://www.newsis.com/view/NISX20260708_0003699894", "source": "뉴시스 경제", "published": "2026-07-07T20:37:04+00:00", "summary": "[서울=뉴시스]고재은 기자 = 미국 뉴욕증시가 반도체주 약세와 유가 급등에 7일(현지 시간) 일제히 하락 마감했다. CNBC 등에 따르면 다우존스30산업평균지수(DJIA)는 장중 사상 최고치를 경신한 후 전장 대비 130.76포인트(0.25%) 내린 5만2925.15에 거래를 마쳤다.  스탠더드앤푸어스(S&P) 500 지수는 33.58포인트(0.45%) 떨어진 7503.85에, 기술주 중심의 나스닥 지수는 302.47포인트(1.16%) 밀린 2만5818.69에 장을 마감했다. 이날 하락세는 한국 삼성전자를 비롯해 아시아·태평양 시장", "language": "ko"}, {"title": "북적이는 피서지 대신…바다 품은 '촌캉스' 11곳", "url": "https://www.newsis.com/view/NISX20260707_0003698925", "source": "뉴시스 경제", "published": "2026-07-07T20:30:00+00:00", "summary": "[서울=뉴시스] 강세훈 기자, 신연경 인턴기자 = 올여름 북적이는 관광지 대신 바다와 자연 속에서 쉬며 체험하는 '촌캉스'를 계획하고 있다면 전국 어촌체험휴양마을이 새로운 선택지가 될 수 있다. 한국어촌어항공단은 섬 체험과 해양레저, 캠핑 등 여름철 다양한 즐길 거리를 갖춘 전국 어촌체험휴양마을 11곳을 선정해 소개했다. 8일 공단에 따르면 이번 선정은 최근 유명 관광지를 짧게 둘러보는 여행보다 자연 속에 머물며 휴식과 체험을 함께 즐기는 '촌캉스' 수요가 늘어나는 점을 반영했다. 공단은 바다와 자연을 함께 즐기는 '블루 투어리즘'", "language": "ko"}, {"title": "한·나토, '조달 기본협정' 협상 개시…靑 \"연15조시장 韓기업 참여 기반 마련\"", "url": "https://www.newsis.com/view/NISX20260708_0003699895", "source": "뉴시스", "published": "2026-07-07T20:12:45+00:00", "summary": "[앙카라=뉴시스]조재완 기자 = 이재명 대통령과 마르크 뤼터 북대서양조약기구(NATO·나토) 사무총장 간 면담을 계기로 양측이 한·나토 조달 기본협정 체결을 위한 협상을 개시한다고 발표했다.  위성락 국가안보실장은 7일(현지시간) 오후 튀르키예 앙카라에서 이 대통령의 나토 정상회의 순방 관련 브리핑을 갖고 \"나토 정상회의를 통해 거둔 주요 성과\"라며 이같이 밝혔다.  위 실장은 \"세계 최대 규모의 나토 방산 시장 진출과 나토와의 견고한 방산 공급망 구축을 위한 발판을 확보했다\"며 \"우선 나토 사무총장 면담 계기에 양측은 한·나토 조", "language": "ko"}, {"title": "韓-나토, 조달기본협정 추진…\"年 15조원 방산시장 진출 발판\"(종합)", "url": "https://www.yna.co.kr/view/AKR20260708006900001", "source": "연합뉴스", "published": "2026-07-07T20:03:32+00:00", "summary": "(앙카라=연합뉴스) 임형섭 설승은 기자 = 청와대는 이재명 대통령과 마르크 뤼터 북대서양조약기구(NATO·나토) 사무총장이 7일(현지시간) 튀르...", "language": "ko"}, {"title": "李대통령, 나토 정상회의 이틀째 일정…'K방산' 외교전", "url": "https://www.yna.co.kr/view/AKR20260707173200001", "source": "연합뉴스", "published": "2026-07-07T20:00:00+00:00", "summary": "(앙카라=연합뉴스) 임형섭 설승은 기자 = 이재명 대통령은 북대서양조약기구(NATO·나토) 정상회의 참석을 계기로 한 튀르키예 방문 이틀째인 8...", "language": "ko"}, {"title": "[오늘의 주요일정]정치(7월8일 수요일)", "url": "https://www.newsis.com/view/NISX20260707_0003699832", "source": "뉴시스", "published": "2026-07-07T20:00:00+00:00", "summary": "[서울=뉴시스] ◇청와대【대통령】 나토 정상회의 참석(튀르키예) ◇총리실【총리】 13:00 불교계 지도자 예방(서울 종로구) 14:30 천주교계 지도자 예방(경기 수원시 장안구) ◇국방부【장관】 국외출장 ◇외교부【장관】 튀르키예·몽골 출장 ◇통일부【장관】 통상일정 ◇더불어민주당【당대표 직무대행 겸 원내대표】 09:30 최고위원회의(국회 본관 당대표회의실) 16:00 2026 ABC 개국 기념 AI 생태계 혁신 포럼(서울 중구 소공로 119 더 플라자 호텔 서울 그랜드볼룸) ◇국민의힘【당대표】 17:00 6·3 참정권 박탈 사태 인천", "language": "ko"}, {"title": "Senate Dems seek Air Force, contractor answers on Qatari-gifted Air Force One conversion", "url": "https://breakingdefense.com/2026/07/senate-dems-seek-air-force-contractor-answers-on-qatari-gifted-air-force-one-conversion/", "source": "Breaking Defense", "published": "2026-07-07T19:54:24+00:00", "summary": "The lawmakers allege they’ve been “stonewalled” when asked for more detailed information about the controversial “bridge” aircraft.", "language": "en"}, {"title": "靑 \"우크라이나에 1억달러 규모 포괄지원…살상무기 지원 제외\"", "url"  탑재한 SLBM을 태평양 공해 해역으로 시험 발사해 예정된 해역에 정확히 들어갔다고 발표한 바 있다. 이번 시험발사는 태평양 일대에서 군사적 영향력을 확대해 온 중국이 해상 기반의 핵 타격 능력을 과시한 것으로 분석된다. 이와 관련해 중국 측은 발사 전 주중국 한국대사관 무관 채널로 미사일 시험 발사 계획을 사전에", "language": "ko"}, {"title": "이 대통령, 튀르키예 앙카라 도착…나토 정상회의 참석", "url": "https://www.newsis.com/view/NISX20260707_0003699731", "source": "뉴시스", "published": "2026-07-07T11:00:26+00:00", "summary": "[앙카라·서울=뉴시스] 김지은 조재완 기자 = 이재명 대통령이 7일 오후 북대서양조약기구(NATO) 정상회의가 열리는 튀르키예에 도착해 닷새간의 순방 일정에 돌입했다. 이 대통령이 나토 정상회의에 참석하는 건 이번이 처음이다. 이 대통령과 부인 김혜경 여사, 참모진 등이 탑승한 공군 1호기는 이날 현지시간으로 오후 1시27분께(한국시간 오후 7시27분) 앙카라 엔센보아공항에 착륙했다. 우리 측에서는 부석종 주튀르키예 대사가, 튀르키예 측에서는 메흐멧 누리 에르소이 문화관광부장관, 베스테 페흐리반 순 외교부 수행대사, 젬 아크바이 앙", "language": "ko"}, {"title": "이 대통령, 7일 NATO 방산포럼서 '방위산업 파트너십 2.0' 격상 제안 - 미디어펜", "url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE1rODFRS3I5d1k1SklLMFpuNFhudU1UVm1VRnNoZU1NbER1LVV1NjZGS2ZkTWQwQWhobjBOY0xHZXpTU09iVlNVR1RGbGJOdnZiVVZWQtIBWEFVX3lxTE1FNGRGMURNUlJBM2loS20zVG5tbFNiVXVOcEp5SFZJQW9HOWhIeTljUDJfS0libXRQSm9sZ0c2bnNlZVhzeDBiQXZiUlNhX2NkRmJabTlhaEg?oc=5", "source": "방산 뉴스", "published": "2026-07-07T10:55:58+00:00", "summary": "이 대통령, 7일 NATO 방산포럼서 '방위산업 파트너십 2.0' 격상 제안    미디어펜", "language": "ko"}, {"title": "[포토] 한반도 농산물 관측 '농림위성' 우주로", "url": "https://www.hankyung.com/article/2026070712531", "source": "한국경제 경제", "published": "2026-07-07T10:47:14+00:00", "summary": "", "language": "ko"}, {"title": "농진청, 농림위성 발사 참관…\"농업 우주기술 활용 이정표\"", "url": "https://www.newsis.com/view/NISX20260707_0003699774", "source": "뉴시스 경제", "published": "2026-07-07T10:45:59+00:00", "summary": "[세종=뉴시스]임소현 기자 = 농촌진흥청은 김상경 차장이 7일 대전 한국항공우주연구원을 찾아 차세대중형위성 4호(농림위성) 발사 상황을 참관했다고 밝혔다. 농림위성은 이날 오후 4시12분(한국시간) 미국 캘리포니아 반덴버그 우주군기지에서 스페이스엑스의 팰컨9 발사체에 실려 발사됐다. 이후 발사 약 2시간30분 뒤 고도 888㎞에서 발사체로부터 정상 분리됐고 약 23분 뒤 노르웨이 스발바르 지상국과의 첫 교신에도 성공했다. 초기 운영 기간에는 스발바르 지상국과 남극 세종기지 등 2개 해외 지상국을 활용한다. 농림위성은 우주항공청과 농", "language": "ko"}, {"title": "Kremlin says Russia will follow NATO summit closely - Reuters", "url": "https://news.google. const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
