le": "\"아파트 있어야 결혼도 합니다\"…부동산 불평등이 쪼개놓은 청춘", "url": "https://www.newsis.com/view/NISX20261111_0003864095", "source": "뉴시스 경제", "published": "2026-11-13T15:00:00+00:00", "summary": "[서울=뉴시스] 김종민 기자 = \"빌라나 오피스텔은 사절입니다. 자가든 전월세든 일단 서울·수도권 아파트에 살아야 입장권이 주어집니다.\" 최근 방영된 KBS '추적60분(회차 제목 : 아파트가 있어서 가능한 사랑)'이 조명한 대한민국 2030세대의 결혼 시장 풍경이다. 낭만과 사랑으로 출발하던 전통적인 혼인 풍속도는 자취를 감추고, 아파트 등기부등본이 연애의 절대적 무기가 되는 세태가 적나라하게 드러났다. 최근 2030 직장인 사이에서는 거주지 인증을 거쳐야 가입할 수 있는 데이팅 앱이 성황을 이루고 있다. 아파트 거주 사실이 확인", "language": "ko"}, {"title": "UK to buy three new mine-hunting drone motherships under Norway agreement", "url": "https://breakingdefense.com/2026/11/uk-to-buy-three-new-mine-hunting-drone-motherships-under-norway-agreement/", "source": "Breaking Defense", "published": "2026-11-13T14:16:31+00:00", "summary": "The decision, for which £90 million ($119.1 million) has been allocated, was formalized on Thursday by British Defense Secretary Wes Streeting and his Norwegian counterpart, Tore O. Sandvik, at the Atlantic Future Forum in Oslo.", "language": "en"}, {"title": "Trump says he wants to ‘get Cuba done’ before leaving office, would consider military force", "url": "https://www.cnbc.com/2026/11/13/trump-cuba-us-military-force-iran.html", "source": "CNBC", "published": "2026-11-13T13:04:00+00:00", "summary": "It comes as the U.S. continues to enforce a comprehensive economic embargo against Cuba.", "language": "en"}, {"title": "외교부, '뱁새가 황새 따라가면' 이란 메시지에…\"전쟁 불관여 원칙\"", "url": "https://www.newsis.com/view/NISX20261113_0003867859", "source": "뉴시스", "published": "2026-11-13T12:09:09+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 외교부는 이란 외무부 대변인이 한국 속담을 인용해 우리 정부의 청해부대 임무 확대 방침을 겨냥한 경고 메시지를 내놓은 것과 관련, 13일 \"전쟁 불관여·불개입\" 원칙을 강조했다. 외교부 당국자는 이날 \"우리 정부는 우리 국민 보호와 경제이익 수호를 목적으로 전쟁 불관여·불개입 원칙 하에 청해부대 임무를 강화하는 방안의 파견연장 동의안을 진행 중\"이라고 밝혔다.  이어 \"이와 관련해 이란 등 관련국들과 지속적으로 소통하고 있다\"라고 덧붙였다.  이란 메흐르 통신에 따르면 에스마일 바가이 이란 외무부 대", "language": "ko"}, {"title": "이언주 \"LIG D&A 방산업체 지정 취소 '어불성설'\"…김정관 \"균형감 있게 판단\" - 노컷뉴스" const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
