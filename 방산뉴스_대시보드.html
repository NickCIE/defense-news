[뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20261014_0003825943", "source": "뉴시스", "published": "2026-10-14T06:41:21+00:00", "summary": "[서울=뉴시스] 류현주 조수정 유자비 기자 = 카멀라 해리스 전 미국 부통령이 14일 \"한국의 미국 투자는 매우 거대하고 중요한 일\"이라며 양국 모두에 '윈윈 투자'라고 밝혔다. 방한한 해리스 전 부통령은 이날 서울 종로구 아산정책연구원에서 '미국의 리더십과 동맹의 미래'를 주제로 진행한 특별강연에서 경제협력과 관련해 한국이 미국과 어떤 역할을 극대화해야 하는지 묻자 \"지금 그대로 잘 하면 될 것 같다\"라며 이같이 말했다. 해리스 전 부통령은 \"전날 한국의 조선기업 리더들과 길게 대화했고 굉장히 의미 있는 대화였다\"라며 \"지금 미국", "language": "ko"}, {"title": "외교차관보, 노르웨이 차관 면담…방산·기술 협력 논의", "url": "https://www.yna.co.kr/view/AKR20261014135200504", "source": "연합뉴스", "published": "2026-10-14T06:28:47+00:00", "summary": "(서울=연합뉴스) 민선희 기자 = 정의혜 외교부 차관보는 14일 안드레아스 모츠펠트 크라비크 노르웨이 외교차관을 만나 방산·기술 협력 확대 방안...", "language": "ko"}, {"title": "외교차관보, 노르웨이 차관 면담…\"방산·수산 협력 확대 기대\"", "url": "https://www.newsis.com/view/NISX20261014_0003825898", "source": "뉴시스", "published": "2026-10-14T06:28:36+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 외교부는 14일 정의혜 차관보가 방한한 안드레아스 모츠펠트 크라비크 노르웨이 외교차관과 면담하고 양국간 실질 협력 등에 대해 논의했다고 밝혔다. 정 차관보는 크라비크 외교차관과 만나 \"방산·수산·첨단기술 등 다양한 분야에서 양국 간 협력이 더 확대되기를 기대한다\"라고 했다. 아울러 노르웨이 내 인프라 건설사업에 참여 중인 우리 기업이 원활히 사업을 수행할 수 있도록 노르웨이 측의 지속적인 관심과 협조를 당부했다. 크라비크 외교 차관은 양국이 민주주의와 국제법 존중 등 공동의 가치를 공유하고 있다며 \"", "language": "ko"}, {"title": "국힘, 민생 해결 '당근위원회' 출범…\"정책으로 유능함 보여드릴 것\"", "url": "https://www.newsis.com/view/NISX20261014_0003825859", "source": "뉴시스", "published": "2026-10-14T06:11:06+00:00", "summary": "[서울=뉴시스]하지현 전상우 기자 = 국민의힘이 14일 민생 현안을 발굴하고 현장 점검부터 입법, 사후관리까지 책임지는 '당근위원회'를 출범했다. 국민의힘은 이날 서울 여의도 중앙당사에서 당근위원회 임명장 수여식을 열었다. 임이자 정책위의장이 위원장을 맡고, 강선영·김민전·안상훈·이달희·이상휘·이소희·조지연·최수진 의원과 이준배 세종특별자치시 당협위원장 등이 부위원장을 맡아 총 45명으로 구성됐다. 장동혁 대표는 인사말에서 \"지난 대선 이후 우리 당을 정비하는 데 1년 가까이 시간을 보냈다\"며 \"이제는 정책으로 우리 국민의힘의 유능", "language": "ko"}, {"title": "국방장관, 광주 제1전비 방문 \"확고한 영공 대비태세·군공항 이전 완수\" 당부", "url": "https://www.newsis.com/view/NISX20261014_0003825818", "source": "뉴시스", "published": "2026-10-14T06:06:30+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 강신철 국방부 장관은 14일 광주에 위치한 제1전투비행단(1전비)을 방문해 작전대비태세 및 임시배치 현황을 점검했다. 국방부에 따르면 강 장관은 1전비의 부대현황을 보고받고 \"축적된 힘이 모였을 때 우리 군은 경쟁에서 승리할 수 있고, 군이 경쟁에서 승리해야 대한민국이 승리할 수 있다\"고 했다. 또 \"정예 전투조종사 양성과 서·남부권 영공방위 임무에 최선을 다해달라\"고 말했다.  아울러 1전비 부지가 메가프로젝트 부지로 활용될 예정인 데 따라, 광주 군공항 부지와 시설현장을 직접 확인하고 임시배치 ", "language": "ko"}, {"title": "김지용 중수청장 후보, '친윤' 부인…\"정치적 배경 고려한 적 없다\"(종합)", "url": "https://www.newsis.com/view/NISX20261014_0003825626", "source": "뉴시스", "published": "2026-10-14T05:44:15+00:00", "summary": "[서울=뉴시스] 오정우 장한지 기자 = 김지용 초대 중대범죄수사청장 후보자가 지명 37일 만에 열린 국회 인사청문회에서 윤석열 전 대통령을 '정치 검사' 1호로 꼽으며, 검찰개혁 필요성에 동의했다. 여당 강경파의 '친윤' 주장에는 중수청장 자리의 무게에 따른 것으로 이해한다며 말을 아꼈다. 김 후보자는 14일 국회 행정안전위원회가 연 인사청문회에서 \"과거 표적수사, 먼지털기식 수사, 기소를 전제로 한 수사 등 국민들께서 우려하는 문제를 답습하지 않겠다\"고 밝혔다. 김 후보자는 2020년 추미애 당시 법무부 장관이 윤석열 당시 검찰총", "language": "ko"}, {"title": "[프로필]임광현 신임 靑 비서실장…조세행정전문가 출신 정치인", "url": "https://www.newsis.com/view/NISX20261014_0003825702", "source": "뉴시스", "published": "2026-10-14T05:29:44+00:00", "summary": "[서울=뉴시스]이인준 기자 = 이재명 대통령은 14일 신임 대통령비서실장에 조세행정 전문가이자 더불어민주당 의원 출신인 임광현 국세청장을 임명했다.  임 신임 비서실장은 충남 홍성 출신으로, 서울 강서고와 연세대 경제학과를 나와 미국 하버드대 로스쿨 국제조세과정을 수료했다. 행정고시 38회로 공직에 입문한 임 실장은 국세청 본청과 지방청에서 조사국장 등 세무조사 관련 보직을 오랜 기간 맡아 온 조세행정 전문가다. 참여정부 시절에는 경제정책비서관실 행정관으로서 청와대에서 근무한 바 있다. 임 실장은 2022년 공직에서 퇴임한 뒤, 2", "language": "ko"}, {"title": "36사단 공병대대, 헌혈증 200장 기부…'232회 헌혈' 간부도 동참", "url": "https://www.yna.co.kr/view/AKR20261014116900062", "source": "연합뉴스", "published": "2026-10-14T05:22:56+00:00", "summary": "(원주=연합뉴스) 류호준 기자 = 육군 제36보병사단 공병대대는 헌혈증 200장을 원주세브란스기독병원에 기증했다고 14일 밝혔다.", "language": "ko"}, {"title": "해리스 전 美부통령 \"한국의 대미투자 매우 중요…양국 모두에 윈윈\"", "url": "https://www.newsis.com/view/NISX20261014_0003825694", "source": "뉴시스", "published": "2026-10-14T05:21:57+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 카멀라 해리스 전 미국 부통령이 14일 \"한국의 미국 투자는 매우 거대하고 중요한 일\"이라며 양국 모두에 '윈윈 투자'라고 밝혔다.  방한한 해리스 전 부통령은 이날 서울 종로구 아산정책연구원에서 '미국의 리더십과 동맹의 미래'를 주제로 진행한 특별강연에서 경제협력과 관련해 한국이 미국과 어떤 역할을 극대화해야 하는지 묻자 \"지금 그대로 잘 하면 될 것 같다\"라며 이같이 말했다.  해리스 전 부통령은 \"전날 한국의 조선기업 리더들과 길게 대화했고 굉장히 의미 있는 대화였다\"라며 \"지금 미국도 조선업에", "language": "ko"}, {"title": "[기자수첩]\"한미관계 이상 없다\"는 정동영,  \"백악관 소통 한계 있다\"는 강경화", "url": "https://www.newsis.com/view/NISX20261014_0003825082", "source": "뉴시스", "published": "2026-10-14T05:21:18+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 연초 불거졌다가 한동안 잠잠했던 한미동맹 이상기류가 최근 다시 수면 위로 떠올랐다. 도널드 트럼프 미 행정부 들어 통상과 안보를 둘러싼 양국 간 이견은 새삼스러운 일은 아니지만, 최근 민감한 대북 정보공유 제한 논란까지 불거졌다. 올해 초 쿠팡 사태가 한미 관계의 불편한 사안이었다면 최근에는 정보협력 문제가 논란의 중심에 있다. 북한 해킹 대응을 위한 한미일 사이버 위협 대응 협의체에 미국이 국정원 참석을 거부했다. 주미대사관에 파견하려던 국정원 직원이나 미국 지역 재외공관 국정감사를 앞둔 현역 국회", "language": "ko"}, {"title": "정점식, 李 대통령 향해 \"정동영 경질해야\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20261014_0003825644", "source": "뉴시스", "published": "2026-10-14T05:06:22+00:00", "summary": "[서울=뉴시스] 류현주 최진석 우지은 전상우 기자 = 정점식 국민의힘 원내대표는 14일 \"정동영 통일부 장관 경질은 한미동맹 회복을 위한 선결조건\"이라고 했다. 정 원내대표는 이날 오전 국회에서 기자간담회를 열고 이재명 대통령을 향해 \"아직도 정동영 팬클럽 대표 직함을 들고 있는 것인가. 지금 당장 정 장관을 경질하라\"며 이같이 말했다. 정 원내대표는 \"대한민국의 합참의장과 주미대사까지 인정하는 한미갈등을 정 장관 혼자만 부인한다. 국방부가 인정한 북한의 침략행위 역시 정 장관 혼자만 부인한다\"며 \"가짜 평화 망상에 빠져 있으니 헛", "language": "ko"}, {"title": "농어촌공사장 \"중국산 드론 보안대책 촬영 가이드라인에 반영\"", "url": "https://www.newsis.com/view/NISX20261014_0003825541", "source": "뉴시스", "published": "2026-10-14T04:18:39+00:00", "summary": "[세종=뉴시스]임소현 기자 = 김인중 한국농어촌공사 사장은 14일 농지 조사에 사용하는 중국산 드론 등의 정보 유출 우려와 관련해 로컬데이터 모드 의무화와 오프라인 운영 등 보안 대책을 시행하고 있다고 밝혔다.  김 사장은 이날 국회 농림축산식품해양수산위원회 국정감사에서 윤준병 더불어민주당 의원의 질의에 중국산 드론의 보안성 검토는 관련 지침에 따라 생략했지만, 별도의 보안 대책을 마련해 촬영 가이드라인에 반영했다고 답했다.  이날 윤 의원은 지난 7일 국감 당시 제기된 중국산 드론과 러시아산 소프트웨어의 보안 논란을 짚으며 공사가", "language": "ko"}, {"title": "정점식 \"정동영, 가짜평화 망상 빠져…한미동맹 회복 위해 경질해야\"", "url": "https://www.newsis.com/view/NISX20261014_0003825545", "source": "뉴시스", "published": "2026-10-14T03:37:03+00:00", "summary": "[서울=뉴시스]우지은 전상우 기자 = 정점식 국민의힘 원내대표는 14일 \"정동영 통일부 장관 경질은 한미동맹 회복을 위한 선결조건\"이라고 했다. 정 원내대표는 이날 오전 국회에서 기자간담회를 열고 이재명 대통령을 향해 \"아직도 정동영 팬클럽 대표 직함을 들고 있는 것인가. 지금 당장 정 장관을 경질하라\"며 이같이 말했다. 정 원내대표는 \"대한민국의 합참의장과 주미대사까지 인정하는 한미갈등을 정 장관 혼자만 부인한다. 국방부가 인정한 북한의 침략행위 역시 정 장관 혼자만 부인한다\"며 \"가짜 평화 망상에 빠져 있으니 헛것이 보이는 지경", "language": "ko"}, {"title": "與 \"국힘, '北지뢰 규탄 결의안' 표결 불참…도발 규탄에 정치 조건 내걸어\"", "url": "https://www.newsis.com/view/NISX20261014_0003825535", "source": "뉴시스", "published": "2026-10-14T03:18:24+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 더불어민주당은 14일 국민의힘을 향해 \"북한의 도발을 규탄하는 것조차 정치적 조건을 내거는 무책임한 행태를 반성하라\"고 했다. 김성회 민주당 원내대변인은 이날 국회 소통관 브리핑을 통해 \"국민의힘은 '북한' 규탄 결의안에 '대한민국 국군'에 대한 조사 내용이 포함되지 않았다는 이유로 표결에 참여하지 않고 퇴장했다\"며 이같이 말했다. 김 원내대변인은 \"오늘 북한의 지뢰 도발을 규탄하는 결의안이 국방위원회를 통과했다\"며 \"정전협정을 정면으로 훼손한 북한 당국의 책임 인정과 사과를 요구하고, 대한민국 국민", "language": "ko"}, {"title": "이진숙 '5·18 왜곡 영상' 삭제 가처분 심문…'표현의 자유' 공방", "url": "https://www.newsis.com/view/NISX20261014_0003825524", "source": "뉴시스", "published": "2026-10-14T03:07:32+00:00", "summary": "[서울=뉴시스]홍연우 기자 = 5·18 광주민주화운동 유공자들과 이진숙 국민의힘 의원 측이 사회관계망서비스(SNS) 게시물 삭제를 둘러싸고 법정 공방을 벌였다. 유공자 측은 해당 게시물이 5·18을 폭동으로 인식하게 해 명예권을 침해한다고 주장했다. 이 의원 측은 역사적 사실을 왜곡하지 않았으며 표현의 자유가 보장돼야 한다고 맞섰다.  재판부는 국회의원이 다양한 이해관계를 대변하는 만큼 헌법상 표현의 자유가 보장된다는 점을 양측에 설명했다. 서울중앙지법 민사합의51부(부장판사 황인성)는 14일 5·18 유공자 4명이 이 의원을 상대", "language": "ko"}, {"title": "국방위, '北 지뢰 규탄 결의안' 與 주도 채택…국힘 \"군 진상규명 안 담겨\"", "url": "https://www.newsis.com/view/NISX20261014_0003825493", "source": "뉴시스", "published": "2026-10-14T03:07:18+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 국회 국방위원회는 14일 비무장지대(DMZ) 지뢰 도발을 규탄하고 북한의 진상 규명과 사과 및 책임자 처벌·재발 방지 대책 마련을 촉구하는 '북한 지뢰 도발 규탄 결의안'을 여당 주도로 채택했다.  국방위는 이날 오전 국회에서 전체회의를 열고 이 같은 내용이 담긴 '군사분계선(MDL) 이남 지역에서의 북한 지뢰 도발 규탄 결의안'을 더불어민주당 주도로 의결했다. 국민의힘은 표결에 불참했다.  여야는 이날 '도발을 방기하고 조사를 지연시킨 군에 대한 책임도 국회 차원에서 진상을 규명해야 한다'는 조항 ", "language": "ko"}, {"title": "국방위 '北지뢰도발 규탄 결의안' 채택…\"조사지연 규명\" 野퇴장", "url": "https://www.yna.co.kr/view/AKR20261014089700001", "source": "연합뉴스", "published": "2026-10-14T03:02:57+00:00", "summary": "(서울=연합뉴스) 최주성 기자 = 국회 국방위원회는 14일 비무장지대(DMZ) 지뢰 폭발 사건과 관련해 북한 도발을 규탄하는 결의안을 여당 주도...", "language": "ko"}, {"title": "[영상] 美브래들리 화력 U 년간 군에서 스스로 목숨을 끊은 장병이 571명에 이르는 상황에서 국방부가 현행 자살 예방 기본계획에...", "language": "ko"}, {"title": "AI로 벼 종자 수확시기 예측…지자체·민간에 무상 제공", "url": "https://www.newsis.com/view/NISX20261014_0003824839", "source": "뉴시스 경제", "published": "2026-10-14T02:00:00+00:00", "summary": "[세종=뉴시스]임소현 기자 = 국립종자원이 인공지능(AI)으로 벼 종자의 적정 수확시기를 예측하는 프로그램을 개발해 지방정부와 민간 종자업체에 무상으로 제공한다. 올해 정부 보급종 생산현장 9565필지에 적용한 결과 예측 시기와 실제 수확시기가 ±3일 수준으로 일치했다. 국립종자원은 한국전자기술연구원과 기상정보와 벼 생육정보를 활용한 'AI 기반 종자 수확기 예측 프로그램'을 개발해 생산현장에서 활용하고 있다고 14일 밝혔다. 최근 고온과 집중호우 등 이상기상이 잦아지면서 같은 벼 품종도 재배지역과 그해 기상여건에 따라 익는 시기와", "language": "ko"}, {"title": "US Army hackathon sets backdrop for an AUSA focused on autonomy", "url": "https://www.defensenews.com/industry/techwatch/2026/10/14/us-army-hackathon-sets-backdrop-for-an-ausa-focused-on-autonomy/", "source": "Defense News", "published": "2026-10-14T01:30:00+00:00", "summary": "The Army's Operation Jailbreak initiative asked defense companies to hack into each other's autonomous systems and machines, enabling them to communicate.", "language": "en"}, {"title": "농진청장 \"현장 체감 성과창출…농업인 소득증대 최선 다할 것\"", "url": "https://www.newsis.com/view/NISX20261014_0003825072", "source": "뉴시스 경제", "published": "2026-10-14T01:23:13+00:00", "summary": "[세종=뉴시스]김동현 기자 = 이승돈 농촌진흥청장은 14일 \"현장에서 체감하는 성과 창출을 통해 농업인의 소득 증대와 민생 안전에 최선을 다하겠다\"고 밝혔다.  이승돈 농진청장은 이날 오전 국회에서 열린 농림축산식품해양수산위원회 국정감사에 참석해 \"농진청은 기후재난과 농촌 고령화, 인력 부족 등 농업·농촌이 직면한 어려움에 대응하면서 현장에서 농업인이 체감할 수 있는 변화와 성과를 만드는데 역량을 집중하고 있다\"며 이같이 말했다.  이 청장은 먼저 \"현재 주요 농작물 생육 상황은 전반적으로 양호하지만 일부 과수에서 열매 터짐 피해가", "language": "ko"}, {"title": "US Army, Navy research labs team up to combat Arctic cold", "url": "https://www.defensenews.com/news/your-military/2026/10/14/us-army-navy-research-labs-team-up-to-combat-arctic-cold/", "source": "Defense News", "published": "2026-10-14T01:00:00+00:00", "summary": "As the Department of Defense eyes greater operability in the Arctic, it needs equipment that can operate in temps as low as -50 degrees Fahrenheit.", "language": };

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}
