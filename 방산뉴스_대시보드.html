 "2026-10-05T03:01:46+00:00", "summary": "[서울=뉴시스]김지훈 기자 = 국회 국방위원회 소속 유용원 국민의힘 의원은 5일 북한 지뢰 폭발 사고가 발생한 서부전선 비무장지대(DMZ) 뿐만 아니라 동부전선 DMZ에서도 북한의 군사분계선(MDL·휴전선) 침범이 발생했을 것으로 추정했다.  유 의원은 이날 오전 국회에서 기자회견을 열어 \"제가 최근 파악한 바에 따르면 북한군 지뢰지대 등 MDL 이남 침범 문제는 25사단에만 국한되지 않고 전방 여러 지역에서 발생하고 있다\"며 \"특히 동부전선 21사단에서는 북한군이 설치한 철책선 등 구조물까지 MDL 남쪽 지역에 설치돼 있다\"고 말", "language": "ko"}, {"title": "野유용원 \"北철책선, 21사단 지역 MDL 침범해 설치됐을 가능성\"", "url": "https://www.yna.co.kr/view/AKR20261005027500001", "source": "연합뉴스", "published": "2026-10-05T02:55:00+00:00", "summary": "(서울=연합뉴스) 권희원 기자 = 국민의힘 유용원 의원은 5일 \"동부전선 21사단에서는 북한군이 설치한 철책선 등 구조물까지 군사분계선(MDL)...", "language": "ko"}, {"title": "장동혁 \"李, 우크라엔 분노조절장애 北엔 분노조절잘해…큰 약점 잡힌건가\"", "url": "https://www.newsis.com/view/NISX20261005_0003814337", "source": "뉴시스", "published": "2026-10-05T02:35:48+00:00", "summary": "[서울=뉴시스]김지훈 한은진 기자 = 장동혁 국민의힘 대표는 5일 이재명 대통령이 비무장지대(DMZ) 북한 지뢰 폭발 사고 등에 대해 유감 표명을 하지 않고 있는 것과 관련해 \"도대체 북한에 얼마나 큰 약점을 잡힌 건가\"라고 했다. 대미(對美)투자에 관해서는 \"왜 우리 정부의 입장이 항상 미국의 발표와 다른가\"라고 지적했다.  장 대표는 이날 오전 국회에서 기자회견을 열어 \"이 대통령은 우크라이나에 대해서는 포로 송환 비공개 합의를 어겼다고 사과를 요구했다. 그런데 북한에 대해서는 지뢰를 매설해 우리 군인의 발을 날렸는데도, 미사일", "language": "ko"}, {"title": "전방 군단 모두 '빈총 경계'…국방부, 기관경고 방침", "url": "https://www.newsis.com/view/NISX20261005_0003814328", "source": "뉴시스", "published": "2026-10-05T02:29:57+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 국방부 감사 결과 우리 군 전방 모든 군단에 '빈총 경계' 사례가 있었던 것으로 5일 확인됐다.  국방부는 파주, 고양 등 경기 북부를 관할하는 육군 1군단에서 공용화기·개인화기에 실탄을 넣지 않고 경계 근무를 하고 있었다는 사실이 알려진 이후 감사에 착수했다.  그 결과 전방 감시초소(GP)와 일반전초(GOP) 경계를 담당하는 육군 2·3·5군단과 육군 수도군단 지시를 받아 서북부 접적지역을 관할하는 해병 2사단에서도 이런 사례가 확인됐다.  군이 전방경계를 설 때는 총에 실탄을 넣은 탄창을 결합", "language": "ko"}, {"title": "안철수 \"군사분계선 이어 NLL까지…정부, 안보 경계선 후퇴시켜\"", "url": "https://www.newsis.com/view/NISX20261005_0003814332", "source": "뉴시스", "published": "2026-10-05T02:24:12+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 안철수 국민의힘 의원이 남북정상선언 19주년을 맞아 10·4 선언 정신 계승을 언급한 이재명 대통령을 향해 북방한계선(NLL) 포기 시도를 즉각 중단하라고 촉구했다.  안 의원은 정부의 대북 기조가 육상 군사분계선(MDL) 경계 태세 후퇴에 이어 해상 경계선마저 무력화하고 있다고 주장했다. 안 의원은 5일 페이스북을 통해 이 대통령의 발언을 언급하며 \"2000년대 10·4 선언문에는 NLL이라는 단어 자체가 없다\"고 적었다. 이어 \"대신 서해평화협력 특별지대와 공동 어로구역 설정이 들어갔다\"며 \"이는", "language": "ko"}, {"title": "韓 비료, 브라질 진출 교두보…콩·옥수수 시장 겨냥", "url": "https://www.newsis.com/view/NISX20261005_0003814174", "source": "뉴시스 경제", "published": "2026-10-05T02:00:00+00:00", "summary": "[세종=뉴시스]이수정 기자 = 국내 비료 기업이 농촌진흥청과의 민관 협력을 바탕으로 세계 최대 농업 강국인 브라질의 콩·옥수수 시장 진출에 나선다.  농촌진흥청은 그린바이오 기업 누보가 브라질 바이오 농업기업 에코아(Ekoa Life Sciences)와 콩·옥수수용 고효율 비료 개발을 위한 공동연구계약(CRA)을 체결했다고 5일 밝혔다. 브라질은 세계 1위 콩 생산국이자 주요 옥수수 수출국이다. 두 작물의 재배면적은 약 6900만㏊로 한국 국토 면적의 약 7배에 달한다.  이번 협력은 지난 2월 한-브라질 정상회담 이후 농진청이 국", "language": "ko"}, {"title": "'실탄 미장착' 전방군단 추가확인…국방부 기관경고 방침", "url": "https://www.yna.co.kr/view/AKR20261005020900504", "source": "연합뉴스", "published": "2026-10-05T01:28:21+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 국방부가 육군 1군단의 '실탄 미장착' 경계작전 논란 후 점검을 벌여 여타 전방 군단에서도 유사 사례를 확인하...", "language": "ko"}, {"title": "의료기관 사이버사고 6년간 109건…올해만 벌써 '16건'", "url": "https://www.newsis.com/view/NISX20261004_0003813955", "source": "뉴시스", "published": "2026-10-05T01:01:00+00:00", "summary": "[세종=뉴시스] 강진아 기자 = 지난 1월 강원대병원과 전남대병원에서 랜섬웨어 공격을 받아 전산망이 마비되는 사태가 벌어졌다. 당시 자기공명영상(MRI), 컴퓨터단층촬영(CT) 영상 등이 보관된 의료영상저장전송시스템(PACS)에 장애가 발생하면서 업무에 혼란을 겪었다. 의료진이 진료실에서 MRI나 CT 결과를 확인하지 못해 직접 촬영실을 오갔고, 이 중 한 병원은 시스템 장애로 오전 5시30분부터 10시20분까지 4시간50분간 일부 진료가 중단되는 사태가 빚어졌다. 강원대병원은 암호 해독을 대가로 수억원대 비트코인을 요구받은 것으로", "language": "ko"}, {"title": "유승민 \"BTS 국위선양이 더 큰데…스포츠·예술 병역특례 폐지해야\"", "url": "https://www.newsis.com/view/NISX20261005_0003814195", "source": "뉴시스", "published": "2026-10-05T00:30:00+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 유승민 전 의원이 아시안게임 금메달리스트를 둘러싼 병역특례 논란과 관련해 스포츠와 예술 분야의 병역면제 기준 자체를 모두 폐지해야 한다고 주장했다. 유 전 의원은 5일 자신의 페이스북을 통해 \"아시안게임에서 금메달을 딴 축구, 야구 선수들이 군면제를 두고 보인 경박한 언행이 많은 국민들의 반감을 사고 있습니다\"라며 \"특히 북한의 DMZ 지뢰도발로 우리 군인들이 큰 부상을 입어 온 국민이 분노하고 있는데, 국방의 의무를 두고 선수들이 보인 언행은 실망스럽기 짝이 없습니다\"라고 비판했다. 이어 그는 \"그", "language": "ko"}, {"title": "북·중 간 신압록강대교   "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
