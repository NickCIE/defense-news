TQ?oc=5", "source": "Reuters", "published": "2026-07-07T08:21:43+00:00", "summary": "NATO's Rutte says allies to buy up to five Triton surveillance drones    Reuters", "language": "en"}, {"title": "대여 공세 집중하는 장동혁…인천 등 '참정권 집회' 참석 예고도", "url": "https://www.newsis.com/view/NISX20260707_0003699518", "source": "뉴시스", "published": "2026-07-07T07:50:30+00:00", "summary": "[서울=뉴시스] 이승재 한은진 기자 = 장동혁 국민의힘 대표가 7일 정보통신망법 개정안 시행, 검찰 보완수사권 폐지 문제 등 다양한 이슈에 목소리를 내며 대여 공세에 집중하고 있다. 당 중앙윤리위원회가 당내 의원들을 향한 징계 논의에 착수하면서 당 안팎에서 비판이 제기되는 가운데 정부·여당을 향한 공세 수위를 높이면서 돌파구를 마련하려는 모습이다. 장 대표는 이날 오후 4시 30분 기준 하루에만 총 5건의 게시물을 자신의 페이스북에 올렸다. 정오께부터 1시간 간격으로 계속해서 메시지를 냈다. 그는 코스피가 급락하며 올해 들어 16번", "language": "ko"}, {"title": "독일 5월 산업생산 0.9%↑…\"자동차 호조에 예상 웃돌아\"", "url": "https://www.newsis.com/view/NISX20260707_0003699524", "source": "뉴시스 경제", "published": "2026-07-07T07:45:38+00:00", "summary": "[서울=뉴시스]이재준 기자 = 유럽 최대 경제국 독일의 5월 산업생산은 자동차 호조로 시장 예상을 웃돌며 작년 9월 이래 가장 큰 폭으로 증가했다. 공장 주문이 늘어난데 이어 생산도 개선하면서 제조업 회복에 대한 기대가 커지고 있다. RTT 뉴스와 마켓워치, dpa 통신에 따르면 독일 연방통계청은 7일 2026년 5월 산업생산 지수가 계절 조정치로 전월 대비 0.9% 상승했다고 발표했다. 시장에서는 산업생산이 0.2% 증가한다고 예상했는데 실제로는 이를 훨씬 상회했다. 4월 0.2% 증가(조정치)보다도 대폭 가속했다. 산업생산 확대", "language": "ko"}, {"title": "NATO to acquire ‘up to’ 10 Saab GlobalEyes for E-3 replacement, says Secretary General", "url": "https://breakingdefense.com/2026/07/nato-to-acquire-up-to-10-saab-globaleye-for-e-3-replacement-says-secretary-general/", "source": "Breaking Defense", "published": "2026-07-07T07:38:49+00:00", "summary": "The selection decision in favor of the Swedish aircraft comes after NATO axed plans to acquire Boeing E-7 Wedgetail surveillance planes.", "language": "en"}, {"title": "한반도 지켜볼 '농림위성' 우주로…차중 4호 발사(종합)", "url": "https://www.yna.co.kr/view/AKR20260707138052017", "source": "연합뉴스", "published": "2026-07-07T07:21:13+00:00", "summary": "(서울=연합뉴스) 조승한 기자 = 농업·산림 관리, 산림 변화 모니터링용 농림위성으로 개발된 차세대 중형위성(차중) 4호가 7일 우주로 향했다.", "language": "ko"}, {"title": "방사청장 \"캐나다 잠수함 사업, 나토 상호운용성에서 결정적 차이\"(종합)", "url": "https://www.newsis.com/view/NISX20260707_0003699467", "source": "뉴시스", "published": "2026-07-07T07:16:43+00:00", "summary": "[서울=뉴시스] 남빛나라 유자비 기자 = 이용철 방위사업청장은 7일 캐나다 정부가 발표한 잠수함사업(CPSP)에서 한국이 선정되지 못한 데 대해 \"결정적 차이는 승조원 공유까지 가능한 북대서양조약기구(NATO·나토) 상호운용성, 협력 부분에서 발생했다고 보인다\"고 말했다. 이 청장은 이날 서울 용산구 국방부에서 기자들과 만나 \"결과가 아쉽지만 이번 도전 성과가 없지는 않다\"며 \"우리 잠수함 기술력과 산업 경쟁력을 세계 방산시장에 각인시키는 계기가 됐다\"고 했다. 이어 \"이제 안보동맹 중시 블럭화와 자국 무기 우선주의는 방산시장의 상", "language": "ko"}, {"title": "차세대 중형위성 4호 탑재 우주발사체 '팰컨9' 발사", "url": "https://www.yna.co.kr/view/AKR20260707138051017", "source": "연합뉴스", "published": "2026-07-07T07:15:45+00:00", "summary": "(서울=연합뉴스) 조승한 기자 = 농업·산림 관리, 산림 변화 모니터링용 농림위성으로 개발된 차세대 중형위성(차중) 4호가 7일 우주로 향했다.", "language": "ko"}, {"title": "北-中 국경 밀수 경로 12곳 이상 다시 활발-NK뉴스 위성 사진 분석", "url": "https://www.newsis.com/view/NISX20260707_0003699228", "source": "뉴시스", "published": "2026-07-07T07:07:00+00:00", "summary": "[서울=뉴시스] 구자룡 기자 = 북한과 중국간 국경에서 12개 이상의 임시 밀수 경로가 지난해 말 이후 잠잠했다가 최근 몇 주 동안 다시 활발해진 것으로 나타났다고 북한 전문매체 NK 뉴스가 6일 보도했다.  매체에 따르면 미국 민간위성 플래닛랩스 위성 이미지 분석 결과 이 경로들은 차량과 기타 물품을 북한으로 밀반입하는 데 사용됐다.  매체에 따르면 북한 내부 소식지 림진강이 밀수 사진과 세부 정보 처음 공개하고 지난해 12월에는 NK 뉴스도 압록강을 가로 지르는 밀수 지점 등을 상세히 보도한 뒤 올해 초에는 밀수가 중단됐다.  ", "language": "ko"}, {"title": "방사청 \"아쉽지만 캐나다 잠수함사업 선정 결과 존중\"", "url": "https://www.hankyung.com/article/2026070706487", "source": "한국경제 정치", "published": "2026-07-07T07:04:24+00:00", "summary": "", "language": "ko"}, {"title": "국조특위, 중앙선관위 찾아 투표용지 부족 사태 부실 대응 질타 [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260707_0003699422", "source": "뉴시스", "published": "2026-07-07T07:04:15+00:00", "summary": "[서울=뉴시스] 류현주 우지은 기자 = 국회 6·3 지방선거 투표용지 부족 사태 등 진상 규명 국정조사특별위원회(국조특위)가 7일 중앙선거관리위원회(중앙선관위) 현장조사에서 투표용지 부족 사태 발생 당시 부실했던 선관위의 대응을 한목소리로 질타했다. 더불어민주당 이기헌 의원은 이날 오전 경기 과천시 중앙선관위에서 열린 2차 현장조사에서 \"투표용지가 부족하다고 전화받고도 자체 확인하는 데만 선관위가 50분씩 소요되는 조직이 돼 버렸다\"며 \"선거상황실이 이렇게 느슨하게 업무를 진행했다\"고 지적했다. 국민의힘 주진우 의원은 \"6월 3일 ", "language": "ko"}, {"title": "US plans PAC-3 missile ma const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
