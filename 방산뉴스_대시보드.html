ummary": "[서울=뉴시스] 옥승욱 신효령 기자 = 제이비어 브런슨 주한미군사령관이 대규모 지휘소연습에 집중된 한미연합훈련에서 벗어나 한반도 전역을 활용한 분산형 훈련이 필요하다고 밝혔다. 우크라이나 전쟁에서 실전 경험을 쌓는 북한군에 맞서 병력과 장비의 노출을 줄이고 기동 능력을 높여야 한다는 취지다. 브런슨 사령관은 12일(현지시간) 미국 워싱턴DC에서 열린 미 육군협회(AUSA) 연례행사 패널 토론을 통해 \"한국에서 매년 실시하는 두 차례 대규모 연습이 주로 대형 지휘소에 집중돼 있다\"며 \"우리는 이런 방식에서 벗어날 필요가 있다\"고 말했", "language": "ko"}, {"title": "강신철 국방부 장관, 취임 후 예비역단체 첫 방문", "url": "https://www.newsis.com/view/NISX20261013_0003824598", "source": "뉴시스", "published": "2026-10-13T10:00:04+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 가강신철 국방부장관은 13일 오후 성우회와 재향군인회를 방문했다.  강 장관의 이날 방문은 예비역단체의 다양한 의견을 듣기 위해 마련됐다.  강 장관은 국가와 군에 대한 예비역단체의 헌신에 감사의 뜻을 전했다. 또 어떠한 안보 위협에도 대응할 수 있는 국방태세 확립을 위한 예비역단체의 지속적인 격려와 성원을 요청했다. 강 장관은 앞으로도 예비역단체들과의 소통을 지속적으로 강화해 현장의 의견을 국방정책에 적극 반영해 나갈 방침이다. \n◎공감언론 뉴시스 okdol99@newsis.com", "language": "ko"}, {"title": "강신철, 예비역 단체 방문…국방정책 현안 의견 들어", "url": "https://www.yna.co.kr/view/AKR20261013180800504", "source": "연합뉴스", "published": "2026-10-13T09:45:48+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 강신철 국방부 장관이 13일 오후, 취임 후 처음으로 성우회와 재향군인회 등 예비역 단체를 찾아 국방정책 현안...", "language": "ko"}, {"title": "미·중 우주 AI데이터센터 경쟁 가속…우주청 \"2028년 조기 실증 노력\"", "url": "https://www.newsis.com/view/NISX20261013_0003824495", "source": "뉴시스", "published": "2026-10-13T09:20:56+00:00", "summary": "[서울=뉴시스]심지혜 기자 = 우주 인공지능(AI) 데이터센터의 조기 실증 필요성에 여야가 한목소리를 냈다. 미국과 중국 등 주요국이 우주 AI 데이터센터 개발에 속도를 내는 가운데 우리나라도 핵심기술을 실제 우주 환경에서 검증할 수 있도록 일정 단축과 예산 확대가 필요하다는 것이다.  우주항공청은 기존 2030년으로 잡힌 실증 일정을 앞당겨 2028년을 목표로 조기 실증을 추진한다는 구상이다. 13일 국회 과학기술정보방송통신위원회의 우주항공청 국정감사에서 여야 의원들은 우주 AI 데이터센터 사업의 추진 속도와 예산 문제를 언급했다", "language": "ko"}, {"title": "與, 추미애에 \"일방 독주\" \"李정부 노선과 반대\"…秋 \"독주 안 해\"(종합)", "url": "https://www.newsis.com/view/NISX20261013_0003824502", "source": "뉴시스", "published": "2026-10-13T08:53:19+00:00", "summary": "[서울=뉴시스] 이창환 한은진 기자 = 더불어민주당은 13일 국회 행정안전위원회 국정감사에서 추미애 경기지사와 재정 비상 상황 선언, 경기도 인사 지연 등 사안을 두고 신경전을 벌였다. 이광희 민주당 의원은 이날 경기도청 대상 국정감사에서 추 지사에게 \"재정 건전화 필요성도 매우 공감한다. 다만 목표가 옳다고 해서 방식까지 정당화되는 것은 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
