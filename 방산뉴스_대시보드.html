 \"회담은 친선적인 분위기 속에서 진행되였다\"고 밝혔다. 통신은 조용원 노동당 중앙위원회 비서도 카시스 장관과 \"친선적", "language": "ko"}, {"title": "北, 제재감시팀에 \"전략적 실패\"…'비핵화처럼 무력화 될 것' 주장", "url": "https://www.newsis.com/view/NISX20261031_0003849168", "source": "뉴시스", "published": "2026-10-30T23:38:57+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한은 31일 국제사회의 대북제재와 관련해 북한에 대한 '비핵화' 요구와 마찬가지로 무력화될 것이라고 주장했다. 이날 북한 대외매체 조선중앙통신에 따르면 외무성 대변인은 대북제재를 감시하기 위해 한국, 미국 등 11개국이 참여하는 '다국적제재모니터링팀'(MSMT) 일부 회원국과 유럽연합(EU)의 최근 추가 체재에 반발하는 담화를 30일 냈다. 대변인은 \"부당하고 무근거한 구실을 붙여 저들의 악의적이고 불량한 대조선(북한) 적대시 정책을 정당화해 보려는 미국과 그 추종세력들의 비열한 음모책동을 엄중한", "language": "ko"}, {"title": "특검도 기소 안했는데…조희대 국정조사, 실효성 의문", "url": "https://www.newsis.com/view/NISX20261030_0003848328", "source": "뉴시스", "published": "2026-10-30T22:00:00+00:00", "summary": "[서울=뉴시스]김정현 기자 = 더불어민주당이 조희대 대법원장에 대한 국정조사 초점을 '12·3 비상계엄 당시 행보'에 맞추기로 했으나 새로운 사실이 드러날 가능성이 높지 않아 실효성이 의심스럽다는 반응이 나온다. 2개의 특별검사팀이 의혹을 수사했으나 범죄 혐의를 밝혀내지 못했다. 조 대법원장은 국정감사에서 계엄사령부의 협조 요청을 거부하라고 지시했다고 밝힌 바 있다. 31일 법조계와 정치권에 따르면 더불어민주당은 조 대법원장에 대한 국정조사 목적을 12·3 비상계엄 선포 당시의 행위에 초점을 맞추는 것으로 가닥을 잡고 다음 달 5일", "language": "ko"}, {"title": "국제 유가, 중동정세 악화에 반등 마감…WTI 2.08%↑ 브렌트유 2.4%↑", "url": "https://www.newsis.com/view/NISX20261031_0003849143", "source": "뉴시스 경제", "published": "2026-10-30T21:59:08+00:00", "summary": "[서울=뉴시스]이재준 기자 = 국제 유가는 30일(현지시간) 중동정세 악화로 원유 공급 부족이 장기화할 가능성이 커지면서 반등 마감했다. 뉴욕상업거래소(NYMEX)에서 이날 미국 서부텍사스산 원유(WTI) 12월 인도분은 전일 대비 2.12달러, 2.08% 올라간 배럴당 104.12달러로 거래를 끝냈다. 미국 중간선거 후 미국이 이란을 재차 공격한다는 경계감이 선물 매수를 부추겼다.  WTI 선물 근월물은 10월 한달 동안 15.2% 뛰었다. 월간으로 4개월 연속 오름세를 이어갔다. 런던 ICE 선물거래소에서 북해산 기준유 브렌트유", "language": "ko"}, {"title": "[AI돋보기] 코인 탈취부터 위장 취업까지…북한발 사이버 위협은", "url": "https://www.yna.co.kr/view/AKR20261030161700017", "source": "연합뉴스 경제", "published": "2026-10-30T21:33:01+00:00", "summary": "(서울=연합뉴스) 심재훈 기자 = 가상자산을 훔치고 방산업체의 기술자료를 빼내는 해킹 조직, 신분을 속여 해외 기업에 취업하는 정보기술(IT) ...", "language": "ko"}, {"title": "US greenlights 500 Patriot missiles for Ukraine, with $2.1 billion to be paid by allies", const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
