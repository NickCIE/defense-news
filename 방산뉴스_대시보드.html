d": "2026-08-05T05:02:00+00:00", "summary": "US presses on with Ukraine Patriot missile talks, sources say, despite Trump's doubts    Reuters", "language": "en"}, {"title": "전쟁 특수에 930억불 번 석유 공룡들…\"기후위기 대가 치러야\"", "url": "https://www.newsis.com/view/NISX20260805_0003737055", "source": "뉴시스 경제", "published": "2026-08-05T04:57:53+00:00", "summary": "[서울=뉴시스]오영주 기자 = 세계 주요 석유 기업들이 중동발 전쟁과 에너지 가격 급등에 힘입어 막대한 수익을 거둔 가운데, 이들이 기후 위기 대응 비용을 부담해야 한다는 목소리가 커지고 있다. 4일(현지 시간) 영국 가디언에 따르면 BP·셸·엑손모빌 등 글로벌 석유 대기업 8곳은 올해 2분기(4~6월) 총 930억 달러(약 132조3400억원)에 달하는 수익을 거뒀다. 전년 동기 대비 약 2배 증가한 규모로, 합산 시가총액도 3조 달러를 넘었다. 특히 사우디아라비아 국영 석유 기업 아람코는 미사일 공격에 일부 인프라가 손상됐음에도", "language": "ko"}, {"title": "덕성여대 방위산업보안연구소, ‘방위산업보안 워크숍 및 간담회’ 개최 - 매일일보", "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE5ibmRuY3BlSUk4b1NCT1hTejhfZjVTbmR1VEpnOWFxSW1BVmFRb3RYUzJpS2RVQnh5M2ZleFlXZTN0d2prWEtldzVhTURidGpqWTg1d19KZG5PR0o4a2t3UFE5NXQ?oc=5", "source": "방산 뉴스", "published": "2026-08-05T04:48:12+00:00", "summary": "덕성여대 방위산업보안연구소, ‘방위산업보안 워크숍 및 간담회’ 개최    매일일보", "language": "ko"}, {"title": "산단공, 오픈이노베이션 프로그램 참여 스타트업 모집", "url": "https://www.newsis.com/view/NISX20260805_0003737389", "source": "뉴시스 경제", "published": "2026-08-05T04:41:47+00:00", "summary": "[세종=뉴시스]김동현 기자 = 한국산업단지공단은 신용보증기금과 함께 대·중견기업과 혁신 스타트업을 잇는 개방형 혁신 프로그램 '2026년 산업단지 오픈이노베이션 프로그램' 참여기업을 오는 12일까지 모집한다고 5일 밝혔다. 산업단지 오픈이노베이션 프로그램(KICXUP)은 전국 산업단지를 대표하는 대중견기업(수요기업)과 혁신 기술을 보유한 스타트업을 매칭해 공동 연구개발(R&D)과 사업화를 지원하는 개방형 혁신 프로그램이다.  올해는 수요기업이 직접 과제를 제시하는 기존의 '킥스업 챌린지'에 더해 지역 산업단지 현안을 스타트업과 함께", "language": "ko"}, {"title": "이재명 대통령, \"자주국방 대한민국 최고 목표, 스스로 못 지키면 결격\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260805_0003737395", "source": "뉴시스", "published": "2026-08-05T04:41:00+00:00", "summary": "[서울=뉴시스]조성봉 김지은 김진아 기자 = 이재명 대통령은 5일 국방부 등 업무보고에서 \"어떤 외부의 도움도 없이 우리 스스로 지켜나가는 자주국방은 가장 큰 과제\"라고 했다.이 대통령은 이날 오전 청와대에서 주재한 외교부·국방부·통일부·국가보훈부 대상 업무보고에서 \"자주국방은 대한민국 최고의 목표다. 하나의 국가가 스스로를 지키지 못한다는 건 결격이다, 스스로 지켜야 한다\"며 이같이 말했다.그러면서 \"당연히 주권 일부인 군 지휘권도 스스로 행사해야 한다\"며 \"국군이 군 통수권자인 대통령 명령을 받는 국방부 장관 지휘를 받지 않는다", "language": "ko"}, {"title": "李대통령 \"군사 쿠데타는 다 육사서…통합하면 그 가능성 줄 것\"", "url": "https://www.yna.co.kr/view/AKR20260805083100001", "source": "연합뉴스", "published": "2026-08-05T04:29:51+00:00", "summary": "(서울=연합뉴스) 임형섭 설승은 기자 = 이재명 대통령은 5일 \"지금까지 대한민국의 군사 쿠데타가 몇 번 있었나. 다 육군에서 벌어진 일 아닌가...", "language": "ko"}, {"title": "국방부 \"올 SCM때 전작권 전환연도 결정 가능…UFS서 일부 평가\"(종합)", "url": "https://www.yna.co.kr/view/AKR20260804153751504", "source": "연합뉴스", "published": "2026-08-05T04:28:56+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 전시작전통제권(전작권) 전환에 속도를 내고 있는 정부가 올해 가을 한미안보협의회(SCM)에서 전환 시기를 결정...", "language": "ko"}, {"title": "EXCLUSIVE: North Korean missile unit deploys in Russia for Ukraine war, Kyiv says - Reuters", "url": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxPaFRSNUJ4Q1ZaYlI0cVl1UjMyRHBNdE40MEYtTGJ6YXplZTdyTG9XTkRDSzg3NUNhUGVTTkY3c1I1MThScU1pZF9Ta1hDYzlHeklKZU8xVTdpUE5xemw4eU4wcUxBUXQ4N1VmMTMxM1N1dXo0SXNMWklQc21EeTFUdnpvTlF4QXRlNGpQM1FySkQ5eDhCWDRLVDVRd1VlaUlpUmtuRS1TVkNEOXRhalVyOXF6VUhFM0JxdzVMaUlXWkpNM2s?oc=5", "source": "Reuters", "published": "2026-08-05T04:02:00+00:00", "summary": "EXCLUSIVE: North Korean missile unit deploys in Russia for Ukraine war, Kyiv says    Reuters", "language": "en"}, {"title": "정동영 \"남북 상호존중, '이름 부르기' 첫걸음…'주적' 혐오 언어 멈춰야\"(종합)", "url": "https://www.newsis.com/view/NISX20260805_0003737316", "source": "뉴시스", "published": "2026-08-05T03:51:47+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 정동영 통일부 장관은 5일 남북 상호존중 차원에서 \"서로 이름을 불러주는 것을 첫걸음으로 '주적' 등 서로에 대한 대결과 혐오의 언어는 멈춰야 한다\"고 말했다. 공론화 과정을 거쳐 정 장관이 공식석상에서 사용해 온 '조선(북한 공식 국호 조선민주주주의인민공화국의 약칭)' 호칭을 확산하자는 제안이다.   ◆'조선' 직접 언급 없이 '이름 부르기' 보고 정 장관은 이날 오전 청와대 영빈관에서 이 같은 내용을 담은 2026년도 하반기 업무계획을 이재명 대통령에게 보고했다. 정 장관은 1월 2일 열린 통일", "language": "ko"}, {"title": "2029 대전 인빅터스 게임 본격 시동…보훈부, 'K-보훈' 세계화 나서", "url": "https://www.newsis.com/view/NISX20260805_0003736934", "source": "뉴시스", "published": "2026-08-05T03:11:51+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국가보훈부가 2029년 대전에서 열리는 세계상이군인체육대회인 인빅터스 게임을 계기로 'K-보훈'의 세계화에 본격 나선다.  아시아 최초로 열리는 인빅터스 게임을 성공적으로 개최해 대한민국 보훈의 국제적 위상을 높이는 한편, 정부가 먼저 보훈대상자를 찾아 예우하는 '찾아가는 보훈' 등을 통해 국가책임 보훈체계를 강화해 나갈 방침이다.  국가보훈부는 5일 청와대 영빈관에서 이재명 대통령이 주재하는 2026년 하반기 업무보고를 실시했다고 밝혔다.  업무보고에는 인빅터스 게임 성공 개최를 통한 'K-보훈' ", "language": "ko"}, {"title": "병무청, 병역면탈 차단·AI 병무행정 강화…취업맞춤특기병도 확대", "url": "https://www.newsis.com/view/NISX20260805_0003737272", "source": "뉴시스", "published": "2026-08-05T03:07:30+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 병무청이 병역의 공정성을 높이기 위해 병역판정 심리검사를 개선하고 병역면탈 단속 범위를 확대하는 한편, 청년들의 병역이행 지원과 AI 기반 병무행정 구축에 나선다. 병무청은 5일 이재명 대통령 주재 부처 업무보고에서 이같은 내용을 담은 하반기 역점 추진과제를 보고했다. 핵심 추진 방향은 ▲병역의 공정성 강화 ▲청년 병역이행 지원 ▲AI 기반 병무행정 구현 및 전시 동원태세 확립이다. 우선 병역의 공정성 강화를 위해 군 복무부적합자를 보다 정밀하게 가려낼 수 있도록 병역판정검사 첫 단계에서 실시하는 심", "language": "ko"}, {"title": "방사청 \"전작권 전력 적기 확보…연내 핵추진잠 사업계획 수립\"", "url": "https://www.newsis.com/view/NISX20260805_0003737190", "source": "뉴시스", "published": "2026-08-05T03:06:42+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 방위사업청이 전시작전통제권(전작권) 전환에 필요한 핵심 전력을 적기에 확보하고, 연내 핵추진잠수함 사업계획을 수립하는 등 '대체불가 K-방산' 구현에 속도를 낸다. 방사청은 5일 청와대 영빈관에서 국방부·병무청과 함께 열린 이재명 대통령 주재 하반기 업무보고에서 이같은 내용을 담은 5대 핵심 추진과제를 발표했다. 방사청은 우선 자주국방을 위한 핵심 전력 확보를 최우선 과제로 제시했다. 전작권 전환에 필요한 전력을 적기에 확보하는 한편 인공지능(AI)과 유·무인 복합체계 등 미래 전력을 조기에 전력화한", "language": "ko"}, {"title": "국방부, 후반기 전작권 회복 로드맵 완성…핵잠 특별법도 연내 제정", "url": "https://www.newsis.com/view/NISX20260805_0003736838", "source": "뉴시스", "published": "2026-08-05T03:00:30+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부가 올해를 전시작전통제권(전작권) 전환의 원년으로 삼아 전환 절차를 본격화하고 국가전략사업인 핵추진잠수함 건조를 추진한다.  이와 함께 한국형 3축체계 고도화와 AI 기반 군 구조 개편, 장병 처우 개선, 해병대 준4군 체제 개편 등을 통해 '국민에게 신뢰받는 첨단 강군'을 구현한다는 구상이다. 국방부는 5일 청와대 영빈관에서 이재명 대통령 주재로 열린 업무보고에서 이 같은 내용을 포함한 13개 핵심 추진과제를 보고했다.  국방부가 꼽은 핵심 추진과제는 ▲국민의 군대로 거듭나기 위한 내란청산 ▲", "language": "ko"}, {"title": "중앙소방학교, 해군 특수전전단과 재난대응 협력 강화", "url": "https://www.yna.co.kr/view/AKR20260805036900530", "source": "연합뉴스", "published": "2026-08-05T03:00:11+00:00", "summary": "(서울 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
