mary": "[워싱턴=AP/뉴시스] 이재준 기자 = 미국 재무부는 4일(현지시간) 이란 정부의 ‘핵심 금융 생명줄’ 역할을 하고 있다고 지목한 튀르키예 금융기관에 경제 제재를 발동했다. 재무부 해외자산통제국(OFAC)은 이날 이란 정부로 연결되는 금융망을 차단하기 위한 추가 조치로 튀르키예 금융기관 골든 글로벌 야티림 방카시 아노님 시르케티(Golden Global Yatirim Bankasi Anonim Sirketi)를 제재 대상으로 지정했다고 밝혔다. 미국 측은 해당 은행이 이란 금융기관에 환거래은행 서비스를 제공해 이란이 국제적으로 자금", "language": "ko"}, {"title": "Opposition by US and Russia raises doubts over autonomous weapons talks outcome, diplomats say", "url": "https://www.defensenews.com/news/pentagon-congress/2026/09/04/opposition-by-us-and-russia-raises-doubts-over-autonomous-weapons-talks-outcome-diplomats-say/", "source": "Defense News", "published": "2026-09-04T15:27:01+00:00", "summary": "Opposition from the U.S. and Russia has raised doubts that countries meeting Friday will agree on international rules about the use of autonomous weapons.", "language": "en"}, {"title": "李대통령, 호르무즈 파병 질문에 \"진척된 것 없다\"…靑 \"다양한 옵션 종합적 검토\"(종합2보)", "url": "https://www.newsis.com/view/NISX20260904_0003777336", "source": "뉴시스", "published": "2026-09-04T14:31:21+00:00", "summary": "[서울=뉴시스]조재완 김지은 기자 = 이재명 대통령은 4일 청와대에서 주재한 시민사회단체 초청 간담회에서 호르무즈 해협 파병과 관련한 참석자의 질문에 \"진척된 것은 없다\"면서 \"고민하고 있다\"고 답한 것으로 알려졌다. 이 대통령은 이날 간담회에서 파병 문제와 관련, 우리나라 원유 수입의 70%가 호르무즈 해협 등 중동 항로에 의존하는 상황에서 전쟁에 관여하는 문제와 우리 상선의 안전한 항행을 확보하는 문제는 구분해서 봐야 한다고 언급하면서 이 같이 말한 것으로 전해졌다. 이에 앞서 청와대 관계자는 이날 파병 문제에 대해 \"정해진 건", "language": "ko"}, {"title": "Space industry lacks workers needed to rebuild satellites lost in war, report says", "url": "https://www.defensenews.com/industry/techwatch/2026/09/04/space-industry-lacks-workers-needed-to-rebuild-satellites-lost-in-war-report-says/", "source": "Defense News", "published": "2026-09-04T13:50:33+00:00", "summary": "The U.S. does not have enough engineers, technicians and assemblers to rebuild military space assets destroyed in a war with China or Russia, per RAND.", "language": "en"}, {"title": "靑,호르무즈 파병문제에 \"대비태세 손상없는 범위서 운신할수도\"(종합2보)", "url": "https://www.yna.co.kr/view/AKR202609040785520 기자 = 외교부는 태국, 튀르키예, 아제르바이잔, 에티오피아 등 4개국의 일부 지역에 대한 특별여행주의보를 해제한다고 4일 밝혔다.  외교부는 이달 중 특별여행주의보가 해제될 예정인 국가들에 대해 연장 여부를 검토한 결과 이같이 결정했다고 밝혔다. 각국의 치안·정세·보건 및 재난 상황 등을 고려했다.  아울러 엘살바도르, 우간다, 쿠바 등 3개국 및 러시아, 멕시코, 볼리비아, 사우디아라비아, 세네갈, 요르단, 중국, 콩고민주공화국, 태국 등 9개국의 일부 지역에 대한 특별여행주의보는 연장하기로 결정했다. 태", "language": "ko"}, {"title": "與 일각, 호르무즈 파병 반대 목소리…범여권 \"넘어선 안 될 선\"(종합)", "url": "https://www.newsis.com/view/NISX20260904_0003777181", "source": "뉴시스", "published": "2026-09-04T09:01:14+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 4일 더불어민주당 내에서 정부의 호르무즈 해협 파병 검토에 대한 반대 목소리가 나왔다. 조국혁신당, 진보당 등 범여권에서는 \"'파병'은 정부가 절대로 넘어서는 안 될 선\", \"파병 검토를 즉각 중단하라\"고 목소리를 높였다.  국회 외교통일위원회 소속 이기헌 민주당 의원은 이날 페이스북에 글을 올려 \"우리 군의 호르무즈 해협 파병 검토 보도가 나왔다\"며 \"청와대는 '결정된 바 없다'고 밝혔지만, 우리 군의 정찰 자산이나 군수 지원 등 파병 카드가 언론을 통해 거론되는 것 자체만으로도 심히 우려스럽다\"고", "language": "ko"}, {"title": "발전5사 합치고, LH 쪼개고…公기관 기능개혁 속도낼까?(종합)", "url": "https://www.newsis.com/view/NISX20260904_0003777091", "source": "뉴시스 경제", "published": "2026-09-04T08:00:10+00:00", "summary": "[세종=뉴시스] 안호균 기자 = 정부가 전체 공공기관의 20%에 달하는 109를 감축하는 구조조정을 추진한다. 공공기관이 보유한 기술·인력 등 핵심 역량을 시대의 흐름에 맞게 전략적으로 재배치하고 유사·중복 기능은 일원화한다는 구상이다.  정부는 올해 4분기부터 시작되는 공공기관 이전에 맞춰 속도감 있게 통폐합을 추진하겠다는 계획이다. 하지만 노조와 주주, 지역사회 등 이해관계자들의 반발도 만만치 않아 구조개혁 추진 과정에서 상당한 진통이 예상된다. 4일 재정경제부 등에 따르면 정부는 전날 발표한 '공공기관 기능개혁 추진방안'을 통", "language": "ko"}, {"title": "농진청, 벼농사용 무인항공 방제 농약 등록 기준 마련", "url": "https://www.newsis.com/view/NISX20260904_0003777080", "source": "뉴시스 경제", "published": "2026-09-04T07:53:18+00:00", "summary": "[세종=뉴시스]김동현 기자 = 농촌진흥청은 벼 병해충 방제에 무인항공기(드론)를 효과적으로 이용할 수 있도록 농약 등록 기준을 새롭게 마련하고 올해 안에 관련 고시를 개정한다고 4일 밝혔다.  무인항공기를 이용한 병해충 방제는 넓은 면적을 짧은 시간에 처리할 수 있어 일손 부족을 겪는 농업 현장에서 활용이 늘고 있지만 크기와 살포 물량에 따라 방제 효과가 달라져 기준 마련 필요성이 제기되고 있는 중이다.  농진청은 지난해 실증시험으로 무인항공기 크기별, 살포 물량별 벼멸구 방제 효과를 분석한 바 있다. 시험 결과, 기체가 클수록 하", "language": "ko"}, {"title": "한국기원, 해군 작전사령부 장병 대상 바둑교실", "url": "https://www.yna.co.kr/view/AKR20260904142100007", "source": "연합뉴스", "published": "2026-09-04T07:37:29+00:00", "summary": "(서울=연합뉴스) 천병혁 기자 = 한국기원이 충무공 이순신 장군의 후예들과 '수담'(手談)을 나눴다.", "language": "ko"}, {"title": "The inflation genie could be out of the bottle — and bond markets are sounding the alarm", "url": "https://www.cnbc.com/2026/09/04/global-bond-selloff-inflation-risk.html", "source": "CNBC", "published": "2026-09-04T07:05:29+00:00", "summary": "Global bond yields have surged as investors assess whether rising debt, tariffs, defense spending and energy shocks could keep inflation higher for longer.", "language": "en"}, {"title": "[쇼츠] 쾅! 강력한 폭발…우크라 해상드론 러 항구 습격", "url": "https://www.yna.co.kr/view/AKR20260904128400704", "source": "연합뉴스", "published": "2026-09-04T06:53:27+00:00", "summary": "(서울=연합뉴스) 우크라이나 해군이 해상드론으로 500km 넘게 떨어진 러시아 흑해 연안의 소치 항구에 있던 다목적 지원선을 공격했습니다.", "language": "ko"}, {"title": "국힘, 靑 호르무즈 파병 검토에 \"국방위 차원 현안질의 요구\"", "url": "https://www.newsis.com/view/NISX20260904_0003776879", "source": "뉴시스", "published": "2026-09-04T06:47:40+00:00", "summary": "[서울=뉴시스]우지은 전상우 기자 = 국민의힘은 4일 청와대가 중동 호르무즈 해협에 군 자산과 파병을 검토한다고 밝힌 것과 관련해 국회 국방위원회 차원에서 긴급 현안질의를 요구했다. 정점식 국민의힘 원내대표는 이날 오후 페이스북에 \"정부는 호르무즈 해협 파병 검토의 배경과 실익을 국회에 투명하게 설명할 것을 촉구한다\"며 이같이 적었다. 정 원내대표는 \"파병에는 국회의 동의가 필수적이다. 우리 군 장병을 해외에 보내는 것은 쉽게 결정할 사안이 아니며 신중한 검토가 필요하다\"며 \"정부는 야당을 상대로 간보기할 것이 아니라, 국회에 나와", "language": "ko"}, {"title": "[게시판] 은행연합회, 육군 5사단 장병들에 위문금", "url": "https://www.yna.co.kr/view/AKR20260904126300002", "source": "연합뉴스 경제", "published": "2026-09-04T06:43:05+00:00", "summary": "▲ 은행연합회는 4일 육군 제5보병사단을 찾아 위문금을 전달했다. 은행연합회는 1969년부터 5사단과 자매결연을 맺고 매년 위문금을 전달해왔다....", "language": "ko"}, {"title": "\"100만명 몰린다\"…행안장관, 서울세계불꽃축제 안전점검", "url": "https://www.newsis.com/view/NISX20260904_0003776086", "source": "뉴시스", "published": "2026-09-04T06:20:00+00:00", "summary": "[세종=뉴시스]성소의 기자 = 윤호중 행정안전부 장관이 4일 서울세계불꽃축제가 열리는 여의도 한강공원을 찾아 대규모 인파에 대비한 안전관리 상황을 점검했다. 올해 22회를 맞는 서울세계불꽃축제는 이날 전야제를 시작으로 5일 본행사까지 처음으로 이틀에 걸쳐 열린다. 불꽃쇼와 드론쇼, 시민참여 행사 등이 진행되며 매년 100만명 이상의 관람객이 찾는다. 윤 장관은 이날 서울시와 경찰, 소방, 서울교통공사, 주최 측인 한화 등 관계기관과 회의를 열고 축제장 상황관리와 인파관리, 교통대책, 화재예방 등 안전관리 대책을 점검했다. 이어 축제", "language": "ko"}, {"title": "김명식 진천군수, 신용한 지사에 '금곡 경제자유구역' 협력 요청", "url": "https://www.yna.co.kr/view/AKR20260904112300064", "source": "연합뉴스 경제", "published": "2026-09-04T06:02:33+00:00", "summary": "(진천=연합뉴스) 박재천 기자 = 김명식 진천군수는 4일 신용한 충북도지사를 예방해 초평면 금곡지구 경제자유구역 지정 추진을 충북도 핵심 전략사...", "language": "ko"}, {"title": "한화에어로, 크로아티아에 천무 수출 임박…6천800억원 규모", "url": "https://www.yna.co.kr/view/AKR20260904111400003", "source": "연합뉴스", "published": "2026-09-04T05:55:52+00:00", "summary": "(서울=연합뉴스) 홍규빈 기자 = 한화에어로스페이스가 크로아티아와 다연장로켓 '천무' 수출 계약을 눈앞에 둔 것으로 전해졌다.", "language": "ko"}, {"title": "정부, 호르무즈 파병 검토…이달 중 파병동의안 국회 제출 관측도(종합)", "url": "https://www.newsis.com/view/NISX20260904_0003776664", "source": "뉴시스", "published": "2026-09-04T05:16:14+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 정부가 호르무즈 해협에 P-8A 해상초계기, 군수지원함, 폭발물처리(EOD) 전력 등을 파견하는 방안을 검토 중인 것으로 알려졌다. 4일 복수의 군·정부 소식통에 따르면 정부는 호르무즈 해협에 병력과 군 자산을 투입하는 방안을 놓고 관계 부처들이 검토를 진행하고 있다. 파병 후보 전력으로 P-8 포세이돈과 해군 군수지원함, EOD 등 비전투 자산이 거론되고 있다고 한다. P-8A는 현존하는 최신예 해상초계기로 대잠수함전, 대수상함전, 해상정찰·탐색 등의 임무를 수행한다. 해상표적을 정밀타격할 수 있는", "language": "ko"}, {"title": "\"스페이스X 등 美기업 4곳, 파리 우주회의 불참\"…트럼프 탓?", "url": "https://www.newsis.com/view/NISX20260904_0003776533", "source": "뉴시스 경제", "published": "2026-09-04T04:26:23+00:00", "summary": "[서울=뉴시스]고재은 기자 = 스페이스X와 블루오리진 등 미국 우주기업 4곳이 오는 9일부터 프랑스 파리에서 열리는 우주 정상회의에 불참 의사를 전달했다고 3일(현지 시간) 폴리티코 유럽판이 보도했다. 한 프랑스 정부 관계자는 이날 \"스페이스X, 블루오리진, 스토크스페이스, 스타클라우드 등 미국 기업 4곳이 우주 정상회의에 불참한다고 당국에 통보했다\"고 말했다. 다른 미국 기업들은 예정대로 참석하는 것으로 알려졌다. 그는 \"언론에 보도된 미국 백악관의 보이콧 압박설과 연관성을 부인하기는 어렵다\"며 \"전략적 변화와 정치적 압력으로 일", "language": "ko"}, {"title": "與 당직 추가 인선…윤리감찰단 부단장 전홍규·청년미래연석회의장 백승아", "url": "https://www.newsis.com/view/NISX20260904_0003776418", "source": "뉴시스", "published": "2026-09-04T03:18:32+00:00", "summary": "[서울·홍성=뉴시스]정금민 신재현 권신혁 기자 = 더불어민주당이 4일 최고위원회의를 열어 당 대표 직속기구인 윤리감찰단 부단장에 전홍규 전 서울지방변호사회 사무부총장을 임명했다. 부단장은 김기표 윤리감찰단장의 추천으로 당 대표가 임명하며, 최고위원회의 협의를 거치도록 하고 있다 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
