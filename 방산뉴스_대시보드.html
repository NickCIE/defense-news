QUg3MEJuei04YkE1T3dYdHdUalhkVWlDdGxYQnBsUXFMdGdtbm5hb3JCekZn?oc=5", "source": "방산 뉴스", "published": "2026-11-19T12:20:50+00:00", "summary": "방위산업공제조합, 우주항공 이어 군수기업까지 지원 확대…공제사업 외연 넓힌다    이코노미트리뷴", "language": "ko"}, {"title": "이 대통령, 서울공항 도착…3박4일 순방 일정 종료", "url": "https://www.newsis.com/view/NISX20261119_0003875808", "source": "뉴시스", "published": "2026-11-19T11:40:42+00:00", "summary": "[서울=뉴시스]김지은 이인준 기자 = 이재명 대통령이 3박4일간의 아세안(ASEAN)·아시아태평양경제협력체(APEC) 정상회의 순방을 마치고 19일 귀국했다. 이 대통령이 탄 공군 1호기는 이날 오후 8시10분께 경기 성남 서울공항에 도착했다. 윤호중 행정안전부 장관, 임광현 대통령비서실장, 최인호 청와대 정무수석 등 참모들이 공항에 나와 이 대통령 내외와 수행원들을 맞았다. 이 대통령은 16~19일 이어진 중국·필리핀 순방에서 주요 다자외교 무대인 아시아태평양경제협력체(APEC)·동남아시아국가연합(ASEAN·아세안) 정상회의에 2", "language": "ko"}, {"title": "러시아 군용기, 이틀 만에 동해 KADIZ 재진입", "url": "https://www.newsis.com/view/NISX20261119_0003875845", "source": "뉴시스", "published": "2026-11-19T11:14:13+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 러시아 군용기 여러 대가 19일 동해 한국방공식별구역(KADIZ·카디즈)에 진입했다가 이탈했다.  합동참모본부(합참)에 따르면 이날 러시아 군용기 수대가 동해 인근 KADIZ에 진입해 우리 공군 전투기가 대응 출격했다. 합참은 \"영공 침범은 없었다\"며 \"우리 군은 러시아 군용기가 KADIZ에 진입하기 이전부터 탐지하였으며, 공군 전투기를 투입하여 우발상황에 대비한 전술 조치 등을 실시하였다\"고 밝혔다. 앞서 17일에도  러시아 군용기 수 대가 동해 카디즈에 진입해 우리 공군 전투기가 출격한 지 이틀", "language": "ko"}, {"title": "북미 깜짝회담 또 무산…'트럼프 北 핵보유국 인정' 우려 완화되나", "url": "https://www.newsis.com/view/NISX20261119_0003875340", "source": "뉴시스", "published": "2026-11-19T10:55:38+00:00", "summary": "[서울=뉴시스] 김승민 기자 = 도널드 트럼프 미국 대통령이 추진한 중국 선전 아시아태평양경제협력체(APEC) 정상회의 계기의 북미 정상회담이 사실상 무산됐다. 미중러 3자 정상회담이 끝난 19일 오후 7시20분 현재까지 김정은 북한 국무위원장이 중국으로 이동한 정황은 확인되지 않는다. 지난해 경주 APEC 계기의 깜짝 회동 제의 무산에 이은 2년 연속 실패로, 김 위원장이 요구해온 미국의 북한 핵보유국 지위 인정 문제가 현실화될 가능성이 다소 낮아졌다는 해석이 나온다. 다만 트럼프 대통령 개인 차원의 불확실성은 남아 있다. 트럼프", "language": "ko"}, {"title": "APEC final day in photos: Trump, Xi and Putin shake hands; Takaichi kept at a distance", "url": "https://www.cnbc.com/2026/11/19/trump-xi-putin-photos-us-china-russia-trilateral-.html", "source": "CNBC", "published": "2026-11-19T10:54:07+00:00", "summary": "Leaders gathe ary": "[서울=뉴시스] 유자비 기자 = 한국이 도입을 추진 중인 핵추진잠수함에 대한 국제원자력기구(IAEA) 사무총장 명의의 보고서가 18일 최초 공개됐다.  외교부에 따르면 IAEA는 지난 18일부터 20일까지 오스트리아 빈에서 열리는 11월 정기이사회 계기 한국의 핵잠 관련 사무총장 명의 보고서를 논의하고 이날 대외 공개했다.  IAEA는 핵잠 관련 협의를 진행 중인 호주 및 브라질에 대해 연례 보고서를 발간해오고 있다. 한국도 올해 핵추진잠수함 관련 안전조치 방안 등에 대한 IAEA와의 협의가 개시됨에 따라 사무총장 명의 최초 보고서", "language": "ko"}, {"title": "경찰, 김태성 신안군수 동생 체포…공무원 도피 도운 혐의", "url": "https://www.yna.co.kr/view/AKR20261119153500054", "source": "연합뉴스", "published": "2026-11-19T08:45:15+00:00", "summary": "(신안=연합뉴스) 정다움 기자 = 공직선거법 위반 혐의로 경찰의 추적을 받고 있는 전남광주 신안군청 소속 공무원의 도피를 도운 혐의로 김태성 신...", "language": "ko"}, {"title": "'161일 태평양 항해' 도산안창호함 승조원 10명 국방부 포상", "url": "https://www.newsis.com/view/NISX20261119_0003875465", "source": "뉴시스", "published": "2026-11-19T08:39:54+00:00", "summary": "[서울=뉴시스]임승규 기자 = 국내 기술로 독자 설계·건조한 3000t급 잠수함 도산안창호함을 타고 한국 잠수함 최초로 태평양을 횡단한 승조원들이 국방부 포상금을 받게 됐다. 국방부는 19일 서울 용산구 청사에서 '제2회 정기국방부특별성과포상금 시상식'을 개최하고 5건의 성과를 낸 정기포상 대상자 21명에게 포상금 총 7800만원을 수여했다고 밝혔다.  해군 잠수함사령부 도산안창호함장 이병일 대령 등 10명은 포상금 5000만원을 받았다. 이들은 한국 잠수함 최초로 태평양을 횡단하며 사고 없이 161일 동안 약 2만8000㎞를 단독", "language": "ko"}, {"title": "이 대통령, 미중러 회담 앞서 '한반도 평화공존' 외교…미중러 정상 만나 입장 개진[순방 결산]", "url": "https://www.newsis.com/view/NISX20261117_0003871513", "source": "뉴시스", "published": "2026-11-19T08:38:31+00:00", "summary": "[선전=뉴시스] 김지은 기자 = 이재명 대통령은 16~19일 이어진 중국·필리핀 순방에서 주요 다자외교 무대인 아시아태평양경제협력체(APEC)·동남아시아국가연합(ASEAN·아세안) 정상회의에 2년 연속 참석해 한반도 평화공존을 위한 외교전을 펼쳤다. 우리 정부의 한반도 평화공존 정책에 대한 지지를 재확인하며 남북 및 북·미 대화 재개를 위한 환경을 조성하는 데 공을 들였다. 특히 사상 첫 미·중·러 3자 정상회담을 앞두고 도널드 트럼프 미국 대통령과 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령을 모두 별도로 만나기도 했다.", "language": "ko"}, {"title": "구미에 K-방산 기술혁신 심장 들어섰다…260억 원 투입 첨단방위산업진흥센터 가동 - 더팩트", "url": "https://news.google.com/rss/articles/CBMiW0FVX3lxTE9URElKeVhBa2NvNU5qNlItbHFnc3pQU05EVV81bC0tTDk4MU83QkJmT3VTaDJvV1dCa1RSRGpzNzY4VEZtQmVDbjNUdTBpUGVSbFpUcFNRRjhGMXPSAVZBVV95cUxQaEx5S2hubFVFcUNHNWlWNDZxLWZpUGxpclFYVi1RZTBwbklVV1JTdVc5b1ZNTnpPWkxsSVBmZjgxSzJ1enhJWk5IeFdPdFRzSXZLX3AyZw?oc=5", " const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
