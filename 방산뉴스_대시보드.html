rvice members for war crimes.", "language": "en"}, {"title": "Why Britain needs a maritime-first defense strategy", "url": "https://breakingdefense.com/2026/11/why-britain-needs-a-maritime-first-defense-strategy/", "source": "Breaking Defense", "published": "2026-11-10T16:14:31+00:00", "summary": "As Germany and Poland build up their armies, Britain should look to its historic strengths at sea to secure its future role in European defense.", "language": "en"}, {"title": "Pentagon can’t track millions of F-35 spare parts, watchdog finds", "url": "https://www.defensenews.com/pentagon/2026/11/10/pentagon-cant-track-millions-of-f-35-spare-parts-watchdog-finds/", "source": "Defense News", "published": "2026-11-10T15:41:12+00:00", "summary": "The GAO reported that while the DoD's F-35 program \"is the costliest in its history,\" the department \"struggles to account\" for its parts.", "language": "en"}, {"title": "Hegseth denounces impeachment charges in rare press briefing", "url": "https://www.defenseone.com/threats/2026/11/hegseth-returns-pentagon-briefing-room-defend-himself-against-impeachment-charges/417148/", "source": "Defense One", "published": "2026-11-10T15:41:08+00:00", "summary": "The defense secretary called his potential removal an attack on his “success.”", "language": "en"}, {"title": "Report: Russian ships are pumping tanks, MRAPs and rocket launchers into Africa", "url": "https://www.defensenews.com/global/mideast-africa/2026/11/10/report-russian-ships-are-pumping-tanks-mraps-and-rocket-launchers-into-africa/", "source": "Defense News", "published": "2026-11-10T15:24:07+00:00", "summary": "Russian cargo ships have carried military equipment including tanks, armored vehicles and rocket launchers to African ports serving as gateways to Moscow’s forces on the continent, according to a new investigation.", "language": "en"}, {"title": "AI 황제마저 흔든 '미인계'…北 '씨받이 공작' 데자뷔", "url": "https://www.newsis.com/view/NISX20261110_0003862119", "source": "뉴시스", "published": "2026-11-10T15:00:00+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 세계 인공지능(AI) 반도체 시장을 호령하는 엔비디아의 젠슨 황 최고경영자(CEO)가 중국 국가안전부(MSS) 소속 스파이 의혹을 받는 여성 기업인 앨리스 황(중국명 황러)과의 부적절한 관계를 시인하면서 글로벌 정보전(情報戰)의 지형이 요동치고 있다.  냉전기 스파이 소설에나 등장할 법한 '허니트랩(Honey trap·미인계)'이 21세기 최첨단 반도체 패권 경쟁의 한복판에 재등장하자, 정보 당국 안팎에서는 북한이 수십 년간 정권 안보와 대남 공작의 핵심 지렛대로 악용해 온 악명 높은 미인계 수법이 ", "language": "ko"}, {"title": "A Pentagon impeachment showdown, plus defense funding in limbo", "url": "https://breakingdefense.com/2026/11/a-pentagon-impeachment-showdown-plus-defense-funding-in-limbo/", "source": "Breaking Defense", "published": "2026-11-10T14:22:50+00:00", "summary": "Hegseth could face a high-profile impeachment battle as Congress struggles to settle major defense spending decisions before the new year.", "language": "en"}, {"title": "Britain says its bases are safe after US refueling planes evacuated", "url": "https://www.defensenews.com/global/europe/2026/11/10/britain-says-its-bases-are-safe-after-us-refueling-planes-evacuated/", "source": "Defense News", "published": "2026-11-10T14:11:56+00:00", "summary": "Commercially available flight tracking data showed at least 10 Boeing KC-135R Stratotanker refueling planes left the Royal Air Force base in Mildenhall, eastern England, on Monday.", "language": "en"}, {"title": "The interoperability gap: Why joint operations still depend on disconnected communications systems", "url": "https://breakingdefense.com/2026/11/the-interoperability-gap-why-joint-operations-still-depend-on-disconnected-communications-systems/", "source": "Breaking Defense", "published": "2026-11-10T13:24:00+00:00", "summary": "[Sponsored] Seamless, secure communication across military, government and mission partners is essential to closing interoperability gaps, strengthening collaboration and ensuring critical information reaches the right people when it matters most.", "language": "en"}, {"title": "한-캐나다 외교장관 G7 계기 회담…방산·에너지 등 실질 협력 논의", "url": "https://www.newsis.com/view/NISX20261110_0003862894", "source": "뉴시스", "published": "2026-11-10T13:23:58+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 주요 7개국(G7) 외교장관회의 참석차 프랑스 파리를 방문 중인 조현 외교부 장관이 10일(현지시간) 아니타 아난드 캐나다 외교장관과 회담을 갖고 방산, 에너지 공급망 등에서 긴밀히 협력하기로 했다.  조 장관은 현지시간으로 이날 오전 아난드 캐나다 외교장관과 양자 회담을 갖고 에너지, 인공지능(AI), 국방·방산 등 분야에서의 실질 협력 확대 방안을 논의했다.   양 장관은 최근 국제정세가 다양하게 변화하고 있는 만큼 양국이 '포괄적 전략 동반자'로서 긴밀한 소통과 협력을 지속하기로 했다. 특히 캐", "language": "ko"}, {"title": "Hegseth vows to fight impeachment ‘spectacle’", "url": "https://breakingdefense.com/2026/11/hegseth-vows-to-fight-impeachment-spectacle/", "source": "Breaking Defense", "published": "2026-11-10T13:17:55+00:00", "summary": "“What one disgruntled and defeated congressman is attempting is not oversight, and it’s not accountability. It’s a political spectacle, a personal manifesto driven by ego and resentment,” Hegseth told reporters at the Pentagon this morning.", "language": "en"}, {"title": "제주 우주발사체 바지선 수중 작업하던 50대 다이버 숨져(종합2보)", "url": "https://www.newsis.com/view/NISX20261110_0003862881", "source": "뉴시스", "published": "2026-11-10T13:13:17+00:00", "summary": "[서울=뉴시스] 옥승욱 김수환 기자 = 제주 서귀포시 마라도 인근 우주발사체 바지선에서 수중 작업중이던 50대 다이버가 심정지 상태로 병원에 이송됐으나 끝내 숨졌다. 10일 제주소방안전본부와 서귀포해양경찰서에 따르면 이날 오후 4시32분께 마라도 서쪽 약 5㎞ 해상에서 다이버 A(50대)씨가 쓰러졌다는 신고가 접수됐다. 당시 A씨는 우주발사체 바지선 체인 인양을 위한 수중작업을 마친 뒤 선박으로 올라온 다음 심정지가 발생한 것으로 파악됐다. 동료들은 민간 레저기구를 이용해 심폐소생술(CPR)을 병행하며 강정항으로 이동했다. 소방당국", "language": "ko"}, {"title": "조현, G7 계기 파리서 美루비오 환담…정상 간 합의 사항 진전 협력키로", "url": "https://www.newsis.com/view/NISX20261110_0003862883", "source": "뉴시스", "published": "2026-11-10T13:05:19+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 주요 7개국(G7) 외교장관회의 참석차 프랑스 파리를 방문 중인 조현 외교부 장관이 10일(현지시간) 마코 루비오 미국 국무부 장관과 만나 환담했다. 미 중간선거에서 공화당이 참패한 후 한미 외교장관 간 첫 대면이었지만 양자 회담 대신 약식회동 형식이었다.  10일 외교부에 따르면 조 장관은 이날 G7 외교장관회의 2일차 회의 계기 루비오 국무장관과 별도 환담을 갖고 한미관계 전반을 비롯해 고위급 교류, 북한 문제 등에 대해 의견을 교환했다. 양 장관은 정상 간 합의 사항 진전을 포함해 한미 양국 관", "language": "ko"}, {"title": "'작전구역 확대' 청해부대 파견 동의안, 국회 제출…국회 심사 일부 진통에도 통과할 듯(종합)", "url": "https://www.newsis.com/view/NISX20261110_0003862861", "source": "뉴시스", "published": "2026-11-10T11:43:32+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 청해부대의 작전구역을 호르무즈 해협 인근까지 확대하는 파견연장 수정 동의안이 국회에 제출되면서 동의안 통과 여부에 관심이 쏠리고 있다. 더불어민주당이 정부 방침에 찬성하고 있지만 조국혁신당과 진보당 등 범여권 일부 정당들이 사실상 '우회 파병'이라며 반대하고 있어 국회 심사 과정에서 일부 진통이 예상된다. 다만 국회 의석 구도상 통과 될 가능성이 크다는 게 대체적인 시각이다. 국방부는 10일 오후 \"오늘 국무회의에서 의결된 '국군부대(청해부대) 소말리아 아덴만 해역 및 오만 남방 외해 파견 동의안'은", "language": "ko"}, {"title": "유가 하락세 지속…브렌트유 장중 배럴당 80달러대까지", "url": "https://www.newsis.com/view/NISX20261110_0003862847", "source": "뉴시스 경제", "published": "2026-11-10T11:16:43+00:00", "summary": "[서울=뉴시스] 김재영 기자 = 국제 유가가 이란 재공격에 대한 도널드 트럼프 미 대통령의 유보적 발언에 10일 하락세를 이어가고 있다. 이날 런던 오전 장에서 브렌트유 12월 인도분 선물가는 지난 8월 이래 처음으로 배럴당 80달러 대까지 떨어졌다. 오전 11시 현재 전날보다 2.0% 떨어진 90.72달러에 거래되고 있다. 미국의 서부텍사스유도 1.64% 떨어진 배럴당 85.43달러에 거래되었다. 트럼프 대통령은 전날 이란 전쟁이 \"군사적으로 끝난 셈\"이라고 말했다. \n◎공감언론 뉴시스 kjy@newsis.com", "language": "ko"}, {"title": "Gulf Arab states approve military command headquarters in Kuwait - Reuters", "url": "https://news.google.com/rss/articles/CBMitgFBVV95cUxOZXEtekhTZlZLaDZGSkNQNlV0bmVOeXRRYWhYeWd6d2ljaThPTWJuZzVqemNWc254cmxVLXpHSTVfTWJ4R1poaWd5Mk9rNlB1RHJjc2dRdkJHck9JSWlDN09nTmZUdTBiUE40SDZhcWRYS3JlNWx4cDF2YWJCU3pVQlVWdGh0ZmN6N1NVLVNtWjN5cmhzaHFvZVhlUi1HX0w4anVVakk2RXEyVGRyRXh3U0U3YjhWQQ?oc=5", "source": "Reuters", "published": "2026-11-10T10:31:20+00:00", "summary": "Gulf Arab states approve military command headquarters in Kuwait    Reuters", "language": "en"}, {"title": "국방부, 국군사관학교 민간자문위 출범…절반은 통합반대 인사", "url": "https://www.newsis.com/view/NISX20261110_0003862814", "source": "뉴시스", "published": "2026-11-10T10:12:45+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부가 국군사관학교 창설을 위한 민간 전문가들의 의견 수렴에 나섰다. 국방부는 강신철 국방부 장관이 10일 오후 서울 용산 국방컨벤션에서 국군사관학교 민간자문특별위원회 회의를 주관했다고 밝혔다. 이날 회의에는 강 장관을 비롯한 국방부 주요 직위자와 학계·연구기관 등 각계 전문가로 구성된 민간자문특별위원 15명이 참석했다.  자문위원 15명 가운데 6명은 육·해·공군 사관학교 출신으로 채워졌다. 이들은 정부가 추진하는 사관학교 통합안에 반대 의견을 개진한 인사들이다.  강 장관은 지난 9일 국방부 청", "language": "ko"}, {"t const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
