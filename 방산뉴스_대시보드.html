고 적절한 대응을 했다\"고 주장한 반면 국민의힘은 \"지뢰 몇발 제거했다고 북한이 행동을 바꿀 것 같느냐\"며 공세를 폈다. 민주당 소속 진성준 국방위원장은 이날 서울 용산구 국방부에서 열린 국방위 합동참모본부 국정감사 초반 \"북한의 지뢰 도발에 대응해서 지뢰지대를 제거하는 군사작전을 단행한 것은 매우 단호하고 적", "language": "ko"}, {"title": "Defense Business Brief: 1:1 with Gabe Camarillo; Tariff ripple effects?, and more", "url": "https://www.defenseone.com/business/2026/10/defense-business-brief-11-gabe-camarillo-tariff-ripple-effects-and-more/416490/", "source": "Defense One", "published": "2026-10-08T08:55:32+00:00", "summary": "", "language": "en"}, {"title": "강호필 前사령관 내란재판서 절차공방…\"공소기각\"vs\"과한 주장\"", "url": "https://www.yna.co.kr/view/AKR20261008183700004", "source": "연합뉴스", "published": "2026-10-08T08:43:11+00:00", "summary": "(서울=연합뉴스) 이영섭 기자 = 12·3 비상계엄 관련 내란 혐의로 기소된 강호필 전 육군 지상작전사령관 측이 첫 재판에서 권창영 2차 종합특...", "language": "ko"}, {"title": "[영상] 美 차세대 기갑전력 포착…M1E3 전차·XM30 보병전투차 실사격", "url": "https://www.yna.co.kr/view/AKR20261008181800704", "source": "연합뉴스", "published": "2026-10-08T08:39:53+00:00", "summary": "(서울=연합뉴스) 미 육군의 차세대 기갑전력 핵심인 M1E3 에이브럼스 전차와 XM30 보병전투차 시제 차량들이 한자리에서 실사격 시험을 진행하...", "language": "ko"}, {"title": "주진우 \"북한 감싸며 암살자(들) 관련 거짓말…박지원·서영교 고발\"", "url": "https://www.newsis.com/view/NISX20261008_0003819491", "source": "뉴시스", "published": "2026-10-08T08:30:00+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 주진우 국민의힘 의원이 더불어민주당 박지원, 서영교 의원을 겨냥해 북한 김정일 국방위원장의 육영수 여사 암살 사과 여부와 관련한 거짓말을 하고 있다며 법적 대응을 예고했다. 주 의원은 8일 사회관계망서비스(SNS)를 통해 \"민주당 박지원, 서영교 의원의 북한 김정일 감싸기가 애처롭다. 거짓말까지 동원해 북한에 충성 맹세하나?\"라고 밝혔다. 이어 주 의원은 \"박지원, 서영교 의원은 김정일이 '김신조 사건'만 사과했지, '육영수 여사 암살'은 사과한 적 없다며 나를 명예훼손으로 걸겠다고 했다\"며 \"박지원", "language": "ko"}, {"title": "After B-1’s leave England, analysts point to limited options, importance of base defense", "url": "https://breakingdefense.com/2026/10/after-b-1s-leave-england-analysts-point-to-limited-options-importance-of-base-defense/", "source": "Breaking Defense", "published": "2026-10-08T08:29:00+00:00", "summary": "“Withdrawing these bombers to [the US] will provide an oppor  만나 동맹...", "language": "ko"}, {"title": "홍준표 \"철부지 선수 한마디에 병역특례 폐지?…정치권 참 한심\"", "url": "https://www.newsis.com/view/NISX20261008_0003819467", "source": "뉴시스", "published": "2026-10-08T07:12:15+00:00", "summary": "[서울=뉴시스]정지연 인턴 기자 = 2026 아이치·나고야 아시안게임에서 남자축구 대표팀 선수들의 병역특례 관련 발언이 논란이 된 가운데 정치권에서 제도 폐지 목소리가 나오자 홍준표 전 대구시장이 이를 강하게 비판했다. 홍 전 시장은 8일 페이스북에 \"철부지 같은 어린 선수의 한마디에 흥분하는 정치권을 보면 한국 정치의 수준을 엿볼 수가 있다\"며 \"아시아 경기대회 금메달 포상에 군면제가 포함된 지가 언제인데 이제 와서 난리들인지\"라고 직격했다. 이어 \"아마추어 스포츠에 동기부여를 위해 마련된 제도를 철부지 같은 어린 선수의 한마디에", "language": "ko"}, {"title": "합참 \"北 국경선 요새화, 2028년 후반기 완료 예상…감시장비 보강\"(종합)", "url": "https://www.newsis.com/view/NISX20261008_0003819520", "source": "뉴시스", "published": "2026-10-08T07:09:15+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 우리 군은 군사분계선(MDL) 일대에서 진행 중인 북한의 '국경선 요새화' 작업이 오는 2028년 후반기께 완료될 것으로 전망했다. 군은 북한의 MDL 근접활동에 대응해 전방 경계부대 감시장비를 보강하고 감시·정찰 능력을 강화할 계획이다. 합동참모본부는 8일 국회 국방위원회 국정감사 업무보고에서 북한의 MDL 근접활동과 관련해 \"우리 군은 북 MDL 근접활동에 대한 감시 및 대응태세를 유지하고 있다\"고 밝혔다. 북한은 2023년 12월 적대적 두 국가 관계를 선언한 이후 MDL 인근에서 국경선 요새화", "language": "ko"}, {"title": "향군, 北 DMZ 지뢰도발 규탄대회…\"책임자 처벌·즉각 사과하라\"", "url": "https://www.newsis.com/view/NISX20261008_0003819471", "source": "뉴시스", "published": "2026-10-08T06:54:01+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 대한민국재향군인회(향군)가 8일 북한의 서부전선 비무장지대(DMZ) 지뢰도발을 규탄하고 책임자 처벌과 즉각적인 사과를 촉구했다. 향군은 이날 서울 코엑스 마곡 컨벤션센터에서 제74주년 재향군인의 날 기념식을 개최한 데 이어 ‘북한 DMZ 지뢰도발 규탄 결의대회’를 열었다. 향군은 결의대회에서 지난달 21일 서부전선 DMZ에서 발생한 지뢰 폭발 사고와 관련해 \"북한이 대한민국 영토를 침범해 매설한 지뢰에 의한 것\"이라며 \"한반도 평화를 해치는 결코 용납할 수 없는 중대한 무력도발\"이라고 규정했다. 이어", "language": "ko"}, {"title": "김여정, 韓 대북의료지원 구상에 \"정치적 도발…관계 되돌리려면 존중·배려 보여야\"(종합)", "url": "https://www.newsis.com/view/NISX20261008_0003819417", "source": "뉴시스", "published": "2026-10-08T06:35:59+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 김여정 북한 노동당 총무부장은 8일 한국 정부의 대북 의료장비 지원 구상을 \"정치적 도발\"로 규정했다. 또 남북 관계를 복원하려면 \"최대한의 존중\"을 보이라고 밝혔다.  김 부장은 이날 대외매체 조선중앙통신을 통해 공개한 담화에서 통일부가 북한 평양 강동군병원에 약 93억원 상당의 의료장비를 발송하는 계획과 관련해 유엔 안전보장이사회 대북제재위원회로부터 제재 면제를 승인 받은 사실을 언급했다. 김 부장은 \"조선반도 정세를 중태에 빠뜨리는 자작 광대극으로 세상을 소란케 한 불량배들이 이번에는 갑자기 ", "language": "ko"}, {"title": "이 대통령 \"한-이집트, CEPA 협상 개시\"…전략적 동반자 관계 격상 [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20261008_0003819376", "source": "뉴시스", "published": "2026-10-08T06:25:12+00:00", "summary": "[서울=뉴시스]김진아 김지은 기자 = 이재명 대통령은 8일 국빈 방한한 압델 파타 알시시 이집트 대통령과 정상회담을 하고 양국 관계를 전략적 동반자 관계로 격상하는 한편 포괄적 경제동반자협정(CEPA) 협상을 개시하기로 합의했다. 이 대통령은 이날 청와대에서 열린 '한-이집트 정상회담' 직후 공동 언론 발표를 통해 \"그간의 합의를 양국 국민이 체감할 수 있는 실질적인 성과로 구체화해 나가기로 했다\"며 이같이 말했다. 이어 \"이번 회담을 계기로 양국은 크게 다섯 가지 분야에서 의미 있는 성과를 거두었으며, 총 12건의 협력 문건을 체", "language": "ko"}, {"title": "강신철, 맥코믹 美 상원의원 접견…조선 협력 확대 논의", "url": "https://www.newsis.com/view/NISX20261008_0003819384", "source": "뉴시스", "published": "2026-10-08T06:21:26+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철 국방부 장관은 8일 오전 데이브 맥코믹 미국 연방 상원의원을 접견하고, 한미동맹과 역내 안보정세 및 주요 동맹현안에 대해 논의했다.  강 장관은 우선 한미동맹이 역내 평화와 안정을 지켜온 핵심축이라는 점을 강조했다. 또한 우리 군이 국방역량 지속 강화를 통해 보다 많은 책임과 역할을 해 나갈 것이라며 앞으로도 미 의회가 한미동맹의 굳건한 지지자의 역할을 해주기를 당부했다.  강 장관은 한화 필리조선소가 맥코믹 의원의 지역구인 펜실베이니아에 위치한 것을 언급하며 한미 조선 협력에 지속적인 관심과", "language": "ko"}, {"title": "노종면 '부평 캠프마켓 日군용동굴' 공개…\"유산가치 평가해야\"", "url": "https://www.yna.co.kr/view/AKR20261008134300001", "source": "연합뉴스", "published": "2026-10-08T06:13:48+00:00", "summary": "(서울=연합뉴스) 박경준 기자 = 일제 강점기 당시 일본군의 무기공장으로 쓰였던 인천 부평미군기지(캠프마켓)와 그 일대에 일제가 만든 지하시설 ...", "language": "ko"}, {"title": "인천공항공사, '장애인 자립 지원' 굿윌스토어 5호점 개소", "url": "https://www.newsis.com/view/NISX20261008_0003819205", "source": "뉴시스 경제", "published": "2026-10-08T05:49:24+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 인천국제공항공사는 발달장애인의 일자리 창출과 자립을 지원하기 위해 굿윌스토어 밀알인천검단점을 개소했다고 8일 밝혔다. 이 곳은 공사의 후원으로 건립된 5호 매장이다. 발달장애인 직원 4명을 포함해 총 8명이 채용됐다. 이로써 1~4호점을 합쳐 고용된 인원은 발달장애인 29명 등 총 57명이다. 공사는 임직원들이 자발적으로 모은 물품도 전달해 나눔의 의미를 더했다. 기부 물품 판매 금액은 발달장애인 직원의 자립 지원금으로 쓰인다. 신가균 공사 경영본부장은 \"공사의 지속적인 후원을 통해 인천 지역의 다섯", "language": "ko"}, {"title": "전북도, 제2기 방위산업발전협의회 출범…동부권 방산 국가사업 발굴 본격화 - 뉴스홈(newshome)", "url": "https://news.goog function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
