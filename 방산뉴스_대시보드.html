제부 장관, 김윤덕 국토교통부 장관, 안규백 국방부 장관, 정성호 전 법무부 장관과 비공개 오찬을 가졌다. 정성호 전 장관은 지난달 24일 퇴임했으며, 구윤철 부총리와 김윤덕·안규백 장관은 후임 장관 후보자 지명에 따라 퇴임을 앞두고 있다. 이 자리에서 이 대통령은 이재명 정부의 첫 1년을 함께한 1기 내각 장관들의 임무 수행", "language": "ko"}, {"title": "한미동맹재단·주한미군전우회, 스틸 美대사 예방…\"굳건한 동맹 토대 협력 중요\"", "url": "https://www.newsis.com/view/NISX20260917_0003794631", "source": "뉴시스", "published": "2026-09-17T10:49:58+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 한미동맹재단(KUSAF)과 주한미군전우회(KDVA)는 17일 미셸 스틸 주한미국대사를 예방하고 한미동맹 발전과 양국 간 주요 현안을 논의했다고 밝혔다. 한미동맹재단과 주한미군전우회는 임호영 전 연합사부사령관과 로버트 에이브럼스 전 연합사령관이 각각 회장을 맡고 있으며, 이날 예방에는 폴 라카메라·버웰 벨 전 한미연합군사령관을 비롯해 주요 인사들이 참석했다. 이날 참석자들은 한반도 및 역내 안보 상황, 한미 안보협력, 통상, 경제안보 등 양국 간 주요 현안에 대해 폭넓게 의견을 교환했다.     한미동", "language": "ko"}, {"title": "한 총리 \"韓, 어느 나라보다 美에 많이 투자…가장 신뢰하는 동맹 될 것\"", "url": "https://www.newsis.com/view/NISX20260917_0003794613", "source": "뉴시스", "published": "2026-09-17T10:32:45+00:00", "summary": "[서울=뉴시스]김경록 기자 = 한성숙 국무총리는 17일 \"미국은 한국에 가장 많이 투자하는 나라이고, 한국도 전 세계 어느 나라보다 미국에 많이 투자하고 있는 상황으로 발전했다\"며 \"미국이 가장 신뢰하는 동맹이자 미래를 만들어가는 든든한 파트너가 되겠다\"고 말했다. 한 총리는 이날 오후 서울 영등포구 FKI 컨퍼런스센터에서 열린 미국 건국 250주년 기념행사에서 미셸 스틸 주한미국대사, 제이비어 브런슨 주한미군사령관 등이 참석한 가운데 특별연설을 통해 이같이 말했다. 한 총리는 \"대한민국은 한미동맹의 튼튼한 토대 위에서 성장과 번영", "language": "ko"}, {"title": "Is NATO ready to fight? The Ukraine war is raising doubts among military analysts - Reuters", "url": "https://news.google.com/rss/articles/CBMi0gFBVV95cUxNQTJ5OFk4WGtia1NNbkZCUV9MVklIOVNfUF9QcVpfTV9QS3VacG1GbHQ5QnlLbkhfbi0zNjZPZFhnVjF0Ry1UaWtTbC1ETmdyT29WeUY3R01HODhPQTFVNHhHN3REZS1aMVZpX2xhUXJUT2FGZ2VVMzMwWnFBRHY4UU0yQzdzRHdsbXZITXRydTQ4TmxDLUZRY3UzX0xiT3lCdTB0NEhSaUN0NFkwUmEwOGVoTjJHc0ZkQWt3dVY0ay15YWhreTJtcGhjVkdwZGZDUkE?oc=5", "source": "Reuters", "published": "2026-09-17T10:12:34+00:00", "summary": "Is NATO ready to fight? The Ukraine war is raising doubts among military analysts    Reuters", "language": "en"}, {"title": "US admission of orbital weapons seen as landmark moment in race with China, Russia - Reuters", "url": "https://news.google.com/rss/articles/CBMi2gFBVV95cUxNMExKc2lMT2dKSTQtc04tcGJoQ2FCa2dTelRkelJzaHRJdG1yQ1Z5ZFhjb2hLZ2VSQ2pBSVdodDZvemtvUDV0d2NZY2NURW1kanJpWHhERWl6eTF0QWhxZ0F5MFZpOTlnUG80SENfQUN4YXlURmgwZzRjamR5VzdtMXdCZEJXMEVfLXRTdXVwODd0b21rNUNqYjhreFQtbGtjX3laOG1CYjEyaFhCZmdCT0ZLZERHbTctdkpUUFBWS3pKS0NNclM4MTlfYjVTeTNwWEFPYk1Rdl9IZw?oc=5", "source": "Reuters", "published": "2026-09-17T09:52:13+00:00", "summary": "US admission of orbital weapons seen as landmark moment in race with China, Russia    Reuters", "language": "en"}, {"title": "북한 선수단 대표 김일국 체육상, 중국 거쳐 일본 입국[나고야AG]", "url": "https://www.newsis.com/view/NISX20260917_0003794568", "source": "뉴시스", "published": "2026-09-17T09:30:46+00:00", "summary": "[나고야(일본)=뉴시스]안경남 기자 = 2026 아이치·나고야 아시안게임에서 북한 선수단을 대표하는 김일국 체육상이 개최지 일본에 입국했다. 김 체육상은 15일 평양에서 출발해 경유지인 중국을 거쳐 이날 오후 아이치현 나고야 주부국제공항에 도착했다. 북한올림픽위원회 위원장인 김 체육상은 이날 고철호 북한올림픽위원회 서기장 등 일부 수행원만 대동했다. 공항에선 재일본조선인총연합회(조선총련) 관계자 등이 김 체육상에게 꽃다발을 건넸다. 김 체육상은 이후 준비된 차량으로 이동했다. 북한의 장관급 당국자가 일본을 방문한 건 8년 만이다. ", "language": "ko"}, {"title": "개혁신당, 천하람·이주영에 \"경기 남부 출마해달라\"…천하람 반발(종합)", "url": "https://www.newsis.com/view/NISX20260917_0003794543", "source": "뉴시스", "published": "2026-09-17T09:06:05+00:00", "summary": "[서울=뉴시스]우지은 하지현 기자 = 개혁신당이 오는 2028년 총선을 앞두고 당 지도부 인사들의 비례대표 출마를 금지하고 경기 남부를 전략 거점으로 삼기로 했다. 이준석 전 대표의 지역구인 동탄을 중심으로 경기 남부에 당력을 집중하는 한편, 성과가 없는 당직자와 조직을 정비하는 인적 쇄신에도 나선다는 방침이다. 천하람 원내대표는 반발하며 순천 갑 조직위원장 신청 반려 재검토를 촉구했다. 이기인 개혁신당 비상대책위원장은 17일 오전 국회에서 기자회견을 열고 ▲지도부 인사 비례대표 출마 금지 ▲경기 남부 전략 거점 확정 ▲일하지 않는", "language": "ko"}, {"title": "'공직자윤리법' 등 군민에게 고발당한 최영일 순창군수 불송치", "url": "https://www.yna.co.kr/view/AKR20260917184300055", "source": "연합뉴스", "published": "2026-09-17T09:03:05+00:00", "summary": "(순창=연합뉴스) 나보배 기자 = 6·3 전국동시지방선거를 앞두고 공직자윤리법 위반 등 혐의로 고발당했던 최영일 전북 순창군수가 불송치됐다.", "language": "ko"}, {"title": "Trump gains a tariff weapon against China and India. Will he use it?", "url": "https://www.cnbc.com/2026/09/17/trump-russia-sanctions-india-china-oil-tariffs.html", "source": "CNB  "ko"}, {"title": "與 더좋은미래 \"형식 막론하고 美 호르무즈 해협 파병 요구 강력 반대\"", "url": "https://www.newsis.com/view/NISX20260917_0003794019", "source": "뉴시스", "published": "2026-09-17T05:53:33+00:00", "summary": "[서울=뉴시스]신재현 기자 = 더불어민주당 의원 모임인 '더 좋은 미래(더미래)'가 17일 호르무즈 해협 파병을 두고 \"국민과 국군의 생명 보다 앞서는 외교적 실익은 없다\"고 반대 의사를 표했다.  더미래는 이날 입장문을 통해 \"회원 일동은 어떠한 형식을 막론하고 미국의 호르무즈 해협 파병 요구를 강력히 반대한다\"고 밝혔다.  더미래는 \"유엔 안전보장이사회 결의 없이 진행된 미국·이스라엘의 이란 공격은 국제법적 정당성을 확보하지 못했다\"며 \"정당성이 확보되지 않은 무력행동에 대한민국 군대와 군사자산을 투입하는 것은 국제법 위반에 동", "language": "ko"}, {"title": "[게시판] 소비자원, 해군교육사령부와 '소비자권익증진 행사'", "url": "https://www.yna.co.kr/view/AKR20260917128500030", "source": "연합뉴스 경제", "published": "2026-09-17T05:49:44+00:00", "summary": "▲ 한국소비자원은 17일 경상남도 창원시에서 한국소비자중심기업협회, 해군교육사령부와 함께 '찾아가는 소비자권익증진 행사'를 열었다. 소비자 교육...", "language": "ko"}, {"title": "증평 출신 호국영웅 연제근 상사 76주기 추모식", "url": "https://www.yna.co.kr/view/AKR20260917130200064", "source": "연합뉴스", "published": "2026-09-17T05:34:27+00:00", "summary": "(증평=연합뉴스) 박재천 기자 = 충북 증평 출신 호국영웅 연제근 육군 상사의 76주기 추모식이 17일 국립서울현충원에서 열렸다.", "language": "ko"}, {"title": "한미, 연합·합동 폭발물처리 세미나·훈련 16~17일 실시", "url": "https://www.newsis.com/view/NISX20260917_0003793937", "source": "뉴시스", "published": "2026-09-17T05:30:43+00:00", "summary": "[서울=뉴시스]옥승욱 기자 = 합동참모본부는 지난 16일부터 이틀간 육군 1군단과 9사단 일대에서 '2026년 연합·합동 폭발물처리(EOD) 세미나 및 훈련'을 실시했다고 17일 밝혔다. 이번 훈련은 폭발물처리 능력에 대한 상호 기술교류와 연합·합동 작전수행능력을 강화하고, 유관기관 간 협력체계를 다지기 위해 마련됐다. 합참과 육·해·공군, 주한미군 미2사단, 한국공항공사 등 폭발물처리 관계관 200여명이 참가했다. 첫날 진행된 실기동 훈련에서는 도시지역에서 폭발물이 발생한 상황을 가정해 육·해·공군·해병대 폭발물처리반이 건물 내 ", "language": "ko"}, {"title": "네팔 韓구호대 2진 오늘 복귀…정부합동대응팀은 잔류", "url": "https://www.newsis.com/view/NISX20260917_0003793881", "source": "뉴시스", "published": "2026-09-17T05:28:50+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 네팔 대홍수로 연락이 두절된 우리 국민에 대한 수색구조 등을 지원하기 위해 파견된 대한민국 해외긴급구호대(KDRT) 2진이 17일 복귀한다. 외교부는 이날 \"KDRT 2진은 지난 10일 민관합동 긴급구호협의회 의결에 따라 계획대로 17일 활동을 종료하고 국내 복귀 예정\"이라고 밝혔다. 외교부, 소방대원, 코이카, 의료진 등 총 8명으로 구성된 2진은 지난 11일 네팔 파견 후로 두산에너빌리티 소속 6명, 한국 793854", "source": "뉴시스", "published": "2026-09-17T05:02:33+00:00", "summary": "[서울=뉴시스] 이승재 기자 = 국회 국방위원회는 18일 강신철 국방부 장관 후보자에 대한 인사청문경과보고서를 여당 주도로 채택했다. 국방위는 이날 전체회의를 열고 강 후보자의 인사청문경과보고서 채택 안건을 의결했다.  야당 소속 국방위원들은 회의에 참석하지 않았고, 야당 간사인 임종득 국민의힘 의원과 천하람 개혁신당 의원은 개회 직후 의사진행발언을 마친 뒤 회의장을 나갔다. 임 의원은 \"(전날 오후) 11시가 넘어서 인사청문회가 끝난 다음에 국민의힘 의원들이 한 자리에 모여서 논의했다\"며 \"전원이 강 후보자가 국방장관 후보자로서 ", "language": "ko"}, {"title": "외교1차관 \"호르무즈 파병 아닌 '기여'…국익 기반해 결정\"", "url": "https://www.newsis.com/view/NISX20260917_0003793847", "source": "뉴시스", "published": "2026-09-17T05:01:46+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 박윤주 외교부 1차관은 17일 호르무즈 해협 파병 문제와 관련, \"기본적으로 한미동맹 측면보다는 항행의 자유, 국민의 안전 등 차원에서 중점을 두고 바라보고 있다\"라고 말했다.    박 차관은 이날 국회 외교통일위원회에 출석해 이같이 밝히며 \"파병 문제에 있어 아직 구체적 사안이 결정돼 있지 않다\"라고 말했다.  박 차관은 이어 \"호르무즈 해협 안전 문제나 공급망과 연결된 부분이 많기 때문에 국익 관점에서 기여 방안을 살펴봐야 하는 상황\"이라고 설명했다.  박성준 더불어민주당 의원이 '도널드 트럼프 ", "language": "ko"}, {"title": "국방위, 강신철 장관 후보자 청문보고서 與주도 채택…국힘 불참", "url": "https://www.yna.co.kr/view/AKR20260917114951001", "source": "연합뉴스", "published": "2026-09-17T05:00:01+00:00", "summary": "(서울=연합뉴스) 안정훈 이율립 기자 = 국회 국방위원회는 18일 강신철 국방부 장관 후보자에 대한 인사청문경과보고서를 여당 주도로 채택했다.", "language": "ko"}, {"title": "靑, NSC 상임위원회 순연…파병 논의 속도 조절", "url": "https://www.newsis.com/view/NISX20260917_0003793757", "source": "뉴시스", "published": "2026-09-17T04:15:04+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 17일 열릴 예정이던 국가안전보장회의(NSC) 상임위원회가 순연된 것으로 확인됐다. 청와대는 애초 이날 위성락 국가안보실장 주재로 NSC를 개최할 예정이었지만 호르무즈 해협 파병 논의에 대한 속도 조절 기류 속에 회의를 연기한 것으로 파악됐다. 정부 안팎에선 이르면 이날 호르무즈 해협 파병 문제와 국회 파병 동의안 제출 문제 등이 회의 안건에 오르는 방안이 거론됐지만 최근 신중론에 무게가 실리며 회의가 연기된 것으로 보인다. 한미 외교장관 회담 등의 일정도 고려됐다. 조현 외교부 장관은 18일(현지시", "language": "ko"}, {"title": "추석 앞두고 환경오염물질 배출 사업장 3400곳 집중 단속", "url": "https://www.newsis.com/view/NISX20260917_0003793213", "source": "뉴시스 경제", "published": "2026-09-17T03:00:00+00:00", "summary": "[세종=뉴시스]이수정 기자 = 정부가 추석 연휴를 앞두고 환경오염 우려가 큰 사업장 3400여곳을 집중 단속한다.  기후에너지환경부는 오는 18일부터 10월8일까지 추석 연휴 환경오염 예방을 위한 특별 감시·단속과 홍보·계도 활동 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
