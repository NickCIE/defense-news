o"}, {"title": "테슬라·스페이스X, 합병 협상 본격화…'이사 5인' 특위 구성", "url": "https://www.newsis.com/view/NISX20261125_0003882402", "source": "뉴시스 경제", "published": "2026-11-25T03:34:36+00:00", "summary": "[서울=뉴시스]신정원 기자 = 일론 머스크 최고경영자(CEO)가 이끄는 전기차 업체 테슬라와 우주기업 스페이스X가 이사 5명으로 구성된 특별위원회(특위)를 구성하고 양사 합병을 본격적으로 추진하고 있다. 합병이 성사되면 기업가치가 최대 3조5000억 달러에 이르는 초거대 기업이 탄생할 수 있지만, 주주 승인과 각국 규제당국의 심사 등 넘어야 할 산도 적지 않다. 24일(현지 시간) 파이낸셜타임스(FT)에 따르면 양사는 특위를 구성해 합병 협상을 진행 중이다. 양측은 주식 교환 방식의 합병을 전제로 재무 모델을 조정하고 있으며, 이를", "language": "ko"}, {"title": "대전, 방산 소부장 특화단지·드론 클러스터 성과 공유…국방산업 생태계 확장 - 드론매거진 뉴스", "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE83bVQzUHJoakM2bk5mS1BiNkVNRVpaSjhHcXlENGlfRE9SQjZvZTduWVhRQ3hKZk1BdkY5TmVxTmU5bTZpbTB3Nlh2WTNXSTFpMXpmLUxXekNBR3hLSUVXR2w1Y0w?oc=5", "source": "방산 뉴스", "published": "2026-11-25T03:30:54+00:00", "summary": "대전, 방산 소부장 특화단지·드론 클러스터 성과 공유…국방산업 생태계 확장    드론매거진 뉴스", "language": "ko"}, {"title": "트럼프 \"당장이라도 김정은과 '러브레터' 가능…주제는 핵문제\"", "url": "https://www.newsis.com/view/NISX20261125_0003882448", "source": "뉴시스", "published": "2026-11-25T03:06:13+00:00", "summary": "[서울=뉴시스]고재은 기자 = 도널드 트럼프 미국 대통령이 첫 번째 임기 동안 김정은 북한 국무위원장과 주고 받던 친서가 당장이라도 재개될 수 있다고 밝혔다. 트럼프 대통령은 24일(현지 시간) 공개된 뉴욕포스트 인터뷰에서 \"러브레터(love letters) 교환이 당장이라도 재개될 수 있다\"며 \"단지 지금 당장 이뤄지고 있지 않을 뿐\"이라고 말했다. 그는 \"재개될 수 있고, (주제는) 핵무기(nuclearization) 같은 문제가 될 것\"이라며 \"하지만 그는 이미 무기를 가지고 있다. 왜냐하면 빌 클린턴 전 대통령이 그를 막지 ", "language": "ko"}, {"title": "국제유가, 호르무즈 선박 공격에도 하락…공급 과잉 우려 부각", "url": "https://www.newsis.com/view/NISX20261125_0003882553", "source": "뉴시스 경제", "published": "2026-11-25T02:54:22+00:00", "summary": "[서울=뉴시스]박미선 기자 = 호르무즈 해협 일대에서 선박을 겨냥한 공격이 잇따르고 있음에도 원유 공급 과잉 전망에 국제유가가 하락했다. 24일(현지 시간) 야후파이낸스에 따르면 런던 ICE선물거래소에서 내년 1월 인도분 브렌트유 선물은 전 거래일보다 2.27% 오른 배럴당 91.40달러에 거래를 마쳤다. 뉴욕상업거래소에서 내년 1월 인도분 서부텍사스산원유(WTI) 선물은 2.35% 상승한 배럴당 82.05달러에 마감했다. 중동 지역의 지정학적 긴장은 여전하다. 이란 파르스통신에 따르면 이란은 전날 네 번째 유조선이 기뢰에 피격됐다", "language": "ko"}, {"title": "[쇼츠] \"우리가 세계 최초\"…튀르키예 무인전투기 전력화", "url": "https://www.yna.co.kr/view/AKR20261125092300704", "source": "연합뉴스", "published": "2026-11-25T02:49:25+00:00", "summary": "(서울=연합뉴스) 튀르키예가 자국산 제트 무인전투기 '바이락타르 키질렐마'를 전력화했습니다.", "language": "ko"}, {"title": "외교부 \"동명부대 철수 이후에도 PKO 지속 기여할 것\"", "url": "https://www.newsis.com/view/NISX20261125_0003882599", "source": "뉴시스", "published": "2026-11-25T02:48:00+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 외교부는 지난 23일(현지시간) 미국 뉴욕에서 장욱진 글로벌다자외교조정관이 유엔 사무국 인사들을 만나 내년 예정된 동명부대 철수 이후에도 평화유지활동(PKO)에 지속 기여하겠다는 의지를 밝혔다고 25일 밝혔다.  장 조정관은 뉴욕에서 모하메드 칼레드 키아리 유엔 평화활동국(DPO) 사무차장보와 아툴 카레 운영지원국(DOS) 사무차장을 각각 면담했다.  PKO는 주로 분쟁이 멈췄거나 평화가 취약한 지역에 유엔 안보리 결의에 따라 유엔이 군, 경찰 등을 파견하는 활동이다. 유엔 사무국 내에서 평화활동국과", "language": "ko"}, {"title": "與 \"27일 이용철 법무장관 청문보고서 채택…30일 예산안 예결위 의결 목표\"", "url": "https://www.newsis.com/view/NISX20261125_0003882589", "source": "뉴시스", "published": "2026-11-25T02:41:24+00:00", "summary": "[서울=뉴시스] 이창환 권신혁 기자 = 더불어민주당은 25일 \"(오는) 27일쯤 이용철 법무부 장관 후보자 인사청문 경과보고서를 채택할 예정\"이라고 했다.  박성준 민주당 수석대변인은 이날 오전 국회에서 최고위원회의를 마친 뒤 기자들과 만나 이같이 말했다. 이용철 법무부 장관 후보자에 대한 인사청문회는 전날 진행됐다.  또 \"이태현 KBS(한국방송공사) 사장 후보자 인사청문 경과보고서 채택이 무산됐다\"며 \"오늘까지가 (보고서 송부) 시한이라고 한다. 다시 대통령께서 재송부 요청을 할 예정\"이라고 말했다. 강금실 국가정보원장, 임웅순", "language": "ko"}, {"title": "[게시판] 신용회복위원회, 육군 수도군단 찾아 금융교육", "url": "https://www.yna.co.kr/view/AKR20261125084800002", "source": "연합뉴스", "published": "2026-11-25T02:22:59+00:00", "summary": "▲ 신용회복위원회는 지난 24일 육군수도군단을 찾아 장병 약 400명을 대상으로 군 장병의 금융역량 강화를 위한 '생생경제 금융교육'을 했다고 ...", "language": "ko"}, {"title": "[영상] 튀르키예 무인전투기 '키질렐마' 전력화…제조사 \"세계 최초\"", "url": "https://www.yna.co.kr/view/AKR20261125078400704", "source": "연합뉴스", "published": "2026-11-25T02:16:02+00:00", "summary": "(서울=연합뉴스) 튀르키예가 자국산 제트 무인전투기 '바이락타르 키질렐마'를 전력화했습니다.", "language": "ko"}, {"title": "월남전 전사자 故안규태 병장, 59년 만에 고국으로…국방장관, 유해봉환식 주관", "url": "https://www.newsis.com/view/NISX20261125_0003882379", "source": "뉴시스", "published": "2026-11-25T01:50:15+00:00", "summary": "[서울=뉴시스]임승규 기자 = 국방부는 25일 서울공항에서 베트남전쟁에서 전사한 고(故) 안규태 병장의 유해봉환식을 강신철 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
