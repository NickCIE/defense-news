//www.newsis.com/view/NISX20260706_0003697924", "source": "뉴시스", "published": "2026-07-07T05:30:00+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 북대서양조약기구(NATO·나토) 정상회의를 계기로 한미일 3국의 외교장관 회의가 개최된다.  외교부에 따르면 조현 외교부 장관은 7일(현지시간) 늦은 오후 나토 정상회의 계기에 마코 루비오 미국 국무장관 및 모테기 도시미쓰 일본 외무상과 튀르키예 앙카라에서 한미일 외교장관 회의를 개최할 예정이다. 올해 처음으로 열리는 이번 한미일 외교장관 회의에서 3국 장관은 한반도 문제, 지역 및 글로벌 정세, 3국 간 안보 및 경제 협력에 대해 논의할 전망이다.  북한 핵·미사일 대응과 중동 정세 및 미국·이란 ", "language": "ko"}, {"title": "Hanwha Ocean shares sink 23% as it loses bid to build Canada's next fleet of submarines", "url": "https://www.cnbc.com/2026/07/07/hanwha-ocean-shares-sink-canada-submarines-tkms.html", "source": "CNBC", "published": "2026-07-07T05:29:18+00:00", "summary": "Canadian Prime Minister Mark Carney announced Monday that Germany's Thyssenkrupp Marine Systems would be the preferred supplier for delivering the submarines.", "language": "en"}, {"title": "中, 림팩기간 태평양에 SLBM 발사…美 \"관련동향 인지, 훈련 변경 없어\"", "url": "https://www.newsis.com/view/NISX20260707_0003699090", "source": "뉴시스", "published": "2026-07-07T05:22:17+00:00", "summary": "[하와이=뉴시스]옥승욱 기자 = 미국 하와이에서 30개국이 참여하는 세계 최대 다국적 해상훈련인 2026년 림팩(RIMPAC) 훈련이 실시되고 있는 가운데, 중국이 림팩 기간인 6일 태평양으로 잠수함발사탄도미사일(SLBM)을 시험 발사했다. 태평양 연안 국가 간 해상교통로 보호, 해양위협에 대한 공동대처능력 증강 등을 위한 목적으로 실시되는 림팩훈련 도중 중국이 태평양에 SMBL을 발사한 것이 이번 훈련과 무관하지 않다는 분석이 나온다.  윌리엄 매티스(대령) 시어도어 루스벨트함(CVN-71·10만t급) 함장은 6일(현지시간) 림팩", "language": "ko"}, {"title": "K방산 '마지막 퍼즐' 항공엔진 국산화…무인기용 시제품 첫 공개", "url": "https://www.hankyung.com/article/202607070248i", "source": "한국경제 정치", "published": "2026-07-07T05:18:00+00:00", "summary": "", "language": "ko"}, {"title": "[르포] 항공엔진 1만여대 생산한 한화…스마트화 넘어 기술 자립으로", "url": "https://www.yna.co.kr/view/AKR20260707083200003", "source": "연합뉴스", "published": "2026-07-07T05:00:04+00:00", "summary": "(창원=연합뉴스) 홍규빈 기자 = 지난 6일 한화에어로스페이스 창원1사업장 정문을 지나 왼쪽으로 눈을 돌리자 외벽에 가스터빈 형상을 표현한 건물...", "language": "ko"}, {"title": "방사청·ADD, 무인기용 국산 항공엔진 최초 공개", "url": "https://www.newsis.com/view/NISX20260707_0003698754", "sourc 60707_0003698483", "source": "뉴시스 경제", "published": "2026-07-07T01:40:30+00:00", "summary": "[서울=뉴시스] 이재우 기자 = 독일은 자국 방산업체 티센크루프마린시스템스(TKMS)가 캐나다 순찰 잠수함 프로젝트(CPSP) 우선협상대상자로 선정되자 북대서양조약기구(NATO·나토) 파트너십을 강화하는 강력한 신호라며 환영했다. 캐나다는 튀르키예 앙카라에서 열리는 나토 정상회의를 위해 출국 직전 독일의 손을 들어줬다. 프리드리히 메르츠 독일 총리는 6일(현지시간) 소셜미디어 엑스(X·옛 트위터)에 \"캐나다의 212CD급 잠수함 도입은 유럽과 대서양간 파트너십을 강화하는 강력한 신호\"라며 \"신뢰를 보여준 마크 카니 캐나다 총리와 요", "language": "ko"}, {"title": "李대통령 \"잠수함 수주 탈락 밑거름...K-방산 담대한 도전 계속\" - 스트레이트뉴스", "url": "https://news.google.com/rss/articles/CBMic0FVX3lxTFBkeGdZZE9XeEVXYkdvblp3ek8xMjhYT0lSMXhVQVFNWEk5YVZfVEswQWZ1OFV0NXpRbDhwSEt1WDAtenBGZTNUUEo5Z29IRGx4dWk0X254UXJVZXFMWEdJSEpTQjliRVFqRHlxbERjQkNRQ3c?oc=5", "source": "방산 뉴스", "published": "2026-07-07T01:38:24+00:00", "summary": "李대통령 \"잠수함 수주 탈락 밑거름...K-방산 담대한 도전 계속\"    스트레이트뉴스", "language": "ko"}, {"title": "'상임위 개문발차' 與 \"국힘 일하라…9일 본회의 개최 요청\"", "url": "https://www.newsis.com/view/NISX20260707_0003698652", "source": "뉴시스", "published": "2026-07-07T01:35:30+00:00", "summary": "[서울=뉴시스] 김난영 기자 = 정무위·과방위·국방위 등 일부 상임위 가동을 시작한 더불어민주당이 오는 9일 본회의 개최를 요청하겠다고 밝혔다. 한병도 민주당 대표 직무대행 겸 원내대표는 7일 오전 국회 원내대책회의에서 \"오늘 조정식 국회의장을 찾아뵙고 본회의 개최를 요청드리겠다\"고 밝혔다. 한 대행은 \"어제 과방위와 국방위 등 상임위가 첫 전체회의를 열었으나 국민의힘은 끝내 출석을 거부했다\"며 \"국민의힘에 엄중히 경고한다. '일'하라\"라고 했다. 이어 \"현재 상임위와 법사위를 통과했지만 국민의힘의 반대로 본회의 문턱에서 잠들어 있", "language": "ko"}, {"title": "이재명 대통령 “‘K-방산’의 담대한 도전...기술 고도화, K-방산위상 도약” - 브레이크뉴스", "url": "https://news.google.com/rss/articles/CBMiQkFVX3lxTE56MUZVd3NtdGNrRmpsRXJfMmc4dl9STnd5ejRFU2VmUjBralotUjRnOFdWZ3FnNzhLdmtfTzJjVXoyQQ?oc=5", "source": "방산 뉴스", "published": "2026-07-07T01:31:00+00:00", "summary": "이재명 대통령 “‘K-방산’의 담대한 도전...기술 고도화, K-방산위상 도약”    브레이크뉴스", "language": "ko"}, {"title": "강진군, 영산강유역청에 옴천면 상수원 보호구역 해제 건의", "url": "https://www.yna.co.kr/view/AKR20260707056900054", "source": "연합뉴스 경제", "published": "2026-07-07T01:06:19+00:00", "summary": "(강진=연합뉴스) 조근영 기자 = 전남광주통합특별시 강진군은 강진원 군수가 영산강유역환경청을 방문, 옴천면 원타운 조성사업의 원활한 추진을 위해...", "language": "ko"}, {"ti 加잠수함, 기대한 결과 아니지만 우리 저력 보여줘\"", "url": "https://www.yna.co.kr/view/AKR20260707021900001", "source": "연합뉴스", "published": "2026-07-06T22:56:23+00:00", "summary": "(서울=연합뉴스) 임형섭 기자 = 이재명 대통령은 7일 한화오션이 캐나다 잠수함사업(CPSP) 우선협상대상자로 선정되지 못한 데 대해 \"도전에는...", "language": "ko"}, {"title": "북, 일 무인잠수정에 \"재침 목표 향해 방아쇠…침략 불길 확대\"", "url": "https://www.newsis.com/view/NISX20260707_0003698141", "source": "뉴시스", "published": "2026-07-06T21:50:18+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한은 7일 일본이 공격 능력을 갖춘 무인잠수정을 개발하기로 한 데 대해 \"일본의 침략무력은 이미 《안전장치》를 해제하였으며 남은 것은 재침의 목표를 향하여 방아쇠를 당기는것 뿐\"이라고 밝혔다. 북한 조선중앙통신은 이날 '일본의 해외침략은 가상이 아니라 현실이다' 제목의 논평에서 \"해외침략에로 향한 군사력 강화 책동에 광분하고 있는 일본이 또다시 위험한 행보를 보이고 있어 지역과 국제사회의 심각한 우려를 자아내고 있다\"고 했다. 통신은 일본의 무인잠수정 개발을 언급하며 \"우리 국가를 비롯한 주변국들", "language": "ko"}, {"title": "방사청 \"캐나다 잠수함 결과 존중…전략적 여건 불리함 못 넘어\"", "url": "https://www.newsis.com/view/NISX20260707_0003698136", "source": "뉴시스", "published": "2026-07-06T21:40:09+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 방위사업청은 캐나다 차기 잠수함 사업(CPSP) 수주 경쟁에서 최종 고배를 마신 데 대해 7일 \"결과를 존중한다\"라면서도 \"정부와 기업이 최선을 다해 준비하고 대응해온 만큼 기대했던 성과로 이어지지 못한 점은 매우 아쉽게 생각한다\"라고 밝혔다.  방위사업청은 이날 보도자료를 내고 이같이 밝히며 \"과거 독일로부터 잠수함 기술을 도입했던 대한민국이 잠수함 원조국과 성능과 납기 등 모든 기술능력 면에서 대등하게 경쟁했다는 점은 우리 방산 기술력의 비약적인 성장을 보여주는 의미있는 성과\"라고 평가했다.  이", "language": "ko"}, {"title": "'계엄령 놀이' 갑질·2천만원 수수…비위 공무원 30명 적발", "url": "https://www.newsis.com/view/NISX20260706_0003696547", "source": "뉴시스", "published": "2026-07-06T21:01:00+00:00", "summary": "[서울=뉴시스] 강지은 기자 = 환경 미화원들을 상대로 이른바 '계엄령 놀이'를 하며 직장 내 갑질과 괴롭힘을 일삼고, 직무 관련자로부터 2000만원을 수수하는 등 비위 행위를 저지른 지방자치단체 공무원들이 줄줄이 적발됐다. 7일 행정안전부에 따르면 행안부는 최근 이러한 내용의 '2025년 지자체 소극행정·공직기강 특별감찰 결과'를 공개했다.  이번 감찰은 지난해 11월 10일부터 12월 5일까지 4주간 진행됐다. 행안부는 비위 공무원 30명을 적발해 중징계 등 처분을 요구하고, 총 1억2687만원을 환수 조치했다. 주요 감찰 결과", "language": "ko"}, {"title": "What to expect from the US at the 2026 NATO summit", "url": "https://breakingdefense.com/2026/07/what-the-pentagon-wants-from-the-2026-nato-summit/", "source": "Breaking Defense", "published": "2026-07-06T20:48:30+00:00", "summary": "Here are a few things we’re monitoring during this week’s alliance summit in Turkey.", "language": "en"}, {"title": "Canada selects Germany’s ThyssenKrupp to build new submarine fleet", "url": "https://breakingdefense.com/2026/07/canada-selects-germanys-thyssenkrupp-to-build-new-submarine-fleet/", "source": "Breaking Defense", "published": "2026-07-06T20:28:15+00:00", "summary": "The planned purchase will be groundbreaking for Canada’s naval capabilities, as the country has not acquired newly built submarines in over 60 years.", "language": "en"}, {"title": "Ondas makes $876M acquisition of DYZNE, latest in acquisition spree - Breaking Defense", "url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxPeVlfMnZaeWlVT1lkMzVPbFlYdmVZcG5WeEdZZ1Z3SURJS1Y4eFpWY3dsYm9JeUJXRXpPcTI5WFVUbElaSzd1QjBVWDRMOUJTekNBaU5Ic1RKNC1HVzlFY0V2SC0zbmFhWnBYazhQVmJoRjdsczFoNlZCZkF1ZlNQbjVNSnZYVXlPTnNUdzlxUm8yZ3JBTk1yUkZDREV3NjdmX2tFUA?oc=5", "source": "Breaking Defense (GNews)", "published": "2026-07-06T20:06:17+00:00", "summary": "Ondas makes $876M acquisition of DYZNE, latest in acquisition spree    Breaking Defense", "language": "en"}, {"title": "정통망법 개정안 시행 논란…與 \"공론장 방어벽\" 野 \"국민 입틀막법\"", "url": "https://www.newsis.com/view/NISX20260706_0003697900", "source": "뉴시스", "published": "2026-07-06T20:00:00+00:00", "summary": "[서울=뉴시스] 이승재 한재혁 기자 = 여야가 7일 시행되는 '정보통신망 이용 촉진 및 정보 보호 등에 관한 법률'(정통망법) 개정안을 두고 공방을 벌이고 있다.  더불어민주당은 이번 개정안이 온라인상에 무분별하게 유포되는 불법 또는 허위·조작정보 등으로부터 공론장과 피해자를 지키기 위한 방어벽 역할을 할 것이라는 입장이다. 반면 국민의힘은 이를 '입틀막법'으로 규정하고 재개정 논의에 착수할 것을 촉구하고 나섰다.  이번에 시행되는 정보통신망법 개정안은 온라인상에 고의적으로 불법 또는 허위·조작 정보를 유통해 타인에게 손해를 끼친 ", "language": "ko"}, {"title": "이 대통령, 오늘부터 닷새간 나토·몽골 순방…방산·공급망 협력 강화", "url": "https://www.newsis.com/view/NISX20260706_0003697928", "source": "뉴시스", "published": "2026-07-06T20:00:00+00:00", "summary": "[서울=뉴시스]김경록 기자 = 이재명 대통령이 7일부터 11일까지 북대서양조약기구(NATO·나토) 정상회의 참석 및 몽골 국빈방문을 위한 4박 5일 간의 해외 순방에 나선다. 이 대통령은 이날 오전 출국해 오는 7~8일(이하 현지시간) 튀르키예 앙카라에서 개최되는 2026년 나토 정상회의에 참석한다. 한국은 나토 회원국은 아니지만 나토가 최근 협력을 강화하고 있는 인도태평양 핵심 파트너국 IP4(한국·일본·호주·뉴질랜드) 일원으로 초청됐다. 이 대통령은 취임 후 첫 참석인 이번 나토 정상회의에서 방위산업 협력에 힘을 실을 전망이다.", "language": "ko"}, {"title": "김민석, 출마 첫날 정청래에 \"자기정치\" 저격…당권경쟁 격돌 예고", "url": "https://www.newsis.com/view/NISX20260706_0003697901", "source": "뉴시스", "published": "2026-07-06T20:00:00+00:00", "summary": "[서울=뉴시스] 한재혁 기자 = 김민석 전 국무총리가 더불어민주당 당대표 선거 출마를 공식화한 첫날부터 정청래 전 대표를 향해 \"지난 1년 자기정치의 폐해가 당과 당정협력을 혼선에 빠뜨렸다\"며 각을 세웠다. 7일 민주당에 따르면 정 전 대표는 이르면 이번 주 후반 출마 선언을 할 가능성이 거론된다. 송영길 의원도 이번 주 출마를 선언할 것으로 예상된다. 민주당의 차기 당권을 둘러싼 충돌이 본격 점화되는 양상이다. 김 전 총리는 전날 오전 광주 금남로 전일빌딩에서 당대표 출마 선언 기자회견을 열고 \"민주당은 지난 1년 대통령과 정부에", "language": "ko"}, {"title": "[오늘의 주요일정]국회(7월7일 화요일)", "url": "https://www.newsis.com/view/NISX20260706_0003698079", "source": "뉴시스", "published": "2026-07-06T20:00:00+00:00", "summary": "[서울=뉴시스]  ◇국회의장 14:00 정성호 법무부 장관 접견(의장 집무실) 15:00 한성숙 국무총리 접견(의장 집무실) ◇위원회 10:00 제9회전국동시지방선거투표용지부족사태등국민참정권침해진상규명및선거관리개혁을위한국정조사특별위원회 전체회의(중앙선거관리위원회 407호) 14:00 재정경제기획위원회 전체회의(본관 430호) ◇의원실 세미나 08:00 김태년 의원실, 경제는 민주당 제51강: 글로벌 AI경제의 미래(의원회관 제1소회의실) 10:00 김용태 의원실 등, AI 시대 올바른 기후 ·에너지 정책(의원회관 제6간담회의실) 1", "language": "ko"}, {"title": "Canada Picks German Type 212 Submarine For Badly Needed Fleet Renewal", "url": "https://www.twz.com/sea/canada-picks-german-type-212-submarine-for-badly-needed-fleet-renewal", "source": "The War Zone", "published": "2026-07-06T19:59:54+00:00", "summary": "The 12-boat procurement is one of Canada’s biggest-ever defense buys and marks a major shift toward closer military cooperation with European allies. \n The post  Canada Picks German Type 212 Submarine For Badly Needed Fleet Renewal  appeared first on  TWZ .", "language": "en"}, {"title": "미군 \"림팩 사령관 맡은 韓, 월드클래스 역량 파트너\"", "url": "https://www.newsis.com/view/NISX20260707_0003698105", "source": "뉴시스", "published": "2026-07-06T19:46:42+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 한국이 세계 최대 다국적 해상훈련인 2026년 림팩(RIMPAC) 훈련에서 아시아 국가 중에는 최초로 연합해군구성군     if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
