 1㎜라도 침범하면 강력 대응\"", "url": "https://www.newsis.com/view/NISX20261006_0003816335", "source": "뉴시스", "published": "2026-10-06T11:11:42+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한은 6일 서부전선 비무장지대(DMZ)에서 발생한 지뢰폭발 사건은 북한이 군사분계선(MDL) 이남에 매설한 지뢰로 인한 것이라는 우리 군 최종발표에 대해 재차 \"자작극\"이라고 주장했다. 지뢰매설, 철책 설치 등 이른바 '국경선 요새화' 작업을 강화하면서 일체의 대화를 거부하겠다는 입장도 밝혔다. 북한 외무성은 이날 대외매체 조선중앙통신을 통해 '우리는 가장 적대적인 국가를 향한 주권행사에 보다 단호하고 명백할 것이다' 제목의 성명을 냈다. 통상 북한 당국의 성명은 '담화'에 비해 격이 높다고 인식", "language": "ko"}, {"title": "France tests upgraded nuclear missile against backdrop of Russia tensions - Reuters", "url": "https://news.google.com/rss/articles/CBMizgFBVV95cUxNdnFZRFNIWk9paTlwTFFMaXJrM1BwQUtRYndNQXZCcXJfMDBadlBXZm85R0VaRFRQa3VrM3UtSGtqbUc4dU1TbU1EeGk3ZTg5eE9Da0FseEtBN3I0aXRoaEpiVW5SQjUwQ3Y0NjlKSjdINU0tM1BlYlo3czk2U3dFbDJRYnhPOGlUeWgyVHlGRnFzUVNpVjBGbVEzdmxOMk43eE50Q2Z3dlFDYUs5NldpYzlkZzEtOGt6cFRuQS1uekl6SHBMM05rc0ZwRkp2dw?oc=5", "source": "Reuters", "published": "2026-10-06T10:57:47+00:00", "summary": "France tests upgraded nuclear missile against backdrop of Russia tensions    Reuters", "language": "en"}, {"title": "Poland to spend $26 billion on civil defence, population protection plan, PM says - Reuters", "url": "https://news.google.com/rss/articles/CBMi0AFBVV95cUxPdWFoQzBKd1lLUEVjYkhzb2VneW15NTdrdlZzYkJaQkZLZ19yUmZJeUZEOHp5OVlZMnMwcWVVcVA5ZS1IOXdhdEVQd2M2My1SNTFOeW81SUdZSEdGMzNMcml0X1A5ZlZqbVA5ZXBPWkhkLWNwNV9rU1pHWlpwNkZmd1ZaNlRFTTlmTWdRMXVpQVhGRnk1cjJPX25GT1RFcW5EeG9uRUc5aU5KTENiSzNpZnAtdTlRNWRNS3Z2N2pmLWxvN3hrcHN0X1lCLU83MW93?oc=5", "source": "Reuters", "published": "2026-10-06T10:49:55+00:00", "summary": "Poland to spend $26 billion on civil defence, population protection plan, PM says    Reuters", "language": "en"}, {"title": "구미시, 7000억 방산 클러스터 본격화 - 경상매일신문", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE02OURzWS1HV2txYnpFWGFMM0RpdC1yc2M3OVdub254QUc5VEc1S3QwWGFLaV81WjJBdGFJdlpkb3BLR0YxSWoweGRaWHB2NF9KYlVCRXc1WWpvcjFuS1Rn?oc=5", "source": "방산 뉴스", "published": "2026-10-06T10:4 url": "https://www.newsis.com/view/NISX20261006_0003815789", "source": "뉴시스", "published": "2026-10-06T06:11:32+00:00", "summary": "[서울=뉴시스]조재완 기자 = 정부가 최근 출범한 중대범죄수사청(중수청)의 운영경비로 68억3683만원을 예비비에서 추가 지출한다. 이재명 대통령이 이날 청와대에서 주재한 제43회 국무회의에서는 이 같은 내용의 '2026년도 일반회계 목적예비비 지출안(중대범죄수사청 출범 4차)'을 포함한 일반안건 3건과 법률공포안 18건, 대통령령안 15건이 심의·의결됐다. 이번 예비비는 최근 출범한 중수청의 운영경비를 지원하기 위한 것으로, 이날 의결된 지출안은 중수청 소관 예산 68억3683만원을 2026년도 일반회계 목적예비비에서 지출할 것을", "language": "ko"}, {"title": "\"군에 바친 우리 청춘 조롱당했다\"…병역특례 폐지 청원 등장", "url": "https://www.newsis.com/view/NISX20261006_0003815069", "source": "뉴시스", "published": "2026-10-06T06:01:05+00:00", "summary": "[서울=뉴시스]이지우 인턴 기자 = 아시안게임에서 금메달을 획득한 남자 축구대표팀 일부 선수들의 병역 혜택 관련 행보가 논란을 빚은 가운데, 예체능인의 병역특례 제도를 폐지해달라는 청원이 등장했다. 5일 국회 국민동의청원 홈페이지에 '예능, 체육인의 병역면제 제도 폐지에 관한 청원'이 올라왔다. 작성자는 \"과거 개발도상국 시절부터 대한민국을 세계에 알리고 국격을 드높인 예체능인에 대하여 병역을 면제해 주었다\"며 \"콩쿠르, 올림픽, 아시안게임 등에서 훌륭한 결과를 만들어 낸 연주자나 선수들에게 이 제도가 큰 동기부여 요인이 되어 왔다", "language": "ko"}, {"title": "손흥민·이강인도 받은 '병역특례', 53년 만에 없어지나...\"군대 안 갑니다\" 발언 논란 후폭풍→국방부 \"예술·체육요원 감축·폐지 추진\" - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMigwFBVV95cUxOSUZYOHRSa3VWV0hVNU5LRkpxcVlpMFJqc0FaOTdaTWpXaEt0LUtvS2tBdVZVclhWd3IzV3Q0Y2wxbXotSnpxLUg5TmQ5QTlxbjR1UDRISHFpWmRvZlFDVGR0MTl3NWRjdndlV3lUQVVuQzIyZXA3WmVlbGtMNzlRemhUY9IBlwFBVV95cUxNeFJlMkV4NEVNcHVZdVdOR2o3WlFQUldOaEZPTk1GMjV5QzFWeUJxajMyUm1STDhiaE56ZzB0R0ozemQ4NGJaZHFybEp6ZVFabTVCT0NFOTY3TVhEeWI5eTNHQXFSNGZFaEVqdE03c0ZsZ2lXNmVscTVUckdJWW5VQXp0M1RaRm42eVp2MzFHLVp2elhCTUlV?oc=5", "source": "조선비즈", "published": "2026-10-06T05:54:00+00:00", "summary": "손흥민·이강인도 받은 '병역특례', 53년 만에 없어지나...\"군대 안 갑니다\" 발언 논란 후폭풍→국방부 \"예술·체육요원 감축·폐지 추진\" - 조선비즈    Chosunbiz", "language": "ko"}, {"title": "MSDI, 구미시와 국제 방위산업 단지 조성한다 - 서울경제TV", "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE0yaUtvRy0wRTI5R0FyeTVDdHpOT1QtaEsyZXhfdHNOOVV1NHJjN2UtUlNlaTlBSmtwMzFnamllcmdIZllxMGFjWFVMUm1fSzg2aFlndjg0Yzlpb05TQm16OTdhdUc?oc=5", "source": "방산 뉴스", "published": "2026-10-06T05:4 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
