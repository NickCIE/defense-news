y": "[서울=뉴시스] 옥승욱 기자 = 병무청은 24일부터 9월 18일까지 제13회 사회복무대상(大賞) 포상 대상자를 추천받는다고 밝혔다. 병무청은 병역을 성실하게 이행하고 있는 사회복무요원과 복무관리 업무유공 직원들의 사기진작을 위해 2014년부터 사회복무대상 시상식을 개최하고 있다.  포상 대상은 사회적으로 귀감이 되는 사회복무요원과 복무기관에서 사회복무요원 성실복무를 지원한 우수 복무관리 담당자 등 사회복무요원 111명, 복무관리 직원 66명, 복무기관 5곳이다. 추천 대상자는 접수시작일 기준 6개월 이상 복무 중인 사회복무요원이다.", "language": "ko"}, {"title": "민주 41.9% 국힘 37.6%…민주 6.0%p↓·국힘 4.5%p↑[리얼미터]", "url": "https://www.newsis.com/view/NISX20260824_0003759255", "source": "뉴시스", "published": "2026-08-23T23:45:28+00:00", "summary": "[서울=뉴시스]하지현 기자 = 더불어민주당과 국민의힘의 지지율 격차가 오차범위 내라는 여론조사 결과가 24일 나왔다. 여론조사 전문회사 리얼미터가 에너지경제신문 의뢰로 지난 20~21일 전국 만 18세 이상 유권자 1009명에게 정당 지지도를 조사한 결과 민주당은 41.9%, 국민의힘은 37.6%로 집계됐다. 직전 조사(8월2주차)보다 민주당 지지율은 6.0%포인트(p) 하락했고, 국민의힘 지지율은 4.5%p 상승해 양당 격차는 14.8%p에서 4.3%p로 크게 좁혀졌다. 이어 조국혁신당 3.9%, 진보당 2.3%, 개혁신당 2.0", "language": "ko"}, {"title": "'親트럼프' 폭스뉴스 북미대화 난항 전망…\"8년 전보다 北협상력 커져\"", "url": "https://www.newsis.com/view/NISX20260824_0003759156", "source": "뉴시스", "published": "2026-08-23T22:35:22+00:00", "summary": "[서울=뉴시스] 신효령 기자 = 도널드 트럼프 미국 대통령이 김정은 북한 국무위원장과의 대화를 다시 추진하고 있지만, 과거보다 북한의 협상력이 강해져 비핵화 합의 가능성은 더 낮아졌다는 분석이 나왔다. '친(親)트럼프 성향'을 보여온 미국 보수 성향 매체 폭스뉴스는 23일(현지시간) '트럼프, 김정은과 핵 포커게임을 벌이다-하지만 패는 누가 쥐고 있나'라는 제목의 기사에서 트럼프 대통령이 1기 때보다 합의를 타결할 유인이 크게 줄어든 북한을 상대하고 있다고 진단했다. 북한의 핵전력이 커진 데다 러시아라는 강력한 우군까지 생겼다는 이", "language": "ko"}, {"title": "북 \"일 야스쿠니 참배 놀음, 평화 바라는 인류 염원에 도전\"", "url": "https://www.newsis.com/view/NISX20260824_0003759162", "source": "뉴시스", "published": "2026-08-23T22:11:11+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한은 일본 정치인들의 야스쿠니 신사 집단 참배에 대해 \"세계의 평화와 안전을 바라는 인류의 염원에 대한 심각한 도전\"이라고 했다. 북한 조선중앙통신은 24일 '일본의 신군국주의 광풍은 섬나라에 멸망의 폭풍을 몰아올 것이다' 제목의 논평에서 한국 광복절(8월 15일·북한 명칭 '조국해방의 날')이자 일본 패전일을 맞아 이뤄진 야스쿠니 신사 참배를 비판했다. 통신은 \"죄 많은 과거사를 유일하게 청산하지 않은 뻔뻔스러운 군국주의 후예들이 해외침략에 앞장섰던 잔인 무도한 침략자, 살인마들을 기를 쓰고 '", "language": "ko"}, {"title": "당정 \"불가피한 비거주 1주택자 인정 확대\"[간추린 주말 뉴스]", "url": "https://www.newsis.com/view/NISX20260823_0003759101", "source": "뉴시스", "published": const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
