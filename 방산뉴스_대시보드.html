:00", "summary": "[서울=뉴시스]김지훈 우지은 기자 = 국민의힘은 17일 이재명 대통령이 일부 국민의힘 의원들과 골프 회동을 하고 개헌 의지를 공유한 데 대해 \"우리 당 내부 개헌에 우호적인 의원들을 포섭해 개헌 밑그림을 그리고, 개헌을 연결고리로 국민의힘 내부 분열을 유도하려는 책략\"이라고 했다. 이 대통령이 '임기 단축 개헌'을 언급한 데 대해서는 \"믿을 사람 있을까\"라고 했다.  박성훈 수석대변인은 이날 오후 국회 소통관에서 기자들과 만나 \"단일대오로 여당의 폭주에 맞서 싸워야 할 시기에 우리당 소속 일부 의원들이 대통령과 골프 회동을 가진 점", "language": "ko"}, {"title": "German drone maker Helsing enlists Rakuten to broker Japan military deal - Reuters", "url": "https://news.google.com/rss/articles/CBMiygFBVV95cUxQQ1NqcVAwOXE2NjV6OTJXNG9nYmRUSUc0X2VYeDczazZ1WWNWT2h5ZkdrbEY1MnpMaUt6cW1PT3FhRFlCeG80aGVjLXZ2RGtLcldFcmtrenZFMWNxa19wVlBsZUpSTFdpZDY3TzNZM1FoZ0Fna1lFTkVaaWR6eXM1aU94aS1BRXRMWHNRTU9VTmozOTlXNDllS3U2bFZOYWV1VDFtTEx3WUljUjIyS1YzbFIxaTZDZnpveEJGNDV2cWw4cWR4RGNOdU1B?oc=5", "source": "Reuters", "published": "2026-08-17T08:28:56+00:00", "summary": "German drone maker Helsing enlists Rakuten to broker Japan military deal    Reuters", "language": "en"}, {"title": "[쇼츠] 폴란드 역사상 최대 군사퍼레이드…'K2 흑표' 질주", "url": "https://www.yna.co.kr/view/AKR20260817051100704", "source": "연합뉴스", "published": "2026-08-17T07:30:19+00:00", "summary": "(서울=연합뉴스) 지난 15일(현지시간) 폴란드 수도 바르샤바 중심가에서 열린 대규모 군사 퍼레이드.", "language": "ko"}, {"title": "국힘, 트럼프 한미훈련 축소 지시에 \"李정부가 자초한 안보참사\"(종합)", "url": "https://www.yna.co.kr/view/AKR20260817035551001", "source": "연합뉴스", "published": "2026-08-17T06:55:04+00:00", "summary": "(서울=연합뉴스) 김연정 조다운 기자 = 국민의힘은 17일 도널드 트럼프 미국 대통령이 한미연합군사훈련 축소를 지시한 것을 두고 \"이재명 정부의...", "language": "ko"}, {"title": "Taiwan's president says record defence spending an investment in peace - Reuters", "url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxNMUhtZ0k5WElRd1ZLNlEtejNuLTZGcXQ0ZXMzRkpVWnk3aFVGaC1GV1EtOWwxQjM5eEdfNm85WGowWGlWQlhSekw2WnV3OXNtV1JRVjdsY2NzcF9HY1VPSDNhcktuV2l3ZWZXaVBNZExsaFN6dGZpcFBBall2MktGME84N2dHbi03WnVqRHRCU1hSMWxOdE5MZE94QnRUTHZWcDBYWFM0MkRqejlUc2xlanlIWQ?oc=5", "source": "Reuters", "published": "2026-08-17T06:47:00+00:00", "summary": "Taiwan's president says record defence spending an investment in peace    Reuters", "language": "en"}, {"title": "장동혁 \"트럼프 한미훈련 축소 지시, 李정권 자초 외교참사…대책 있나\"", "url": "https://www.newsis.com/view/NISX20260817_0003751518", "source": "뉴시스", "published": "2026-08-17T06:38:35+00:00", "summary": "[서울=뉴시스]김지훈 기자 = 장동혁 국민의힘 대표는 17일 미국 도널드 트럼프 대통령의 한미연합훈련 축소 지시에 대해 \"이재명 정권이 자초한 외교 참사\"라고 했다.  장 대표는 자신의 페이스북에 \"연합훈련이 없어질 판이다. 결국 이재명 대통령이 바라던 대로 됐다. 속이 시원한지 묻고 싶다\"라며 이같이 적었다.  또한 \"트럼프 대통령은 북한 김정은에 대해 '매우 좋은 관계'라고 했다. 이 대통령에 대해서는 '이란 비핵화 동참에 노 땡스(No thanks)라고 했다'고 전했다\"라며 \"동맹국 대통령에게 북한 독재자보다도 신뢰를 못 얻고", "language": "ko"}, {"title": "트럼프 '대폭 축소' 지시…한미연합훈련 실제 축소되나", "url": "https://www.newsis.com/view/NISX20260817_0003751519", "source": "뉴시스", "published": "2026-08-17T06:37:30+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 도널드 트럼프 미국 대통령이 한미연합훈련을 대폭 축소하라고 지시하면서 실제 연합훈련이 잇달아 중단·축소될지 주목된다. 트럼프 대통령이 김정은 북한 국무위원장과의 관계를 함께 언급한 만큼 연합훈련을 북미 대화 재개 여건을 조성하기 위한 카드로 활용하려는 것 아니냐는 관측도 나온다.  트럼프 대통령은 16일(현지시간) 자신의 소셜미디어(SNS) 트루스소셜에 \"북한의 김정은과의 매우 좋은 내 관계에 비춰볼때, 저는 한국과의 연합군사연습에 미국이 참여하기로 오래전에 합의했다는 사실이 기쁘지 않다\"며 \"취소하", "language": "ko"}, {"title": "靑 \"트럼프 메시지 주목, 북미대화로 이어지길…한미연합훈련 긴밀 조율\"", "url": "https://www.newsis.com/view/NISX20260817_0003751493", "source": "뉴시스", "published": "2026-08-17T06:02:13+00:00", "summary": "[서울=뉴시스]김경록 기자 = 청와대는 17일 도널드 트럼프 미국 대통령이 김정은 북한 국무위원장과의 좋은 관계를 언급하며 한미 연합훈련 축소를 지시했다고 밝힌 데 대해 \"한미 양국은 그동안 확고한 연합방위태세 유지와 연합연습 및 훈련에 대해 긴밀히 조율해왔으며, 앞으로도 이와 관련한 구체사항에 대해 공조해 나갈 것\"이라고 밝혔다. 청와대는 트럼프 대통령이 16일(현지시간) 소셜미디어(SNS) 트루스소셜에 게시한 내용에 대해 이날 오후 이 같은 입장을 냈다. 트럼프 대통령은 이날 한미 연합 훈련 '을지 자유의 방패'(UFS) 시작을", "language": "ko"}, {"title": "[속보] 靑 \"이란·호르무즈 관련 실질적·군사적 기여 美와 논의 중\"", "url": "https://www.yna.co.kr/view/AKR20260817042700001", "source": "연합뉴스", "published": "2026-08-17T06:00:10+00:00", "summary": "(", "language": "ko"}, {"title": "文 \"與 전당대회 보며 큰 우려…단결은 승리, 분열은 곧 패배\"", "url": "https://www.newsis.com/view/NISX20260817_0003751476", "source": "뉴시스", "published": "2026-08-17T05:29:31+00:00", "summary": "[서울·대전=뉴시스]신재현 한재혁 권신혁 김윤영 기자 = 더불어민주당 8·17 전당대회가 열린 가운데 문재인 전 대통령이 \"경쟁이 당을 분열시켜서는 안 된다\"며 \"치열히 경쟁하되 결과에 승복하고 서로 포용하며 함께하는 성숙한 모습을 보여주길 기대한다\"고 밝혔다.  문 전 대통령은 17일 대전 유성구 DCC대전컨벤션센터에서 열린 3차 정기전국당원대회 영상 축사를 통해 \"단결은 곧 승리이고 분열은 곧 패배라는 역사 교훈을 우리는 잘 알고 있다\"며 이같이 말했다.  문 전 대통령은 \"하지만 이번 당원대회를 바라보며 우려가 큰 것이 사실이", "language": "ko"}, {"title": "'5·18 재조명 포럼' 이진숙 당 윤리위에 제소 \"중징계 내려야\"", "url": "https://www.newsis.com/view/NISX20260817_0003751468", "source": "뉴시스", "published": "2026-08-17T05:12:04+00:00", "summary": "[서울=뉴시스]김지훈 기자 = '5·18 민주화운동 재조명 포럼' 개최로 논란을 빚은 이진숙 국민의힘 의원이 국민의힘 윤리위원회에 17일 제소됐다.    국민의힘 한 책임당원은 이날 오후 책임당원 등 3700여명이 참여한 이 의원 제소장을 당사에 냈다.  이들은 제소장에서 \"원내대표가 취소를 요청했음에도 이를 묵살하고 강행했다\"라며 \"당의 공식 의사를 거역한 것\"이라고 주장했다.  또한 \"발제자 이영훈은 5·18 민주화운동을 소요 사태로 규정, 5·18 민주화운동을 부정하는 주장이 국회 안에서, 우리 당 소속 의원의 이름을 걸고 공", "language": "ko"}, {"title": "트럼프, '훈련 축소 지시' 속 UFS 실시 [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260817_0003751450", "source": "뉴시스", "published": "2026-08-17T04:58:09+00:00", "summary": "[서울=뉴시스]김진아 김종택 유자비 기자 = 한미 군 당국이 17일부터 유사시 한반도 방어를 위한 정례 연합훈련인 '을지 자유의 방패'(UFS·Ulchi Freedom Shield)' 훈련에 돌입했다. 도널드 트럼프 미국 대통령이 훈련 축소를 지시했다고 밝힌 가운데 훈련은 예정대로 실시되고 있는 것으로 알려졌다. 오는 27일까지 시행되는 이번 UFS 연습은  한미가 연례적으로 실시하는 방어적 성격의 훈련이다. 한미는 최근 전쟁 양상을 통해 분석된 전훈 등 현실적인 위협을 연습 시나리오에 반영했다. 이번 훈련에 한국군은 지난해와 동일", "language": "ko"}, {"title": "[영상] 폴란드 지상·해상·공중 최대 군사 퍼레이드…'K2 흑표' 질주", "url": "https://www.yna.co.kr/view/AKR20260817039200704", "source": "연합뉴스", "published": "2026-08-17T04:57:06+00:00", "summary": "(서울=연합뉴스) 지난 15일(현지시간) 폴란드 수도 바르샤바 중심에서 열린 대규모 군사 퍼레이드.", "language": "ko"}, {"title": "국힘, 트럼프 한미연합훈련 축소 지시에 \"코리아 패싱 시작\"", "url": "https://www.newsis.com/view/NISX20260817_0003751438", "source": "뉴시스", "published": "2026-08-17T04:30:48+00:00", "summary": "[서울=뉴시스]우지은 기자 = 국민의힘은 17일 도널드 트럼프 미국 대통령이 한미연합훈련인 '을지자유의방패'(을지프리덤실드·UFS) 축소를 지시한 데 대해 \"코리아 패싱(Korea Passing)이 시작됐다\"고 했다. 박성훈 국민의힘 수석대변인은 이날 오전 논평을 내어 \"북한의 위협에 맞서 실전 대응 능력을 점검해야 할 방위 훈련이 껍데기만 남게 된 참담한 현실은, 전적으로 이재명 정부의 빈곤한   "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
