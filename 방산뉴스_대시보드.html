 제시한다.  이 대통령은 기업의 대규모 지역 투자를 통해 국가 균형 발전을 이루겠다는 국정 목표를 재차 제시하고, 범정부 차원의 총력 지원도 약속할 전망이다. 이번 투자 계획은 특정 지역에 시혜를 주는 차원이 아니라, 기업이 입지·인프", "language": "ko"}, {"title": "송영길 \"보완수사권, 정치적 무기화해 쟁점화하는 것은 바람직하지 않아\"", "url": "https://www.newsis.com/view/NISX20260703_0003695098", "source": "뉴시스", "published": "2026-07-03T05:59:50+00:00", "summary": "[서울=뉴시스]정금민 한재혁 권신혁 기자 = 더불어민주당 차기 당 대표 선거 출마가 점쳐지는 송영길 의원은 3일 \"보완수사권 여부를 정치적으로 무기화할 문제는 아니다\"라고 했다. 송 의원은 이날 서울 용산구의 한 호텔에서 열린 민주당 국회의원 워크숍에 참석해 기자들과 만나 \"보완수사권 문제처럼 조율할 수 있는 문제를 정치적으로 무기화해서, 전당대회에서 마치 정부를 상대로 싸움하듯 쟁점화하는 것은 바람직하지 않다\"며 이같이 말했다. 정청래 전 민주당 대표와 김민석 전 국무총리가 보완수사권 완전 폐지를 언급한 가운데 당 안팎에서 '예외", "language": "ko"}, {"title": "靑 \"쿠팡 표적 조사 없어…국적따라 기업 차별 대우 안 해\"", "url": "https://www.newsis.com/view/NISX20260703_0003695074", "source": "뉴시스", "published": "2026-07-03T05:49:00+00:00", "summary": "[서울=뉴시스] 김지은 조재완 기자 = 청와대는 3일 미국 백악관이 대규모 개인정보 유출 사태를 빚은 쿠팡과 관련해 한국 정부가 미국 기업을 표적으로 삼고 있다고 주장한 데 대해 \"우리는 국적에 따라서 기업활동에 대해 차별적으로 대처하거나 아니면 누구를 표적화해서 조사하지 않는다\"며 \"한미 안보 영역에 파장이 없도록 노력하겠다\"고 밝혔다. 위성락 국가안보실장은 이날 오후 브리핑에서 관련 질의에 \"쿠팡에 대해서 이뤄진 조사는 국내법과 적법 절차에 따라서 비차별적으로 이뤄지고 있다\"며 이같이 말했다. 이어 \"그래서 이 조사가 차별적이다", "language": "ko"}, {"title": "[속보]위성락 \"쿠팡 표적 조사 없어…美 의회 보고서 사실과 달라\"", "url": "https://www.newsis.com/view/NISX20260703_0003694999", "source": "뉴시스", "published": "2026-07-03T05:23:01+00:00", "summary": "후속기사가 이어집니다 \n◎공감언론 뉴시스 kje1321@newsis.com", "language": "ko"}, {"title": "이 대통령, 7~8일 나토 정상회의 참석…9~11일 몽골 국빈 방문", "url": "https://www.newsis.com/view/NISX20260703_0003694752", "source": "뉴시스", "published": "2026-07-03T05:22:50+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령이 튀르키예 앙카라에서 열리는 북대서양조약기구(NATO·나토) 정상회의 참석하는 등 7일부터 4박5일 간의 순방길에 오른다. 위성락 청와대 국가안보실장은 3일 오후 청와대 춘추관에서 브리핑을 열고 \"이 대통령은 마크 루터 NATO 사무총장의 초청으로 7일부터 8일까지 튀르키예 앙카라에서 개최되는 2026년 NATO 정상회의에 참석한다\"고 밝혔다. 이어 \"이번 참석은 지난달 G7 정상회의에 이어 우리 외교의 지평을 더욱 넓히고, 특히 세계 국방비의 55%를 차지하는 최대 방산시장인 NATO", "language": "ko"}, {"title": "[단독]종합특검, 김상환 前 육군 법무실장 소환…'계엄 버스' 수사 박차", "url": "https://www.newsis.com/view/NISX20260703_0003694966", "source": "뉴시스", "published": "2026-07-03T05:17:32+00:00", "summary": "[서울=뉴시스] 오정우 기자 = 12·3 비상계엄 당시 육군의 '계엄 버스' 탑승 의혹을 들여다보는 2차 종합특별검사팀이 김상환 전 육군 법무실장을 소환한 것으로 파악됐다. 3일 법조계에 따르면 2차 특검팀(특별검사 권창영)은 이날 오전부터 김 전 실장을 내란중요임무종사 미수 혐의로 첫 피의자 조사를 진행하고 있다.  내란중요임무종사 미수죄는 국헌문란의 목적으로 내란죄의 핵심적인 역할을 수행하려 했으나, 폭동이 충분한 수준에 이르지 못하거나 범죄가 완수되지 않아 미수에 그친 경우에 적용된다. 특검팀은 고현석 전 육군본부 참모차장 등", "language": "ko"}, {"title": "\"산재 반복 없도록\"…노동부, 제조업 15개사와 긴급회의", "url": "https://www.newsis.com/view/NISX20260703_0003694665", "source": "뉴시스 경제", "published": "2026-07-03T05:00:00+00:00", "summary": "[서울=뉴시스] 고홍주 기자 = 정부가 동일한 사업장에서 같은 유형의 산업재해가 반복되는 것을 막기 위해 주요 제조업체 대표들과 대응 방안을 논의했다. 고용노동부는 3일 오후 서울 중구 서울지방고용노동청에서 '제조업 동일 유형 반복 사고 근절 점검회의'를 열었다. 회의에는 고려아연, 금호타이어, KCC글라스, 삼립, 세아베스틸, 삼성디스플레이, 삼강에스앤씨, 쌍용C&E, SK지오센트릭, HD현대삼호, 아워홈, 한솔제지, 한화오션, 현대자동차, 현대제철 등 15개 제조업체 대표이사가 참석했다. 이번 회의는 이재명 대통령이 지난달 2일", "language": "ko"}, {"title": "[게시판] 국내 중소기업 상대 美GE에어로 절충교역 설명회", "url": "https://www.yna.co.kr/view/AKR20260703080900504", "source": "연합뉴스", "published": "2026-07-03T04:35:42+00:00", "summary": "▲ 방위사업청은 3일 대전테크노파크에서 국내 중소기업이 미국의 대표 방산기업 GE에어로스페이스와 산업협력을 할 수 있도록 절충교역 사업설명회를 ...", "language": "ko"}, {"title": "해병대, 몽골서 다국적 평화유지훈련 '칸퀘스트' 참가", "url": "https://www.newsis.com/view/NISX20260703_0003694877", "source": "뉴시스", "published": "2026-07-03T04:34:15+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 해병대는 지난달 20일부터 3일까지 몽골 오릉 훈련장에서 진행된 다국적 유엔 평화유지활동(PKO) 훈련 '2026 칸 퀘스트 훈련'에 참가했다고 밝혔다.  올해 훈련에는 해병대 제2신속기동부대 장병 21명과 의무사 1명, 해군(의무) 1명을 포함해 미국·몽골·인도·영국·필리핀·호주·이집트·독일 등 17개국 700여명이 참가했다. 훈련 기간 장병들은 각 국에서 선발된 전문교관의 지도하에 고정 및 이동 검문소 운용, 급조폭발물(IED) 대응, 차단 및 탐색, 전투부상자처치, 호송, 무인기 대응, 방호, ", "language": "ko"}, {"title": "퇴직 검사·한전 임원, 삼성전자行…대통령실 고위직은 KT로", "url": "https://www.newsis.com/view/NISX20260703_0003694405", "source": "뉴시스", "published": "2026-07-03T03:00:00+00:00", "summary": "[서울=뉴시스] 강지은 기자 = 퇴직한 검찰청 검사와 한국전력공사 임원이 삼성전자로 취업할 수 있게 됐다. 대통령비서실에서 근무한 별정직 고위 공무원은 KT로 재 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
