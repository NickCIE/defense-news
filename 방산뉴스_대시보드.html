is.com/view/NISX20261107_0003858869", "source": "뉴시스 경제", "published": "2026-11-08T02:00:00+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 강릉항에서 구조된 남방큰돌고래 '안목이'가 치료·재활을 마치고 다시 바다로 돌아간다.  해양수산부는 오는 10일 제주특별자치도 서귀포시 산방산 인근 해역에서 안목이를 자연 방류할 계획이라고 8일 밝혔다. 안목이는 지난해부터 강릉항 일대에서 혼자 생활하던 어린 남방큰돌고래다. 남방큰돌고래는 현행법에 따라 '해양보호생물'로 지정된 법정 보호종이다.  허리 부위 피부에 약 20㎝ 길이의 찢어진 상처가 발견돼 지난 7월 15일 구조됐다. 이후 해양동물 전문 구조·치료기관인 울산 장생포 고래생태체험관으로 이송", "language": "ko"}, {"title": "보건·복지 상용직 8만명 늘었는데…20대는 5만명 줄었다", "url": "https://www.newsis.com/view/NISX20261108_0003859197", "source": "뉴시스 경제", "published": "2026-11-08T01:12:19+00:00", "summary": "[세종=뉴시스]여동준 기자 = 올해 3분기 보건·복지 분야 상용근로자가 8만명 넘게 늘었지만, 20대는 오히려 5만명 이상 줄어든 것으로 나타났다. 같은 업종에서도 연령에 따라 고용 흐름이 엇갈린 것이다. 20대는 정보통신업에서도 상용직이 4만명 넘게 감소했다. 30대는 교육 서비스업과 전문·과학·기술 서비스업에서 각각 5만명 이상 줄었다. 8일 국가데이터처 경제활동인구조사 마이크로데이터를 분석한 결과 올해 3분기 보건업 및 사회복지 서비스업 상용근로자는 월평균 230만4903명이었다. 지난해 같은 기간보다 8만1250명 증가했다.", "language": "ko"}, {"title": "'장군 정신 함께 잇는다' 세종시·해군 대호김종서함 협약", "url": "https://www.yna.co.kr/view/AKR20261108015900063", "source": "연합뉴스", "published": "2026-11-08T00:51:14+00:00", "summary": "(세종=연합뉴스) 이재림 기자 = 세종시는 해군의 차세대 이지스구축함인 대호김종서함과 함께 김종서 장군의 역사적 가치 확산에 나서기로 했다고 8...", "language": "ko"}, {"title": "초선부터 3선까지 기소…오태완 의령군수 '사법리스크' 반복", "url": "https://www.yna.co.kr/view/AKR20261106160500052", "source": "연합뉴스", "published": "2026-11-07T23:13:00+00:00", "summary": "(의령=연합뉴스) 박영민 기자 = 초선 때부터 선거법 위반 등으로 재판받아온 오태완 경남 의령군수가 3선 임기에도 또다시 기소되면서 사법리스크가...", "language": "ko"}, {"title": "Binance CFO Kaiser Ng steps down, Justin Yek named new finance chief - Reuters", "url": "https://news.google.com/rss/articles/CBMivAFBVV95cUxNY1JmenBXVVhvTTZIU0dnVDduN0VVeWNYU3R1Sl9CLVRhQ3RPaUYwcG85TWZrenoxS3Nwc2NKU3FmNnI0Z05ydlhySG9fWjF1cy1sdm9WVlluYUt6SFNzSTVzUFdaSWVQY21Ud0dOV1ROamRnSUFPUUFTZF9mLXpidXRRdjlwRkZfaGVSNmxnMDVhWF9SRDE4TmxsanRkRktselE4SGVRZFlXYmNvbWo1aEJaVl8zZy1YZm9nQg?oc=5", "source": "Reuters", "published": "2026-11-07T22:45:30+00:00", "summary": "Binance CFO Kaiser Ng st function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
