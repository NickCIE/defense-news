ary": "(서울=연합뉴스) 윤보람 기자 = 지난 21일 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고 당시 군은 군사분계선(MDL)에서 10여ｍ...", "language": "ko"}, {"title": "From pickups to idle plants: automakers seek lifeline from defence boom - Reuters", "url": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxPQW9jYVdEZ19vYkRWVC04bnJLU241NWtCby11TnJGMkEyX0RiT2JicGI2ZnZfM04yLWV2aW5vVjlUUTFzbmtnZnVKdk42VHkwLWZRUDlveC1LUWRqcERlX1BTUkNtT3BhUVNRUW1VMVN0a3pUb0czb0FWX1NxYk1zU19PWC12cjVub1IyVnJlTWNmQi1mcUNxVEh6OEpBMVhyUFhwb0FNeXZYTTdmdzFDa2ROc0Z2YjlVYW8xdTRaQlA?oc=5", "source": "Reuters", "published": "2026-09-28T14:15:14+00:00", "summary": "From pickups to idle plants: automakers seek lifeline from defence boom    Reuters", "language": "en"}, {"title": "與 \"北, 지뢰 진상규명 즉각 협조하고 우리 장병에 사과해야\"", "url": "https://www.newsis.com/view/NISX20260928_0003806105", "source": "뉴시스", "published": "2026-09-28T13:51:19+00:00", "summary": "[서울=뉴시스]권신혁 기자 = 더불어민주당은 28일 서부전선 비무장지대(DMZ) 폭발 사고의 원인으로 북한군 지뢰일 가능성이 높다는 군의 발표와 관련해 \"북한은 이번 사태의 진상을 낱낱이 규명하는데 즉각 협조해야 한다\"며 \"우리 장병과 국민께 사죄해야 마땅할 것\"이라고 했다.  박성준 민주당 수석대변인은 이날 오후 서면브리핑에서 \"오늘 합동참모본부는 중간 조사 결과를 통해 이번 폭발이 북한군 지뢰에 의한 것일 가능성이 매우 높다고 발표했다\"며 이같이 말했다.  박 수석대변인은 \"합참의 현장조사 결과대로 북한이 군사분계선 인근에 지뢰", "language": "ko"}, {"title": "합참 \"DMZ 폭발원인, 북한군 지뢰 가능성 매우 높아…北 매설 판정시 상응 조치\"(종합)", "url": "https://www.newsis.com/view/NISX20260928_0003806097", "source": "뉴시스", "published": "2026-09-28T13:40:58+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 우리 군은 지난 21일 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 \"이번 지뢰 폭발 원인은 북한군의 지뢰일 가능성이 매우 높다고 판단했다\"고 28일 밝혔다.  다만 이 지뢰가 북한군이 최근 MDL 일대에서 국경선화 작업 일환으로 매설한 것인지, 오래 전 다른 지점에 매설한 지뢰가 유실된 것인지에 대해서는 추가적인 조사가 필요하다는 입장이다.  권대원 합동참모본부 차장(육군 중장)은 28일 저녁 국방부 청사에서 열린 DMZ폭발사고 관련 브리핑에서 \"해당 지역에 아군의 지뢰 매설 기", "language": "ko"}, {"title": "As private investment in defense increases, some bottlenecks in funding: AIA-Bain", "url": "https://breakingdefense.com/2026/09/as-private-investment-in-defense-increases-some-bottlenecks-in-funding-aia-bain/", "source": "Breaking Defense", "published const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
