 laid out new details on the effort.", "language": "en"}, {"title": "강신철, 싱가포르·베트남 국방장관 만나 국방·방산 협력 논의", "url": "https://www.newsis.com/view/NISX20261029_0003847396", "source": "뉴시스", "published": "2026-10-29T12:37:15+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철 국방부 장관은 29일 필리핀 세부에서 제13차 아세안 확대 국방장관회의(ADMM-Plus) 참석을 계기로 싱가포르, 베트남 국방부장관을 잇따라 만나 양자회담을 가졌다.  먼저 강 장관은 찬춘싱 싱가포르 국방장관과 회담을 갖고 양국 국방·방산 협력 방안을 논의했다.  두 장관은 양국이 '전략적 동반자 관계' 격상 이후 국방·방산 협력 발전을 위해 기울인 노력들을 긍정적으로 평가했다. 이와 함께 인적교류 활성화 및 사이버·인공지능(AI) 등 다양한 협력 분야들을 발굴, 양국 협력을 한층 강화해 나", "language": "ko"}, {"title": "이 대통령 \"독일은 정확, 한국은 빠르다…함께 협력의 시너지 낼 것\"", "url": "https://www.newsis.com/view/NISX20261029_0003847391", "source": "뉴시스", "published": "2026-10-29T12:16:11+00:00", "summary": "[서울=뉴시스]이인준 기자 = 이재명 대통령은 29일 공식 방한한 프리드리히 메르츠 독일 총리와 만찬을 갖고 \"앞으로 대한민국과 독일은 인공지능과 반도체를 비롯한 첨단산업부터 안보, 방산, 공급망, 과학기술에 이르기까지 다방면에 걸쳐 협력의 지평을 넓혀가게 될 것\"이라고 말했다.  이 대통령은 이날 오후 청와대 영빈관에서 만찬사를 통해 \"오늘 한국, 독일 양국은 강화된 전략적 동반자 관계 수립을 통해 함께 새로운 미래를 열어가기로 뜻을 모았다\"며 이같이 밝혔다.  이 대통령은 \"한국과 독일은 지리적으로 멀리 떨어져 있지만 전쟁과 분", "language": "ko"}, {"title": "이 대통령 \"한·독, 강화된 전략적 동반자 관계 수립…방산·첨단기술, 구체적 성과 기대\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20261029_0003847387", "source": "뉴시스", "published": "2026-10-29T12:13:31+00:00", "summary": "[서울=뉴시스]조성봉 김진아 김지은 이인준 기자 = 이재명 대통령은 29일 공식 방한한 프리드리히 메르츠 독일 총리와 정상회담을 하고 반도체·배터리·인공지능(AI) 등 핵심 산업의 공급망 안정화와 첨단기술 협력을 확대하기로 뜻을 모았다. 양국은 기업의 투자환경을 개선하기 위해 이중과세방지협정 개정의정서에 서명하고, 군사비밀정보보호협정 체결을 추진해 국방·안보 협력의 제도적 기반도 강화하기로 했다. 이 대통령은 이날 오후 청와대에서 한-독 정상회담을 마친 후 공동 언론발표를 통해 \"독일은 대한민국의 유럽 내 최대 교역국이자 자유와 민", "language": "ko"}, {"title": "변광용 거제시장, 정부예산 심의 앞두고 국회 방문", "url": "https://www.newsis.com/view/NISX20261029_0003847373", "source": "뉴시스", "published": "2026-10-29T12:07:07+00:00", "summary": "[거제=뉴시스] 신정철 기자 = 경남 거제시 변광용 시장이 2027년도 정부예산 국회 심의를 앞두고 지난 28일과 29일 이틀간 국회를 방문했다. 변 시장은 이광재 국회 예산결산특별위원장을 비롯해 예결위 허성무 의원, 국토교통위 염태영 의원, 국방위 김성회 의원을 잇따라 만나 주요 사업의 필요성을 설명하고 국회 차원의 적극적인 지원을 요청했다. 이번 방문에서 변 시장은 거제~통영 고속도로 건설과 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
