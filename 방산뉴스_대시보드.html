, "language": "ko"}, {"title": "'북한 지뢰 폭발' 논의 위한 유엔사-북한군 회담 무산", "url": "https://www.newsis.com/view/NISX20261117_0003870645", "source": "뉴시스", "published": "2026-11-16T21:34:43+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 유엔군사령부(UNC)가 비무장지대(DMZ) 남측 지역에서 북한 지뢰가 폭발한 사건 등을 논의하는 회담을 개최하기 위해 북한군과 접촉했으나 한국 정부가 북한에 공개적으로 사과를 요구한 뒤 이러한 노력이 중단됐다고 NK뉴스(NK NEWS)가 16일(현지시각) 보도했다.  유엔군사령부 군사정전위원회(UNCMAC)는 지난 9월21일 발생한 폭발 사건 이후 조선인민군(KPA)에 접촉해 지뢰 폭발 사건과 비무장지대 내부 군사분계선 표지물의 정확한 위치를 논의할 것으로 제의했다.  UNCMAC는 회담이 성사될 경", "language": "ko"}, {"title": "U.S. Army Now Wants Concrete Bunkers For Troops In Israel, Saudi Arabia And Lebanon", "url": "https://www.twz.com/news-features/u-s-army-now-wants-concrete-bunkers-for-troops-in-israel-saudi-arabia-and-lebanon", "source": "The War Zone", "published": "2026-11-16T21:15:24+00:00", "summary": "The Army wants to replace modified shipping containers with concrete bunkers in the latest sign that the Pentagon is finally taking hardening more seriously. \n The post  U.S. Army Now Wants Concrete Bunkers For Troops In Israel, Saudi Arabia And Lebanon  appeared first on  TWZ .", "language": "en"}, {"title": "New Bow Sonar Dome For Heavily Damaged Submarine USS Connecticut Seen For The First Time", "url": "https://www.twz.com/sea/new-bow-sonar-dome-for-heavily-damaged-submarine-uss-connecticut-seen-for-the-first-time", "source": "The War Zone", "published": "2026-11-16T20:24:52+00:00", "summary": "USS Connecticut has been undergoing major repairs since losing its bow after an underwater collision in 2021. \n The post  New Bow Sonar Dome For Heavily Damaged Submarine USS Connecticut Seen For The First Time  appeared first on  TWZ .", "language": "en"}, {"title": "Vulcan failure deepens concerns over US military launch capacity", "url": "https://breakingdefense.com/2026/11/vulcan-failure-deepens-concerns-over-us-military-launch-capacity/", "source": "Breaking Defense", "published": "2026-11-16T20:07:47+00:00", "summary": "The failed launch could further delay ust be able to fire the Stratus LO, a land-strike cruise missile under development by MBDA for the French, British, and Italian militaries.", "language": "en"}, {"title": "New tools for troops to gun down drones | Defense News Weekly Full Episode 11.17.26", "url": "https://www.defensenews.com/video/2026/11/16/new-tools-for-troops-to-gun-down-drones-defense-news-weekly-full-episode-11-17-26/", "source": "Defense News", "published": "2026-11-16T18:03:38+00:00", "summary": "The visceral threat of cheap drones delivering pinpoint, guided anti-personnel munitions continues to spawn new protection systems. Plus, an interview with a Medal of Honor recipient.", "language": "en"}, {"title": "Europe hunts for Palantir alternatives as militaries seek to limit US dependence", "url": "https://www.defensenews.com/news/2026/11/16/europe-hunts-for-palantir-alternatives-as-militaries-seek-to-limit-us-dependence/", "source": "Defense News", "published": "2026-11-16T18:00:00+00:00", "summary": "Europe's defense ministries are looking to limit dependency on American technology and major software company Palantir Technologies.", "language": "en"}, {"title": "크렘린궁 \"미중러 3자 회담서 공동성명 기대…러 제안, 中에 전달\"", "url": "https://www.newsis.com/view/NISX20261117_0003870613", "source": "뉴시스", "published": "2026-11-16T17:30:36+00:00", "summary": "[서울=뉴시스] 이재우 기자 = 러시아 크렘린궁은 오는 19일(현지시간) 미국·중국·러시아 3자 정상회담 이후 공동성명이 발표될 것으로 기대했다. 미중러 정상은 중국 선전에서 열리는 아시아태평양경제협력체(APEC) 정상회의를 계기로 사상 첫 3자 회담에 나설 예정이다. 타스통신과 인테르팍스 등에 따르면 유리 우샤코프 크렘린궁 외교정책 보좌관은 이날 3자 회담 의제와 회담 결과에 관한 공동성명 문안을 조율하고 있다고 밝혔다.  러시아는 공동성명 관련 제안을 중국에 전달했으며 현재 당사국들은 미국의 답변을 기다리고 있다고도 설명했다. ", "language": "ko"}, {"title": "China has ‘normalized’ naval presence near Japan since political spat of 2025", "url": "https://www.defensenews.com/global/asia-pacific/2026/11/16/china-has-normalized-naval-presence-near-japan-since-political-spat-of-2025/", "source": "Defense News", "published": "2026-11-16T17:02:51+00:00", "summary": "Given its scale, the massive C   "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
