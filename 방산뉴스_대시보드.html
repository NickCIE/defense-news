9+00:00", "summary": "[마닐라=뉴시스] 유자비 기자 = 조현 외교부 장관은 22일(현지시간) 필리핀 마닐라에서 아세안 관련 외교장관회의 계기 아니타 아난드 캐나다 외교장관과 회담을 갖고, 국방·방산, 에너지·핵심광물, 인공지능(AI) 등 전략 분야에서의 실질 협력 진전 방안에 대해 논의했다.  외교부에 따르면 조 장관은 회담에서 최근 다수의 한국 방산 기업들이 NATO 회원국들의 방위 역량 강화에 기여하고 있다고 설명했다.  양 장관은 기존의 외교·안보 협의체를 기반으로 한-캐 간 국방·방산 협력이 상호 호혜적인 방향으로 발전할 수 있도록 긴밀히 소통해", "language": "ko"}, {"title": "조현, 호주·뉴질랜드와 외교장관 회담…\"LNG 등 에너지 안정적 수급 협조 당부\"", "url": "https://www.newsis.com/view/NISX20260722_0003719470", "source": "뉴시스", "published": "2026-07-22T14:08:18+00:00", "summary": "[마닐라=뉴시스] 유자비 기자 = 조현 외교부 장관은 아세안 관련 외교장관회의 참석을 위해 필리핀 마닐라를 방문한 계기에 22일(현지시간) 호주의 페니 웡 외교장관, 뉴질랜드의 윈스턴 피터스 외교장관과 각각 양자 회담을 개최했다.  외교부에 따르면 양 장관은 한-호주 외교장관회담에서 지난 4월 '한-호주 에너지자원 안보 공동성명'을 토대로 양국간 에너지 협력을 지속 강화해 나가기로 했다.  조 장관은 호주가 우리의 최대 LNG 공급국인 만큼 주요 에너지자원의 안정적 수급을 위한 호주측의 관심과 협조를 당부했다.  같은 날 오후에 개", "language": "ko"}, {"title": "Collaborative Combat Aircraft need to be more than a flying weapons magazine", "url": "https://breakingdefense.com/2026/07/collaborative-combat-aircraft-need-these-systems-to-be-more-than-a-flying-weapons-magazine/", "source": "Breaking Defense", "published": "2026-07-22T14:00:40+00:00", "summary": "[Sponsored] Capabilities, cost and autonomy are top of mind concerns for developing effective unmanned aircraft.", "language": "en"}, {"title": "캐나다 수주 실패로 방산 목표 달성 어려워진 한화·HD현대… “전방위 수주전 나선다” - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxPOTdlMU9zcG5OUjA0VDJueGFTaV9SaFd1Q3RVR2FzUnFJSnc0SlA0eTVhOUpJaU9IMHpHb3hvRlpVcldjZUUzdmo1RHpCTlFVbWpfbDBKMjF3YmRfR3N2SU9qc3hXN0dfRkhmeXFscVdHbkt3dWhZdEp3RzUxd3JnMXZDbUnSAZgBQVVfeXFMTWM3M2VpNjFidHA0dFZ6bkd5SWRsT3JsN242YVJsLVhxVXFaUWU0ZU8yRHpJdTZLajZQMjFzelRkSGptbnpPVHViMXhrQmhSckhBaXZfQThSVHg0ZG8yV0FBTkFkX2xQdkgzRjZRVHJPQTlBOUNKUVhUdnhVX0xOR3RuS25HM25IQWFidW5ZYkdRVmVlUDljSG0?oc=5", "source": "조선비즈", "published": "2026-07-22T13:56:00+00:00", "summary": "캐나다 수주 실패로 방산 목표 달성 어려워진 한화·HD현대… “전방위 수주전 나선다” - 조선비즈    Chosunbiz", "language": "ko"}, {"title": const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
