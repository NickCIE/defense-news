/07/usaf-chief-wilsbach-on-lessons-from-iran-t-7-flight-and-f-35-delays/", "source": "Breaking Defense", "published": "2026-07-19T18:00:00+00:00", "summary": "In a one-on-one with Breaking Defense, Air Force Chief of Staff Gen. Kenneth Wilsbach laid out his big concerns for the service.", "language": "en"}, {"title": "Boeing expects additional cost hit on Air Force One to make 2028 delivery: Defense CEO", "url": "https://breakingdefense.com/2026/07/boeing-expects-additional-cost-hit-on-air-force-one-to-make-2028-delivery-defense-ceo/", "source": "Breaking Defense", "published": "2026-07-19T17:02:57+00:00", "summary": "“I do expect to see some cost growth there as we come through [final assembly] and we finish off the wiring and the structures, as well as finishing off with certification,” Steve Parker told reporters ahead of Farnborough Airshow this week.", "language": "en"}, {"title": "러 외무 차관 \"韓, 美 '타이폰' 배치시 '안보 위협'에 상응 대응\"", "url": "https://www.newsis.com/view/NISX20260720_0003714339", "source": "뉴시스", "published": "2026-07-19T15:34:56+00:00", "summary": "[서울=뉴시스] 이재우 기자 = 안드레이 루덴코 러시아 외무차관은 19일(현지시간) 한국이 미국의 중거리 지상발사 미사일 체계인 '타이폰(Typhon)'을 배치할 경우 그에 상응하는 비례적 대응이 있을 것이라고 경고했다. 루덴코 차관은 이날 타스통신과 인터뷰에서 '일본이 미국과 군사훈련 과정에서 타이폰 미사일 체계의 자국 영토 배치에 동의했다. 이 체계가 한국에도 배치될 가능성이 있는가'라는 질문에 이같이 답했다. 그는 \"현재로서는 한국이 자국 영토에 미국 타이폰 시스템을 배치하려 한다는 정보를 가지고 있지 않다\"면서도 \"만약 그런", "language": "ko"}, {"title": "국힘, 李 골프 의혹·안규백 탈영 의혹 비판…\"정권 목표 국방 붕괴 아니길\"", "url": "https://www.newsis.com/view/NISX20260719_0003714182", "source": "뉴시스", "published": "2026-07-19T06:28:28+00:00", "summary": "[서울=뉴시스] 전상우 기자 = 국민의힘은 19일 해군 장병 실종 당시 이재명 대통령이 골프를 쳤다는 의혹과 안규백 국방부 장관의 탈영 의혹을 거론하며 정부를 향한 비판을 이어갔다. 장동혁 국민의힘 대표는 이날 오후 자신의 페이스북에 \"해군 장병이 차가운 바다에서 죽어갈 때 국군통수권자 대통령은 골프를 쳤다고 한다\"며 \"국방부 장관은 탈영병 의혹을 해소하지 못하고 있다\"고 적었다. 장 대표는 \"대한민국은 여전히 휴전 국가\"라며 \"북한 김정은 정권은 지금도 핵과 미사일을 강화하며 끊임없이 우리 국민의 삶을 위협하고 있다\"고 했다. 이", "language": "ko"}, {"title": "北, DMZ 인근에 방사포 지원시설 다수 건설 정황", "url": "https://www.newsis.com/view/NISX20260719_0003714103", "source": "뉴시스", "published": "2026-07-19T04:49:15+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 북한이 지난 2년간 비무장지대(DMZ) 인근에 동일한 형태를 갖춘 최소 21개 건물을 건설한 정황이 포착됐다. 이는 방사포의 보관 또는 정비 시설로 활용될 수 있다는 분석이 나온다.  19일 미국 자유아시아방송(RFA)이 분석한 위성사진에 따르면 각각 약 52m 길이에 달하는 건물이 2023~2025년 개성 남쪽 소규모 북한군 기지에 건설됐다. RFA는 \"비무장지대에서는 북쪽으로 불과 수㎞, 서울에선 직선거리로 약 52㎞ 떨어진 곳에 있다\"라고 설명했다.  RFA는 전문가들이 이동식 발사차량이나 다연", "language": "ko"}, {"title": "앞으로 해외 은행에서도 원화계좌 만들고 송금 가능해져", "url": "https://www.newsis.com/view/NISX20260719_0003713970", "source": "뉴시스 경제", "published": "2026-07-19T03:00:00+00:00", "summary": "[세종=뉴시스]박광온 기자 = 정부가 외국인이 해외 금융기관에 원화 계좌를 만들고 원화를 예금·대출·송금할 수 있도록 '역외원화결제기관'을 도입한다. 이 기관의 계좌를 이용해 외국인끼리 원화를 빌려주거나 주식·채권 투자자금을 주고받을 때는 자본거래 사전신고를 면제한다. 한국은행에는 해외에서 이뤄지는 원화 거래를 24시간 처리하는 별도 결제망도 만든다. 정부는 19일 관계기관 합동으로 이런 내용을 담은 '원화 국제화 로드맵'을 발표했다. ◆해외 은행에 원화계좌…국내 계좌 없어도 거래 그동안 외국인이 원화를 송금하거나 결제하려면 원칙적", "language": "ko"}, {"title": "北 매체도 \"최선희 외무상, 러 초청으로 러시아 방문\"", "url": "https://www.newsis.com/view/NISX20260719_0003713876", "source": "뉴시스", "published": "2026-07-18T23:27:13+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 최선희 북한 외무상이 러시아를 방문하기 위해 지난 18일 전용기로 평양을 출발했다고 19일 조선중앙통신이 보도했다.  조선중앙통신은 이날 \"로씨야련방(러시아) 외무상 쎄르게이 라브로브 동지의 초청에 따라 외무상 최선희 동지와 일행이 로씨야련방을 방문하기 위해 18일 전용기로 평양을 출발했다\"라고 밝혔다.  통신은 평양국제비행장에서 김정규 외무성 부상, 블라디미르 토페하 주북 러시아대사관 임시대사대리가 전송했다고 전했다.  구체적인 방문 목적과 세부 일정은 공개하지 않았다. 전날 러시아 외교부도 최 외", "language": "ko"}, {"title": "“미래 軍 경쟁력, 좋은 드론보다 인간·AI 잇는 소프트웨어가 좌우” - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxOODJ0Ukp6ZmNxbl9qOUNOdkdsN0NNTVMtZFQ5dDd1RG9YcWxHY1B1Y3g1VFJIbkc1RWp6VjhfVEQyWGxQQ1dFLTA5b0pTZ2NvOTJTbWFRbVVrSWZqVkowZDZpVl91YzZycDBtSlBWOUZ3eXlLMmFHWWxUeERWY3hRQU0xcXTSAZgBQVVfeXFMTXRzOXRBdVhGTnd1akNVdVZYVGV4aXdTajBtSDYxc0pIdHZSeTUtSU1CUmJVbGd6OWtFRUpLdjZLdVhJU29zUDFpT1lSX0dKRjd3TkE1RHlxcWRyUXJOU1JmcGhBR2xyaFc3eWxpbk5Dd2hoaVRKNE9TMVpWTHpBT245bnRUVnhxZjBMUlhocVJDRmZrVDFXa2U?oc=5", "source": "조선비즈", "published": "2026-07-18T21:00:00+00:00", let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
