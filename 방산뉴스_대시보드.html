NnpLYl9xZ2xrWDFvZzlrN2RwV2J4QUt1UUtiLTlzZTA1Qms2eTMtTjMyRXRGblJXVkF5NV9nTzEzTE1rbDFLUDdNOWRuQlhrS1BIVXFRdVJiQUtuT0lmODVRcVZ1dTRMeU11SkJuWlJvNGNJUjJhY1RBVGN1WWJGQ0JyZw?oc=5", "source": "Reuters", "published": "2026-10-18T09:08:02+00:00", "summary": "Iran's parliament approves Mehrdad Akhlaqi as minister of defence    Reuters", "language": "en"}, {"title": "브런슨 '한국은 DMZ 이남부터' 발언 논란…국방부 \"개인 견해\"", "url": "https://www.yna.co.kr/view/AKR20261018033900504", "source": "연합뉴스", "published": "2026-10-18T06:06:45+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 제이비어 브런슨 주한미군사령관(유엔군사령관 겸 한미연합군사령관)이 최근 \"한국은 비무장지대(DMZ) 남쪽 철책...", "language": "ko"}, {"title": "국힘 \"與, 정쟁 넘어 '탄핵 국감'…李정권 실정 덮는 물타기 안 돼\"(종합)", "url": "https://www.newsis.com/view/NISX20261018_0003830494", "source": "뉴시스", "published": "2026-10-18T06:06:25+00:00", "summary": "[서울=뉴시스]하지현 기자 = 국민의힘은 18일 이재명 정부 2년 차 국정감사가 후반기로 접어든 가운데 \"민생 국감을 저지하고 고성과 호통이 난무하는 정쟁 국감을 만든 것은 더불어민주당\"이라고 주장했다. 민주당의 조희대 대법원장 탄핵 추진 논의를 두고 \"이재명 정권 실정을 덮기 위한 물타기\"라고도 했다. 정점식 원내대표는 이날 국회에서 국정감사 현안 관련 기자간담회를 열고 \"이재명 정부는 집권 1년 4개월 만에 치안, 부동산, 농지, 주식 등 전방위적 영역에서 나라를 절단내고 있다\"며 이같이 말했다. 이어 \"민주당은 김용범 전 청와", "language": "ko"}, {"title": "'전작권 전환' 두고 공방…민주 \"국힘은 굴종적\" 국힘 \"李임기 억지로 맞추기\"", "url": "https://www.newsis.com/view/NISX20261018_0003830475", "source": "뉴시스", "published": "2026-10-18T05:54:05+00:00", "summary": "[서울=뉴시스]정금민 하지현 한재혁 기자 = 여야는 18일 전시작전통제권(전작권) 전환 문제를 놓고 공방을 벌였다. 더불어민주당은 전작권 전환과 관련한 '새 기준'을 언급한 주한미군 사령관 발언에 문제를 제기하며 \"국민의힘은 굴종적\"이라고 했다. 반면 국민의힘은 \"이재명 대통령의 임기에 (전작권 전환을) 억지로 맞추려는 (민주당의) 시도\"라며 미국과 충분히 협의해야 한다고 했다. 전은수 더불어민주당 원내대변인은 이날 서면브리핑을 통해 \"'굴종'은 국민의힘의 외교 안보 노선을 두고 하는 말\"이라며 \"이재명 정부의 임기 내 전작권 회복", "language": "ko"}, {"title": "北 \"日, 핵무장 물꼬 트려는 위험천만한 시도…재침 야망\"", "url": "https://www.newsis.com/view/NISX20261018_0003830416", "source": "뉴시스", "published": "2026-10-18T04:43:31+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 북한이 일본의 핵무기 및 원자력잠수함 보유 논의 움직임에 대해 \"핵무장화의 물꼬를 터뜨리려는 위험천만한 시도\"라며 강하게 비난했다. 북한 노동당 기관지 노동신문은 18일 '핵무장화의 물꼬를 터뜨리려는 위험천만한 시 제의 성장 둔화 우려를 상쇄하고 있다고 평가했다. 한국의 성장과 재정건전성, 대외 지표도 안정적인 흐름을 보이고 있다는 진단이다. 신평사들은 특히 정부의 미래대응기금 운용 계획에 관심을 나타냈다. 18일 재정경제부에 따르면 이형일 경제부총리 겸 재경부 장관은 지난 16일(현지 시간) 태국 방콕에서 열린 국제통화기금(IMF)·세계은행(WB) 연차총회", "language": "ko"}, {"title": "농진청, 고기능성 수수 신품종 개발·재배 기계화 박차", "url": "https://www.newsis.com/view/NISX20261018_0003830222", "source": "뉴시스 경제", "published": "2026-10-18T02:00:00+00:00", "summary": "[세종=뉴시스]김동현 기자 = 농촌진흥청이 국산 수수의 경쟁력을 높이고 수수 산업 활성화를 지원하기 위해 고기능성 신품종 개발과 생산·가공·유통을 연계한 산업화 체계 구축에 박차를 가하고 있다.  18일 농진청에 따르면 수수에는 폴리페놀, 탄닌, 플라보노이드 같은 항산화 물질이 풍부하다. 다양한 지방산과 비타민, 미량원소도 함유돼 있어 모세혈관을 튼튼하게 하고 콜레스테롤 함량을 낮춰 심혈관계 질환 등 생활습관병 예방에 도움을 준다.  국내에서는 남부 지역 기준으로 5월 상순에 육묘하면 8월 중하순에 수확할 수 있다. 감자나 배추 등", "language": "ko"}, {"title": "'교통올림픽' ITS 세계총회 19일 강릉서 개막…AI·자율주행 기술 한자리", "url": "https://www.newsis.com/view/NISX20261018_0003830286", "source": "뉴시스 경제", "published": "2026-10-18T02:00:00+00:00", "summary": "[서울=뉴시스]정유선 기자 = 국토교통부와 강릉시는 '2026 강릉 ITS 세계총회'가 오는 19일부터 23일까지 5일간 강릉 올림픽파크에서 개최된다고 18일 밝혔다. '교통올림픽'으로 불리는 ITS 세계총회는 전 세계 정부·기업·학계가 모여 최신 교통기술을 공유하는 대규모 국제행사다.  국내에서는 1998년 서울과 2010년 부산에 이어 세 번째로 열리며, '이동을 넘어 하나되는 세계(Beyond Mobility, Connected World)'를 주제로 193개 학술 세션과 428개 전시부스 등이 운영된다. 이번 총회에서는 인공", "language": "ko"}, {"title": "정점식 \"與, 정쟁 넘어 '탄핵 국감'…조희대 탄핵 조속히 결론 내라\"", "url": "https://www.newsis.com/view/NISX20261018_0003830318", "source": "뉴시스", "published": "2026-10-18T01:57:26+00:00", "summary": "[서울=뉴시스]하지현 우지은 기자 = 정점식 국민의힘 원내대표는 18일 더불어민주당이 조희대 대법원장 탄핵 추진 논의를 공식화한 것을 두고 \"김민석 대표는 탄핵 추진 여부를 조속히 결론 내리라\"라며 \"사법부와 대한민국의 운명을 본인들의 정치적 볼모로 잡아두지 말라\"고 했다. 정 원내대표는 이날 오전 국회에서 국정감사 현안 관련 기자간담회를 열고 \"김 대표는 정쟁 국감의 차원을 넘어 탄핵 국감을 만들고 있다\"며 이같이 말했다. 그는 \"본인들이 초래한 민생 파탄과 외교·안보 위기에서 국민의 관심을 돌리고 지지층을 다시 결집시키기 위해 ", "language": "ko"}, {"title": "이집트 대통령 “사우디 요청시 군사 지원… 방어 방어 위한 조치” - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMingFBVV95cUxOZEFwRG1lOE9Rc2dvZVUxN20wZGZTY19CX3h3MEFoYWFabTBNR0ljNnM5ZE05VVUzQmt5WWpka0hzNm53WVJWZnVfa2R4MHNFVDMxa0ozV1p5LXZ4UDllbkFVW const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
