 "url": "https://www.newsis.com/view/NISX20261105_0003857125", "source": "뉴시스", "published": "2026-11-05T14:49:28+00:00", "summary": "[서울=뉴시스]하지현 전상우 김윤영 정유진 기자 = 이재명 대통령 관련 사건 등의 조작기소 의혹을 수사하는 이른바 '조작기소 특검법'이 5일 더불어민주당 주도로 국회 본회의에 상정됐다. 국민의힘은 이를 저지하기 위한 필리버스터(무제한 토론을 통한 합법적 의사진행방해)에 돌입했다. 민주당은 6일 필리버스터를 종결하고 법안을 처리할 계획이다.  국회 법제사법위원장인 서영교 민주당 의원은 이날 '윤석열 정권 검찰청, 국가정보원, 감사원 등의 조작수사·조작기소 등 의혹의 진상규명을 위한 특별검사 임명 등에 대한 법률안' 제안 설명에 나섰다", "language": "ko"}, {"title": "Israeli defense company says this trigger is programmed to shoot drones", "url": "https://www.defensenews.com/news/2026/11/05/israeli-defense-company-says-this-trigger-is-programmed-to-shoot-drones/", "source": "Defense News", "published": "2026-11-05T14:00:00+00:00", "summary": "The company says the Arbel electromechanical device will release a cadence of fire optimized for shooting down drones.", "language": "en"}, {"title": "French counter-drone startup Alta Ares wins third of NATO framework contract - Reuters", "url": "https://news.google.com/rss/articles/CBMivAFBVV95cUxQbjhmZ3Y2TENHQzM4LV9XMXhSMkQxT09xMTlCdDZ5Y3hUVEd0U3pxTjR5VmpNSkx1OUpEbm5qcDhkM3o4VFFwN2ZHUFB5aTA4Sl9qTUVWOWRQS0laV01XMkVWOTZBZjdpT29iV1RVRDBjZGw3SG5DNTBBYWdQNGxZLXdyR2Z0SkxJQU1GT0NYZmR6MWlJUnRuLTdib2I1N1hkNmVrWU9BOVJxSWtQejhzS3hwaFA4MUpJQWd4TA?oc=5", "source": "Reuters", "published": "2026-11-05T13:33:32+00:00", "summary": "French counter-drone startup Alta Ares wins third of NATO framework contract    Reuters", "language": "en"}, {"title": "외교차관보, 英의회 대표단 면담…호르무즈·한반도 정세 등 논의", "url": "https://www.newsis.com/view/NISX20261105_0003857063", "source": "뉴시스", "published": "2026-11-05T11:45:55+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 정의혜 차관보는 5일 알리샤 컨스 영국 하원의원을 비롯한 영국 의회 대표단을 면담하고, 한-영국 관계와 주요 지역정세 등을 폭넓게 논의했다고 외교부가 밝혔다. 외교부에 따르면 정 차관보는 한-영 양국이 '글로벌 전략적 동반자'로서 우호 협력 관계를 꾸준히 발전시켜 온 점을 평가하고, 지정학적 위기와 불안정성이 심화되는 오늘날 핵심 가치를 공유하는 양국의 협력이 더욱 긴요하다고 언급했다.  또 한-영 양국이 경제, 방산, 공급망 등 제반 분야에서 협력을 더욱 심화시켜 나가기를 기대한다면서, 최근 G20", "language": "ko"}, {"title": "외교부, 청해부대 작전범위 확대에 \"이란과 소통 중…호르무즈 실질적 기여 연관성 있을 것\"", "url": "https://www.newsis.com/view/NISX20261105_0003857053", "source": "뉴시스", "published": "2026-11-05T11:31:05+00:00", "summary": "[서울=뉴시스] 박준호 유자비 기자 = 외교부는 5일 청해부대의 작전 범위를 기존 아덴만에서 호르무즈 해협과 더 가까운 오만 남방 해안 일대로 확대하고 군사 전력을 추가 투입하기로 한 정부 결정과 관련해 \"이란을 포함한 관련국들과 지속적으로 소통 중에 있다\"고 밝혔다. 외교부 당국자는 이날 기자들과 만나 청해부대의 파견 연장 수정 동의안과 관련한 이란측과의 소통 여부에 대해 이같이 말했다. 이 당국자는 \"여러 외교 채널이 있기 때문에 이 건에 대해서도 소통 중에 있다\"면서도 이란 외교당국과의 소통 내용이나 외교채널에 대해선 확인해주", "language": "ko"}, {"title": "靑, 美 중간선거 결과에 \"한미동맹, 초당적 지지로 굳건한 관계\"(종합)", "url": "https://www.yna.co.kr/view/AKR20261105149651001", "source": "연합뉴스", "published": "2026-11-05T10:58:49+00:00", "summary": "(서울=연합뉴스) 설승은 황윤기 기자 = 청와대는 미국 중간선거 결과와 관련해 5일 \"한미동맹은 70년 이상 미국의 초당적 지지를 받으면서 굳건...", "language": "ko"}, {"title": "우상호 \"원주는 KT와 AI 데이터센터 협의…드론기업 유치 추진\"", "url": "https://www.yna.co.kr/view/AKR20261105174300062", "source": "연합뉴스 경제", "published": "2026-11-05T10:32:45+00:00", "summary": "(원주=연합뉴스) 이재현 기자 = 우상호 강원특별자치도지사가 원주에 대기업 AI 데이터센터와 해외 드론기업 유치를 추진하고, 이를 기반으로 첨단...", "language": "ko"}, {"title": "Poland arrest four in probe into military supplies sent to Russia - Reuters", "url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxQUjJ1OG55UUdJZk4ybzRYcDlreDBySHo0YWpJX1hVYUVrVXF1bm5YbV9qTjZPVlVMR0U1REJFTlY5Z2dBUWpSX0pKNjVkbXo1ME0tX2c1WkNxeHE4STFQOERrZjdRRHdxaFZFMEZfbHdva2lIeS05d2Y4RF8zMFowUkFqMVhHb1ZFaVRJZWFRdUVfTDVNZ2xtSXBMaHN0U1JJS1pB?oc=5", "source": "Reuters", "published": "2026-11-05T09:48:12+00:00", "summary": "Poland arrest four in probe into military supplies sent to Russia    Reuters", "language": "en"}, {"title": "[글로컬픽]강원 방위산업 육성 속도 - MTN 머니투데이방송", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE9iQjJTRTVTVTBlQm90Ukg5QWZSUWR6NTc0Ykx4ZmFhRDR6enJGV2pTZG01S3lNYTZTdVRmN1oybFdGUC01VXZwZDlkWXhaMTdLN01PeHpuQ1Q2UERjdU9v?oc=5", "source": "방산 뉴스", "published": "2026-11-05T09:22:47+00:00", "summary": "[글로컬픽]강원 방위산업 육성 속도    MTN 머니투데이방송", "language": "ko"}, {"title 1Q1ZhM3BKWTZaNXItdHN4VDhidzZNeFhISE14eFRwQ1luVER3dFo1d3JzN2szQQ?oc=5", "source": "방산 뉴스", "published": "2026-11-05T08:21:32+00:00", "summary": "첨단 항공우주력과 방산의 미래를 보다... 영주 동양대 군사학과 전문가 초청 특강    이로운넷", "language": "ko"}, {"title": "From tanks to drones: South Korea’s defense firms face a new battlefield test", "url": "https://www.cnbc.com/2026/11/05/south-korea-defense-weapon-war-stocks-fall.html", "source": "CNBC", "published": "2026-11-05T08:07:43+00:00", "summary": "South Korean defense stocks rode a wave of global rearmament for the past two years, but they have plunged in 2026.", "language": "en"}, {"title": "[게시판] 동서식품, 육군 제21보병사단에 위문품·기부금 전달", "url": "https://www.yna.co.kr/view/AKR20261105149800030", "source": "연합뉴스 경제", "published": "2026-11-05T07:51:05+00:00", "summary": "▲ 동서식품은 일 강원도 양구군에 있는 육군 제21보병사단을 방문해 맥심 커피믹스, 카누 캡슐·스틱 등 총 2천만원 상당의 제품과 기부금 3천3...", "language": "ko"}, {"title": "정부, 유엔 북한인권 결의안 공동제안국 5년 연속 참여(종합)", "url": "https://www.newsis.com/view/NISX20261105_0003856729", "source": "뉴시스", "published": "2026-11-05T07:47:59+00:00", "summary": "[서울=뉴시스] 박준호 유자비 기자 = 정부가 유엔총회 북한인권 결의안의 공동제안국으로 5년 연속 참여했다. 외교부는 5일 \"우리 정부는 북한주민의 인권을 실질적으로 개선하는 것이 중요하다는 입장이며, 이를 위해 국제사회와 협력을 지속해 나가는 차원에서 금번 북한인권 결의안에 공동제안국으로 참여한다\"고 밝혔다. 외교부는 \"유엔총회 북한인권 결의안이 예년과 마찬가지로 EU에 의해 상정되었으며, 11월 중순경 채택될 것으로 전망된다\"며 18~19일께 결의안이 채택될 예정이라고 전망했다. 이번 북한인권 결의안에는 우리측 제안을 통해 남북", "language": "ko"}, {"title": "靑, 미 중간선거 결과에 \"한미동맹 초당적 지지로 굳건…행정부·의회와 긴밀 소통\"", "url": "https://www.newsis.com/view/NISX20261105_0003856800", "source": "뉴시스", "published": "2026-11-05T07:46:40+00:00", "summary": "[서울=뉴시스] 김지은 김경록 기자 = 청와대는 5일 민주당이 상원과 하원 모두에서 다수당 지위를 확보한 미국 중간선거 결과와 관련해 \"특정한 선거 결과가 한미 동맹에 영향을 미치지는 않을 것이라 본다\"고 밝혔다. 강유정 청와대 수석대변인은 이날 오후 청와대 춘추관에서 열린 브리핑에서 관련 질문에 \"한미 동맹은 70년 이상 미국의 초당적 지지를 받으면서 굳건히 발전해온 관계\"라며 이같이 말했다. 강 수석대변인은 \"정부는 한미 동맹의 지속적인 발전을 위해 정치 변화 지형을 분석하면서 미 행정부, 의회와 계속 긴밀히 소통하고 협력할 것", "language": "ko"}, {"title": "中왕이, 방중 北김성남과 접견…\"북·중 관계 심화 지속\"", "url": "https://www.newsis.com/view/NISX20261105_0003856624", "source": "뉴시스", "published": "2026-11-05T07:36:35+00:00", "summary": "[베이징=뉴시스]박정규 특파원 = 중국 외교수장이 김성남 북한 노동당 국제비서와 만나 북·중 관계를 지속적으로 심화시키길 바란다는 뜻을 전했다. 5일 중국공산당 중앙대외연락부에 따르면 왕이 중국공산당 중앙정치국 위원 겸 외교부장은 이날 베이징에서 중국을 방문 중인 김 비서 등 노동당 대표단과 접견했다. 왕 부장은 올해 6월 시진핑 중국 국가주석의 방북을 비롯해 최근 시 주석과 김정은 북한 국무위원장의 교류로 북·중 관계가 개선됐다는 점을 들면서 \"양당과 양국 최고 지도자들이 전략적 소통을 심도 있게 진행하고 일련의 중요한 합의를 도", "language": "ko"}, {"title": "국힘, '조작기소 특검법'에 장외투쟁 돌입…7일 경복궁역 집회(종합)", "url": "https://www.newsis.com/view/NISX20261105_0003856769", "source": "뉴시스", "published": "2026-11-05T07:35:48+00:00", "summary": "[서울=뉴시스]하지현 전상우 기자 = 국민의힘이 5일 더불어민주당이 강행 추진하는 이른바 '조작기소 특검법'을 저지하기 위한 장외투쟁에 돌입한다. 오는 7일 서울 경복궁역 인근에서 대규모 집회를 열고, 다음 주에는 청와대 앞에서 현장 최고위원회의와 의원총회를 개최하는 등 대여 투쟁 수위를 높일 방침이다. 최수진 원내수석대변인은 이날 오후 국회에서 의원총회를 마친 뒤 기자들과 만나 원내·장외투쟁 계획을 밝혔다. 국민의힘은 오는 6일 오후 3시께 필리버스터가 종료되면 국회 본관 계단 앞에서 규탄 집회를 개최할 예정이다. 이어 오는 7일", "language": "ko"}, {"title": "[속보]靑, 美 중간선거 결과에 \"한미동맹 초당적 지지로 굳건…영향 미치지 않을 것\"", "url": "https://www.newsis.com/view/NISX20261105_0003856783", "source": "뉴시스", "published": "2026-11-05T07:34:13+00:00", "summary": "후속기사가 이어집니다 \n◎공감언론 뉴시스 kje1321@newsis.com", "language": "ko"}, {"title": "美 중간선거, 한미관계 불확실성 커져…전작권·핵잠 제약 가능성, 트럼프 북미대화 추진할수도", "url": "https://www.newsis.com/view/NISX20261105_0003856292", "source": "뉴시스", "published": "2026-11-05T07:26:13+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 미국 중간선거에서 도널드 트럼프 대통령의 공화당이 패배하고 민주당이 연방 상·하원을 장악하면서 한미관계에도 불확실성이 커졌다는 전망이 나온다. 당장 트럼프 행정부의 대외 정책 기조가 근본적으로 바뀌지는 않겠지만 미 의회의 견제 강화로 전시작전통제권 환수와 핵추진잠수함 건조 등 주요 안보 현안의 추진에 제약이 따를 수 있다는 관측이 제기된다.  미국 민주당은 이번 선거 승리로 청문회와 국정조사, 예산·입법 심사 등을 통해 트럼프 행정부에 대한 견제 수위를 높일 수 있게 됐다. 다만 외교안보 분야에선 백", "language": "ko"}, {"title": "'조작기소 특검법' 국회 본회의 상정…野 필리버스터 돌입", "url": "https://www.newsis.com/view/NISX20261105_0003856726", "source": "뉴시스", "published": "2026-11-05T07:15:42+00:00", "summary": "[서울=뉴시스]하지현 전상우 김윤영 정유진 기자 = 이재명 대통령 관련 사건 등의 조작기소 의혹을 수사하는 이른바 '조작기소 특검법'이 5일 더불어민주당 주도로 국회 본회의에 상정됐다. 국민의힘은 6-11-05T06:04:47+00:00", "summary": "[대구=뉴시스]정재익 기자 = 육군 제50보병사단은 오는 10~12일 대구·경북 일대에서 실제 병력과 장비가 이동하는 기동훈련을 실시한다고 5일 밝혔다. 훈련에는 민간과 행정기관, 군·경찰·소방이 함께 참여한다. 적의 역할을 맡는 대항군을 운용하고 이에 대응하는 방식으로 진행한다. 사단은 유사시 국민의 생명을 보호하기 위해 관계기관이 함께 상황을 대응하는 능력을 높일 계획이다. 50사단 관계자는 \"훈련 기간 병력과 장비 이동에 따른 주민들의 양해와 협조를 부탁드린다\"며 \"거동이 수상한 인물을 발견하면 가까운 군부대나 경찰서, 국번 ", "language": "ko"}, {"title": "조작기소 특검, 文사건까지…\"'李방탄' 비판 피하려 물타기\" 지적도", "url": "https://www.newsis.com/view/NISX20261105_0003856276", "source": "뉴시스", "published": "2026-11-05T05:30:39+00:00", "summary": "[서울=뉴시스]권지원 박선정 기자 = 국회 법제사법위원회가 더불어민주당 주도로 통과시킨 '조작기소 특검법'이 본회의 표결을 앞두고 있다. 이재명 대통령 사건뿐만 아니라 문재인 정부 시절 의혹까지 수사 대상에 추가되면서, 공정성 훼손 등을 우려하는 목소리가 법조계에서 나오고 있다.  조정식 국회의장은 5일 오후 3시 국회 본회의를 열고 민주당이 추진하는 '윤석열 정권 검찰청, 국가정보원, 감사원 등의 조작 수사·조작 기소 등 의혹의 진상규명을 위한 특별검사 임명 등에 관한 법률안'을 상정하기로 했다. ◆李 대통령 관련 의혹 8건…대장", "language": "ko"}, {"title": "국방부, K-MOSA 성과공유회 개최…'신기술 적용 신속화'", "url": "https://www.newsis.com/view/NISX20261105_0003856353", "source": "뉴시스", "published": "2026-11-05T05:30:34+00:00", "summary": "[서울=뉴시스]임승규 기자 = 국방부가 K-MOSA(모듈형 개방형 시스템 접근법) 정책의 주요 성과를 공유하고 향후 발전 방향을 논의하는 행사를 마련했다. 국방부는 5일 서울 용산구 전쟁기념관에서 국방과학연구소와 함께 '2026 K-MOSA 발전을 위한 성과공유회'를 개최했다. K-MOSA(Korea Modular Open Systems Approach)는 표준화된 개방형 인터페이스를 기반으로 무기체계를 모듈화해 새로운 기술과 구성품을 보다 유연하게 적용시키는 기술적 설계이자 사업 전략이다. 이번 성과공유회에서는 ▲K-MOSA 정책", "language": "ko"}, {"title": "\"미군 전우들 부대에 가보고 싶다\"…6·25참전자, 미8군 사령부 방문", "url": "https://www.newsis.com/view/NISX20261105_0003855717", "source": "뉴시스", "published": "2026-11-05T05:26:45+00:00", "summary": "[서울=뉴시스]임승규 기자 = 6·25전쟁 참전유공자들이 평택 캠프 험프리스에 있는 미8군 사령부를 찾았다. 5일 국가보훈부에 따르면 이날 강윤진 보훈부 차관과 6·25참전유공자회 서울지부 회원 30여명이 미8군 사령부를 방문했다. 이번 행사는 지난 9월 유공자회 간담회 당시 \"피땀 흘려 함께 싸웠던 미군 전우들의 부대에 꼭 한 번 가보고 싶다\"라는 참전 유공자들의 의견을 반영해 추진됐다. 강 차관과 유공자들은 이날 오전 미8군 군악대의 연주와 함께 공식 환영 행사에 참석한 후 부대 장병들과 오찬을 가졌다. 이어 미8군 박물관(8A", "language": "ko"}, {"title": "청해부대 임무, 호르무즈 650㎞인 오만 남방까지 확대…초계기·기뢰제거 전력 추가(종합)", "url": "https://www.newsis.com/view/NISX20261105_0003 let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
