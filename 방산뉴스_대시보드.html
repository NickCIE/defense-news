m/view/NISX20261001_0003810584", "source": "뉴시스", "published": "2026-10-01T02:44:11+00:00", "summary": "[서울=뉴시스] 신항섭 정유진 수습 기자 = 시민사회단체와 여야 일부 정당 관계자들이 국군의 날인 1일 국회 본청 앞 계단에서 기자회견을 열고 \"침략전쟁을 지원하는 어떠한 파병도 안 된다\"며 이란전쟁 관련 한국군 파병 반대 결의안 채택을 국회에 촉구했다. '미국 침략전쟁 중단 한국군 파병 반대 긴급행동'은 이날 오전 10시 '미국 침략전쟁 즉각 중단, 한국군 파병 반대 국회-시민사회 공동기자회견'을 열었다.  참석자들은 '파병 반대' 글자가 한 자씩 적힌 현수막과 \"국회는 파병반대 결의안 채택하라\", \"미국은 침략전쟁 중단하라\" 등", "language": "ko"}, {"title": "이 대통령 \"남북 군사긴장 낮추기 위한 조치 일관되게 이어 갈 것…北 신뢰 회복 함께 하길\"(종합)", "url": "https://www.newsis.com/view/NISX20261001_0003810264", "source": "뉴시스", "published": "2026-10-01T02:39:40+00:00", "summary": "[서울=뉴시스] 김지은 조재완 김경록 기자 = 이재명 대통령은 국군의 날인 1일 \"자주국방은 곧 주권\"이라며 \"앞으로 전시작전통제권(전작권) 환수로 그 마침표를 찍어 반세기 동안 이어져 온 그 꿈을 국민과 함께 반드시 실현해 내겠다\"고 밝혔다. 또 국민의 군대 재건 추진을 거론하며 \"앞으로도 군에 의한 불법적 내란이 다시는 일어나지 않도록, 우리 군이 본연의 임무에만 전념할 수 있는 문화와 제도를 정착시켜 나갈 것\"이라고 했다. 이 대통령은 이날 충남 계룡대에서 열린 제78주년 국군의 날 기념식에 참석해 \"가장 확실한 안보는 싸울 ", "language": "ko"}, {"title": "\"드론 잡는 레이저\"…국내 기술 개발 레이저 대공무기 '천광' 실전 요격", "url": "https://www.newsis.com/view/NISX20261001_0003810557", "source": "뉴시스", "published": "2026-10-01T02:28:45+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 국내 독자 기술로 개발된 레이저 대공무기 '천광'이 국군의 날 행사 시연에서 적 드론을 신속하게 격추하며 첨단 방공 성능을 입증했다. 1일 계룡대에서 열린 제78주년 국군의 날 기념식 식후 행사에서 레이저 대공무기 '천광'의 드론 요격 실사격 시연이 진행됐다. 이번 시연은 가상의 적 무인기가 접근하는 상황을 가상해 고출력 레이저를 쏘아 표적을 즉시 무력화하는 방식으로 이루어졌다. 국방과학연구소(ADD) 주도로 개발되어 2024년 말 전력화된 '천광'은 광섬유 기반 고출력 레이저를 표적에 조사해 드론의", "language": "ko"}, {"title": "李대통령 \"군사긴장 낮추는 조치 이어갈것…北 대화복원 함께하길\"", "url": "https://www.yna.co.kr/view/AKR20261001080400001", "source": "연합뉴스", "published": "2026-10-01T02:27:27+00:00", "summary": "(서울=연합뉴스) 임형섭 기자 = 이재명 대통령은 2일 \"남북 관계의 매듭은 복잡하게 얽혀있지만, 앞으로도 인내심을 가지고 차근차근 얽힌 매듭을...", "language": "ko"}, {"title": "전투기 교전 핵심 ‘장거리 공대공 유도탄’ 국산화서 맞붙은 한화·현대로템… 승부처는 ‘고체 덕티드 램제트’ - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxQT2pFUkNRLWE1Z3poWDhXVEpkX1M2X0FWZXBiQUo4QWM4OFVjNmVKNUF0YzFveDgxV01GNVdZZ0ZUWmRQemd2 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
