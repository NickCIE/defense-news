"2026-07-13T02:00:00+00:00", "summary": "[서울=뉴시스]정진형 기자 = 영국의 앤 공주가 우리나라와 영국의 해양 분야 교류와 협력의 역사를 되새기기 위해 부산항을 방문한다. 해양수산부는 오는 14일 부산항에서 영국의 앤 공주를 맞아 한영 간 해양 협력의 의미를 다지는 행사를 연다고 13일 밝혔다. 부산항은 영국과 역사적 인연이 깊은 곳이다. 1797년 영국 해군 프로비던스호를 타고 온 브로턴 함장의 항해일기를 통해 '초산항(Chosan Harbour)'이라는 이름으로 서양에 처음 알려졌다. 개항 초기인 1905년에는 당시 총세무사였던 영국인 맥리비 브라운의 주도로 항로 내", "language": "ko"}, {"title": "'내란 가담 의혹' 강호필 전 육군 지작사령관 구속심사 시작", "url": "https://www.yna.co.kr/view/AKR20260713052000004", "source": "연합뉴스", "published": "2026-07-13T01:18:09+00:00", "summary": "(서울=연합뉴스) 최윤선 기자 = 내란 가담 의혹을 받는 강호필 전 육군 지상작전사령관이 구속 갈림길에 섰다.", "language": "ko"}, {"title": "엔화, 美·이란 대립 격화에 1달러=161엔대 후반 하락 출발", "url": "https://www.newsis.com/view/NISX20260713_0003706425", "source": "뉴시스 경제", "published": "2026-07-13T01:08:27+00:00", "summary": "[서울=뉴시스]이재준 기자 = 엔화 환율은 13일 미국과 이란 간 군사충돌이 재차 격화하면서 엔 매도, 달러 매수 선행으로 1달러=161엔대 후반으로 내려 시작했다. 도쿄 외환시장에서 엔화 환율은 이날 오전 8시30분 시점에 1달러=161.96~161.97엔으로 지난 10일 오후 5시 대비 0.27엔 하락했다. 미국 중부사령부는 13일 새벽 호르무즈 해협을 자유 항행하는 민간 선박과 선원에 대한 공격 능력을 무력화하기 위해 이란에 대한 추가 공격을 개시했다고 발표했다. 전날에는 혁명수비대가 호르무즈 해협 재봉쇄를 선언했다고 이란 매", "language": "ko"}, {"title": "\"임대료 꼼수 인상 막는다\" 관리비·사용료도 신고 포함", "url": "https://www.newsis.com/view/NISX20260712_0003705775", "source": "뉴시스 경제", "published": "2026-07-13T01:00:00+00:00", "summary": "[서울=뉴시스]정진형 기자 = 정부가 관리비나 사용료 명목으로 임대료를 우회적으로 올리는 것을 막기 위한 제도 개선에 나선다. 국토교통부는 오는 14일부터 다음 달 24일까지 이러한 내용을 담은 '민간임대주택에 관한 특별법' 시행령·시행규칙 일부 개정안을 입법예고한다고 12일 밝혔다. 이번 개정안은 관리비와 사용료 명목의 편법 인상을 방지하고 시도의 주택 관리 권한을 강화하는 게 골자다. 개정안에 따르면 앞으로 임대사업자가 임대차계약을 신고할 때 기존 임대료 외에 관리비와 사용료 금액, 또는 산정방식도 반드시 신고해야 한다. 최근 ", "language": "ko"}, {"title": "농기평, 상반기 혁신제품 3건 지정…공공조달 판로 지원", "url": "https://www.newsis.com/view/NISX20260713_0003706317", "source": "뉴시스 경제", "published": "2026-07-13T00:45:02+00:00", "summary": "[세종=뉴시스]임소현 기자 = 농림식품기술기획평가원(농기평)이 인공지능(AI) 자율주행 방제기 등 농식품 분야 혁신제품 3건을 새롭게 지정했다. 지정 제품은 공공조달 시장에 진출할 수 있는 길이 열리면서 초기 판로 확보와 기술사업화에 속도가 붙을 전망이다. 농기평은 2026년 상반기 혁신제품 3건을 신규 지정했다고 13일 밝혔다. 혁 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
