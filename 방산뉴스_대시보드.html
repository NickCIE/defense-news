87달러에 거래되고", "language": "ko"}, {"title": "한미, 16일부터 부산서 통합국방협의체…전작권 전환·조선건조 협력 등 논의", "url": "https://www.newsis.com/view/NISX20260914_0003787973", "source": "뉴시스", "published": "2026-09-14T00:48:25+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 한국과 미국은 이번주 부산에서 연합방위태세 및 국방 현안을 논의하는 정례 차관보급 협의체인 한미 통합국방협의체(KIDD) 회의를 개최한다. 국방부는 16~18일 제29차 KIDD 회의를 연다고 14일 밝혔다. 회의 양측 수석대표는 김홍철 국방부 국방정책실장과 조지 르무어 미국 전쟁부 동아시아부차관보다. 국방부는 \"이번 회의에서 한미는 전시작전통제권(전작권) 전환, 연합방위태세, 조선건조 협력 등 동맹 안보현안 전반에 대해 논의할 예정\"이라고 밝혔다. 이번 회의는 전작권 전환 시기 및 도널드 트럼프 ", "language": "ko"}, {"title": "장동혁 \"李, '용혜인 침투 작전 실패' 사과해야…'김승원 구하기'에 올인\"", "url": "https://www.newsis.com/view/NISX20260914_0003787924", "source": "뉴시스", "published": "2026-09-14T00:30:36+00:00", "summary": "[서울=뉴시스] 이승재 한은진 기자 = 장동혁 국민의힘 대표는 14일 용혜인 성평등가족부 장관 후보자가 자진 사퇴한 데 대해 \"이재명 대통령의 용혜인 침투 작전이 결국 실패했다\"고 말했다. 장 대표는 이날 오전 국회에서 최고위원회의를 열고 \"성난 민심 앞에 이재명 좌파 카르텔이 무릎을 꿇었다. 이 대통령, 인사 참사에 책임지고 사과하기를 바란다\"며 이같이 말했다. 이어 \"용혜인 사퇴만으로 끝날 일이 아니다. 용혜인을 포기한 좌파 카르텔은 더 큰 청구서를 내밀 것\"이라며 \"이참에 가족소득당, 조직소득당을 국회에서 퇴출시켜야 한다. 그", "language": "ko"}, {"title": "넥슨게임즈, 韓문화유산을 신작 '우치'에 구현…관광공사와 맞손", "url": "https://www.newsis.com/view/NISX20260914_0003787892", "source": "뉴시스 경제", "published": "2026-09-14T00:28:55+00:00", "summary": "[서울=뉴시스]이주영 기자 = 넥슨게임즈가 한국관광공사의 사진·영상 자료를 활용해 신작 '우치 더 웨이페어러' 속 조선 판타지 세계를 구현한다. 실제 한국의 자연과 문화유산을 게임 속 배경 제작에 활용한다는 구상이다. 넥슨게임즈는 지난 11일 한국관광공사와 우치 더 웨이페어러 개발 지원을 위한 업무협약을 체결했다고 14일 밝혔다. 우치 더 웨이페어러는 넥슨게임즈의 로어볼트 스튜디오가 개발 중인 트리플A급 싱글 플레이 액션 어드벤처 게임이다. 한국 고전소설 '전우치전'을 모티프로 한 독자적인 이야기를 바탕으로 도사 전우치가 도술을 사", "language": "ko"}, {"title": "진성준 국방위원장 \"민주당 내에도 호르무즈 파병 매우 신중…제3의 방안도 정부 검토\"", "url": "https://www.newsis.com/view/NISX20260914_0003787855", "source": "뉴시스", "published": "2026-09-14T00:23:42+00:00", "summary": "[서울=뉴시스]신재현 기자 = 국회 국방위원장인 진성준 더불어민주당 의원이 14일 호르무즈 해협 파병을 두고 \"민주당 내에도 파병에 매우 신중해야 된다, 또 반대한다고 하는 입장이 상당하게 있다\"고 말했다.  진 의원은 이날 MBC 라디오 '김종배의 시선집중'에서 정부가 호르무즈 해협 파병을 결정해 파병동의안을 국회에 제출할 경우 본회의에서 통과될 가능성을 묻는 진행자 질문에 이같이 답했다.  진 의원은 \"우리 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
