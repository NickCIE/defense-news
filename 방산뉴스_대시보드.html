se", "url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxONHZfbE1ZZkdSMUt1elV2dkx1djR4dUxEbDJPSjdlRUY1NGNNdE5nTmtCeFE5NnFTd05YLWYtMEJFNVNybEFnZ1NpaERrM3RhcU1feWw1dkVKaDdyVlpLSUFDMWxpaVFOVGVHSkxQU3dDQ0NzMFQ5WWJUSC1NZ3prNWFDSkczUGdOblRfWHBLVU4?oc=5", "source": "Breaking Defense (GNews)", "published": "2026-10-23T14:45:33+00:00", "summary": "HD Hyundai, Kiewit unveil plans for new US shipyard    Breaking Defense", "language": "en"}, {"title": "US Air Force wants AI to assist aerial refueling", "url": "https://www.defensenews.com/industry/techwatch/2026/10/23/us-air-force-wants-ai-to-assist-aerial-refueling/", "source": "Defense News", "published": "2026-10-23T14:29:17+00:00", "summary": "The goal is for AI to automatically analyze refueling operations from cameras mounted on the tankers and provide “hot wash” feedback to the tanker crews.", "language": "en"}, {"title": "Leonardo, Rheinmetall secure $4 billion contracts with Italian Army, report says", "url": "https://www.defensenews.com/global/europe/2026/10/23/leonardo-rheinmetall-secure-4-billion-contracts-with-italian-army-report-says/", "source": "Defense News", "published": "2026-10-23T14:10:15+00:00", "summary": "The defense companies secured two contracts with the Italian Army for $4.16 billion for armored vehicles, an Italian financial newspaper reported.", "language": "en"}, {"title": "Saudi missile plant expansion may produce more powerful missiles, study says", "url": "https://www.defensenews.com/global/mideast-africa/2026/10/23/saudi-missile-plant-expansion-may-produce-more-powerful-missiles-study-says/", "source": "Defense News", "published": "2026-10-23T13:57:29+00:00", "summary": "More capable missiles could help Saudi Arabia deter Iranian attacks and make its military more self-reliant, but they risk fueling a regional missile race.", "language": "en"}, {"title": "Natilus secures Air Force contract to develop blended wing body aircraft", "url": "https://breakingdefense.com/2026/10/natilus-secure 보고했다\"고 말했다.  최근 김정은 북한 국무위원장의 사망 가능성을 주장하는 글이 온라인상에서 확산되자 조치를 취한 것으로 보인다.  또 해당 관계자는 \"최근 논란이 되고 있는 MDL(군사분", "language": "ko"}, {"title": "국힘, 軍 남북 군사회담 재차 제의에 \"대북 구걸 회담 즉각 철회해야\"", "url": "https://www.newsis.com/view/NISX20261023_0003839213", "source": "뉴시스", "published": "2026-10-23T09:49:42+00:00", "summary": "[서울=뉴시스] 전상우 기자 = 국민의힘은 23일 국방부 북한에 군사분계선(MDL) 위치를 상호 확인하고 접경지역 우발충돌 방지 방안을 협의하기 위한 남북 군사당국 회담을 공식 제안한 데 대해 \"대북 구걸 회담 제안을 즉각 철회하라\"고 촉구했다. 박충권 수석대변인은 이날 오후 논평을 내고 \"우리 영토의 경계를 도발 주체인 북한과 마주 앉아 맞추겠다는 발상 자체가 명백한 굴종이다\"며 이같이 말했다. 박 수석대변인은 \"군사분계선은 1953년 정전협정으로 이미 명확히 그어진 선이며 그 이남에 지뢰를 매설하는 것은 명백한 정전협정 위반이자", "language": "ko"}, {"title": "대전지역 與의원들, 청와대 찾아 2차공공기관 건의", "url": "https://www.newsis.com/view/NISX20261023_0003839216", "source": "뉴시스", "published": "2026-10-23T09:46:56+00:00", "summary": "[대전=뉴시스] 조명휘 기자 = 더불어민주당 대전지역 국회의원들이 23일 홍익표 청와대 정무수석과 홍지선 국토교통부 장관을 잇따라 만나 2차 공공기관 대전 이전과 철도·국비 지원을 요청했다.  23일 장종태(서구갑) 시당위원장에 따르면 의원들은 이날 홍익표 수석에게 지역구 국회의원 7명이 공동 명의로 작성한 '제2차 공공기관 지방이전 관련 대전지역 국회의원 공동 건의문'을 전달했다. 대전처럼 1차 이전에서 제외된 후발 혁신도시에 대한 형평성 보정 원칙이 반영돼야 하고 R&D·연구관리, 지식재산·기술사업화, 방산·국방과학 등 5대 기", "language": "ko"}, {"title": "노동부 산하기관 국감…'납 노출 은폐'에 '성남라인' 인사 도마에(종합)", "url": "https://www.newsis.com/view/NISX20261023_0003839155", "source": "뉴시스", "published": "2026-10-23T09:38:52+00:00", "summary": "[서울=뉴시스] 고홍주 박정영 기자 = 고용노동부 산하기관을 대상으로 한 국회 국정감사에서 DN오토모티브의 납 노출 은폐 의혹과 공공기관장 '낙하산 인사' 논란을 둘러싼 공방이 벌어졌다. 또 인공지능(AI) 스마트안경을 이용한 국가자격시험 부정행위 문제도 도마에 올랐다. 국회 기후에너지환경노동위원회는 23일 근로복지공단과 한국산업안전보건공단, 한국산업인력공단, 건설근로자공제회 등 노동부 산하 12개 기관을 대상으로 국정감사를 실시했다. 이날 김태선 더불어민주당 의원이 공개한 자료에 따르면 DN오토모티브 1·2공장의 2025년 상·하", "language": "ko"}, {"title": "SNS 막말 논란 박종운 원안위원, 부적절한 언행 인정…\"사과\"", "url": "https://www.newsis.com/view/NISX20261023_0003839204", "source": "뉴시스", "published": "2026-10-23T09:37:38+00:00", "summary": "[서울=뉴시스]심지혜 윤현성 고선영 수습 기자 = 박종운 원자력안전위원회 비상임위원이 국정감사에서 한국과학기술원(KAIST)의 휴머노이드 로봇 시연을 소개한 황정아 더불어민주당 의원을 겨냥한 SNS 막말 논란에 대해 사과했다. 황 의원은 해당 게시글이 자신뿐 아니라 시연을 준비한 연구자와 학생들의 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
