ps://www.newsis.com/view/NISX20260916_0003792777", "source": "뉴시스", "published": "2026-09-16T11:25:20+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한 국방성은 16일 한미 대량살상무기대응위원회(CWMDC)에 반발하며 자국 '핵무력정책법' 발동 요건에 해당하는 것으로 간주할 수 있다고 위협했다. 북한 국방성 대변인은 이날 대외매체 조선중앙통신에 발표한 입장문에서 \"간과할 수 없는 것은 미국과 한국이 그 누구의 '대량살육무기 위협'을 전면에 내걸고 대조선(북한) 군사력 사용을 전제로 하는 연합방위태세의 강화에 대해 떠든 것\"이라고 했다. 대변인은 \"이는 조선반도 유사시 우리 국가에 대한 핵 및 생화학무기 사용을 기정사실화하고 그 실행을 위한 실", "language": "ko"}, {"title": "靑, 3실장 동시교체 보도에 \"결정된 바 없어…추측 기사 신중해달라\"", "url": "https://www.newsis.com/view/NISX20260916_0003792770", "source": "뉴시스", "published": "2026-09-16T11:08:49+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 청와대는 16일 이재명 대통령이 다음 달 중 '청와대 3실장'을 새로 임명하는 인적쇄신 방안을 검토하고 있다는 보도에 대해 \"결정된 바 없다\"고 밝혔다. 청와대는 이날 입장문을 내고 \"인사 관련 사안은 결정된 바 없으며 확인이 어렵다\"고 말했다. 이어 \"추측에 의한 인사 관련 기사에 신중을 기해주시기 바란다\"고 했다. 청와대가 해당 기사를 두고 추측에 의한 것으로 신중 보도를 당부한 만큼 사실상 사실이 아니다는 취지로 부인한 것 아니냐는 해석이 나온다. 이날 한 언론은 여권 관계자를 인용해 이 대통령", "language": "ko"}, {"title": "‘판교 첨단기술을 K-방산으로’…신상진 성남시장 특별공로상 - bzeronews.com", "url": "https://news.google.com/rss/articles/CBMibEFVX3lxTE9TYkgzUU5KYVoybm1WTXV0ZGloMkdjb0tVQnZMUWVPZnVBdkJlV19zdzJsVnZsQ1lJZFZ5OHhXT2xWTmJJOG5SeDNrWk9hTFdVd3NNd29UaHZIVVRlUHkyM01IOTcwRUJiRE93QQ?oc=5", "source": "방산 뉴스", "published": "2026-09-16T10:59:08+00:00", "summary": "‘판교 첨단기술을 K-방산으로’…신상진 성남시장 특별공로상    bzeronews.com", "language": "ko"}, {"title": "강신철 \"사관학교 통합, 인재 키우는데 중요…보완 부분도 보여\"(종합)", "url": "https://www.newsis.com/view/NISX20260916_0003792748", "source": "뉴시스", "published": "2026-09-16T10:23:09+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철 국방부 장관 후보자가 각 군 사관학교 통합 문제와 관련해 \"앞으로 훌륭한 인재를 키우는 데 굉장히 중요한 문제\"라면서도 \"현재 있는 안도 보완해야 할 부분이 개인적으로 보인다\"고 언급했다. 강 후보자는 16일 국회 국방위원회 인사청문회에서 더불어민주당 민홍철 의원의 사관학교 통합 추진 의지에 대한 질문에 이같이 답했다. 그는 육사 출신 예비역 장교들의 강한 반대에 대해 \"비판이나 그런 것에 대해서 생각하는 것보다는, 훌륭한 인재를 만들어 내는 것이 제일 중요하다고 본다\"며 \"개혁에 대한 의지가", "language": "ko"}, {"title": "브런슨 \"韓 방위 대한 미 공약 흔들림 없어…조건 기반 전작권 전환\"(종합)", "url": "https://www.newsis.com/view/NISX20260916_00037 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
