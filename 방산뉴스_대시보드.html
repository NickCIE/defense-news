urce": "뉴시스 경제", "published": "2026-07-17T05:33:16+00:00", "summary": "[세종=뉴시스]박광온 기자 = 미국이 이란 항만을 오가는 선박에 대한 해상 봉쇄를 재개하면서 국내 물가에도 '빨간불'이 켜졌다. 잠시 안정을 되찾는 듯했던 중동 지역의 긴장이 다시 고조되면서 국제유가가 재차 상승하고, 이미 3%대로 올라선 국내 물가를 추가로 끌어올릴 수 있다는 우려가 나온다. 고유가와 고환율이 겹칠 경우 수입물가와 기업의 원가 부담이 커지고, 가공식품·외식비 등 생활물가 전반으로 상승 압력이 확산할 수 있다. 기준금리 인상으로 이자 부담까지 늘어난 상황에서 취약계층과 자영업자의 어려움이 가중될 수 있다는 우려가 나", "language": "ko"}, {"title": "호르무즈 이어 홍해도 막히나…공급 우려에 국제유가 다시 들썩", "url": "https://www.newsis.com/view/NISX20260717_0003713282", "source": "뉴시스 경제", "published": "2026-07-17T04:58:54+00:00", "summary": "[서울=뉴시스]박미선 기자 = 미국과 이란이 걸프 지역에서 공습을 확대하면서 국제유가가 상승했다. 양국 간 휴전이 사실상 무너지며 호르무즈 해협을 통한 원유 수송이 차질을 빚는 가운데, 이란이 예멘 후티 반군에 홍해 항로 봉쇄를 준비하라고 지시했다는 보도까지 나오면서 공급 차질 우려가 커졌다. 17일(현지 시간) 야후 파이낸스에 따르면 브렌트유 선물은 이날 오전 한때 전장보다 0.83% 오른 배럴당 84.93달러를 기록했다. 미국 서부텍사스산원유(WTI) 선물도 1.03% 상승한 배럴당 79.76달러로 전날 하락분을 모두 만회했다.", "language": "ko"}, {"title": "Qatar says Iranian missile attack thwarted, child injured - Reuters", "url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxNSHZqQ2FSa1E2ZG9XdzN0QklxdDlUN0hBLWd0aTVJRUV5YUxlcTVEU1BKbGtRZDhOWjVDeWVFdFo5b1JpdlhUekJIT2FWZjhORlB3REFJUXN0a2s1N2tSejg3QW1SYlE4MHp4WUlXZmMxaHVJM2hoNVJJRkpmejFycWlsOW1JQ2hOYUxMUXpOc1hMX2FJQ1lOSTkyb3l5cHhOcktzaHZNTnJHRm14cXRhVlJB?oc=5", "source": "Reuters", "published": "2026-07-17T02:40:28+00:00", "summary": "Qatar says Iranian missile attack thwarted, child injured    Reuters", "language": "en"}, {"title": "與최고위, 송영길·김용 '전대 출마 제한' 예외 적용…친청 \"위인설제\"(종합)", "url": "https://www.newsis.com/view/NISX20260717_0003713225", "source": "뉴시스", "published": "2026-07-17T02:04:29+00:00", "summary": "[서울=뉴시스] 한재혁 기자 = 더불어민주당 최고위원회의가 17일 송영길 의원, 김용 전 민주연구원 부원장의 '전당대회 출마자격 제한' 논란과 관련 예외를 두기로 결정했다. 민주당은 이날 오후 3시 당무위원회를 열어 이를 최종 결정할 예정이다. 강준현 수석대변인은 이날 서울 여의도 국회에서 열린 비공개 최고위원회의 이후 기자들을 만나 \"어제 있던 송 의원과 김 전 부원장에 대한 피선거권과 관련 최고위가 예외 적용 여부를 두고 찬반 표결을 했다. 결과는 당무위원회로 (해당 사안을) 부의하기로 결정했고 최고위에선 예외를 적용하겠다고 판", "language": "ko"}, {"title": "국힘 \"육·해·공군 사관학교 통합은 군 뿌리 흔드는 도박…李정권 폭주 좌시 않겠다\"", "url": "https://www.newsis.com/view/NISX20260717_0003713222", "source": "뉴시스", "published": "2026-07-17T01:48:36+00:00", "summary": "[서울=뉴시스]김지훈 기자 = 국민의힘은 17일 \"이재명 정부는 육·해·공군 사관학교 통합 폭주를 즉각 중단하라\"고 했다.  박성훈 수석대변인은 논평에서 \"국가 안보의 백년대계를 좌우할 중대한 사안을 공청회 한번 없이 밀어붙이는 이재명 정부의 오만과 독선에 강력한 유감을 표한다\"라며 이같이 말했다.  박 대변인은 \"충분한 연구와 사회적 합의도 없이 하루아침에 없애겠다는 것은 개혁이 아니라 국가 안보를 대상으로 한 무책임한 정치 실험이며, 군의 뿌리를 흔드는 위험한 도박\"이라며 \"정부는 '합동성 강화'와 '미래전 대비'를 명분으로 내", "language": "ko"}, {"title": "스페이스X '스타십' 발사 직전 중단…머스크 \"다음주 초 재도전\"", "url": "https://www.newsis.com/view/NISX20260717_0003713181", "source": "뉴시스 경제", "published": "2026-07-17T01:37:19+00:00", "summary": "[서울=뉴시스]박미선 기자 = 스페이스X가 초대형 우주발사체 '스타십(Starship)'의 시험 발사를 발사 직전 취소했다. 일론 머스크 최고경영자(CEO)는 엔진 이상이 원인이라며 다음 주 초 재발사를 추진하겠다고 밝혔다. 16일(현지 시간) CNBC에 따르면 스페이스X는 미국 텍사스주 남부 스타베이스 발사장에서 스타십 시험 발사를 준비했지만, 발사 직전 자동 중단 시스템이 작동하면서 계획을 취소했다. 머스크 CEO는 엑스(X)를 통해 \"일부 엔진이 시동되지 않아 자동 발사 중단 절차가 작동했다\"며 \"안전한 비행을 위해 랩터 엔진", "language": "ko"}, {"title": "‘Makes no sense’: Firing of Ukraine’s defense minister sparks protests, outcry among allies", "url": "https://www.defenseone.com/policy/2026/07/ukraine-defense-minister-firing-protests/414836/", "source": "Defense One", "published": "2026-07-17T01:04:26+00:00", "summary": "Analysts and former officials said Mikhailo Federov had the clearest thinking on winning the war.", "language": "en"}, {"title": "북 \"림팩에 韓괴뢰들 주력 참가…비례성 대응조치\"", "url": "https://www.newsis.com/view/NISX20260717_0003713182", "source": "뉴시스", "published": "2026-07-17T00:52:57+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한은 17일 미국이 주도하고 한국이 주력으로 참가한 해상훈련 '환태평양훈련'(RIMPAC·림팩)에 대해 \"국제적 망나니들의 무분별한 망동은 이를 단호히 억제 관리하기 위한 지역나라들의 연쇄적인 비례성 대응조치를 초래하게 돼있다\"고 경고했다. 북한 조선중앙통신은 이날 논평에서 림팩이 \"태평양에 정세 격화의 격랑을 몰아오고 있다\"고 했다. 통신은 림팩이 \"아시아태평양 전략 실현에 주되는 장애로 되는 지역의 국가들을 목표로 미국과 그 추종세력이 특별히 벌리는 전쟁 시연\"이라며 \"이번 훈련에 처음으로 한", "language": "ko"}, {"title": "김정은, 방북 왕후닝 접견…\"북중조약, 전략적 방향 제시해 줘\"", "url": "https://www.newsis.com/view/NISX2026071 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
