시스", "published": "2026-08-19T21:22:35+00:00", "summary": "[서울=뉴시스]고재은 김예진 기자 = 도널드 트럼프 미국 대통령은 19일(현지 시간) 연내 김정은 북한 국무위원장과 회담 가능성을 묻는 질문에 그럴 것이라는 답변을 내놓았다. 폭스비즈니스 등에 따르면 그는 이날 김 위원장이 \"매우 강력한 핵무기 57개를 가지고 있다\"며 \"애초에 그렇게 되도록 놔둬서는 안 됐다. 그들은 그렇게 되도록 놔둬서는 안 됐다\"고 밝혔다. CBS뉴스는 미국 대통령이 김정은 북한 국무위원장의 핵무기 보유량에 대해 이처럼 이례적으로 구체적인 평가를 내놓은 것은 드문 일이라고 평가했다. 트럼프 대통령은 그러면서 김", "language": "ko"}, {"title": "EA-37B Flew Along Kaliningrad Border As Part Of “Specialized” Recon, EW Flight Package", "url": "https://www.twz.com/air/ea-37b-flew-along-kaliningrad-border-as-part-of-specialized-recon-ew-flight-package", "source": "The War Zone", "published": "2026-08-19T21:06:53+00:00", "summary": "The USAF's new EA-37B Compass Call electronic warfare jet was part of a larger NATO package that flew along the doorstep of Russia's strategic military outpost. \n The post  EA-37B Flew Along Kaliningrad Border As Part Of “Specialized” Recon, EW Flight Package  appeared first on  TWZ .", "language": "en"}, {"title": "ISA는 되돌리고 부동산세는 당정 테이블로…세제개편 막판 조율", "url": "https://www.newsis.com/view/NISX20260819_0003754899", "source": "뉴시스 경제", "published": "2026-08-19T21:00:00+00:00", "summary": "[세종=뉴시스]임하은 기자 = 정부의 세제개편안이 입법예고를 마치는 가운데 김민석 신임 당대표 체제의 더불어민주당이 비거주 1주택자 과세 강화 등에 제동을 걸지 주목된다. 정부는 개인종합자산관리계좌(ISA)의 납입한도 이월과 계약기간 제한 등 논란이 된 내용을 보완할 방침이다. 반면 종합부동산세와 양도소득세 개편은 법률 개정이 필요한 만큼 당정 협의와 국회 심의 과정에서 수정 여부가 결정될 전망이다. 20일 재정경제부에 따르면 정부가 마련한 11개 세법 개정 법률안의 입법예고는 이날 종료된다. 정부는 접수된 의견을 검토한 뒤 다음 ", "language": "ko"}, {"title": "카드업계, 호우피해 금융지원…청구유예·카드론 이자 감면 등", "url": "https://www.yna.co.kr/view/AKR20260819159800002", "source": "연합뉴스 경제", "published": "2026-08-19T20:55:00+00:00", "summary": "(서울=연합뉴스) 김지연 강류나 기자 = 카드업계가 경남지역 집중호우로 피해를 본 고객을 대상으로 일제히 특별 금융지원에 나섰다.", "language": "ko"}, {"title": "Striveworks to build AI layer for NGC2 at corps level, Army says", "url": "https://breakingdefense.com/2026/08/striveworks-to-build-ai-layer-for-ngc2-at-corps-level-army-says/", "source": "Breaking Defense", "published": "2026-08-19T20:00:00+00:00", "summary": "Striveworks’s models will be able to compress “hours of staff work into seconds,” CEO Jim Rebesco told Breaking Defense.", "language": "en"}, {"title": "이 대통령, 中 왕이 부장 접견…트럼프 대북 메시지 속 북핵문제 논의 주목", "url": "https://www.newsis.com/view/NISX20260819_0003754148", "source": "뉴시스", "published": "2026-08-19T20:00:00+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령이 20일 오전 청와대에서 중국 외교 수장인 왕이 외교부장을 접견한다. 이 자리에서는 한중 관계 발전 방향과 역내 정세 등에 대해 논의가 이뤄질 것으로 보인다. 왕이 부장은 시진핑 중국 국가주석의 메시지도 전할 것으로 예상된다.  이 대통령이 왕이 부장을 접견한 자리에서 북한 문제를 놓고 깊이 있는 논의가 이뤄질지 관심이 쏠린다. 이 대통령은 왕이 부장에 북핵 문제와 관련한 건설적 역할을 요청할 것으로 전망되는데 한반도 정책에 변화가 없다는 태도를 유지해 온 중국이 유의미한 메시지를 내놓", "language": "ko"}, {"title": "[오늘의 주요일정]국회(8월20일 목요일)", "url": "https://www.newsis.com/view/NISX20260819_0003755015", "source": "뉴시스", "published": "2026-08-19T20:00:00+00:00", "summary": "[서울=뉴시스] ◇국회의장 11:00 승진자 임명장 수여식(본관 제4회의실) 11:30 퇴직공무원 포상 수여식(국회 접견실) 12:00 퇴직공무원 오찬간담회(본관 2식당) 13:30 김민석 민주당 대표 접견(의장 집무실) 15:00 본회의(본회의장) ◇본회의 및 위원회 15:00 본회의(본회의장) 10:00 재정경제기획위원회 전체회의(본관 430호) 10:00 국방위원회 전체회의(본관 419호) 10:00 보건복지위원회 예산결산심사소위원회(본관 601호) 10:00 국토교통위원회 예금결산기금심사소위원회(본관 529호) ◇의원실 세미", "language": "ko"}, {"title": "김윤덕·오세훈 오늘 회동…'용산공원 주택 공급' 이견 좁힐까", "url": "https://www.newsis.com/view/NISX20260819_0003754657", "source": "뉴시스 경제", "published": "2026-08-19T20:00:00+00:00", "summary": "[서울=뉴시스] 박성환 기자 = 8·13 공급대책 발표 이후 용산공원 주택공급이 쟁점으로 떠오른 가운데 오늘 김윤덕 국토교통부 장관과 오세훈 서울시장이 직접 만나 서울 내 주택공급 방안을 논의한다. 지난달 24일 비공개 회동 이후 약 한 달 만이다. 용산공원 주택공급 방식을 두고 여전히 양측의 입장 차가 큰 만큼, 이번 회동을 통해 얼마나 이견을 좁힐 수 있을지가 관건이다.  한동안 잠잠했던 양측의 대립은 정부가 서울 용산어린이정원 용지에 청년층을 위한 대규모 임대주택 단지를 조성하는 방안을 적극 검토하면서 최고조에 달하고 있다. ", "language": "ko"}, {"title": "New USS John F. Kennedy Brings Back Key Feature From The Nimitz Class", "url": "https://www.twz.com/sea/future-ford-class-uss-john-f-kennedy-brings-back-key-feature-from-the-nimitz-class", "source": "The War Zone", "published": "2026-08-19T19:15:29+00:00", "summary": "Major radar changes mean 'illuminators' are needed to help Evolved Sea Sparrow Missiles protect the carrier. \n The post  New USS John F. Kennedy Brings Back Key Feature From The Nimitz Class  appeared first on  TWZ .", "language": "en"}, {"title": "Pentagon rebuffed repeated requests for Golden Dome brief: CBO", "url": "https://breakingdefense.com/2026/08/pentagon-rebuffed-repeated-requests-for-golden-dome-brief-cbo/", "source": "Breaking Defense", "published": "2026-08-19T18:55:42+00:00", "summary": "David Mosher, head of the Congressional Budget Office’s National Security Directorate, stressed that the watchdog office was tasked with estimating the price tag for implementing Trump’s January 2025 executive order, not any DoD plans.", "language": "en"}, {"title": "빅터 차 \"트럼프 이란엔 핵 보유 불허…北엔 타협적 접근법 취해\"", "url": "https://www.newsis.com/view/NISX20260820_0003755060", "source": "뉴시스", "published": "2026-08-19T17:47:49+00:00", "summary": "[서울=뉴시스] 김예진 기자 = 도널드 트럼프 미국 대통령이 비핵화를 둘러싸고 북한과 이란에 다르게 접근하고 있는 것은 논리적이라는 분석이 나왔다.  빅터 차 미국 전략국제문제연구소(CSIS) 한국석좌는 19일(현지 시간) 워싱턴포스트(WP)에 기고한 글에서 \"미국의 핵 비확산 정책에서 한 가지 일관된 점이 있다면 바로 일관성이 없다는 것\"이라며 이같이 분석했다.  차 석좌는 리비아 비핵화 이후 미국 정부가 모든 비핵화에 대해 리비아에서 성공한 '완전하고 검증 가능하며 불가역적인 비핵화(CVID)' 모델을 따라야 한다는 견해를 받아", "language": "ko"}, {"title": "트럼프 \"北김정은과 연내 만날 것…그는 57개 핵무기 보유\"(종합)", "url": "https://www.newsis.com/view/NISX20260820_0003755059", "source": "뉴시스", "published": "2026-08-19T17:13:43+00:00", "summary": "[서울=뉴시스] 김예진 기자 = 도널드 트럼프 미국 대통령은 19일(현지 시간) 연내 김정은 북한 국무위원장과 회담 가능성을 묻는 질문에 그럴 것이라는 답변을 내놓았다.  폭스비즈니스에 따르면 그는 이날 김 위원장이 \"매우 강력한 핵무기 57개를 가지고 있다”며 “애초에 그렇게 되도록 놔둬서는 안 됐다. 그들은 그렇게 되도록 놔둬서는 안 됐다\"고 밝혔다.  CBS뉴스는 미국 대통령이 김정은 북한 국무위원장의 핵무기 보유량에 대해 이처럼 이례적으로 구체적인 평가를 내놓은 것은 드문 일이다. 그러면서 그는 김 위원장과 \"매우 잘 지낸다", "language": "ko"}, {"title": "US Navy destroyer spent 4 days without power in South China Sea", "url": "https://www.defensenews.com/news/your-military/2026/08/19/us-navy-destroyer-spent-4-days-without-power-in-south-china-sea/", "source": "Defense News", "publis  방안을 검토했다고 18일(현지 시간) 영국 파이낸셜타임스(FT)가 보도했다. FT는 이란 정권과 가까운 복수의 소식통을 인용해 \"이란군이 불가리아 등 남동유럽 국가에 있는 미군 자산을 공격하는 방안을 검토했다\"고 전했다. 불가리아는 지난달 이란의 반대에도 미군 항공기의 공중 급유를 위해 베즈메르 공군기지 사용을 승인한 바 있다. 한 소식통은 지난 3월 드론 공격으로 피해를 입은 영국 공군 기지가 있는 키프로스도 보복 대상 중 하나로 검토", "language": "ko"}, {"title": "을지연습서 GPS 교란 대응훈련…민·관·군 총출동", "url": "https://www.yna.co.kr/view/AKR20260819048600017", "source": "연합뉴스", "published": "2026-08-19T05:00:02+00:00", "summary": "(서울=연합뉴스) 권하영 기자 = 정부가 을지연습 기간에 맞춰 위성항법장치(GPS) 전파 혼신 상황을 가정한 민·관·군 합동 모의훈련을 실시하고...", "language": "ko"}, {"title": "Defense contractor Lyntris, shareholders raise about $298 million in downsized US IPO​ - Reuters", "url": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxNWFpxLVh5TTU0NE5TeGFNdTBOdVNxV0RZa0hTZHdIM2d4NkIwdjFQOEFmSnZ6bGQ5dkVZRnJDVnFiWWNkQ1R5R0hHbGhfUVpsQUQzY1FmeTM0bzRCSWR0TGV0LXZjOHFITkN0c09YRGJOcUwwM1hMa2p2SEpobkRMSEtNTHlqdjU4T1BERUMzbUIxckM2MnlrMDNTZF81d2xOTGhWUHU0ck1kekpVcEVTSXd0a1JvY3gtUG5ORm43aThkUkZIZ0FyRzVjZ05hZExsWlNMTmItY0t4Rnc?oc=5", "source": "Reuters", "published": "2026-08-19T04:41:00+00:00", "summary": "Defense contractor Lyntris, shareholders raise about $298 million in downsized US IPO​    Reuters", "language": "en"}, {"title": "한국해양과학기술원서 박사학위 받은 콜롬비아 해군 女 장교", "url": "https://www.yna.co.kr/view/AKR20260819095000051", "source": "연합뉴스", "published": "2026-08-19T04:30:25+00:00", "summary": "(부산=연합뉴스) 박창수 기자 = 콜롬비아 해군 여성 장교가 한국해양과학기술원(KIOST)에서 과학 박사 학위를 받았다.", "language": "ko"}, {"title": "한미연합훈련 '반토막'…대비태세 약화·전작권 전환 차질 우려", "url": "https://www.yna.co.kr/view/AKR20260819077300504", "source": "연합뉴스", "published": "2026-08-19T02:58:45+00:00", "summary": "(서울=연합뉴스) 김효정 김철선 기자 = 한반도 전면전을 가정한 전구급 한미연합연습인 '을지 자유의 방패'(UFSS·Ulchi Freedom S...", "language": "ko"}, {"title": "[영상] K9 자주포 첫 미국 수출…미 육군에 차륜형 시제품 공급 계약", "url": "https://www.yna.co.kr/view/AKR20260819086100704", "source": "연합뉴스", "published": "2026-08-19T02:57:06+00:00", "summary": "(서울=연합뉴스) 한화가 국산 무기체계로는 처음으로 세계 최대 방산시장인 미국에 k-9 자주포를 수출하는 쾌거를 이뤘습니다 };

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}
