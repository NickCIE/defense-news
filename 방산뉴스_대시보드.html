0260802_0003733241", "source": "뉴시스", "published": "2026-08-02T12:36:45+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 북한 노동당 기관지 노동신문은 2일 고이즈미 신지로 일본 방위상의 '비핵 3원칙' 재검토 가능성을 시사하는 발언을 두고 \"해외 팽창과 재침에 환장한 일본의 신군국주의세력이 핵보유 야망 실현에 달라붙으려 하는 것은 지역과 세계평화에 대한 노골적인 도전이고 위협\"이라고 보도했다. 노동신문은 이날 '일본은 왜 비핵３원칙'을 수정하려 하는가'라는 제목의 논평에서 \"최근 일본에서 '비핵３원칙'을 수정하려는 움직임이 노골적으로 나타나고 있다\"며 \"역대 일본 당국자들은 겉으로는 '평화국가'를 표방하면서 핵보유금지", "language": "ko"}, {"title": "이 대통령, 4일부터 업무보고 재개…산업부·중기부·교육부 등 점검", "url": "https://www.newsis.com/view/NISX20260802_0003733149", "source": "뉴시스", "published": "2026-08-02T09:04:01+00:00", "summary": "[서울=뉴시스]조재완 기자 = 이재명 대통령이 오는 4일부터 부처 업무보고를 재개한다. 2일 청와대에 따르면, 이 대통령은 4일부터 이틀 간 각 부·처·청·위원회로부터 그간 정책 및 국정과제 이행 상황을 점검한다. 미국·남미 순방을 마무리하고 3일 귀국한 다음 날부터 곧바로 남은 부처들의 업무보고를 받는 것이다.  첫날인 4일에는 오후 2시부터 3시 40분까지 산업부, 지식재산처, 기후에너지부(기상청), 원자력안전위원회가 보고에 나서고, 오후 4시 20분부터 6시까지는 고용노동부, 중소벤처기업부, 공정거래위원회가 보고한다. 이어 5", "language": "ko"}, {"title": "李대통령, 순방 마치면 업무보고 재개…산업·국방·법무부 등", "url": "https://www.yna.co.kr/view/AKR20260802041000001", "source": "연합뉴스", "published": "2026-08-02T08:48:00+00:00", "summary": "(서울=연합뉴스) 고동욱 기자 = 미국·남미 순방을 마치고 돌아오는 이재명 대통령이 이번 주 부처별 업무보고를 재개한다.", "language": "ko"}, {"title": "이 대통령, 독일 프랑크푸르트 도착…동포 오찬간담회로 순방 마무리", "url": "https://www.newsis.com/view/NISX20260801_0003732766", "source": "뉴시스", "published": "2026-08-02T06:50:43+00:00", "summary": "[프랑크푸르트·서울]=뉴시스] 김지은 조재완 기자 = 미국에 이어 남미 3개국 순방을 마친 이재명 대통령이 2일(현지시간) 독일에 도착했다. 이 대통령과 부인 김혜경 여사, 수행단을 태운 공군 1호기는 이날 오전 8시40분께 프랑크푸르트 국제공항에 착륙했다. 우리 측에서는 김은정 주프랑크푸르트총영사, 조윤선 독일남부지역한인회장단협의회장 등이, 독일 측에서는 마르쿠스 도른 헤센주 부의전장과 베네딕트 쿤 헤센주 주총리실장 등이 이 대통령 내외를 맞이했다. 이 대통령은 이날 프랑크푸르트 시내에서 동포 오찬간담회를 한 후 7박 11일 일정", "language": "ko"}, {"title": "조국 \"尹 뜰 때 나는 바닥…7년 만에 엇갈린 운명 뒤집혔다\"", "url": "https://www.newsis.com/view/NISX20260802_0003733015", "source": "뉴시스", "published": "2026-08-02T05:44:40+00:00", "summary": "[서울=뉴시스]김성은 인턴 기자 = 조국 조국혁신당 혁신정책연구원장이 검찰의 수사권과 기소권을 완전히 분리하는 내용을 담은 형사소송법 개정안의 국회 통과를 두고 \"1954년 형사소송법 제정 이후 가장 큰 변화\"라며 검 o"}, {"title": "통상본부장, 美 주 정부 대상 아웃리치…전략적 협력 외연 확대", "url": "https://www.newsis.com/view/NISX20260802_0003732907", "source": "뉴시스 경제", "published": "2026-08-02T01:21:16+00:00", "summary": "[세종=뉴시스]김동현 기자 = 여한구 산업통상부 통상교섭본부장은 지난달 30일(현지시간)부터 미국 오클라호마시티에서 개최된 2026년도 전미주지사협회(NGA) 하계회의에 참석해 미국 주지사 등 주요인사와 업계 등과 면담을 갖고 한미 산업·통상 협력 전반에 대해 논의했다.  먼저 여 본부장은 3일에 걸쳐 11개 주의 주지사들과 연쇄 면담을 갖고 양국 간 활발한 교역·투자 현황을 평가하고 향후 발전 방향에 대해 모색했다.  또 주별로 우리 기업이 진출한 자동차, 배터리, 에너지, 핵심광물, 조선 등 첨단·전략 산업 분야에서 긴밀한 협력", "language": "ko"}, {"title": "인천공항 반경 9.3㎞ 드론 비행 제한…벌금 최대 500만원", "url": "https://www.newsis.com/view/NISX20260802_0003732861", "source": "뉴시스 경제", "published": "2026-08-02T00:55:59+00:00", "summary": "[서울=뉴시스]이종성 기자 = 인천공항 인근 해수욕장과 유원지에서 승인 없이 드론을 날릴 경우 최대 500만원의 벌금이 부과될 수 있어 피서객들의 주의가 요구된다. 인천국제공항공사는 여름 휴가철을 맞아 민·관·군 합동으로 '하계 공항지역 불법드론 비행금지 안내 캠페인'을 진행했다고 2일 밝혔다.  캠페인은 지난달 30일 인천공항 인근 해수욕장 등에서 진행됐다. 인천공항공사와 영종경찰서, 제3경비단, 인천국제공항보안, 지역단체, 한국노인인력개발원 및 영종구 노인인력센터 관계자 등 70여명이 참여했다. 참석자들은 인천공항 인근 해수욕장", "language": "ko"}, {"title": "해군 대전함, 림팩서 '바다의 탑건' 영예…韓 함정 16년만", "url": "https://www.yna.co.kr/view/AKR20260802011100504", "source": "연합뉴스", "published": "2026-08-02T00:22:22+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 해군의 3천100t급 호위함인 대전함(FFG)이 세계 최대 다국적 해상훈련 '2026 환태평양훈련'(RIMPA...", "language": "ko"}, {"title": "김포 한강뷰 '푸르지오 리버프론트', 서울서도 관심…교통편 개선 '과제'[르포]", "url": "https://www.newsis.com/view/NISX20260731_0003732040", "source": "뉴시스 경제", "published": "2026-08-01T22:00:00+00:00", "summary": "[서울=뉴시스] 이연희 기자, 신연경 인턴기자 = \"향산리 허허벌판에 아파트가 들어선다고요?\" \"요즘 김포 부동산 시장 분위기가 좋아서 서울에서 왔어요\" 대우건설이 지난달 31일 경기 김포시 풍무동 일원에 문을 연 '한강 푸르지오 리버프론트' 견본주택에는 가족 단위의 방문객으로 북적였다. 방문객들은 청약 일정 현수막을 촬영하거나 단지 모형도를 살펴보며 동별로 조망권을 비교하는 등 한강변 프리미엄을 꼼꼼히 따지는 모습이었다. 한강 푸르지오 리버프론트는 김포한강로(김포고속화도로)를 끼고 한강변에 지어지는 총 2432세대 규모의 대단지다", "language": "ko"}, {"title": "전북자치도-전주시, 방위사업청 ‘방산혁신클러스터’ 선정 - 쿠키뉴스", "url": "https://news.google.com/rss/articles/CBMiY0FVX3lxTFBDWVJpT2dsWWpKbHFkWS0xQkV4bnhBNDJPNWxrb1pSYjM3R1A2UC1FSWZ1cHpyZFFUZ3lFNW const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
