.com/view/NISX20260728_0003725549", "source": "뉴시스 경제", "published": "2026-07-28T02:58:42+00:00", "summary": "[서울=뉴시스]정진형 기자 = 정부와 지자체, 민간기업이 손을 잡고 충남 서천갯벌을 탄소 흡수원인 '블루카본' 거점으로 복원하는 사업을 추진한다. 해양수산부는 28일 서울 그랜드 인터컨티넨탈 파르나스에서 기아, 충청남도, 서천군, 해양환경공단, 한국해양재단과 함께 '민관협력 서천갯벌 블루카본 생태복원사업' 추진을 위한 6자 간 업무협약(MOU)을 맺었다고 밝혔다. 협약식에는 황종우 해수부 장관, 송호성 기아 대표이사, 박수현 충남지사, 유승광 서천군수, 강용석 해양환경공단 이사장, 김양수 한국해양재단 이사장 등 관계기관의 주요 인사", "language": "ko"}, {"title": "스타링크에 도전장 내민 아마존…모바일 서비스 위성 5000여개 발사 계획", "url": "https://www.newsis.com/view/NISX20260728_0003726099", "source": "뉴시스 경제", "published": "2026-07-28T02:56:11+00:00", "summary": "[서울=뉴시스]고재은 기자 = 아마존이 전 세계 소비자에게 위성 모바일 서비스를 제공하기 위해 5000기 이상 위성을 발사할 계획이라고 미 연방정부에 승인을 요청했다.  일론 머스크가 이끄는 스페이스X의 '스타링크'에 본격 도전장을 내민 것이다. 27일(현지 시간) CNBC 등에 따르면 최근 아마존은 D2D(direct-to-device) 서비스를 제공할 위성 군집의 일환으로 최대 5105기 위성을 발사할 수 있게 승인해 달라고 미 연방통신위원회(FCC)에 요청했다. D2D는 기존 기지국 대신 위성을 통해 스마트폰 등 단말기에 직접", "language": "ko"}, {"title": "아동학대 사망 분석해 재발 방지…국가 차원 특위 꾸린다", "url": "https://www.newsis.com/view/NISX20260728_0003725689", "source": "뉴시스", "published": "2026-07-28T02:46:22+00:00", "summary": "[세종=뉴시스] 강진아 기자 = 국가 차원의 아동학대의심사망사건 분석을 위해 아동학대의심사망사건분석특별위원회를 구성·운영하고 지방자치단체장과 검사의 친권상실 선고의 청구 요건을 법적으로 구체화한다. 보건복지부는 28일 국무회의에서 이 같은 내용의 '아동복지법 시행령' 일부개정령안이 의결됐다고 밝혔다. 아동학대의심사망사건분석특별위원회 구성·운영 등 분석 체계를 규정해 아동학대의심사망사건의 원인 분석과 재발 방지 대책 수립의 법적 근거를 마련한다.  내실 있는 아동학대의심사망사건 분석을 위한 면담, 자료·정보 제출을 이유로 불이익 처우", "language": "ko"}, {"title": "특사단, 페루 신임 대통령에 李 대통령 친서 전달", "url": "https://www.newsis.com/view/NISX20260728_0003726226", "source": "뉴시스", "published": "2026-07-28T02:37:18+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 더불어민주당 민홍철 의원을 단장으로 한 대통령 특사단이 페루를 방문해 지난 27일 케이코 후지모리 페루 신임 대통령을 예방했다고 28일 외교부는 밝혔다.  특사단은 이재명 대통령의 취임 축하 인사와 각별한 안부를 전하고 양국간 우호 협력관계를 한층 발전시켜 나가고자 하는 이 대통령의 의지를 담은 친서를 전달했다.  특사단은 그동안 양국이 구축해 온 정무·경제 협력을 바탕으로 안보·국방 분야까지 협력의 지평을 더 확대해 나갈 것을 제안하고, 공항·철도 등 페루의 주요 인프라 사업에 우리 기업들이 적극 ", "language": "ko"}, {"title": "중동 불안 지속에 '유류 탄력세율 인하' 9월 말까지 연장", "url": "https:/ 설은 거의", "language": "ko"}, {"title": "엔화, 美 기준금리 동향 관망에 1달러=163엔대 후반 하락 출발", "url": "https://www.newsis.com/view/NISX20260728_0003726040", "source": "뉴시스 경제", "published": "2026-07-28T01:28:56+00:00", "summary": "[서울=뉴시스]이재준 기자 = 엔화 환율은 28일 미국 기준금리 동향에 관심이 모아지는 가운데 엔 매도, 달러 매수가 유입하면서 1달러=163엔대 후반으로 내려 시작했다. 도쿄 외환시장에서 엔화 환율은 이날 오전 8시30분 시점에 1달러=163.73~163.74엔으로 전일 오후 5시 대비 0.21엔 하락했다. 연방준비제도(Fed 연준)는 28~29일(현지시간) 열리는 연방공개시장위원회(FOMC)에서 5회의 연속으로 기준금리를 동결한다는 관측이 대체적이다. 다만 시장 일각에서는 연준이 예상 밖으로 기준금리를 인상할 가능성이 없지 않다", "language": "ko"}, {"title": "李대통령, 상파울루 도착…핵심 광물·방산·디지털 협력 확대 모색", "url": "https://www.hankyung.com/article/2026072899337", "source": "한국경제 정치", "published": "2026-07-28T01:13:14+00:00", "summary": "", "language": "ko"}, {"title": "창원시, 국내 최초 100MW급 방산 전용 AI데이터센터 유치 - 철강금속신문", "url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFBhU0VpYkxnT2ZjM0NtX1pRN2FLLXpkTVM5eTBIYjB5dWZ3WUxYSVlkY0ZIQTN5SVVfX0ZreUNydzVQZmYyd2pjakltY20yejJMMmxTNDBtVXJzSlVDdngyMTV3emNvYVJxOEE?oc=5", "source": "방산 뉴스", "published": "2026-07-28T01:08:57+00:00", "summary": "창원시, 국내 최초 100MW급 방산 전용 AI데이터센터 유치    철강금속신문", "language": "ko"}, {"title": "Air Force eyes next-gen engine ‘integration’ by 2030", "url": "https://breakingdefense.com/2026/07/air-force-eyes-next-gen-engine-integration-by-2030/", "source": "Breaking Defense", "published": "2026-07-28T00:30:49+00:00", "summary": "An engine with so-called adaptive turbofan technologies “could” go on the forthcoming F-47 stealth fighter, John Sneden, the chief of the Air Force’s propulsion directorate said, though he emphasized no final decisions have been made.", "language": "en"}, {"title": "Air Force will resume B-52 radar testing with second bomber after deadly crash", "url": "https://www.defenseone.com/defense-systems/2026/07/air-force-will-resume-b-52-radar-testing-second-bomber-following-deadly-crash/415040/", "source": "Defense One", "published": "2026-07-28T00:29:13+00:00", "summary": "“We need to look at our schedule and adjust ublished": "2019-12-19T08:00:00+00:00", "summary": "AI & Robots Crush Foes In Army Wargame    Breaking Defense", "language": "en"}];

const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
