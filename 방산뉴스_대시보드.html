260", "source": "뉴시스", "published": "2026-08-14T02:08:54+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 방위사업청은 14일 HJ중공업 부산 영도조선소에서 대한민국 최전방 해역인 북방한계선을 수호할 신형 고속정(PKMR) '검독수리-B 배치-II 1번함 인도식'을 개최한다고 밝혔다.  차기 고속정 사업인 검독수리-B 사업은 노후화된 참수리급 고속정(PKM)을 대체하는 사업이다. 방사청은 2017년부터 2022년까지 검독수리-B 배치-I 사업을 성공적으로 마무리한 뒤 배치-II 사업에 착수했다.  2025년 진수와 시운전을 거쳐 배치-II 첫 번째 함정을 이날 해군에 인도하게 됐다.  배치-II 함정은 배", "language": "ko"}, {"title": "U.S. to use economic tactics on Iran 'that have never been seen'; Navy works to relieve troubled carrier USS Abraham Lin", "url": "https://www.cnbc.com/2026/08/14/us-iran-war-trump-hormuz-carrier-abraham-lincoln-george-washington.html", "source": "CNBC", "published": "2026-08-14T01:52:07+00:00", "summary": "\"It will be a combination of economic isolation like ‌the world has ​never seen before, ​and ​the continued blockade in ‌the Strait of ​Hormuz,\" Bessent said.", "language": "en"}, {"title": "CNBC Daily Open: An 'indefinite' war, and a record-breaking rally", "url": "https://www.cnbc.com/2026/08/14/us-iran-war-hormuz-ai-south-korea-openai-anthropic-meta-.html", "source": "CNBC", "published": "2026-08-14T01:38:34+00:00", "summary": "Hegseth says the U.S. Navy can blockade Iran for as long as it takes, while Wall Street responded by sending the S&P 500 to another day of record high.", "language": "en"}, {"title": "안규백 장관 \"사관학교 현체제 유지 어려워…국방개혁 박차\"", "url": "https://www.newsis.com/view/NISX20260814_0003749100", "source": "뉴시스", "published": "2026-08-14T01:19:59+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 안규백 국방부 장관이 육·해·공군 사관학교 통합 방침에 변함이 없다고 밝혔다. 최근 육·해·공사 총동창회장들은 안 장관과의 면담 후 \"안 장관이 현 체제를 유지하는 것도 검토하겠다\"고 했는데 이를 부인한 것이다.  안규백 장관은 14일 국방부 청사 이전 후 첫 출근 도어스테핑에서 관련 질문을 받고 \"제가 사관학교를 통합하면서 현 체제를 유지한다는 말을 할 수 있겠나\"며 \"기본적으로 저는 어렵다고 생각한다\"고 말했다.  총동창회 측이 주장해 온 현 체제 유지는 검토 대상이 아니라는 점을 분명히 한 것이", "language": "ko"}, {"title": "안규백 \"현 사관학교 체제 유지한단 말 제가 할 수 있겠나\"", "url": "https://www.yna.co.kr/view/AKR20260814049400504", "source": "연합뉴스", "published": "2026-08-14T01:09:06+00: function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
