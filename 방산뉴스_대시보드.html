27일)을 하루 앞두고 평양에서 경축행사 막바지 준비에 열을 올리고 있다.   북한 대외매체 조선중앙통신은 26일 \"조국해방전쟁 승리 73돌 경축행사가 수도 평양에서 성대하게 진행되게 된다\"고 보도했다.  행사 참석를 위해 전쟁 노병들과 전시공로자들은 전날(25일) 평양에 도착했다.  통신은 \"평양에 도착한 그들을 노동당 중앙위원회 간부들이 평양역과 해당 숙소들에서 따뜻이 맞이했다\"며 \"수도의 거리들에서 시민들과 청소년 학생들이 전쟁", "language": "ko"}, {"title": "상어 출몰이 잦은 이유는…난류성 어종 북상에 포식자도 이동[뜨거워진 동해②]", "url": "https://www.newsis.com/view/NISX20260723_0003720636", "source": "뉴시스 경제", "published": "2026-07-26T00:00:00+00:00", "summary": "[서울=뉴시스] 강세훈 기자, 이우경인턴기자 = 최근 동해안에서 식인 상어로 알려진 백상아리를 비롯해 다양한 종류의 상어가 잇따라 발견되면서 해양 생태계 변화에 대한 우려가 커지고 있다. 동해안에서 상어 출몰이 잦아진 배경에는 기후변화로 인한 해양 생태계 변화가 꼽힌다. 수온 상승으로 과거보다 따뜻해진 동해 해역에 난류성 어종이 북상했고, 먹이를 따라 이동하는 대형 상어의 유입도 늘고 있다. 이에 따라 상어의 활동 범위와 개체 수, 출현 빈도 역시 갈수록 증가하고 있다는 분석이 나온다.  동해안의 상어 출몰은 해마다 증가하는 추세다", "language": "ko"}, {"title": "‘Game of Thrones’ as Ukraine’s president, defense minister split", "url": "https://www.defenseone.com/threats/2026/07/game-thrones-ukraines-president-defense-minister-split/415009/", "source": "Defense One", "published": "2026-07-25T22:34:44+00:00", "summary": "The largest government crisis since 2022 shows Ukrainian reform and democracy efforts are as rough and uneven as democracy itself.", "language": "en"}, {"title": "이 대통령 \"韓반도체 없으면 세계산업 안 돌아가…AI 선도국 꼭 만들 것\"(종합)", "url": "https://www.newsis.com/view/NISX20260726_0003723324", "source": "뉴시스", "published": "2026-07-25T22:25:56+00:00", "summary": "[샌프란시스코·서울=뉴시스] 김지은 김경록 기자 = 미국 샌프란시스코를 방문 중인 이재명 대통령은 25일(현지시간) 현지 교민들과 만나 \" \"인공지능(AI) 시대라는 새로운 시대가 열리고 있는데 대한민국에 정말 진정한 새로운 기회가 왔다고 생각한다\"고 밝혔다. 이 대통령은 이날 샌프란시스코 시내 한 호텔에서 열린 동포 오찬 간담회에서 이같이 말하며 \"대한민국이 빠져서는 안 될, 빠지면 진전할 수 없는 상황을 만들고, 선도자가 되는 그런 대한민국을 꼭 만들어보고 싶다\"고 했다. 이어 \"대한민국을 대체 불가한 나라로 만드는 것이 목표다", "language": "ko"}, {"title": "李 지시에 '공직 감사' 대폭 강화…28개 부처 63명 증원", "url": "https://www.newsis.com/view/NISX20260725_0003722988", "source": "뉴시스", "published": "2026-07-25T21:30:00+00:00", "summary": "[서울=뉴시스] 강지은 기자 = 정부가 공직 사회의 감사 기능을 강화하기 위해 28개 부처에 감사 인력 총 63명을 증원한다.  이재명 대통령이 일 잘하는 공 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
