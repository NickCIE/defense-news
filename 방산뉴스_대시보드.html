, "published": "2026-10-22T08:24:48+00:00", "summary": "[인천·서울=뉴시스] 변해정 이연희 기자 = 김원준 한국공항공사 사장은 22일 불법 드론으로 인한 항공기 운항 차질을 최소화하기 위해 노력하겠다고 밝혔다.  경찰 출신인 김 사장은 이날 인천 영종도 인천공항공사에서 열린 국회 국토교통위원회의 국정감사에서 \"취임 후 경찰과 드론 관련 검거 활동을 강화하도록 요청했고 9월 통계를 보니 지난해 대비 많이 줄었다. 약간의 효과를 보고 있다\"며 이같이 말했다.  그는 \"제주와 김포는 드론 관련 레이더 등이 운영되고 있어 적발·조치 중\"이라며 \"특히 제주의 경우 드론이 심심치 않게 나타나는데 ", "language": "ko"}, {"title": "與, '李대통령 北 변호' 발언 장동혁 명예훼손 고발…\"엄중 처벌\"", "url": "https://www.newsis.com/view/NISX20261022_0003837408", "source": "뉴시스", "published": "2026-10-22T08:21:56+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 더불어민주당은 22일 이재명 대통령을 향해 '조선노동당 대변인이 돼 북한을 변호하고 있다', '불법 송금 영수증이 두려운 것인가' 등 발언을 한 장동혁 국민의힘 대표를 정보통신망법 위반 혐의로 경찰에 고발했다.  민주당 법률위원회는 이날 오후 보도자료를 내고 \"장동혁 국민의힘 당대표가 허위 사실을 적시해 이재명 대통령의 명예를 훼손한 행위에 대해 '정보통신망 이용촉진 및 정보보호 등에 관한 법률' 위반(명예훼손)으로 서울경찰청에 고발했다\"고 했다. 이어 \"장 대표는 (지난) 20일 페이스북 계정에 이", "language": "ko"}, {"title": "한화에어로스페이스, 해군정비창 찾아 근무환경 개선 활동", "url": "https://www.yna.co.kr/view/AKR20261022164900052", "source": "연합뉴스", "published": "2026-10-22T07:56:32+00:00", "summary": "(창원=연합뉴스) 김선경 기자 = 한화에어로스페이스는 22일 경상남도자원봉사센터와 함께 해군정비창을 찾아 근무자와 장병들을 위한 생활환경 개선활...", "language": "ko"}, {"title": "수원 영통 '한화포레나 영흥숲' 전용 66㎡ 1가구 재공급", "url": "https://www.newsis.com/view/NISX20261022_0003837220", "source": "뉴시스 경제", "published": "2026-10-22T07:36:12+00:00", "summary": "[서울=뉴시스]정유선 기자 = 경기 수원시 영통구 '한화포레나 영흥숲' 1가구가 불법행위 재공급 물량으로 다시 나왔다.  22일 한국부동산원 청약홈에 따르면 오는 26일 '한화포레나 영흥숲' 전용 66㎡ 1가구에 대한 특별공급 청약이 진행된다. 한화포레나 영흥숲은 2021년 8월 '한화 포레나 수원원천'이라는 이름으로 분양된 단지다. 지하 2층~지상 20층, 2개동, 총 157가구 규모다. 이번에 공급되는 가구는 불법행위에 따른 재공급 물량이다. 신혼부부 특별공급으로 나오며, 경쟁이 있으면 추첨으로 당첨자를 정한다. 공급가는 5억1", "language": "ko"}, {"title": "법원 \"'계엄버스 탑승'만으로 징계사유 안 돼\"…정학승 정직 취소(종합)", "url": "https://www.newsis.com/view/NISX20261022_0003837262", "source": "뉴시스", "published": "2026-10-22T07:31:22+00:00", "summary": "[서울=뉴시스]이승주 기자 = 12·3 비상계엄과 관련해 정직 처분을 받은 정학승 전 육군 동원참모부장(소장)에 대한 징계를 취소해야 한다는 법원 판단이 나왔다. 서울행정법원 행정14부(부장판사 이상덕)는 22일 정 소장이 국방부 장관을 상 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
