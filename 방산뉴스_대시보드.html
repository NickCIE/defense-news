026-08-27T02:01:00+00:00", "summary": "[서울=뉴시스]송연주 기자 = 정부가 '중소기업 지원사업 효율화' 작업을 통해 그간 지적돼왔던 소액 나눠주기식 지원을 중단·축소하고 신성장 분야 기업에 최대 100억원 이상 지원한다.  중소벤처기업부(중기부)는 27일 재정운용전략협의회에서 전 부처의 중소기업 지원사업 중 유사·중복 사업, 소액·나눠주기·저성과 사업 등 232개를 효율화해 4조원을 절감하고, 이를 전략 분야에 재투자하기로 했다고 밝혔다. 재투자의 한 축은 신성장 분야 혁신기업이다. 신안보·제약바이오·기후테크·K-소비재를 신성장 분야로 꼽고 중기부와 관계부처가 이 분야", "language": "ko"}, {"title": "휴머노이드 2.3조·피지컬AI 2.8조 투입…中企지원사업 232개 정비", "url": "https://www.newsis.com/view/NISX20260827_0003764633", "source": "뉴시스 경제", "published": "2026-08-27T02:00:00+00:00", "summary": "[세종=뉴시스]여동준 기자 = 정부가 2030년까지 휴머노이드 생태계에 2조3000억원, 8대 분야 피지컬 인공지능(AI) 실증에 2조8000억원을 투입한다. 중소기업 지원사업 232개를 통폐합·감액해 약 4조원을 절감하고 이를 성장성이 높은 사업에 다시 투자한다. 기획예산처는 27일 서울 예금보험공사에서 박홍근 기획처 장관 주재로 제2차 재정운용전략협의회를 열고 이 같은 내용의 초격차 산업 육성 방안을 확정했다.  박 장관은 \"글로벌 AI 시장이 피지컬 AI와 휴머노이드 중심으로 재편되고 있다\"며 이를 우리 경제의 다음 성장엔진으", "language": "ko"}, {"title": "[올댓차이나] 中 상하이, 2030년까지 전략적 신흥산업 431조원 규모 육성", "url": "https://www.newsis.com/view/NISX20260827_0003764995", "source": "뉴시스 경제", "published": "2026-08-27T01:59:31+00:00", "summary": "[서울=뉴시스]이재준 기자 = 중국 상하이시가 2030년까지 전략적 신흥산업 부가가치를 2조1000억 위안(약 431조원)으로 확대한다.  증권시보와 등신망(騰訊網), 중국신문망은 27일  전날 나온 ‘상하이시 전략적 신흥산업 발전 제15차 5개년 계획(2026∼2030년)'을 인용해 이같이 전했다. 계획에 따르면 상하이시는 2025년 1조4000억 위안이던 전략적 신흥산업 부가가치를 50% 대폭 증대한다는 목표를 세웠다. 아울러 2030년에는 규모 이상 공업의 총생산액에서 전략적 신흥산업이 차지하는 비중을 50% 이상으로 높이기로", "language": "ko"}, {"title": "Russia launches missiles and drones at Ukraine, authorities say - Reuters", "url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxPeU1UU1ZVd3p5WHJVdWxEVEVxVWNzQUh4bnBLUGJFRjhSVDFXUUpFT1JCVlU2aXAwT3E5QVFFNnlkamtnRmtKcVkxQmxVZFNvZzdRallja2gwdG9pOHJXdDNPMWxFSUVjaWhSQ056dTJaSkRtNlUxbUNiZE1BblRrdkhvZ2dsUkJSelZ3OG1JQXJYQjNsa0FmT25ZbDMwYXJOeVE?oc=5", "source": "Reuters", "published": "2026-08-27T01:51:00+00:00", "summary": "Russia launches missiles and drones at Ukraine, authorities say    Reuters", "language": "en"}, {"title": "'모범 군복무' 샤이니 민호, 국방부 유해발굴단 새 홍보대사", "url": "https://www.yna.co.kr/ const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
