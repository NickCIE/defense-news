0818_0003752249", "source": "뉴시스", "published": "2026-08-18T01:24:51+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령은 18일 을지 국가안전보장회의(NSC) 전체회의를 주재해 전시상황을 대비한 국가 총력전 수행 능력과 기관별 전시 전환 절차, 조치사항 등을 점검했다고 강유정 청와대 수석대변인이 서면 브리핑에서 전했다. 이 대통령은 \"싸울 필요가 없는 평화를 만드는 것이 무엇보다 중요하나 최악의 상황도 대비가 필요하다\"며 \"비상사태에 우리 국민을 보호하고 국가안전 보장을 위한 실질적인 연습이 되도록 을지연습을 진행해달라\"고 당부했다. 이어 \"을지연습은 우리 국민의 생명과 안전을 지키는 방어적 성격으로, ", "language": "ko"}, {"title": "李 \"한미동맹 미래 상징할 핵잠 추진 속도…전작권 임기 내 환수 차질없이 추진\"", "url": "https://www.newsis.com/view/NISX20260818_0003752242", "source": "뉴시스", "published": "2026-08-18T01:23:12+00:00", "summary": "[서울=뉴시스]조재완 김경록 기자 = 이재명 대통령은 18일 \"보다 건설적이고 굳건한 한미 동맹의 미래를 상징할 핵 잠수함 사업 추진에 속도를 내주길 바란다\"고 밝혔다.  이 대통령은 이날 오전 청와대에서 주재한 을지1 및 제36회 국무회의에서 \"견고한 한미 동맹, 또 자주적인 국방 역량 강화는 서로 필요 충분 조건이다. 동맹이 굳건해야 안보의 근간이 더 튼튼해질 것이고, 또 우리 자신의 힘을 키워야 동맹으로서의 가치와 필요성도 더 커지게 된다\"며 이같이 말했다. 이 대통령은 한미 연합연습인 '을지 자유의 방패'(UFS)가 시작된 ", "language": "ko"}, {"title": "\"트럼프, '韓 3500억$ 투자 지연' 불만에 UFS 축소 지시\" 폴리티코", "url": "https://www.newsis.com/view/NISX20260818_0003752042", "source": "뉴시스", "published": "2026-08-18T01:12:33+00:00", "summary": "[서울=뉴시스] 김승민 기자 = 도널드 트럼프 미국 대통령이 한국의 3500억 달러(494조2700억원) 규모 대(對)미국 투자가 지연되고 있다는 불만으로 한미연합연습 을지자유의방패(을지프리덤실드·UFS) 축소를 발표했다는 전언이 나왔다. 트럼프 대통령이 언급한 북미대화 추동, 한국의 대이란 전선 참여 거부 등 외교안보적 명분 뿐 아니라, 한국의 투자를 재촉하는 경제적 압박도 주된 목적이었다는 것이다. UFS 개시 전날 훈련 축소를 전격 발표한 배경을 두고 이 같은 해석이 여러 차례 제기되기는 했지만, 실제로 트럼프 행정부 내부 기", "language": "ko"}, {"title": "[속보] 李대통령 \"한미동맹 굳건해야…핵잠 사업 속도내달라\"", "url": "https://www.yna.co.kr/view/AKR20260818056800001", "source": "연합뉴스", "published": "2026-08-18T01:11:36+00:00", "summary": "(", "language": "ko"}, {"title": "[속보]이 대통령 \"전시작전권 임기 내 환수 차질없이 추진…국군사관학교도 흔들림없이 진행\"", "url": "https://www.newsis.com/view/NISX20260818_0003752222", "source": "뉴시스", "published": "2026-08-18T01:10:36+00:00", "summary": "후속기사가 이어집니다", "language": "ko"}, {"title": "국방 R&amp;D 이끌 이공계 장교 뽑는다…과학기술전문사관 43명 모집", "url": "https://www.newsis.com/view/NISX20260818_0003751984", "s z.com/news-features/u-s-military-training-with-south-korea-reduced-over-iran-war-snub", "source": "The War Zone", "published": "2026-08-17T23:13:20+00:00", "summary": "Trump's decision comes amid growing concerns about America's commitment to Asian allies, especially as the standoff with Iran grinds on. \n The post  U.S. Military Training With South Korea Reduced Over Iran War Snub  appeared first on  TWZ .", "language": "en"}, {"title": "'초대형 IPO' 앞둔 엔트로픽, 연환산 매출 92조원…1년새 700%", "url": "https://www.newsis.com/view/NISX20260818_0003751772", "source": "뉴시스 경제", "published": "2026-08-17T22:53:06+00:00", "summary": "[서울=뉴시스]신정원 기자 = 기업공개(IPO)를 추진 중인 미국의 생성형 인공지능(AI) 기업 앤트로픽이 지난달 말 기준 연환산 매출액이 650억 달러(약 92조1000억원)에 달했다고 CNBC가 17일(현지 시간) 보도했다. 정통한 소식통에 따르면 앤트로픽은 지난 주말 투자자들에게 이 같은 수치를 공유했다.  이는 1년 전보다 약 7배 증가한 것으로, AI 클로드(Claude) 기반의 기업용 도구가 시장에서 폭발적인 인기를 끌고 있음을 보여준다.  이번 발표는 엔트로픽이 대규모 기업공개(IPO)를 준비하는 가운데 나왔다.  앤트", "language": "ko"}, {"title": "L3Harris ousts CEO Chris Kubasik over unspecified 'conduct,' stock drops 4%", "url": "https://www.cnbc.com/2026/08/17/l3harris-ceo-chris-kubasik-lhx-defense-mehta.html", "source": "CNBC World", "published": "2026-08-17T22:52:11+00:00", "summary": "Chris Kubasik was ousted as Lockheed Martin's incoming CEO in 2012 after what that company called a \"close personal relationship with a subordinate employee.\"", "language": "en"}, {"title": "트럼프 \"김정은, 대화 요구에 반응했다…우린 서로 이해\"(종합2보)", "url": "https://www.newsis.com/view/NISX20260818_0003751743", "source": "뉴시스", "published": "2026-08-17T22:12:21+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 17일(현지 시간) 김정은 북한 국무위원장이 미국의 대화 요구에 반응을 보였다고 밝혔다. 지난 이틀간 김 위원장과 찍은 과거 사진을 게시하고, 한미 연합군사훈련 축소를 지시해 북미대화 재개에 대한 기대가 높아지는 가운데 실제 북한에서도 호응이 있었다는 의미로 풀이된다. 다만 김 위원장이나 북한이 어느시점에 어떤 반응을 보였는지에 대해서는 함구했다. 또한 한국을 향해서는 이란 전쟁 참전 요구를 거부했다며 불만을 토로했다. 트럼프 대통령은 이날 백악관 집무실에서 '왜 김정", "language": "ko"}, {"title": "美 국방부 “트럼프 한미훈련 축소 지시 적극 이행”… 韓·美 동맹 안보정책 격변 - 조선비즈 - Chosunbiz", "url": "https://news.google.com const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
