: "연합뉴스", "published": "2026-10-21T02:49:42+00:00", "summary": "(서울=연합뉴스) 미 해군이 항공모함 기반의 무인 공중급유기 'MQ-25A 스팅레이'와 약 3천400km 떨어진 실제 항공모함 간의 첫 원격 지...", "language": "ko"}, {"title": "청주 가경 아이파크에 15만명 몰려…올해 전국 최다 청약 기록", "url": "https://www.newsis.com/view/NISX20261021_0003834850", "source": "뉴시스 경제", "published": "2026-10-21T02:39:34+00:00", "summary": "[서울=뉴시스]이종성 기자 = 충북 청주시 흥덕구 가경동 일원에 공급되는 '청주 가경 아이파크 7∙8단지'가 올해 전국에서 분양한 단지 중 가장 많은 1순위 청약 접수 건수를 기록했다. 21일 한국부동산원 청약홈에 따르면, 전날 실시한 청주 가경 아이파크 7∙8단지 1순위 청약 접수 결과 특별공급을 제외한 1235가구 모집에 총 14만9730건이 몰려 평균 121.24대 1의 높은 경쟁률을 기록했다. 단지별로 7단지는 374가구 모집에 7만2777건이 접수돼 194.59대 1, 8단지는 861가구 모집에 7만6953건이 몰려 89.", "language": "ko"}, {"title": "국조실장, '소방 재정 빨대' 발언에 \"적절치 않은 측면 있어\"", "url": "https://www.newsis.com/view/NISX20261021_0003834787", "source": "뉴시스", "published": "2026-10-21T02:13:39+00:00", "summary": "[서울=뉴시스]이인준 기자 = 임기근 국무조정실장은 21일 추미애 경기도지사의 '소방 재정 빨대' 발언 논란에 대해 \"적절치 않은 측면이 있는 것 같다\"고 했다.  임 실장은 이날 오전 국회 정무위원회의 국무조정실 등 국정감사에 참석해 김재섭 국민의힘 의원의 관련 질의에 \"소방재정의 어려움을 표현하고자 하신 말씀\"이라면서도 \"과한 측면이 있는 것 같다\"고 했다.  또 \"국가 전체적인 차원에서 처우 개선과 장비 보강은 이루어질 필요가 있다\"면서 \"소방관에 대해서 중앙정부, 지방정부가 같이 나서서 처우 개선도 하고 소방 장비를 확충해야", "language": "ko"}, {"title": "2년 입찰 퇴출 날벼락…LIG D&A, 방산 수출도 멈추나 - 경제타임스", "url": "https://news.google.com/rss/articles/CBMiU0FVX3lxTE9hR19RcjJPV3M0dGZiRWZUaVF0UmVDNDVYSjlzV1F3RFU5Q0hURzBGY0dKRnJYYTlaTEQtOEdxTTNfMTJhOWp6M01iRFFlUUp2MHJV?oc=5", "source": "방산 뉴스", "published": "2026-10-21T02:09:30+00:00", "summary": "2년 입찰 퇴출 날벼락…LIG D&A, 방산 수출도 멈추나    경제타임스", "language": "ko"}, {"title": "항공·디지털 복합재난 대비…21일부터 이틀간 대응훈련", "url": "https://www.newsis.com/view/NISX20261021_0003834341", "source": "뉴시스 경제", "published": "2026-10-21T02:00:00+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 국토교통부는 21~22일 이틀간 항공 관제시설 장애와 행정 전산망 마비에 따른 복합재산 발생에 대비해 관계기관 합동 대응훈련을 실시한다고 밝혔다.  첫 날인 21일 오후 2시 한국교통안전공단(TS) 본사에서 디지털 재난대응훈련을 벌인다. 이 훈련에는 국토부와 TS를 비롯해 국토지리정보원, 한국국토정보공사, 한국공항공사, 한국도로공사, 국가철도공단 등 관계기관 관계자 약 60명이 참여한다. 훈련은 TS 본사 인근 산불로 가공전선이 단선돼 정전이 발생하고 비상발전기 과부하로 정보통신실에 화재가 나 자동차", "language": "ko"}, {"title": "LIG D&amp;A '2년 입찰 제한' 후폭풍…KF-21 미사일 사업 변수로", "url": "https://www.newsis.com/view/NISX20261021_0003834483", "source": "뉴시스", "published": "2026-10-21T01:36:20+00:00", "summary": "[서울=뉴시스]박현준 기자 = LIG 디펜스&에어로스페이스(LIG D&A)가 방위사업청(방사청)으로부터 24개월 입찰참가자격 제한 처분을 받으면서 KF-21 장거리 공대공 유도탄 개발사업 등 국내 사업 수주에 변수가 생겼다. 21일 업계에 따르면 방사청은 전날 방위사업계약심의위원회를 열고 뇌물 제공과 원가부정 등을 이유로 LIG D&A에 2년간 입찰참가자격을 제한하기로 했다.  LIG D&A는 현재 약 1조9000억원 규모의 KF-21 장거리 공대공 유도탄 사업 체계종합 등 분야에서 제안서 평가 1순위로 선정돼 최종 사업자 선정 절", "language": "ko"}, {"title": "육군, 남수단 한빛부대서 UN PKO기지 최초 '스마트캠프' 준공식", "url": "https://www.newsis.com/view/NISX20261021_0003834637", "source": "뉴시스", "published": "2026-10-21T01:26:32+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 육군은 지난 20일(현지시간) 남수단에 파병된 한빛부대 주둔지에서 유엔 평화유지활동(PKO) 기지 최초로 스마트캠프(Smart Camp) 사업 준공식을 개최했다고 21일 밝혔다. 행사에는 김영석 육군본부 스마트캠프 TF장(대령)과 이정대 한빛부대장(대령), 아그레이 케도고 유엔남수단임무단(UNMISS) 운영·자원관리실장, 이고르 마슬롭스키 종글레이주 행정관 등 한국군과 유엔 관계자들이 참석했다. 스마트캠프는 첨단 정보통신기술(ICT)을 활용해 경계·감시, 통신, 시설관리, 에너지·자원관리 등 기지 운", "language": "ko"}, {"title": "스페이스X·테슬라 합병특위 구성…3조 달러 'AI 공룡' 탄생하나", "url": "https://www.newsis.com/view/NISX20261021_0003834328", "source": "뉴시스 경제", "published": "2026-10-21T01:09:11+00:00", "summary": "[서울=뉴시스]박미선 기자 = 일론 머스크가 이끄는 우주기업 스페이스X와 전기차업체 테슬라가 합병을 검토하고 있다. 합병이 성사되면 기업가치가 3조 달러를 넘는 초대형 인공지능(AI) 기업이 탄생할 전망이다. 20일(현지 시간) 파이낸셜타임스(FT)와 월스트리트저널(WSJ) 등에 따르면 머스크는 이날 스페이스X의 3분기 실적 발표 전화회의에서 양사가 합병 가능성을 논의하기 위한 특별위원회를 각각 구성했다고 밝혔다. 머스크는 \"우리가 사실상 초지능 특이점에 진입한 상황에서 두 회사를 합치는 데 상당한 이점이 있다\"며 \"좋은 생각이라고", "language": "ko"}, {"title": "국힘, 주우크라 대사관 공관원 일부 철수에 \"정부 외교 노선 북·중·러와 결착인가\"", "url": "https://www.newsis.com/view/NISX20261021_0003834543", "source": "뉴시스", "published": "2026-10-21T00:55:24+00:00", "summary": "[서울=뉴시스] 전상우 기자 = 국민의힘은 21일 정부가 주우크라이나 대사관의 공관원 일부를 철수하기로 결정한 데 대해 \"이재명 정부의 외교 노선은 북·중·러와의 결착인가\"라며 비판을 이어갔다. 정점식 원내대표는 이날 오전 페이스북에 \"정부의 외교노선이 서방세계로부터의 이탈과 북·중·러 동맹과의 결착이 아니라면 이와 같은 행태를 설명할 수 없다\"며 이같이 적었다. 정 원내대표는 \"북한군 포로 송환이 공개된 이후 이재명 대통령은 감정적 대응으로 일관했다\"며 \"SNS로 젤렌스키 대통령에게 악담을 퍼붓고, 주우크라이나 대사를 소환하고 급", "language": "ko"}, {"title": "與 \"국힘, 전작권 환수에 철 지난 '억지 색깔론'…안보 불안 조성 중단해야\"", "url": "https://www.newsis.com/view/NISX20261021_0003834520", "source": "뉴시스", "published": "2026-10-21T00:49:25+00:00", "summary": "[서울=뉴시스]정금민 권신혁 기자 = 더불어민주당은 21일 정부의 전시작전통제권(전작권) 전환 논의와 관련한 국민의힘의 비판에 \"안보 불안을 야기하는 것\"이라고 했다. 한병도 원내대표는 이날 국회에서 열린 최고위원회의에서 \"이재명 대통령께서 전시작전통제권의 조기 환수 의지를 다시 한번 분명히 하셨다\"며 \"대한민국의 안보를 우리 스스로 책임지고, 한미동맹 안에서 더욱 주도적인 역할을 수행하겠다는 뜻\"이라고 했다. 이어 \"그런데 국민의힘은 이를 '임기 내 치적 쌓기'라고 깎아내리고, 한미동맹이 흔들릴 것처럼 국민 불안을 부추기고 있다.", "language": "ko"}, {"title": "[특징주] LIG D&A, 방사청 제재 소식에 장 초반 11% 넘게 급락", "url": "https://www.yna.co.kr/view/AKR20261021034500008", "source": "연합뉴스", "published": "2026-10-21T00:06:44+00:00", "summary": "(서울=연합뉴스) 임은진 기자 = LIG디펜스앤에어로스페이스(이하 LIG D&amp;A)가 방위사업청으로부터 제재를 받았다는 소식에 21일 장 ...", "language": "ko"}, {"title": "Military power rising as power of diplomacy falling, diplomats, crisis monitors, allies say", "url": "https://www.defenseone.com/threats/2026/10/military-power-rising-power-diplomacy-falling-diplomats-crisis-monitors-allies-say/416720/", "source": "Defense One", "published": "2026-10-20T23:53:00+00:00", "summary": "America is abandoning the rules, and the allies, it once kept safe.", "language": "en"}, {"title": "Canada, Turkey to agree during Carney visit to deepen defence and energy ties, source says - Reuters", "url": "https://news.google.com/rss/articles/CBMiygFBVV95cUxObWlTeVJJYUVSSnEtekFFRGpHdkdVSVgwczVsS3NSeEdESkYxYWZoVkFJUmNuSUtmcC1ybXB3bFFFTlhDSjhYOFVxblVXZ3dYcHE3MzVYRHJieVYxQXd6VWtQWklwbjRkZzJGMkZnZkhpSzQ4UjI5ZTV4ZUxsUEpHQkhNcVNQczhsaWVLM3c5cUsxblJaMWVMN3diM1p3NWh6UUd2ZzNpQWdUdU5lOG9nN1RoMWFEdXdndzdOdzJMWjB5alFHcWFHNV9R?oc=5", "source": "Reuters", "published": "2026-10-20T23:24:39+00:00", "summary": "Canada, Turkey to agree during Carney visit to deepen defence and energy ties, source says    Reuters", "language": "en"}, {"title": "초광역특구법 살펴보니…'주52시간 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
