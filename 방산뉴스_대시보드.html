"summary": "[서울=뉴시스] 남빛나라 기자 = 김여정 북한 노동당 총무부장이 30일 서부전선 비무장지대(DMZ) 지뢰폭발 관련 책임을 전면 부인하고 '국경선화' 공사를 정당화하면서, 향후 군사분계선(MDL) 일대 긴장이 고조될 수 있다는 우려가 나온다. 김정은 북한 국무위원장의 동생인 김 부장은 이날 조선중앙통신에 담화를 내고 지뢰폭발 사건을 한국의 \"명백한 자작극\"이라고 주장했다. 2050자 분량의 담화는 절반가량이 MDL 일대를 영구적인 국경선으로 바꾸는 이른바 '요새화' 작업 관련 내용이다. 김 부장은 해당 작업을 \"철저한 주권행사\"로 규", "language": "ko"}, {"title": "합참 \"北, 국경선 요새화 등 즉시 중단해야…北 사과 강력히 촉구\"", "url": "https://www.newsis.com/view/NISX20260930_0003808498", "source": "뉴시스", "published": "2026-09-30T01:47:55+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 합동참모본부가 지난 21일 서부전선 비무장지대(DMZ)에서 발생한 지뢰폭발 사고와 관련해 북한의 사과를 강력히 촉구했다.  강현우 합참 작전본부장(육군 중장)은 30일 용산 국방부 청사 브리핑룸에서 가진 현 상황 관련 입장 발표를 통해 \"북한은 우리 정부의 일관된 한반도 평화공존 노력에도 불구하고, 군사분계선 인근 지뢰매설 등 소위 '국경선 요새화'를 지속 추진해 왔다\"고 밝혔다. 그러면서 \"남북 간 접경지역에서 긴장을 고조시키는 원인이 되고 있다\"고 했다.  강 본부장은 \"이는 명백한 정전협정 위반", "language": "ko"}, {"title": "윤상현 \"김여정 자작극 주장 패턴 반복…北 지뢰 폭발 대응 카드 없어\"", "url": "https://www.newsis.com/view/NISX20260930_0003808500", "source": "뉴시스", "published": "2026-09-30T01:45:10+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 윤상현 국민의힘 의원이 비무장지대(DMZ) 지뢰 폭발 사고와 관련해 현 정부의 안보 대응 태세와 군 기강 해이를 강하게 비판했다. 윤 의원은 30일 방송된 채널A '정치시그널'에서 북한 김여정 노동당 부부장이 지뢰 폭발 사고를 '자작극'이라 주장한 데 대해 \"2015년 박근혜 정부 시절 목함지뢰 사건 때도 첫 반응은 자작극, 모약극이었다\"며 \"똑같은 패턴이 반복되고 있다\"고 밝혔다. 윤 의원은 \"그 당시에는 우리가 대북 확성기 방송이라는 큰 카드가 있었고, 사건 발생 일주일도 안 돼 북한 소행임을 발", "language": "ko"}, {"title": "8월 일본 산업생산 1.7%↓…\"자동차 부진에 2개월째감소\"", "url": "https://www.newsis.com/view/NISX20260930_0003808485", "source": "뉴시스 경제", "published": "2026-09-30T01:41:29+00:00", "summary": "[서울=뉴시스]이재준 기자 = 일본 제조업 경기 흐름을 파악할 수 있는 8월 산업생산은 자동차 부진으로 2개월 연속 감소했다. 닛케이 신문과 지지(時事) 통신에 따르면 일본 경제산업성은 30일 8월 광공업 생산지수(2020년=100 계절조정 속보치)가 102.6으로 전월 대비 1.7% 하락했다고 발표했다. 시장에서는 1.7% 상승한다고 보았지만 예상에 반해 떨어졌다. 지진에 따른 가동정지로 인한 자동차 감산등이 영향을 미쳤다.  업종별로는 15업종 가운데 12개가 감소하고 3개는 증가했다. 자동차 공업이 전월에 비해 6.8% 줄었다", "language": "ko"}, {"title": "與 \"'DMZ 폭발' 北 정전협정 위반 규탄…반드시 사과하고 시정해야\"(종합)", "url": "https://www.newsis.com/view/NISX20260930_0003808465", "source": "뉴시스", "published": "2026-09-30T01:41:06+00:00", "summary": "[서울=뉴시스]정금민 김난영 권신혁 기자 = 더불어민주당은 30일 서부전선 비무장지대(DMZ) 폭발 사건과 관련해 \"북한의 정전협정 위반\"이라며 사과를 요구했다. 김민석 민주당 대표는 이날 오전 국회에서 열린 최고위원회의에서 \"DMZ 폭발 사건이 군사분계선 남쪽의 북한 측 지뢰 매설로 밝혀지고 있다\"며 \"북한의 정전협정 위반을 규탄한다\"고 했다. 그는 특히 \"자작극 운운하면서 부인하는 북한 당국의 태도를 더욱 비판하고 규탄한다\"며 \"반드시 사과하고 시정해야 한다\"고 강조했다. 이어 \"우리 군의 대응 조치를 촉구한다\"며 \"윤석열 정부", "language": "ko"}, {"title": "유승민 \"김관진, 北지뢰 도발에 담판…강신철은 양복 차림 최전방”", "url": "https://www.newsis.com/view/NISX20260930_0003808403", "source": "뉴시스", "published": "2026-09-30T01:30:51+00:00", "summary": "[서울=뉴시스]서이현 인턴 기자 = 유승민 전 국민의힘 의원이 29일 서부전선 비무장지대(DMZ) 지뢰 폭발 사고와 관련해 \"2015년 목함지뢰 도발 때 김관진 국가안보실장은 사흘간 담판을 지어 북의 자백과 사과를 받아냈다\"며 정부와 강신철 국방장관의 대응을 비판했다. 29일 유 전 의원은 자신의 페이스북에 \"이재명 정권의 어느 누가 11년 전 김 실장이 해낸 것만큼 할지 똑똑히 지켜보겠다\"고 적었다. 이어 그는 군이 북한군 지뢰일 가능성이 매우 높다는 판단을 내놓기까지 7일 10시간이 걸렸다며 \"그동안 우리 군은 도대체 뭘 한 건", "language": "ko"}, {"title": "나경원 \"北 지뢰 축소·은폐는 이적행위…국민께 사과하라\"", "url": "https://www.newsis.com/view/NISX20260930_0003808278", "source": "뉴시스", "published": "2026-09-30T01:16:11+00:00", "summary": "[서울=뉴시스]이준형 인턴 기자 = 나경원 국민의힘 의원이 최근 발생한 비무장지대(DMZ) 북한 지뢰 폭발 사건과 관련해 정부의 축소·은폐 의혹을 강력히 제기하며 이재명 대통령의 사과와 대북 강경 조치를 촉구했다. 30일 나 의원은 자신의 사회관계망서비스(SNS)를 통해 \"2026년 9월21일 DMZ 북한 지뢰 군 발목절단 참사, 결국 합참도, 국방위 강신철 장관도 이제야 북한의 지뢰, 매립 사실 2가지 모두를 인정하였다\"며 말문을 뗐다.  이어 \"사건 당일부터 인정, 발표할 수 있었던 자명한 사실들이다. 축소·은폐, 북한 두둔하다", "language": "ko"}, {"title": "정부, 최근 5년간 국감 2회 이상 지적사항 전면 점검…309건 개선 완료", "url": "https://www.newsis.com/view/NISX20260930_0003808327", "source": "뉴시스", "published": "2026-09-30T01:09:59+00:00", "summary": "[서울=뉴시스]이인준 기자 = 정부는 국정감사에서 최근 5년간 반복 지적된 사항을 전면 점검하고 제도 및 정책 개선을 추진했다고 30일 밝혔다.  국무총리실에 따르면 정부 부처가 지난 5월부터 국감 대상 소속·산하기관을 포함한 그동안의 국정감사 결과보고서, 국감 회의록 등을 검토·분석한 결과 국감에서 2회 이상 지적된 사항은 131개 부처·기관 총 631건으로 집계됐다.  총리실 조사 결과, 이 중 ▲캄보디아 취업사기·감금 피해 대응 ▲관계성범죄 대책 및 피해자보호 강화 ▲공연 및 스포츠 암표 근절 방안 등 309건은 법령·제도 개", "language": "ko"}, {"title": "김민석 \"北 정전협정 위반·자작극 운운 규탄…반드시 사과·시정해야\"", "url": "https://www.newsis.com/view/NISX20260930_0003808353", "source": "뉴시스", "published": "2026-09-30T01:04:09+00:00", "summary": "[서울=뉴시스] 김난영 권신혁 기자 = 김민석 더불어민주당 대표가 서부전선 비무장지대(DMZ) 폭발 사건에 관해 \"북한의 정전협정 위반을 규탄한다\"고 밝혔다. 김 대표는 30일 오전 국회에서 최고위원회의를 열고 \"DMZ 폭발 사건이 군사분계선 남쪽의 북한 측 지뢰 매설로 밝혀지고 있다\"며 이같이 말했다. 그는 특히 \"자작극 운운하면서 부인하는 북한 당국의 태도를 더욱 비판하고 규탄한다\"며 \"반드시 사과하고 시정해야 한다\"고 강조했다. 이어 \"우리 군의 대응 조치를 촉구한다\"며 \"윤석열 정부 때인 2024년 초에 시작된 북한 측의 이", "language": "ko"}, {"title": "유엔사 \"MDL 이남서 北지뢰 발견…정전협정 위반 판단\"", "url": "https://www.yna.co.kr/view/AKR20260930051500504", "source": "연합뉴스", "published": "2026-09-30T01:02:35+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 유엔군사령부는 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 한국군과 합동 현장조사를 실시하는 과정에...", "language": "ko"}, {"title": "국힘 \"김여정, 지뢰사고 '자작극' 매도 적반하장…대통령은 어디에 있나\"", "url": "https://www.newsis.com/view/NISX20260930_0003808335", "source": "뉴시스", "published": "2026-09-30T01:01:54+00:00", "summary": "[서울=뉴시스] 이승재 기자 = 국민의힘은 30일 김여정 북한 노동당 총무부장이 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 '자작극'이라는 입장을 낸 데 대해 \"대한민국 대통령은 어디에 있나\"라고 했다. 박충권 수석대변인은 이날 논평에서 \"이재명 대통령은 '음모론'을, 국방부를 감시해야 할 진성준 국방위원장은 '상해할 목적으로 심었다고 단정하기 어렵다'며 북한의 입장을 대변하는 듯한 태도를 보였다\"며 이같이 말했다. 박 수석대변인은 \"마치 입을 맞춘 듯 김 부장은 담화에서 이번 사고를 '자작극'이라 매도하며 적", "language": "ko"}, {"title": "실손보험 청구전산화 연계율 47%…\"미연계 시 과태료 부과 검토\"", "url": "https://www.yna.co.kr/view/AKR20260930049400002", "source": "연합뉴스 경제", "published": "2026-09-30T01:00:01+00:00", "summary": "(서울=연합뉴스) 강수련 기자 = 금융위원회가 실손보험 청구 전산화 제도 활성화를 위해 미연계 의료기관과 전자의무기록(EMR) 업체에 과태료를 ...", "language": "ko"}, {"title": "통일연구원 \"북한에 '무관심' 응답 70.3%…'통일 필요' 48.2%\"", "url": "https://www.newsis.com/view/NISX20260930_0003807978", "source": "뉴시스", "published": "2026-09-30T01:00:00+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 우리 국민 10명 가운데 7명은 북한에 무관심하다고 응답했다는 국책연구기관 여론조사 결과가 나왔다.  국무총리실 산하 경제인문사회연구회(경인사) 소속 통일연구원(KINU)이 30일 공개한 '2026년 통일의식조사'를 보면 '북한에 대해 얼마나 관심이 있느냐'는 질문에 70.3%가 무관심하다고 답했다. 지난해와 비교해 2.2%p 상승한 수치다. 2015년 조사를 시작한 이후 해당 항목에서 무관심 답변이 70%를 넘은 것은 이번이 처음이다.  연구원은 \"상대적으로 북한에 대한 무관심은 남북 관계 변화와", "language": "ko"}, {"title": "김여정, 'DMZ 北지뢰' 軍 발표 부인…\"韓 실사격하면 가차 없는 보복\"(종합)", "url": "https://www.newsis.com/view/NISX20260930_0003808301", "source": "뉴시스", "published": "2026-09-30T00:49:45+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 김여정 북한 노동당 총무부장은 30일 서부전선 비무장지대(DMZ)에서 폭발한 지뢰가 북한 것일 가능성이 높다는 한국 군 발표를 전면 부인하며 \"만약 남북국경 영구화 공사를 진행하는 우리 군인들을 향해 한국 군깡패들이 경고사격이 아닌 실지사격을 가해온다면 우리 국경부대들은 즉시적이고 가차없는 보복을 가할 것\"이라고 위협했다. 김 부장은 이날 조선중앙통신에 '도발의 장본인들은 자작 광대극의 대가를 각오해야 할 것이다' 제목의 담화를 냈다. 우리 군 당국이 28일 합동참모본부와 유엔사 군정위원회 현장조사", "language": "ko"}, {"title": "유엔사 \"MDL 이남서 北지뢰 1발 발견…지뢰폭발 사고 정전협정 위반\"", "url": "https://www.newsis.com/view/NISX20260930_0003808302", "source": "뉴시스", "published": "2026-09-30T00:48:31+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 유엔군사령부가 지난 21일 서부전선 비무장지대(DMZ)에서 발생한 지뢰폭발사고와 관련해 정전협정 위반이라고 판단했다.  유엔사는 30일 입장문을 내고 \"대한민국 군과 협조해 21일 DMZ에서 발생한 지뢰 폭발 사고와 관련해 합동 현장조사를 실시했다\"고 밝혔다.  이어 \"현장조사 과정에서 군사분계선(MDL) 이남 대한민국 측 지역에서 북한 대인지뢰 1발을 발견했다\"며 \"조사 결과를 바탕으로 유엔사는 정전협정 위반이 발생한 것으로 판단했으며, 확립된 정전협정 체계에 따라 조치하고 있다\"고 설명했다.  유", "language": "ko"}, {"title": "\"日육상자위대 수장, 17년만 방한…육군참모총장과 회담\"", "url": "https://www.newsis.com/view/NISX20260930_0003808149", "source": "뉴시스", "published": "2026-09-30T00:43:58+00:00", "summary": "[서울=뉴시스] 김예진 기자 = 일본의 육상자위대의 수장 아라이 마사요시(荒井正芳) 육상막료장(육군참모총장 격)이 지난 29일 한국을 방문했다고 일본 공영 NHK가 보도했다.  NHK에 따르면 아라이 막료장은 29일 오후 한국 김포공항을 통해 입국했다.  일본 육상막료장이 한국을 공식 방문하는 것은 2009년 이후 17년 만이다. 이번 방문은 한국 육군의 초청으로 이뤄졌다고 NHK는 전했다.  관계자에 따르면 아라이 막료장은 30일까지 한국에 머물며 김규하 육군참모총장과 안보 환경 및 방위 협력 등에 대해 의견을 교환할 계획이다. ", "language": "ko"}, {"title": "The military may be top-heavy. Don't make things worse with hasty cuts.", "url": "https://www.defenseone.com/ideas/2026/09/hegseth-military-cut-generals-admirals/416326/", "source": "Defense One", "published": "2026-09-30T00:31:00+00:00", "summary": "Congress should closely monitor Hegseth’s latest effort to reduce the number of generals and admirals.", "language": "en"}, {"title": "What Boeing’s New Rend const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
