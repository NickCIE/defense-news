0-17T03:14:29+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 북한이 인공지능(AI) 기술을 도입한 신형 초고속 정밀유도 어뢰무기체계 '잠-2.0' 실탄을 시험발사했다. 조선중앙통신은 \"국방과학원과 미사일총국, 수뢰무기연구국은 15일 신형어뢰무기체계의 기술적갱신성과를 확증하기 위해 어뢰수중시험발사를 진행했다\"고 17일 보도했다. 통신은 \"해당 시험은 무기체계들의 기술고도화를 위한 국방과학연구기관들의 정상적인 활동의 일환이다\"라며 \"시험을 참관한 국방과학연구부문의 지도간부들은 이번 시험이 해군의 실질적발전에서 중대한 변화를 예고하는 커다란 성과로 된다고 확신했다\"", "language": "ko"}, {"title": "250만명에 카톡·사흘 연속 농촌으로…세종청사에선 못 찾는 송미령", "url": "https://www.newsis.com/view/NISX20261016_0003829033", "source": "뉴시스 경제", "published": "2026-10-17T00:00:00+00:00", "summary": "[세종=뉴시스]임소현 기자 = 농업인 250만명에게 카카오톡 메시지를 보내고, 경남 함양에서 전북 무주를 거쳐 경북까지 사흘 연속 농촌으로 발걸음을 옮겼다. 마을 이장부터 군수, 일선 조사원까지 만나는 사람도 다양했다.  농지 전수조사를 둘러싼 농촌의 불안을 달래기 위해 송미령 농림축산식품부 장관이 현장을 찾아 농민들의 이야기를 듣고 있다. 정부의 후속조치를 설명하는데 그치지 않고, 농촌의 복잡한 현실을 직접 확인해 제도 개선에 반영하겠다는 취지다.  17일 농식품부의 농지 전수조사 추진 경과 자료와 간담회 내역을 종합하면 송 장관", "language": "ko"}, {"title": "北, 신형 어뢰무기 시험 발사…\"유도기능에 인공지능 기술 도입\"", "url": "https://www.newsis.com/view/NISX20261017_0003829837", "source": "뉴시스", "published": "2026-10-16T22:12:46+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 북한이 인공지능(AI) 기술을 도입한 신형 초고속 정밀유도 어뢰무기체계 '잠-2.0' 실탄을 시험발사했다.  조선중앙통신은 \"국방과학원과 미사일총국, 수뢰무기연구국은 15일 신형어뢰무기체계의 기술적갱신성과를 확증하기 위해 어뢰수중시험발사를 진행했다\"고 17일 보도했다.  통신은 \"해당 시험은 무기체계들의 기술고도화를 위한 국방과학연구기관들의 정상적인 활동의 일환이다\"라며 \"시험을 참관한 국방과학연구부문의 지도간부들은 이번 시험이 해군의 실질적발전에서 중대한 변화를 예고하는 커다란 성과로 된다고 확신했", "language": "ko"}, {"title": "F-22 Pilot Controls FQ-44 Fighter Drone From The Cockpit For The First Time", "url": "https://www.twz.com/air/f-22-pilot-controls-fq-44-fighter-drone-from-the-cockpit-for-the-first-time", "source": "The War Zone", "published": "2026-10-16T21:25:22+00:00", "summary": "This is a key milestone as F-22s will be the Air Force's first aerial 'quarterbacks' for Collaborative Combat Aircraft drones. \n The post  F-22 Pilot Controls FQ-44 Fighter Drone From The Cockpit For The First Time  appeared first on  TWZ .", "language": "en"}, {"title": "[오늘의 주요일정]정치(10월17일 토요일)", "url": "https://www.newsis.com/view/NIS const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
