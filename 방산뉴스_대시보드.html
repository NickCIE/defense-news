.com/view/NISX20260909_0003782764", "source": "뉴시스 경제", "published": "2026-09-09T22:40:00+00:00", "summary": "[세종=뉴시스]임소현 기자 = 정부가 공급 과잉으로 공실이 급증한 지식산업센터를 오피스텔과 임대주택 등으로 전환할 수 있도록 규제를 완화한다. 기존에 허용된 업종만 입주할 수 있었던 규제도 제한 업종을 제외하고 모두 입주할 수 있는 네거티브 방식으로 바꾼다. 산업통상부는 10일 관계부처 합동으로 이 같은 내용의 '지식산업센터 공실 대책 및 제도개선 방안'을 발표했다. 전국에서 설립 승인을 받은 지식산업센터는 지난 5월 기준 1553개다. 이 가운데 최근 3년간인 2023~2025년 준공된 153곳의 평균 공실률은 43.5%, 미분양", "language": "ko"}, {"title": "‘Truly concerns me’: DAWG director warns funding lapse could kill ‘momentum’ - Breaking Defense", "url": "https://news.google.com/rss/articles/CBMirAFBVV95cUxNRkpZb2xteDFLQkVDRTU4NC1rVGtHc0RDSE52ZzJrVUZ4VGRLMGM4QlRMcmRkTS1XSmh4eGY1MzVRRmpBRmxpR0FVQmJLRTVYQ3I3eHptU01SQWh1eTVpcFpfM3cwbFpJZUl6ZUQ5dnRabVRIV3ltbWNIOGJJUWh0T2ZHaE9pUFhXM0dQM0pQM0hTbHV2d01feEVzQkdTeVlWYVZ4MHFkQzZmcXhj?oc=5", "source": "Breaking Defense (GNews)", "published": "2026-09-09T22:03:53+00:00", "summary": "‘Truly concerns me’: DAWG director warns funding lapse could kill ‘momentum’    Breaking Defense", "language": "en"}, {"title": "\"김주애, '신'의 반열 올랐다\"…탈북 외교관이 밝힌 北 승계의 진실", "url": "https://www.newsis.com/view/NISX20260909_0003782247", "source": "뉴시스", "published": "2026-09-09T21:10:00+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 북한이 김정은 국무위원장의 딸 김주애를 조기 조명하며 후계 세습 메시지를 대내외에 명확히 전달하고 있다.  지난 2023년 탈북한 리일규 전 쿠바 주재 북한대사관 참사는 9일 유튜브 채널 '머니인사이드'에 출연해 김주애의 위상 변화와 북한의 권력 승계 구조를 상세히 지적했다.  리 전 참사는 \"김주애를 처음부터 후계자로 보지는 않았다\"면서도 \"사랑하는 자재분에서 존경하는 자재분으로 호칭이 바뀌고 수령을 대하는 듯한 우상화 시스템이 작동하는 것을 보며 후계자 준비 과정을 느꼈다\"고 말했다. 북한에서 여", "language": "ko"}, {"title": "10∼11일 전북 남원서 최신 측량기술 겨룬다", "url": "https://www.newsis.com/view/NISX20260909_0003782886", "source": "뉴시스 경제", "published": "2026-09-09T21:00:00+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 국토교통부는 10~11일 양일간 전북 남원 종합스포츠타운에서 '2026년 국토정보 챌린지 지적·드론측량 경진대회'를 개최한다고 밝혔다.  이 대회는 지적·드론측량 분야의 최신 기술을 익히고 실력을 겨루는 자리로 올해로 7회째를 맞는다. 지적측량과 드론측량 부문으로 나눠 진행되며 약 300명이 참가할 예정이다. 지적측량은 위성 신호를 수신해 측정하는 위성항법시스템(GNSS) 등 첨단 기술·장비를 활용하는 측량기술을 평가한다. 드론측량은 저고도 드론을 활용해 토지 경계 및 형상 등을 측정한 결과·정확성에", "language": "ko"}, {"title": "'환경오염물질 배출업소 관리' 우수 관리사례 전국 확산", "url": "https://www.newsis.com/view/NISX20260909_0003783006", "source": "뉴시스 경제", "published": "2026-09-09T21:00:00+00:00", "summary": "[세종=뉴시스]이수정 기자 = 정부와 지방자치단체가 매년 5만1000여개 환경오염물질 배출 사업장을 단속하는 가운데, 현장의 우수 관리사례를 발굴해 전국으로 확산한다. 기후에너지환경부는 10일 서울 용산구 나인트리프리미어로카우스에서 '2026년 배출업소 환경관리 경진대회'를 개최한다고 밝혔다. 환경오염물질 배출업소 관리는 지난 2002년 중앙정부에서 지방정부로 위임됐다. 미세먼지와 악취, 소음 등으로부터 국민의 건강과 안전을 보호하기 위해 기후부와 지방정부가 협력해 관리하고 있다. 최근 3년간 기후부와 지방정부는 합동단속과 계절별 ", "language": "ko"}, {"title": "Where Are The Aircraft Carriers?: September 9, 2026", "url": "https://www.twz.com/sea/where-are-the-american-aircraft-carriers-september-9-2026", "source": "The War Zone", "published": "2026-09-09T20:49:19+00:00", "summary": "The Navy is applying lessons learned from recent marathon carrier cruises to the USS Theodore Roosevelt, which conducted an unreported maintenance availability ahead of deployment. \n The post  Where Are The Aircraft Carriers?: September 9, 2026  appeared first on  TWZ .", "language": "en"}, {"title": "與 내부 커지는 '파병 신중론'…오늘 외교안보 대정부질문 주목", "url": "https://www.newsis.com/view/NISX20260909_0003783103", "source": "뉴시스", "published": "2026-09-09T20:00:00+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 더불어민주당 내에서 정부의 호르무즈 해협 파병 검토 움직임과 관련한 신중론이 커지는 모습이다. 범여권에서는 일찌감치 '파병 반대' 목소리를 낸 가운데, 일부 당에서는 10일 청와대를 찾아 '파병 거부' 1인 시위를 진행한다.  당초 민주당은 파병 검토 문제에 대한 공개적인 입장 표명이나 개인 의견 개진을 자제하는 분위기였으나, 한·프 정상회담에서 호르무즈 해협 협력 기조가 확인되고 국방부가 현지 조사단을 파견하면서 점차 공개 우려 목소리가 나오는 모양새다. 민주당에서는 김병주, 송영길 의원이 전날 공", "language": "ko"}, {"title": "[오늘의 주요일정]국회(9월10일 목요일)", "url": "https://www.newsis.com/view/NISX20260909_0003783362", "source": "뉴시스", "published": "2026-09-09T20:00:00+00:00", "summary": "[서울=뉴시스]  ◇국회의장 11:00 청년의정 현판식(국회 소통관 332-1호) 14:00 본회의-대정부질문(외교통일안보)(본회의장) ◇본회의 및 위원회 14:00 본회의-대정부질문(외교통일안보)(본회의장) 10:00 국방위원회 전체회의(본관 419호) 11:00 성평등가족위원회 전체회의(본관 550호) ◇의원실 세미나 07:30 박민규 의원실 등, 국내 모험자본은 왜 인내하지 못하는가?(의원회관 제5간담회의실) 07:30 이헌승 의 한 배럴당 94.66달러를 기록", "language": "ko"}, {"title": "'계엄 가담 의혹' 군 장성, 징계 취소 소송 시작…\"무혐의인데 파면\"", "url": "https://www.newsis.com/view/NISX20260909_0003783071", "source": "뉴시스", "published": "2026-09-09T07:54:18+00:00", "summary": "[서울=뉴시스]이윤석 기자 = 12·3 비상계엄에 연루됐다는 의혹으로 국방부로부터 중징계를 받은 이승오 전 합참 작전본부장이 특검에서 무혐의 처분을 받았는데 파면 처분을 받은 것은 부당하다고 주장했다. 서울행정법원 행정10부(부장판사 정은영)는 9일 이 전 본부장이 국방부 장관을 상대로 제기한 파면 처분 취소 소송 1차 변론기일을 진행했다. 이 전 본부장 측은 '평양 무인기 작전'에서 이 전 본부장이 어떤 역할을 했는지 알기 위해 관련 재판 판결문을 비공개로 심리해줄 것을 요청했다. 국방부 측은 해당 재판의 내용이 군사 기밀에 해당", "language": "ko"}, {"title": "[영상] 8년 전 호위함 통했나…한화오션, 태국 차세대호위함 우선협상자", "url": "https://www.yna.co.kr/view/AKR20260909153300704", "source": "연합뉴스", "published": "2026-09-09T07:47:48+00:00", "summary": "(서울=연합뉴스) 한화오션이 태국 왕립해군의 차세대 호위함 도입 사업 우선협상대상자로 선정됐다고 9일 밝혔습니다.", "language": "ko"}, {"title": "외교부 \"네팔 당국 수색·구조 종료 단계 전환…韓 긴급구호대, 9일 오전 수색 안 해\"", "url": "https://www.newsis.com/view/NISX20260909_0003783083", "source": "뉴시스", "published": "2026-09-09T07:47:24+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 네팔 대홍수로 연락이 두절된 한국인 9명에 대한 수색이 별다른 성과를 내지 못한 가운데 현지에 파견된 대한민국 해외긴급구호대(KDRT)는 9일 오전 별도의 수색 활동을 진행하지 않았다. 외교부는 이날 \"네팔 측의 수색·구조 종료 단계 전환 등을 감안해 이날 오전 수색 활동 계획은 없다\"라고 밝혔다.  네팔 당국은 사고 현장에 투입했던 군 병력과 헬기를 상당수 철수하는 등 홍수 피해 대응의 무게 중심을 수색·구조에서 복구·재건으로 옮기고 있는 것으로 알려졌다.  네팔군의 협조를 받아 활동해온 KDRT도", "language": "ko"}, {"title": "합참의장, 주한미군사령관과 동부전선 GP·GOP 연합방위태세 점검", "url": "https://www.newsis.com/view/NISX20260909_0003782998", "source": "뉴시스", "published": "2026-09-09T07:43:51+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 진영승 합동참모의장이 9일 제이비 브런슨 유엔사·한미연합사·주한미군사령관과 함께 동부전선 최전방 GP(감시초소)와 GOP(일반전초) 부대를 찾아 군사대비태세를 점검했다. 진 의장과 브런슨 사령관은 이날 동부전선 GP와 GOP를 방문해 비무장지대(DMZ) 작전 상황을 확인하고 최전방 경계작전태세를 점검했다. 특히 GP에서는 최근 북한군의 군사분계선(MDL) 일대 근접작업과 현장 부대의 즉응태세를 확인했다. 진 의장은 북한군의 MDL 일대 활동에 대해 엄중한 우려를 표했다. 그는 \"녹음(綠陰)과 잦은 안", "language": "ko"}, {"title": "[영상] 폴란드형 K2전차, 동유럽 최대 방산전시회서 처음 공개", "url": "https://www.yna.co.kr/view/AKR20260909149700704", "source": "연합뉴스", "published": "2026-09-09T07:43:   "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
