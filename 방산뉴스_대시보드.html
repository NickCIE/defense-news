다.  이 대통령은 기업의 대규모 지역 투자를 통해 국가 균형 발전을 이루겠다는 국정 목표를 재차 제시하고, 범정부 차원의 총력 지원도 약속할 전망이다. 이번 투자 계획은 특정 지역에 시혜를 주는 차원이 아니라, 기업이 입지·인프", "language": "ko"}, {"title": "송영길 \"보완수사권, 정치적 무기화해 쟁점화하는 것은 바람직하지 않아\"", "url": "https://www.newsis.com/view/NISX20260703_0003695098", "source": "뉴시스", "published": "2026-07-03T05:59:50+00:00", "summary": "[서울=뉴시스]정금민 한재혁 권신혁 기자 = 더불어민주당 차기 당 대표 선거 출마가 점쳐지는 송영길 의원은 3일 \"보완수사권 여부를 정치적으로 무기화할 문제는 아니다\"라고 했다. 송 의원은 이날 서울 용산구의 한 호텔에서 열린 민주당 국회의원 워크숍에 참석해 기자들과 만나 \"보완수사권 문제처럼 조율할 수 있는 문제를 정치적으로 무기화해서, 전당대회에서 마치 정부를 상대로 싸움하듯 쟁점화하는 것은 바람직하지 않다\"며 이같이 말했다. 정청래 전 민주당 대표와 김민석 전 국무총리가 보완수사권 완전 폐지를 언급한 가운데 당 안팎에서 '예외", "language": "ko"}, {"title": "靑 \"쿠팡 표적 조사 없어…국적따라 기업 차별 대우 안 해\"", "url": "https://www.newsis.com/view/NISX20260703_0003695074", "source": "뉴시스", "published": "2026-07-03T05:49:00+00:00", "summary": "[서울=뉴시스] 김지은 조재완 기자 = 청와대는 3일 미국 백악관이 대규모 개인정보 유출 사태를 빚은 쿠팡과 관련해 한국 정부가 미국 기업을 표적으로 삼고 있다고 주장한 데 대해 \"우리는 국적에 따라서 기업활동에 대해 차별적으로 대처하거나 아니면 누구를 표적화해서 조사하지 않는다\"며 \"한미 안보 영역에 파장이 없도록 노력하겠다\"고 밝혔다. 위성락 국가안보실장은 이날 오후 브리핑에서 관련 질의에 \"쿠팡에 대해서 이뤄진 조사는 국내법과 적법 절차에 따라서 비차별적으로 이뤄지고 있다\"며 이같이 말했다. 이어 \"그래서 이 조사가 차별적이다", "language": "ko"}, {"title": "[속보]위성락 \"쿠팡 표적 조사 없어…美 의회 보고서 사실과 달라\"", "url": "https://www.newsis.com/view/NISX20260703_0003694999", "source": "뉴시스", "published": "2026-07-03T05:23:01+00:00", "summary": "후속기사가 이어집니다 \n◎공감언론 뉴시스 kje1321@newsis.com", "language": "ko"}, {"title": "이 대통령, 7~8일 나토 정상회의 참석…9~11일 몽골 국빈 방문", "url": "https://www.newsis.com/view/NISX20260703_0003694752", "source": "뉴시스", "published": "2026-07-03T05:22:50+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령이 튀르키예 앙카라에서 열리는 북대서양조약기구(NATO·나토) 정상회의 참석하는 등 7일부터 4박5일 간의 순방길에 오른다. 위성락 청와대 국가안보실장은 3일 오후 청와대 춘추관에서 브리핑을 열고 \"이 대통령은 마크 루터 NATO 사무총장의 초청으로 7일부터 8일까지 튀르키예 앙카라에서 개최되는 2026년 NATO 정상회의에 참석한다\"고 밝혔다. 이어 \"이번 참석은 지난달 G7 정상회의에 이어 우리 외교의 지평을 더욱 넓히고, 특히 세계 국방비의 55%를 차지하는 최대 방산시장인 NATO", "language": "ko"}, {"title": "독일, 美에 무기 공동 생산 제안...트럼프 압박 속 유럽 재무장 박차 - 조선비즈 - Chosun const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
