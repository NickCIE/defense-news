03784570", "source": "뉴시스", "published": "2026-09-10T06:38:36+00:00", "summary": "[목포=뉴시스] 박상수 기자 = 전남광주 서남권 단체장에 이어 시·군 의회에서도 '전남 국립의과대 후보 추천' 철회를 촉구하고 나섰다. 목포시의회를 비롯한 전남광주 서남권 9개 시·군의회는 10일 전남광주통합특별시 무안청사 만남의 광장에서 공동 기자회견을 갖고 \"국립의과대학 후보대학 선정·추천을 즉각 철회하고, 교육부가 직접 국립의대 설립 대학을 선정할 것\"을 요구했다. 이들은 \"국립의과대학은 특정 지역이나 대학의 이해관계를 넘어 주민들의 생명과 건강을 책임질 국가적 의료 인프라”라며 “이처럼 중대한 사안을 충분한 검증과 사회적 공", "language": "ko"}, {"title": "법무·성평등·국방장관 청문회 증인 채택 줄줄이 무산…野 \"맹탕 청문회\"", "url": "https://www.newsis.com/view/NISX20260910_0003784562", "source": "뉴시스", "published": "2026-09-10T06:31:54+00:00", "summary": "[서울=뉴시스] 이승재 기자 = 김승원 법무부 장관 후보자와 용혜인 성평등가족부 장관 후보자, 강신철 국방부 장관 후보자의 인사청문회 증인 채택이 줄줄이 무산되면서 국민의힘 내에서는 '맹탕 청문회'가 될 것이라는 비판이 나온다. 국회 법제사법위원회는 9일 열린 전체회의에서 김 후보자 인사청문 실시계회서 등을 의결했지만, 증인·참고인 출석 요구와 관련해서는 여야 합의에 실패했다. 국민의힘은 '신약 청탁' 의혹 관련 브로커 양모씨와 제약업체 제넨셀 대표 강모씨 등 증인 44명과 참고인 4명을 채택할 것을 요구했지만, 더불어민주당은 이를", "language": "ko"}, {"title": "Defense Business Brief: AI manufacturing; Skilled trades; Arms transfer oversight", "url": "https://www.defenseone.com/business/2026/09/defense-business-brief-ai-manufacturing-skilled-trades-arms-transfer-oversight/415898/", "source": "Defense One", "published": "2026-09-10T06:31:22+00:00", "summary": "", "language": "en"}, {"title": "외신 \"미국은 불만, 한국은 불안\"…대미투자 1년 가까이 제자리", "url": "https://www.newsis.com/view/NISX20260910_0003784105", "source": "뉴시스 경제", "published": "2026-09-10T06:23:40+00:00", "summary": "[서울=뉴시스]고재은 기자 = 한국이 3500억 달러(468조여원) 규모의 대미 투자를 약속한 지 1년이 가까워지는 가운데, 아직 한 건의 자금도 집행되지 않으면서 양국의 셈법이 복잡해지고 있다는 외신 진단이 나왔다. 9일(현지 시간) 영국 파이낸셜타임스(FT)는 '한국, 트럼프와 3500억 달러 합의 이행할까?' 제하의 기사에서 \"대미 투자 합의가 이뤄진 지 약 1년이 지나면서 미국에서는 불만이, 한국에서는 우려(alarm)가 커지고 있다\"고 보도했다. 대미 투자 1호 사업으로 미국 텍사스주 엔시날 가스복합화력발전소 건설 사업이 ", "language": "ko"}, {"title": "육군 특전사 A팀, 국방부장관배 국제 저격수 경연대회 우승", "url": "https://www.newsis.com/view/NISX20260910_0003784532", "source": "뉴시스", "published": "2026-09-10T06:17:48+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 육군은 지난 9월 3일부터 10일까지 경기 이천 특수전사령부와 경기 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
