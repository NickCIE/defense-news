"https://www.newsis.com/view/NISX20261027_0003843151", "source": "뉴시스", "published": "2026-10-27T06:27:12+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 해병대는 주일석 사령관이 오는 30일까지 3박 4일간 태국 해병대사령부의 초청으로 태국 방콕 및 사타힙을 방문한다고 27일 밝혔다. 주 사령관은 출장 기간 위라차이 리카 태국 해병대사령관 등 주요 직위자와 대담을 통해 양국 해병대 간 군사협력 강화와 방산 협력 확대방안 등에 대해 논의한다.  또한 태국 촌부리 6·25 참전기념비를 방문해 헌화하고, 6·25전쟁 중 전사한 태국 참전용사의 희생을 기릴 예정이다.  촌부리 6·25 참전 기념비는 6·25전쟁 당시 참전의 모체가 된 제21보병연대 부대 내에", "language": "ko"}, {"title": "여야, 외통위 국감서 '한미 동맹' 공방…\"할 말 해야\" vs \"위기 경고\"", "url": "https://www.newsis.com/view/NISX20261027_0003843116", "source": "뉴시스", "published": "2026-10-27T06:21:35+00:00", "summary": "[서울=뉴시스]정금민 김지훈 기자 = 여야는 27일 국회 외교통일위원회 종합 국정감사에서 한미 관계 문제를 놓고 공방을 벌였다. 더불어민주당은 한미 관세 협상 문제 등을 짚으며 \"미국에 (할 말은) 이야기 해야 한다\"는 취지의 입장을 밝혔고, 국민의힘은 '동맹 위기' 징후가 포착되고 있다며 정부의 대응 방식을 질타했다. 차지호 민주당 의원은 이날 외통위의 외교부·통일부·재외동포청 등에 대한 종합 국정감사에서 한미 관세 협상과 대미 투자 등을 언급하며 \"왜 우리 국민들은 미국 대통령의 한마디에, 우리 외교부는 그 한마디에 이렇게 휘청", "language": "ko"}, {"title": "국감장에 모형지뢰…박충권 \"장관 앞에 놓자\"·정동영 \"사양한다\"", "url": "https://www.yna.co.kr/view/AKR20261027123400001", "source": "연합뉴스", "published": "2026-10-27T06:11:58+00:00", "summary": "(서울=연합뉴스) 박수윤 기자 = 여야는 27일 외교부·통일부에 대한 국회 외교통일위원회 국정감사에서 한미동맹 이상 기류에 대한 정부 대처와 북...", "language": "ko"}, {"title": "육군 제2신속대응사단, 양평 일대서 '공정·공중강습 훈련' 실시", "url": "https://www.newsis.com/view/NISX20261027_0003843111", "source": "뉴시스", "published": "2026-10-27T06:11:53+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 육군 제2신속대응사단은 2026년 호국훈련 기계화부대 쌍방훈련과 연계한 공정·공중강습훈련을 지난 26일부터 27일까지 양평종합훈련장 등 작전지역에서 실시한다고 밝혔다.  이번 훈련은 공중전력을 활용해 주요 목표지역을 신속하게 확보하고, 기계화부대의 공격작전을 지원하는 능력을 높이는 데 중점을 뒀다. 훈련에는 공용화기 등을 휴대하고 완전군장을 갖춘 사단 장병 100여명이 참가했다. 수리온 10대·CH-47 수송헬기 2대가 투입됐다.  26일에는 육군 CH-47 수송헬기를 활용한 공정작전 훈련이, 27일", "language": "ko"}, {"title": "North Korean artillery pointed south stirs concern at border observatory - Reuters", "url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxQRFdMZk52VVlPVC1sUlhRekk1elJCTXRQQ3VrS09qMUtzQUxjYVhJZWNfc1hXZXZSM1dvZkZMZ21lVDNBZFlhQ e": "정청래, 美 비자발급 지연에 \"한미동맹 손상 논란 굉장히 유감\"", "url": "https://www.newsis.com/view/NISX20261027_0003842787", "source": "뉴시스", "published": "2026-10-27T02:58:51+00:00", "summary": "[서울=뉴시스]정금민 기자 = 국회 외교통일위원회 소속 정청래 더불어민주당 의원이 27일 미국 비자 발급이 지연돼 미주반 국정감사에 합류하지 못한 것을 두고 \"미국 행정 당국에 굉장히 유감스럽다\"고 했다. 정 의원은 이날 국회에서 열린 외통위 종합 국정감사에서 신상발언을 통해 이같이 말했다.  그는 \"미국에서 활동도 정상적으로 하고, 한미 우호 증진을 위해 많이 했는데 이번에 미국 비자가 불허면 불허, 허가면 허가도 아니고 그냥 '리뷰 중'이라는 것\"이라며 \"자칫 잘못하면 국정감사 자체를 못할 것 같아서 반을 옮겼다\"고 했다. 이어", "language": "ko"}, {"title": "김민석 \"北 군사도발 단호히 대응해야…최소한의 대화 통로 열 것\"", "url": "https://www.newsis.com/view/NISX20261027_0003842772", "source": "뉴시스", "published": "2026-10-27T02:47:20+00:00", "summary": "[서울=뉴시스] 한재혁 김윤영 기자 = 김민석 더불어민주당 대표는 27일 북한의 지뢰 도발과 관련해 \"군사도발에는 단호하고 원칙있게 대응하는 동시에 우발적인 충돌을 막고 긴장을 완화할 수 있는 최소한의 대화 통로를 열어 둬야 한다\"고 했다. 김 대표는 이날 오전 서울 여의도 국회에서 열린 민주당 한반도평화경제특별위원회 출범식에 참석해 \"정부가 분계선을 확인하고 우발적인 충돌 방지를 위한 군사당국회담을 제안한 것도 이러한 취지\"라며 이같이 말했다. 그는 \"최근의 변화는 상당히 큰 틀의 변화가 바닥에 깔려 있다. 한이 남북관계를 적대적", "language": "ko"}, {"title": "김민석 \"北도발 단호히 대응하고 최소한의 대화통로는 열어둬야\"", "url": "https://www.yna.co.kr/view/AKR20261027093600001", "source": "연합뉴스", "published": "2026-10-27T02:47:19+00:00", "summary": "(서울=연합뉴스) 박경준 정연솔 기자 = 더불어민주당 김민석 대표는 27일 최근의 대북 관계와 관련해 \"군사 도발에는 단호하고 원칙 있게 대응하...", "language": "ko"}, {"title": "임성근 징역 3년 확정…채상병 유족 \"형량, 원통함 금할 수 없어\"(종합)", "url": "https://www.newsis.com/view/NISX20261027_0003842748", "source": "뉴시스", "published": "2026-10-27T02:39:12+00:00", "summary": "[서울=뉴시스]김정현 기자 = '채상병 순직 사건' 책임자로 지목된 임성근 전 해병대 1사단장이 징역 3년을 확정받았다. 채모 상병이 순직한 지 3년 3개월만이다. 대법원 1부(주심 신숙희 대법관)는 27일 임 전 사단장의 업무상 과실치사상, 군형법상 명령 위반 등 혐의 상고심에서 징역 3년을 선고한 원심을 확정했다. 사고 당시 수해 현장을 총괄한 박상현 전 해병대 7여단장과 최진규 전 포11대대장에게는 각각 금고 1년 6개월을 확정했다. 채상병 부대 직속상관인 장모 전 포7대대 본부중대장은 금고 8월에 집행유예 2년을 확정받았다.", "language": "ko"}, {"title": "Saudi-led coalition says it intercepted Houthi missiles, drones attacking kingdom - Reuters", "url": "https://news.google.com/rss/articles/CBMizwFBVV95cUxQbkE2MkVyd2dKcU5mTW 받은 LIG 디펜스&에어로스페이스(LIG D&A)가 법적 대응에 나선 가운데, 이번 제재가 약 2조원 규모의 '한국형 전자전기' 등 주요 국방 연구개발(R&D) 사업의 향방을 가를 변수로 떠올랐다.  여기에 소형무인기 대응체계 사업의 방산업체 지정 취소 가능성까지 제기되면서 자칫 군 전력화 지연과 방산업계의 부담으로 이어질 수 있다는 우려가 나오고 있다. 27일 업계에 따르면 LIG D&A는 지난 22일 방위사업청(방사청)의 2년간 입찰참가자격 제한 처", "language": "ko"}, {"title": "엔화, 주요국 금융회의 전 포지션 조정 엔 매도로 1달러=157엔대 중반 하락 출발", "url": "https://www.newsis.com/view/NISX20261027_0003842464", "source": "뉴시스 경제", "published": "2026-10-27T01:03:38+00:00", "summary": "[서울=뉴시스]이재준 기자 = 엔화 환율은 27일 미국과 일본, 유럽 중앙은행의 기준금리 발표를 앞두고 포지션 조정 엔 매도, 달러 매수가 선행하면서 1달러=157엔대 중반으로 내려 시작했다. 도쿄 외환시장에서 엔화 환율은 이날 오전 8시30분 시점에 1달러=157.54~157.55엔으로 전일 오후 5시 대비 0.42엔 하락했다. 연방준비제도(Fed 연준)는 27~28일 연방공개시장위원회(FOMC)를 연다. 기준금리 동결 관측이 대체적이다. 차기 12월 회의 이래 금리인상 시기와 속도 등에 관해 시장의 관심이 고조하고 있다. 일본은", "language": "ko"}, {"title": "전자복권 당첨권 분산배치 은폐…위약벌 3000만원에 감사 청구도", "url": "https://www.newsis.com/view/NISX20261027_0003842125", "source": "뉴시스 경제", "published": "2026-10-27T01:00:00+00:00", "summary": "[세종=뉴시스]여동준 기자 = 복권사업 수탁사업자인 동행복권이 전자복권의 1등 당첨권 분산배치 구조를 알고도 복권위원회에 보고하지 않고, 현장점검을 앞두고 관련 메일까지 삭제한 것으로 확인됐다. 복권위는 동행복권에 위약벌 3000만원을 추가로 부과하고 관련 책임자의 인사조치를 요구했다. 복권 발행·관리의 투명성을 확인하기 위해 감사원에 감사도 청구했다. 기획예산처 복권위원회는 27일 이 같은 내용의 수탁사업자 위약벌 부과안 등을 전날 전체회의에서 심의·의결했다고 밝혔다. 문제가 된 상품은 구매 즉시 당첨 여부를 확인하는 즉석식 전자", "language": "ko"}, {"title": "USAF Orders ARRW Hypersonic Missile Into Production, The Same Weapon It Nearly Cancelled", "url": "https://www.twz.com/air/usaf-orders-arrw-hypersonic-missile-into-production-the-same-weapon-it-nearly-cancelled", "source": "The War Zone", "published": "2026-10-27T00:04:14+00:00", "summary": "The fortunes of the AGM-183A, which is now set to arm B-52 and B-1 bombers, have now been fully reversed. \n The post  USAF Orders ARRW Hypersonic Missile Into Production, The Same Weapon It Nearly Cancelled  appeared first on  TWZ .", "language": "en"}, {"title": "90 Days No Help: Fortress America’s Goal To Make Bases Resilient Bastions In A Crisis", "url": "https://www.twz.com/nuclear/90-d const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
