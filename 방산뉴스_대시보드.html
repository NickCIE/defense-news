l": "https://www.newsis.com/view/NISX20260712_0003705610", "source": "뉴시스", "published": "2026-07-12T03:00:00+00:00", "summary": "[하와이=뉴시스] 옥승욱 기자 = 대한민국 해군이 세계 최대 다국적 해상훈련인 '림팩(RIMPAC·환태평양)'에서 아시아 최초로 연합해군구성군사령관(CFMCC)을 맡으면서 2년 뒤인 2028 림팩에서 어떠한 임무를 수행할 지 관심이 쏠린다.  올해 훈련에서 30개국 연합 해군을 지휘하는 사령관 역할을 수행한 만큼, 2년 뒤에는 림팩 연합기동부대 사령관의 수석 보좌이자 자문역인 연합기동부대 부사령(CCTF)을 맡을 수 있을 것이라는 관측이 조심스럽게 제기된다. 미 해군 중장인 제프리 재블론 림팩 연합기동부대 사령관은 11일(현지시간)", "language": "ko"}, {"title": "온실가스 관측 초소형 위성 이름 공모…대상 100만원", "url": "https://www.newsis.com/view/NISX20260711_0003705136", "source": "뉴시스 경제", "published": "2026-07-12T03:00:00+00:00", "summary": "[세종=뉴시스]여동준 기자 = 기후에너지환경부 소속 국립환경과학원이 온실가스 배출원을 감시할 초소형 위성의 이름을 공모한다. 국립환경과학원은 13일부터 다음 달 7일까지 전 국민을 대상으로 온실가스 관측 초소형 위성 명칭 공모전을 진행한다고 12일 밝혔다. 이번 공모전은 온실가스 배출원을 감시하고 감축을 지원하기 위해 개발 중인 초소형 위성에 대한 국민의 관심과 이해를 높이기 위해 마련됐다. 국립환경과학원은 한화시스템과 온실가스 관측용 초소형 위성 5기를 개발하고 있다. 2027년 하반기에 1기, 2028년 하반기에 나머지 4기를 ", "language": "ko"}, {"title": "현대전 무기 된 허위정보…한미 군·정부 첫 연합 도상훈련", "url": "https://www.yna.co.kr/view/AKR20260712022900504", "source": "연합뉴스", "published": "2026-07-12T02:35:55+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 현대전에서 허위 정보를 퍼트려 상대국의 판단과 민심을 교란하는 인지전(cognitive warfare)이 주목...", "language": "ko"}, {"title": "빗장 거는 글로벌 방산 시장… 가성비 공장에서 글로벌 안보 파트너로 진화하라 - 아시아투데이", "url": "https://news.google.com/rss/articles/CBMibkFVX3lxTFBfbHF0d2sxckxmQ3k3bVJYZE9lZ3h5VTk5S01JSzA3MWdFX3l5cmtBOGxzaTZlZjd5WHVzSm8wQ1dzd2pZQVFDNGRCT3Y2cm45elNpM1l4U1BtZ2VVTE9jcnRMQVBuUTUyUDBITHZn?oc=5", "source": "방산 뉴스", "published": "2026-07-12T02:26:32+00:00", "summary": "빗장 거는 글로벌 방산 시장… 가성비 공장에서 글로벌 안보 파트너로 진화하라    아시아투데이", "language": "ko"}, {"title": "국힘 \"안규백, 당장 병적기록부 공개하라…자진사퇴 안 하면 탄핵할 것\"", "url": "https://www.newsis.com/view/NISX20260712_0003705622", "source": "뉴시스", "published": "2026-07-12T02:09:54+00:00", "summary": "[서울=뉴시스] 이승재 기자 = 국민의힘은 12일 안규백 국방부 장관이 방위병 복무 시절 근무지를 이탈했다는 의혹과 관련해 \"당장 국민 앞에 병적기록부를 공개하라. 만약 의혹 해소도, 자진사퇴도 없다면 국회는 국민의 엄중한 명령에 따라 즉각 탄핵 소추에 나설 것\"이라고 했다. 최보윤 수 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
