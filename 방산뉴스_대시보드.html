 "South Korea, Turkey to cooperate in nuclear, defence, infrastructure - Reuters", "url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxPOTVzdi13ZWhBc1ZvQmhaNVk5TUpHRGFGcllVMzE4aTUyS2plRmw0dmFreW02SkRySDR6OWduMnJELW1xN3NQQVRtb0FiSGdKOG41U082YnhheWVyQURaZURHV1BwUzJqUVdKMUkzTVZDMmFldFFnTUJNRkM0dGNPdW1YZF9ScGgxMUVzVktHSmwwcDB0cTRQTFVURGVDNTV3M0tPS3lDdG5vaFZVU3BsbnFtcVY?oc=5", "source": "Reuters", "published": "2026-11-03T10:57:44+00:00", "summary": "South Korea, Turkey to cooperate in nuclear, defence, infrastructure    Reuters", "language": "en"}, {"title": "이형일 \"내년 관리재정수지 적자비율 0.1%…20년 만에 가장 양호\"", "url": "https://www.newsis.com/view/NISX20261103_0003853475", "source": "뉴시스", "published": "2026-11-03T10:06:41+00:00", "summary": "[세종=뉴시스]임하은 기자 = 이형일 경제부총리 겸 재정경제부 장관은 3일 내년 국내총생산(GDP) 대비 관리재정수지 적자 비율이 0.1%로 낮아질 전망이라며 \"20년 만에 가장 양호한 수준이 될 전망\"이라고 밝혔다. 이형일 부총리는 이날 자신의 엑스(X·옛 트위터)에 39조7000억원 규모의 내년도 재경부 예산안이 국회에 상정됐다는 소식을 전하며 이같이 말했다. 그는 \"국가채무 비율은 올해 51.6%에서 내년 48.3%로 개선되고, GDP 대비 나라살림 적자(관리재정수지) 비율도 3.9%에서 0.1%로 낮아져 20년 만에 가장 양", "language": "ko"}, {"title": "조정식 국회의장, 伊 하원 의장 회담…\"한국 기업 공정한 대우·지원 부탁\"", "url": "https://www.newsis.com/view/NISX20261103_0003853453", "source": "뉴시스", "published": "2026-11-03T09:30:20+00:00", "summary": "[서울=뉴시스] 한재혁 기자 = 조정식 국회의장은 2일 서울 여의도 국회의장 접견실에서 로렌초 폰타나 이탈리아 하원의장을 만나 양국 의회 간 교류 확대 및 미래산업 협력 강화 방안 등을 논의했다. 3일 국회에 따르면 조 의장은 전날 폰타나 의장에게 \"지난 10월 이탈리아 방문 당시 따뜻하게 환대해 주신 데 감사드린다\"며 \"당시 방한을 요청한 지 한 달 만에 다시 만나 뵙게 되어 대단히 뜻깊고 반갑다\"고 했다. 이어 \"이탈리아 하원의장의 대한민국 국회 방문은 26년 만으로, 양국 관계와 의회 간 교류･협력 발전에 큰 계기가 될 것으로", "language": "ko"}, {"title": "李대통령 \"튀르키예, 피를 나눈 형제…원전·방산 협력 심화\"", "url": "https://www.yna.co.kr/view/AKR20261103143800001", "source": "연합뉴스", "published": "2026-11-03T09:19:21+00:00", "summary": "(서울=연합뉴스) 임형섭 기자 = 이재명 대통령은 3일 \"튀르키예는 우리 국민의 마음속에서 '칸 카르데쉬', 즉 피를 나눈 형제로 자리 잡고 있...", "language": "ko"}, {"title": "이 대통령 \"튀르키예 원전 건설 협력 순조롭게 진행…韓기업 참여 선제적 지원\"", "url": "https://www.newsis.com/view/NISX20261103_0003853196", "source": "뉴시스", "published": "2026-11-03T09:14:44+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령은 3일 레제프 타이이프 에르도안 튀르키예 대통령과 정상회담을 하고 \"원전·방산·인프라 등 전략 분야에서 실질 협력을 더욱 내실화 해나가겠다\"고 밝혔다. 이 대통령은 이날 오후 청와대에 열린 한-튀르키예 정상회담 직후 공동 언론 발표를 통해 \"지난해 11월 합의한 사항들의 이행 성과를 점검하고, 양국 간 '전략적 동반자 관계'를 한층 더 심화시킬 방안에 대해 심도 있게 논의했다\"며 이같이 말했다. 이날 양국이 체결한 협력 문건은 원전과 에너지, 천연자원, 과학기술 분야 등 모두 4건이다.", "language": "ko"}, {"title": "日 방위에도 AI 바람…기대만큼 커지는 ‘해외 기술 의존’ 우려", "url": "https://www.newsis.com/view/NISX20261103_0003853361", "source": "뉴시스", "published": "2026-11-03T09:09:41+00:00", "summary": "[서울=뉴시스]문은주 기자 = 일본 정부가 자위대의 지휘 통제 시스템에 인공지능(AI)을 도입하는 방안을 추진하는 가운데, 해외 기술 의존에 따른 위험성을 경계하는 목소리가 나오고 있다.  3일 니혼게이자이신문은 \"과거 외국산 장비를 도입하려다 생산 중단 등으로 위기를 맞았던 방위성이 이번엔 자위대 지휘체계의 AI 도입 방안을 두고 다시 고민에 빠졌다\"고 지적했다.  앞서 일본 정부는 외국산 군사용 AI 시스템을 지휘 통제 체계에 활용하는 방안을 검토하고 있다고 밝혔다. 동시에 독자 기술 개발도 추진하면서 국방 분야의 AI 전환을 ", "language": "ko"}, {"title": "[영상] \"한반도 안보 핵심 전략자산\"…3천600t급 잠수함 '서희함' 진수", "url": "https://www.yna.co.kr/view/AKR20261103168900704", "source": "연합뉴스", "published": "2026-11-03T08:48:02+00:00", "summary": "(서울=연합뉴스) 3천600t급 잠수함 2번함인 서희함이 3일 오후 한화오션 거제 옥포조선소에서 진수식을 거행했습니다.", "language": "ko"}, {"title": "이 대통령 \"전략적 동반자 관계 발전 논의\"…에르도안 \"FTA 개정 조속 마무리\"", "url": "https://www.newsis.com/view/NISX20261103_0003853373", "source": "뉴시스", "published": "2026-11-03T08:43:37+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령은 3일 국빈 방한한 레제프 타이이프 에르도안 튀르키예 대통령과 만나 \"앞으로도 대통령님과 함께 원전, 방산, 에너지, 과학기술 등 다양한 분야에서 양국 간 협력의 폭을 더 넓혀 갈 수 있기를 희망한다\"고 밝혔다.  이 대통령은 이날 오후 청와대에서 열린 한-튀르키예 확대 정상회담에서 \"양국의 협력이 실제로 매우 속도감 있게 이뤄지고 있다는 점을 확인했고 매우 기쁘게 생각한다\"며 이같이 말했다. 이 대통령은 \"지난해 회담 당시 대통령님께서는 양국 간 협력에 있어서 빠른 시작이 가장 중요하", "language": "ko"}, {"title": "합참의장, 'DMZ 지뢰' 부상장병 위문…\"헌신 잊지 않겠다\"", "url": "https://www.yna.co.kr/view/AKR20261103165200504", "source": "연합뉴스", "published": "2026-11-03T08:31:34+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 진영승 합참의장이 3일 국군수도병원을 방문해 지난 9월 비무장지대(DMZ) 작전 중 북한군 지뢰 폭발로 크게 ...", "language": "ko"}, {"title": "김정은 방중 열흘 만에…\"北 김성남, 당 대표단 이끌고 베이징行\"", "url": "https://www.newsis.com/view/NISX20261103_0003853346", "source": "뉴시스", "published": "2026-11-03T08:29:43+00:00", "summary": "[베이징·서울=뉴시스] 박정규 특파원,  최홍 기자 = 북한의 대표적 '중국통'인 김성남 노동당 국제비서가 3일 노동당 대표단을 이끌고 중국 방문길에 올랐다.  일각에서는 최근 열린 중국공산당 주요 회의 결과를 공유하고 양국 당 간 유대를 강화하려는 목적이라는 분석이 나온다. 3일 AP통신과 일본 니혼카이신문 등에 따르면 김 비서가 이끄는 북한 노동당 대표단은 이날 평양을 출발해 베이징에 도착한 것으로 알려졌다. 김 비서는 2021년 1월 노동당 국제부장에 임명된 데 이어, 올해 2월 제9차 당대회를 계기로 당 비서로 선출된 인물이", "language": "ko"}, {"title": "외교부 \"1호기 명단, 외교부 양식과 유사하지만 공문 형식은 아냐…행사 준비 과정서 유출 추측\"", "url": "https://www.newsis.com/view/NISX20261103_0003853342", "source": "뉴시스", "published": "2026-11-03T08:21:50+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 외교부는 대통령 순방단 개인정보 유출 사건과 관련, 자체 긴급 보안 점검 결과 메일시스템에서 비정상적인 접근 흔적은 발견하지 못했다고 3일 밝혔다. 온라인에 노출된 파일은 외교부 자체 생산 문서로 추정되는 가운데 해킹보다는 '유출'에 무게를 두고 조사가 진행되고 있다.  외교부 당국자는 이날 기자들과 만나 \"전날 사건 인지 후 우선적으로 자료가 유출될 수 있는 주요 경로인 메일시스템 등에 대한 긴급 보안 점검을 실시했다\"라며 \"밤사이 점검한 결과 메일시스템에선 비정상 접근을 확인하지 못했다\"라고 말했", "language": "ko"}, {"title": "합참의장 \"적 드론 및 무인기 위협 대비 방호력 강화하라\"", "url": "https://www.newsis.com/view/NISX20261103_0003853349", "source": "뉴시스", "published": "2026-11-03T08:21:34+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 진영승 합동참모의장은 3일 육군 항공사령부 예하 항공작전부대를 방문해 동계 항공작전태세를 점검했다.  합참에 따르면 진 의장은 이날 항공사 예하 공격·기동헬기 부대에서 항공작전태세를 보고받고, 동계작전 준비상황을 점검했다. 그는 \"적 도발에 대비한 즉응태세를 확립한 가운데, 적을 압도하는 월등한기동력과 화력으로 적 도발을 억제하라\"며 \"드론 및 무인기 위협에 대비한 확고한 대응태세와 방호력을 강화한 가운데, 주요 공격·기동헬기 전력화를 통해 작전능력을 보강해나가라\"고 지시했다.  이어 \"최근 전쟁사례", "language": "ko"}, {"title": "'김정은 갈아마시자' 사진 올린 해병대 장교 징계 위기?…해병대 \"사실 아니다\"", "url": "https://www.newsis.com/view/NISX20261103_0003853062", "source": "뉴시스", "published": "2026-11-03T08:12:00+00:00", "summary": "[서울=뉴시스]김성은 인턴 기자 = 한 해병대 장교가 \"김정은을 갈아 마시자\"는 문구가 담긴 사진을 사회관계망서비스(SNS)에 올렸다가 징계를 받을 위기에 놓였다는 내용이 온라인에서 확산했지만, 해병대는 사실이 아니라고 반박했다. 2일 온라인 커뮤니티와 SNS에서는 해병대 공병대대 소속 장교가 훈련을 마친 뒤 촬영한 사진을 SNS에 게시했다가 징계 위협을 받았다는 취지의 글이 퍼졌다. 사진에는 군복과 전투 장비를 착용한 장병들이 \"김정은을 갈아 마시자\"는 문구가 적힌 현수막을 들고 있는 모습이 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
