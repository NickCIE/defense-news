ublished": "2026-09-03T06:20:11+00:00", "summary": "(서울=연합뉴스) 미국이 해외 발주할 해군 함정에 한국, 일본, 튀르키예의 유도미사일 호위함이 검토 대상이라고 미 해군 전문매체 USNI 뉴스가...", "language": "ko"}, {"title": "美상무 \"앤트로픽, 요구한 것 다 이행해…이제 신뢰\"", "url": "https://www.newsis.com/view/NISX20260903_0003775013", "source": "뉴시스 경제", "published": "2026-09-03T06:19:45+00:00", "summary": "[서울=뉴시스]고재은 기자 = 하워드 러트닉 미국 상무장관이 인공지능(AI) 안전장치 등을 두고 수개월 동안 갈등을 벌였던 앤트로픽을 이제 신뢰한다고 밝혔다.  러트닉 장관은 2일(현지 시간) 공개된 액시오스와 인터뷰에서 다리오 아모데이 앤트로픽 최고경영자(CEO)를 신뢰하느냐는 질문에 \"신뢰한다\"고 답했다.  그는 \"그들은 우리가 요구한 것을 이행했다\"며 \"다시 올바른 방향으로 돌아왔다. 따라서 답은 '그렇다' 이다\"라고 말했다.  이번 발언은 국가 안보와 AI 안전 규제를 둘러싸고 격렬하게 갈등을 빚었던 앤트로픽과 도널드 트럼프", "language": "ko"}, {"title": "강신철, 사관학교 통합 동의 여부에 \"다양한 의견·우려 안다\"(종합)", "url": "https://www.yna.co.kr/view/AKR20260903043451504", "source": "연합뉴스", "published": "2026-09-03T06:05:02+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 강신철 국방부 장관 후보자는 3일 육·해·공군 3군 사관학교 통합 문제에 대해 \"다양한 의견과 우려가 있는 것...", "language": "ko"}, {"title": "29년간 헌혈 400회…육군 39사단 진기주 상사 '생명나눔' 귀감", "url": "https://www.yna.co.kr/view/AKR20260903120600052", "source": "연합뉴스", "published": "2026-09-03T06:03:10+00:00", "summary": "(함안=연합뉴스) 박영민 기자 = 육군 제39보병사단 소속 진기주 상사가 29년간 헌혈을 이어오며 400회 헌혈을 달성해 귀감이 되고 있다.", "language": "ko"}, {"title": "국방차관, 병영생활전문상담관 만나 \"정신건강, 첨단무기 개발만큼 중요\"", "url": "https://www.newsis.com/view/NISX20260903_0003775157", "source": "뉴시스", "published": "2026-09-03T05:52:37+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 이두희 국방부 차관이 병영생활전문상담관을 만나 이들의 업무가 첨단 무기 개발 이상으로 중요하다는 점을 강조했다.  국방부는 이두희 차관이 3일 국방컨벤션에서 병영생활전문상담관 9명을 초청해 격려 행사를 개최하고 국방부장관 명의의 감사장을 수여했다고 밝혔다.  병영생활전문상담관 제도는 2005년 장병의 기본권 보장 등을 위해 도입됐다. 현재 각 군에 740명(정원 기준)을 배치해 운영 중이다.  이 차관은 이날 각 부대에서 장병 인권 향상과 고충해소를 위한 든든한 버팀목이 돼주고 있는 병영생활전문상담관", "language": "ko"}, {"title": "러 교통장관 \"북러 첫 도로 교량 조만간 개통 예정\"", "url": "https://www.newsis.com/view/NISX20260903_0003774919", "source": "뉴시스", "published": "2026-09-03T05:23:24+00:00", "summary": "[서울=뉴시스] 이재우 기자 = 북한과 러시아를 연결하는 첫 도로 교량이 조만간 개통될 것으로 보인다. 양국을 직접 잇는 육상 통로는 s://www.newsis.com/view/NISX20260903_0003774853", "source": "뉴시스 경제", "published": "2026-09-03T03:45:33+00:00", "summary": "[세종=뉴시스]임하은 기자 = 삼성전자가 지난해 임원을 대상으로 317건의 주식지급약정을 새로 체결한 것으로 나타났다. 기존에 현금으로 지급하던 임원 인센티브를 주식기반 보상으로 대거 전환했다. 이에 따라 대기업집단 전체의 주식지급약정 체결 건수도 1년 만에 65.7% 증가했다. 3일 공정거래위원회가 발표한 '2026년 공시대상기업집단 주식소유현황'에 따르면 총수가 있는 15개 기업집단 소속 60개 계열사는 지난해 총수와 친족, 임원 등을 대상으로 총 585건의 주식지급약정을 신규 체결했다. 2024년 체결된 353건보다 232건 ", "language": "ko"}, {"title": "국힘 \"16일 법무부 장관 후보자 청문회 합의 진행 중\"", "url": "https://www.newsis.com/view/NISX20260903_0003774849", "source": "뉴시스", "published": "2026-09-03T03:40:32+00:00", "summary": "[서울=뉴시스]한은진 전상우 기자 = 국민의힘은 3일 김승원 법무부 장관 후보자에 대한 국회 인사청문회 진행을 오는 16일에 열기로 합의 중에 있다고 전했다.  최수진 원내수석대변인은 이날 오전 국회에서 열린 정책 의원총회를 마치고 기자들과 만나 \"오는 16일 국방부 장관 후보자와 국토교통부 장관 후보자 청문회가 있을 예정이고 법무부 장관 후보자도 예정 중에 있다. 이 부분은 아직 합의가 진행 중\"이라고 말했다. 최 원내대변인은 \"오는 15일에 재정경제부와 중소벤처기업부 장관 후보자 청문회가 예정돼있다\"며 \"17일에는 본회의를 할 ", "language": "ko"}, {"title": "행안장관 \"법무·성평등부, 내년 상반기 세종 이전…연내 확정\"(종합2보)", "url": "https://www.newsis.com/view/NISX20260903_0003774805", "source": "뉴시스", "published": "2026-09-03T03:22:46+00:00", "summary": "[서울=뉴시스] 강지은 기자 = 윤호중 행정안전부 장관은 3일 \"2027년 상반기부터 법무부, 성평등가족부 등 규모나 이전 효과가 큰 기관을 우선으로 (세종으로의) 순차적 이전을 추진하겠다\"고 밝혔다. 윤 장관은 이날 정부서울청사에서 한성숙 국무총리 발표로 진행된 '행정·공공기관 이전 및 공공기관 기능개혁' 관련 기자회견에서 2차 중앙행정기관 이전 방향에 대해 이같이 밝혔다.  중앙행정기관 이전은 행안부가, 공공기관 이전은 국토교통부가 주무 부처로 담당 업무를 맡고 있다. 윤 장관은 \"2012년부터 2021년까지 43개 기관이 세종", "language": "ko"}, {"title": "윤호중 \"정부부처 이전, 4분기 중 확정…외교통일 검토도\"[일문일답]", "url": "https://www.newsis.com/view/NISX20260903_0003774836", "source": "뉴시스", "published": "2026-09-03T03:12:34+00:00", "summary": "[세종=뉴시스]성소의 기자 = 윤호중 행정안전부 장관은 3일 서울 소재 중앙부처들의 추가 이전과 관련해 \"올해 4분기 중 이전 대상 기관을 최종 확정해 고시하겠다\"고 밝혔다. 윤 장관은 이날 정부서울청사에서 열린 '행정·공공기관 이전 및 공공기관 기능 개혁 방안 기자회견'에서 금융위원회가 이날 발표한 이전 대상에 포함되지 않은 이유를 묻는 질문에 \"오늘 발표에 없다고 해서 제외된다는 의미는 아니다\"며 이같이 말했다. 정부는 이날 법무부와 성평등가족부 등을 시작으로 수도권에 있는 중앙행정기관과 소속기관의 세종 이전을 순차적으로 추진하", "language": "ko"}, {"title": "KDRT·신속대응 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
