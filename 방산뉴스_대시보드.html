미군이 벌금형을 선고받았다.", "language": "ko"}, {"title": "엔화, 중동 긴장 격화에 1달러=163엔대 후반 하락 출발", "url": "https://www.newsis.com/view/NISX20260724_0003721694", "source": "뉴시스 경제", "published": "2026-07-24T00:59:53+00:00", "summary": "[서울=뉴시스]이재준 기자 = 엔화 환율은 24일 중동정세가 한층 긴박해지면서 기축통화인 달러에 유사시 매수 선행으로 1달러=163엔대 후반으로 내려 시작했다. 도쿄 외환시장에서 엔화 환율은 이날 오전 8시30분 시점에 1달러=163.81~163.83엔으로 전일 오후 5시 대비 0.50엔 떨어졌다. 엔화는 전날 일시 1달러=163.99엔으로 164엔에 육박했다. 도널드 트럼프 대통령은 이란에 대해 공격을 준비하고 있다며 \"유례 없을 정도로 대규모\"라고 경고했다. 예멘 친이란 무장세력 후티반군은 23일 홍해에서 사우디아라비아 관련 유", "language": "ko"}, {"title": "조현, 태국·필리핀 등 아세안 6개국과 양자회담…에너지·초국가범죄 대응 등 논의", "url": "https://www.newsis.com/view/NISX20260724_0003721683", "source": "뉴시스", "published": "2026-07-24T00:56:17+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 아세안 관련 외교장관회의 참석 차 필리핀 마닐라에 방문한 조현 장관은 태국, 브루나이, 인도네시아, 필리핀, 캄보디아, 베트남 등 아세안 6개국과 각각 양자 회담을 개최하고 양국 관계, 한-아세안 및 한-메콩 협력과 한반도 정세를 포함한 지역·국제정세 등에 대해 의견을 교환했다고 외교부가 24일 밝혔다. 조 장관은 22일(현지시간) 시하삭 푸앙껫깨우 태국 부총리 겸 외교장관과의 회담에서 올해 양국 간 포괄적 경제동반자협정(CEPA) 협상 타결, 초국가 범죄 대응 공조 등 안보 협력과 같은 실질 협력을", "language": "ko"}, {"title": "이 대통령, 페루 대통령 취임식에 특사단 파견…단장에 민홍철 의원", "url": "https://www.newsis.com/view/NISX20260724_0003721595", "source": "뉴시스", "published": "2026-07-24T00:38:34+00:00", "summary": "[서울=뉴시스]이인준 기자 = 이재명 대통령은 페루에 민홍철 더불어민주당 의원(한-페루 의원친선협회 회장)을 단장으로 하는 특사단을 파견할 예정이다. 강유정 청와대 수석대변인은 24일 서면 브리핑을 통해 \"정부는 오는 28일 케이고 후지모리(Keiko Fujimori) 페루 신임 대통령 취임식 참석 및 신정부 출범을 계기로 양국 간 우호 협력관계 증진을 위해 특사단을 보낸다\"고 밝혔다.  특사단에는 민 의원과 함께 강민국 국민의힘 의원, 이기헌 민주당 의원이 참여한다. 강 대변인은 특사단이 페루 측에 우리 정부의 국정 철학 및 대외", "language": "ko"}, {"title": "창원대 교수회 \"바다 떠난 해군사관학교는 모순…진해 존치해야\"", "url": "https://www.yna.co.kr/view/AKR20260724042400052", "source": "연합뉴스", "published": "2026-07-24T00:26:25+00:00", "summary": "(창원=연합뉴스) 박영민 기자 = 정부가 육·해·공군사관학교를 통합해 대전에 국군사관학교를 신설하는 방안을 밝힌 가운데 국립창원대학교 교수회가 ...", "language": "ko"}, {"title": "美, 한국 등에 '강제노동 관세' 부과 …\"즉각적 경제 충격 크지 않을 듯\"", "url": "https://www.newsis.com/view/NISX20260724_0003721316", "source": "뉴시스 경제", "published": "2026-07-23T23:31:13+00:00", "summary": "[서울=뉴시스]고재은 기자 = 도널드 트럼프 미국 행정부가 23일(현지시간) 강제노동 관련 무역법 301조 조사 결과에 따라 한국 등 60개국에 10~12.5%의 관세를 부과하기로 했다. 사실상 지난 2월 연방대법원의 상호관세 위헌 판결 이후 도입된 '10% 글로벌 관세'를 대체하려는 조치로, 과거처럼 즉각적인 글로벌 충격을 야기할 가능성은 낮다는 관측이 나온다. 미국 무역대표부(USTR)는 이날 \"1974년 무역법 301조에 따라 강제노동으로 생산된 상품의 수입 금지 조치를 시행하지 않거나 이를 효과적으로 집행하지 못한 60개국에", "language": "ko"}, {"title": "Congress’ Proposed Trump Class Battleship Program Guardrails Met With White House Pushback", "url": "https://www.twz.com/sea/congress-proposed-trump-class-battleship-program-guardrails-met-with-white-house-pushback", "source": "The War Zone", "published": "2026-07-23T23:14:45+00:00", "summary": "Congress is moving ahead with a bill that would block Trump class battleship construction unless certain weapons are deemed mature. \n The post  Congress’ Proposed Trump Class Battleship Program Guardrails Met With White House Pushback  appeared first on  TWZ .", "language": "en"}, {"title": "한투증권 \"글로벌 방공 미사일 공급 부족…방산 '비중 확대'\"", "url": "https://www.yna.co.kr/view/AKR20260724024800008", "source": "연합뉴스", "published": "2026-07-23T23:12:43+00:00", "summary": "(서울=연합뉴스) 임은진 기자 = 한국투자증권은 24일 글로벌 방공 미사일 공급 부족 현상이 심화하고 있다면서 방위 산업 업종에 대한 투자 의견...", "language": "ko"}, {"title": "Helicopters Just Took Center Stage In Rim Of The Pacific Sinking Exercises", "url": "https://www.twz.com/news-features/helicopters-just-took-center-stage-in-rim-of-the-pacific-sinking-exercises", "source": "The War Zone", "published": "2026-07-23T22:34:33+00:00", "summary": "Allied rotorcraft employed at least four different missile types against retired warships during the massive Pacific exercise. \n The post  Helicopters Just Took Center Stage In Rim Of The Pacific Sinking Exercises  appeared first on  TWZ .", "language": "en"}, {"title": "Pentagon awards Oracle nearly $7 billion deal in latest software consolidation push - Reuters", "url": "https://news.google.com/rss/articles/CBMixAFBVV95cUxPelFsM01lVjQ1c0t2Qkk3Y044T094Y3REUFB2eDJHZk const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
