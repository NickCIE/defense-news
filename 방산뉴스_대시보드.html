] 박성환 기자 = 해양경찰청이 보유한 드론이 61대로 늘었지만, 강풍과 비·눈 등 기상 악화 때는 운용이 제한돼 해상 수색·구조에 한계가 있다는 지적이 나왔다. 부산 해상 예인선 사고 당시에도 장기간 풍랑주의보가 이어지면서 드론을 투입하지 못한 것으로 나타났다. 19일 국회 농림축산식품해양수산위원회 소속 문금주 더불어민주당 의원이 해양경찰청에서 제출받은 자료에 따르면 해경의 드론 보유 대수는 2021년 38대에서 올해 8월 기준 61대로 늘었다. 기종별로는 무인멀티콥터 42대, 무인헬리콥터 13대, 무인비행기 6대다.", "language": "ko"}, {"title": "NHN두레이, 육·해·공군 30만명 잇는 ‘국방이음’ 구축 완료 - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxQMnlVaXJjR0laVFd1dXdFOEJrdUw3TlQ3eGtMVFp2azB4eEFzZktoUkRVTkVwWGZES0xIZnRxSGZoUjdpMDh1a1l6UHNETDQ3UUhhSEZiRm0ycHotVUF2ZUlUcGY3YUllZEZDMllLUVlreGp5NmZyc3FTNmRENlBJSzRB0gGWAUFVX3lxTE1XLV9oTFhVQXBhcHNSN3hrcmpaQTJJWlA5cW1WZXZUdFRrY3p4VnJXQ1dVNk9LQnczRUY2VnctdXFHNU50RU92ajhVMzdqSkhpcWNBdmRhcnpGdU5CUHVLNk53SHJzWl9zbkRvS3E5VjFqQ2RQanZDQm9MNk9oTGgzVm5MZGRYTENXQnc1OTVhdnp0ZjlYZw?oc=5", "source": "조선비즈", "published": "2026-10-19T01:29:00+00:00", "summary": "NHN두레이, 육·해·공군 30만명 잇는 ‘국방이음’ 구축 완료 - 조선비즈    Chosunbiz", "language": "ko"}, {"title": "TS, 김천·화성 드론자격센터서 실기 '자동평가 서비스' 도입", "url": "https://www.newsis.com/view/NISX20261019_0003831058", "source": "뉴시스 경제", "published": "2026-10-19T00:42:52+00:00", "summary": "[서울=뉴시스]정유선 기자 = 한국교통안전공단(TS)은 드론 자격시험 수험생의 실기시험 준비를 돕기 위해 김천·화성 드론자격센터에서 '드론 연습비행 자동평가 서비스'를 19일부터 운영한다고 밝혔다. 이번 서비스는 무인멀티콥터 실기평가과정에서 활용 중인 자동평가 시스템을 적용한 것이 특징이다. 수험생은 실전과 동일한 환경에서 연습비행을 마친 뒤 비행경로, 경로이탈 지점 등이 담긴 결과지를 받아볼 수 있다. 이를 통해 자신의 비행이 평가 기준에 얼마나 부합하는지 점검하고, 부족한 부분을 집중적으로 보완해 효율적으로 시험을 준비할 수 있", "language": "ko"}, {"title": "KAI 차세대 무인기에 국산 AI반도체 탑재…가온칩스, 삼성 8나노 기반 설계 참여 - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxPaExVeno3NzlGa1dlLWNURUxERTl4LVRObVVibno5QmZXcExIeXlsV1J6REd2MkNPUmljd2pYd2Rvb01iLXRNU0tpRDBnbVFZR0trOWVzbEpmNUcwVjRMUjAxbUJFOXB3QWtJVGFQeEo0d1M2a3A3UDFsMGhJdXpJSlZn0gGWAUFVX3lxTE9ZUHl5eE1zQllCbVM2R3dPb1Qxaks3TlBnVW9URUhBbHg5TVlLcFU0TWtFVDVGQ2NIZFdZU3NQRkl3akNNYktqMG5mOW5FQUtSNExlSk5JbHdwM05YaXhJc3d5eXlSWWtTQWI2aExMR3dNaHZBcU5BYWNISENrRS02Uk10bFY4eFpCdk52TjNoQTlnWkxEUQ?oc=5", "sour const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
