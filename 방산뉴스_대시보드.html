ublished": "2026-08-10T21:33:33+00:00", "summary": "DOGE reported $1.76 billion in savings from terminating a contract, but GAO found that the contract was never terminated and no funds were deobligated.", "language": "en"}, {"title": "젤렌스키 “우크라이나 전쟁 참여 북한군, 韓·日·필리핀에 위협될 것”", "url": "https://www.newsis.com/view/NISX20260811_0003743615", "source": "뉴시스", "published": "2026-08-10T21:25:32+00:00", "summary": "[서울=뉴시스] 구자룡 기자 = 볼로디미르 젤렌스키 대통령이 이틀만에 다시 전쟁에 참여하는 북한군이 한국에 위협이 될 것이라고 경고했다.  젤렌스키 대통령은 10일(현지 시각) 대국민 연설에서 “러시아는 역사상 처음으로 북한의 지원 없이는 전쟁을 수행할 수 없는 상황에 처했다”고 말했다.  젤렌스키 대통령은 “현재 러시아는 자국 영토에 북한 병력을 추가로 배치할 준비를 하고 있다”며 “북한으로부터 추가 탄도미사일을 공급받았다”고 강조했다.  그는 “전 세계 모든 이들이 이것이 무엇을 의미하는지 반드시 이해해야 한다”며 단순히 우크라", "language": "ko"}, {"title": "주말새 '수상보트' 전복사고 잇따라…지난해만 '640건'", "url": "https://www.newsis.com/view/NISX20260810_0003743037", "source": "뉴시스", "published": "2026-08-10T21:07:00+00:00", "summary": "[서울=뉴시스] 강지은 기자 = 주말 사이 모터보트 전복 등 수상 사고가 잇따르면서 안전사고 예방에 각별한 주의가 요구된다.  특히 최근 너울성 파도 등으로 보트가 뒤집히는 사고가 발생하고 있어 출항 전 기상·해상 상황을 확인하고, 구명조끼를 착용하는 등 안전 수칙을 철저히 준수해야 한다. 11일 행정안전부에 따르면 지난 주말 0.28t급 모터보트를 타고 인천 앞바다에 낚시를 나간 20~30대 남성 3명이 연락이 두절된 지 11시간 만에 구조됐다. 앞서 9일 오후 10시30분께 인천 해양경찰서에는 '모터보트를 타고 낚시를 나간 남편", "language": "ko"}, {"title": "DARPA developing hypersonic cruise missile to evade enemy air defenses", "url": "https://www.defensenews.com/industry/techwatch/2026/08/10/darpa-developing-hypersonic-cruise-missile-to-evade-enemy-air-defenses/", "source": "Defense News", "published": "2026-08-10T20:54:38+00:00", "summary": "DARPA is developing a hypersonic cruise missile in response to the Pentagon's concerns that American missiles are vulnerable to enemy air defenses.", "language": "en"}, {"title": "[오늘의 주요일정]정치(8월11일 화요일)", "url": "https://www.newsis.com/view/NISX20260810_0003743571", "source": "뉴시스", "published": "2026-08-10T20:00:00+00:00", "summary": "[서울=뉴시스] ◇청와대【대통령】 10:00 국무회의 ◇총리실【총리】 10:00 국무회의 ◇국방부【장관】 10:00 국무회의 15:00 제177회 방위사업추진위원회 ◇외교부【장관】 10:00 국무회의 ◇통일부【장관】 10:0 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
