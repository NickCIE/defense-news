blished": "2026-11-02T07:02:36+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부가 광주 군공항 내 미군 시설의 임시배치 문제를 기존에 논의해 온 한미 공군 공동운영기지(COB) 이전 관련 포괄협정에 포함하는 방안을 미국 측과 협의하고 있다고 밝혔다.  정빛나 국방부 대변인은 2일 정례브리핑에서 광주 군공항 내 미군 시설 이전 문제와 관련해 \"광주 군공항 내 미군 시설의 임시배치에 관한 사항을 기존에 협의해 온 COB 이전 포괄협정에 포함하는 방안을 미 측과 협의하고 있다\"고 말했다. 정 대변인은 이어 \"국가산단 추진에 지장이 없도록 현재 주한미군과 긴밀히 협의하고 있다\"며", "language": "ko"}, {"title": "드론 산업 경쟁력 높인다…범정부 '전략 추진단' 출범", "url": "https://www.yna.co.kr/view/AKR20261102080200001", "source": "연합뉴스", "published": "2026-11-02T06:30:01+00:00", "summary": "(서울=연합뉴스) 이상현 기자 = 부처별로 분산된 드론 산업 육성 전략을 통합·조정하는 '국가 드론·대(對)드론 전략 추진단'이 출범했다.", "language": "ko"}, {"title": "국가 드론·對드론 전략추진단 출범…공공수요 확대·위협대응 체계 구축", "url": "https://www.newsis.com/view/NISX20261102_0003850868", "source": "뉴시스", "published": "2026-11-02T06:30:00+00:00", "summary": "[서울=뉴시스]이인준 기자 = 드론(무인기)의 공공수요 확대, 국가 대응 체계 구축 등 범부처 협력이 필요한 과제를 추진할 국무총리 소속 '국가 드론·대드론 전략 추진단'이 2일 출범식을 갖고 본격 활동에 들어갔다. 임기근 국무조정실장 겸 추진단장은 이날 오후 열린 출범식을 통해 \"드론은 미래의 성장동력이자 국가안보와 국민 안전을 지키는 핵심 수단\"이라며 \"추진단을 중심으로 부처 간 칸막이를 허물고 민·관·군의 역량을 하나로 모으는 데 주력하겠다\"고 밝혔다. 추진단은 지난 6월4일 정부가 발표한 '국가 드론·대드론 대전환 전략'의 ", "language": "ko"}, {"title": "Thales unit wins $53.9 million US Navy contract - Reuters", "url": "https://news.google.com/rss/articles/CBMirAFBVV95cUxOZGxhbmhPb1NOakpWdWUyUUZ5T083YlFlZTk0UUpQQ04ydWxKT2R1dVNWTEEycEJxWmV3QkZBRDNHYl9MOVhuQ2ZVNXZQcWw2Sl9kMEpmcTd0NkZhZXZOQUx4aDlkVkItV3hqcTEwdjFIYTRHc2c5NEtrYVBxTGc5MWVxUTBQQXNaa1hnQmFVbVBzQWxKc0cxamxCQWVLOUVpTFdXRlYzZnRJbE9F?oc=5", "source": "Reuters", "published": "2026-11-02T06:21:00+00:00", "summary": "Thales unit wins $53.9 million US Navy contract    Reuters", "language": "en"}, {"title": "대구 민주당·정의당, 팔현습지 보도교 공사 강행 규탄", "url": "https://www.newsis.com/view/NISX20261102_0003851280", "source": "뉴시스", "published": "2026-11-02T06:20:17+00:00", "summary": "[대구=뉴시스] 정창오 기자 = 더불어민주당 대구시당과 정의당 대구시당은 2일 대구 팔현습지에 건설 예정인 보도교가 하늘다람쥐와 담비 등 보호종의 서식에 악영향을 끼칠 수 있다며 낙동강유역환경청에 보도교 건설계획 철회를 촉구하고 나섰다. 낙동강유역환경청은 대구 수성구 매호동에서 동구 망우당공원까지 5.5㎞ 구간에 제방 보강과 팔현습지 인근 산책로·보도교 신설 등을 포함한 420억원 규모의 하천환경정비사업을 추진하고 있다.  사업에 포함된 보도교는 길이 886m로 사업비 174억원을 투입해 추진했지만 지역 환경단체의 반발로 2022년", "language": "ko"}, {"title": "국방부, 공군 군악대 동원 음주회식에 \"엄중 사안…필요한 조치 시행\"", "url": "https://www.newsis.com/view/NISX20261102_0003851262", "source": "뉴시스", "published": "2026-11-02T06:16:42+00:00", "summary": "[서울=뉴시스]옥승욱 기자 = 국방부는 공군 일선 부대에서 장성들이 참석한 가운데 군악대를 동원해 과도한 음주 회식을 벌였다는 보도와 관련해 \"매우 엄중한 사안으로 인식하고 있다\"고 밝혔다.  정빛나 국방부 대변인은 2일 정례브리핑에서 관련 질문에 대해 \"국방부 장관은 감사관실에 사실관계를 엄정하게 확인하도록 지시했다\"며 이같이 말했다.  정 대변인은 이어 \"사실관계 확인을 거쳐 필요한 조치를 엄정하게 시행하겠다\"고 덧붙였다.  전날 한 매체는 지난 4월 29일 경남 사천 공군 제3훈련비행단에서 공군 교육사령관(중장)과 제3훈련비행", "language": "ko"}, {"title": "이형일, 주한미국대사 접견 \"동맹 강화 위해 경제협력 확대해야\"", "url": "https://www.newsis.com/view/NISX20261102_0003851114", "source": "뉴시스", "published": "2026-11-02T06:00:00+00:00", "summary": "[세종=뉴시스] 안호균 기자 = 이형일 경제부총리 겸 재정경제부 장관은 2일 정부서울청사에서 미셸 박 스틸 주한미국대사를 접견하고 한미 경제협력 발전 방향 등에 대해 의견을 교환했다.  이 부총리는 스틸 대사의 부임을 축하하면서, 70년 넘게 발전해 온 한미동맹이 안보를 넘어 첨단산업·에너지·공급망 등 경제 분야로 심화되고 있다고 평가했다. 이어 서울에서 태어나 한국과 미국 모두를 깊이 이해하는 스틸 대사가 양국 경제 협력의 든든한 가교가 돼 줄 것을 기대한다고 밝혔다. 양측은 한미 전략투자와 통상 등 현안에 대해서도 의견을 나눴다", "language": "ko"}, {"title": "소설가 김홍신 \"악한 자 글로 벌 주는 것, 문학 소명\"", "url": "https://www.newsis.com/view/NISX20261102_0003851095", "source": "뉴시스", "published": "2026-11-02T05:38:45+00:00", "summary": "[서울=뉴시스]조기용 기자 = \"제가 우리 아이들에게 유언을 미리 남겼습니다. 죽을 때 손에 만년필과 머리맡에 원고지를 놔달라고요. 젊어서부터 등단도 늦었지만, 그때부터 꿈꾼 것이 죽는 날까지 원고지에 글을 쓰자는 것이었습니다.\" 대하소설 '인간시장'으로 한국 출판사상 최초 밀리언셀러 작가 김홍신(79)이 올해로 등단 50주년을 맞았다. 작가는 이를 기념해 장편 '유다의 어머니'(해냄출판사)를 펴냈다. 소설 '죽어 나간 시간을 위한 애도' 이후 3년 만에 선보이는 작품이다. 김홍신은 2일 서울 중구 한국프레스센터에서 열린 신간 출간", "language": "ko"}, {"title": "The Pentagon’s IT agency wants to bridge network gaps in the Pacific", "url": "https://www.defenseone.com/technology/2026/11/pentagons-it-agency-wants-bridge-network-gaps-pacific/416963/", "source": "Defense One", "published": "2026-11-02T04:37:52+00:00", "summary": "“The old ways of connecting with partners are simply no longer sufficient,” says INDOPACOM deputy commander.", "language": "en"}, {"title": "광주 軍공항 대미협의, 포괄협정으로…연내 문안협의 완료 목표", "url": "https://www.yna.co.kr/view/AKR20261102090100504", "source": "연합뉴스", "published": "2026-11-02T04:35:02+00:00", "summary": "(서울=연합뉴스) 김효정 김철선 기자 = 정부가 한미 공군 공동운영기지(COB)인 광주 군공항 이전을 위한 대미협의를 국내 5개 COB 전체를 ...", "language": "ko"}, {"title": "군, 北 탄도미사일 발사 미공지에 \"보안 등 고려한 군사적 판단\"", "url": "https://www.newsis.com/view/NISX20261102_0003850953", "source": "뉴시스", "published": "2026-11-02T04:32:51+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 군 당국은 지난달 31일 북한의 탄도미사일 발사를 식별하고도 언론에 공지하지 않은 이유에 대해 \"공지 여부는 우리 군의 감시·정찰 자산 및 능력의 보호, 작전보안 등을 고려해 종합적·군사적으로 판단하고 있다\"고 2일 밝혔다.  장도영 합동참모본부 공보실장은 이날 국방부 정례브리핑에서 관련 질문에 대해 \"우리 군이 북한의 모든 발사체에 대해 공지하지는 않는다\"며 이같이 말했다.  북한 대외매체 조선중앙통신은 미사일총국이 지난달 31일 '전술탄도미사일 산포전투부(집속탄 탄두)의 전투적용성 및 위력평가시험", "language": "ko"}, {"title": "'모두의 성장' 방점 찍은 이 대통령…27분 연설서 \"성장\" 36번 언급", "url": "https://www.newsis.com/view/NISX20261102_0003850669", "source": "뉴시스", "published": "2026-11-02T03:07:17+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령이 2일 내년도 예산안 설명을 위한 국회 시정연설에서 \"불평등과 양극화가 심화되는 'K자 성장'의 한계를 극복하려면 성장이냐 분배냐 하는 낡은 이분법적 논쟁에서 벗어나 달라진 시대와 상황에 맞는 새로운 성장 공식을 적용해야 한다\"고 말했다. 이 대통령이 이날 연설문에서 가장 많이 쓴 단어는 36번 언급한 '성장'으로 '모두의 성장'을 강력하게 추진하겠다는 의지를 재차 드러냈다.   이 대통령은 이날 국회에서 열린 2027년도 예산안 시정연설에서 \"우리 경제는 뚜렷한 V자형 회복세를 이어가", "language": "ko"}, {"title": "철원 육군 전방부대서 20대 하사 숨진 채 발견", "url": "https://www.yna.co.kr/view/AKR20261102086500062", "source": "연합뉴스", "published": "2026-11-02T02:51:17+00:00", "summary": "(철원=연합뉴스) 양지웅 기자 = 2일 강원 철원군 육군 모 부대에서 부사관이 숨진 채 발견됐다.", "language": "ko"}, {"title": "국방부, 공군 '군악대 동원 음주회식' 보도에 \"엄중하게 인식\"", "url": "https://www.yna.co.kr/view/AKR20261102085200504", "source": "연합뉴스", "published": "2026-11-02T02:43:03+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 공군 일선 부대에서 지난 4월 장성들이 참석한 가운데 군악대를 동원한 음주 회식이 진행됐다는 보도와 관련해 국...", "language": "ko"}, {"title": "Rubio says Trump wants to end Iran war 'peacefully' even as both sides prepare for strikes", "url": "https://www.cnbc.com/2026/11/02/us-iran-war-trump-hormuz-rubio.html", "source": "CNBC", "published": "2026-11-02T02:39:35+00:00", "summary": "The remarks come as reports suggest that both sides are gearing up for additional military strikes after the U.S. midterm elections.", "language": "en"}, {"title": "軍, ‘국방드론본부’ 공식 출범… “드론 역량 강화” - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMigwFBVV95cUxQcUYwTjJxY3B0YXozMUItTllzV2VqZTNmVTZZLVBpc0tSLTBDRmJKeFl1dVlRTGhjZ1BLNTlxMExjOFdXYkN1dUhiUUJCcFBtRGo5WjBKTElWcno1OXpSMERnd2xjbE9MTjRxR3NwSXdaeHB3ci1ybW5XMXRlRlRhQ2NmQQ?oc=5", "source": "조선비즈", "published": "2026-11-02T02:38:00+00:00", "summary": "軍, ‘국방드론본부’ 공식 출범… “드론 역량 강화”    Chosunbiz", "language": "ko"}, {"title": "국힘, 李대통령 시정연설에 \"미래 팔아 나라 곳간 거덜 내겠다는 선언문\"(종합)", "url": "https://www.newsis.com/view/NISX20261102_0003850825", "source": "뉴시스", "published": "2026-11-02T02:34:32+00:00", "summary": "[서울=뉴시스] 전상우 이승재 기자 = 국민의힘은 2일 이재명 대통령의 2027년도 예산안 시정연설에 대해 \"미래를 팔아 나라 곳간을 거덜 내겠다는 '대국민 선전포고문'이자 '대한민국 미래파괴 선언문'\"이라고 했다. 장동혁 대표는 이날 오전 페이스북에 \"이 대통령, 본인 하고 싶은 말만 하고 갔다\"며 이같이 적었다. 그는 \"7000자 넘는 연설문에 끝내 빠진 단어들. '부동산'도 '증시'도 '농지'도 없었다\"며 \"'북한'도 '한미동맹'도 '치안'도 '사법'도 없다\"고 말했다. 이어 \"국민이 듣고 싶은 말은 한 마디도 하지 않은 것\"", "language": "ko"}, {"title": "대미 무역흑자 벌써 1000억弗 …K-수출 호조세에 美 관세압박 변수", "url": "https://www.newsis.com/view/NISX20261102_0003850278", "source": "뉴시스", "published": "2026-11-02T02:32:41+00:00", "summary": "[세종=뉴시스]김동현 기자 = 반도체 수출 호황에 힘입어 대미 무역흑자가 사상 처음으로 1000억 달러를 돌파했다. 지난해 495억 달러 흑자의 2배가 넘는 규모다. 트럼프 행정부가 무역 불균형을 관세 정책의 명분으로 삼아 온 만큼, 흑자 확대가 추가 시장 개방이나 미국 내 생산 확대 요구로 이어질 수 있다는 우려가 나온다.    2일 산업통상부가 발표한 '2026년 10월 수출입 동향'에 따르면 올해 1~10월 대미 수출액은 1767억 달러, 수입액은 745억 달러로 무역흑자는 1022억 달러였다.  월별 대미 무역수지는 1월 5", "language": "ko"}, {"title": "합참 \"北발사체 모두 공지하진 않아…보안 등 고려 군사적 판단\"", "url": "https://www.yna.co.kr/view/AKR20261102078400504", "source": "연합뉴스", "published": "2026-11-02T02:29:45+00:00", "summary": "(서울=연합뉴스 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
