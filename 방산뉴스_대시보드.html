ry": "[서울=뉴시스] 옥승욱 기자 = 21일 오전 육군 25사단 비무장지대에서 수색작전을 벌이던 군 간부 3명이 지뢰 폭발로 추정되는 사고로 부상을 입었다.  이날 합동참모본부는 \"21일 오전 서부전선 비무장지대(DMZ) 군사분계선(MDL) 이남 지점에서 작전을 수행하던 우리 군 간부 3명이 미상 폭발로 부상을 입었다\"고 밝혔다. 이 폭발이 지뢰로 인해 발생했는지, 지뢰가 원인이라면 우리 군이 매설한 것인지 혹은 북한군이 매설한 것인지 등에 대해서는 아직 확인되지 않고 있다.  군은 사고 발생 직후 응급헬기를 DMZ 내부로 투입했고 간부", "language": "ko"}, {"title": "주병기 \"소수업체 방산 독점 개선해야…신규진입 촉진안 논의\"", "url": "https://www.yna.co.kr/view/AKR20260921128000002", "source": "연합뉴스 경제", "published": "2026-09-21T07:00:02+00:00", "summary": "(세종=연합뉴스) 김수현 송정은 기자 = 주병기 공정거래위원장은 21일 \"방산물자 시장에 신규기업 진입을 촉진하기 위한 방안을 관계부처와 협의 ...", "language": "ko"}, {"title": "주병기 \"정유사 가격담합 10월 조사 마무리…국고채 조만간 결론\"", "url": "https://www.newsis.com/view/NISX20260921_0003798656", "source": "뉴시스 경제", "published": "2026-09-21T07:00:00+00:00", "summary": "[세종=뉴시스]임하은 기자 = 주병기 공정거래위원장은 21일 \"서민 생활과 물가에 직결된 정유사들의 석유류 가격담합 사건은 10월까지 조사를 마치고 심의 절차 개시 여부를 결정하겠다\"고 밝혔다. 주병기 위원장은 이날 정부세종청사 공정위 기자실에서 열린 취임 1주년 기자간담회에서 이같이 말했다. 공정위는 정유사들이 석유제품 가격을 담합했다는 의혹을 조사하고 있다. 다음 달까지 조사를 마친 뒤 조사 결과를 담은 심사보고서를 위원회에 상정할지 결정할 방침이다. 추석 연휴 이전에 결론이 날 것으로 관측됐던 국고채 입찰 담합 사건은 결론이 ", "language": "ko"}, {"title": "주병기 \"쿠팡 현장조사 무력화, 매우 중대…회피 차단 검토\"", "url": "https://www.newsis.com/view/NISX20260921_0003798677", "source": "뉴시스 경제", "published": "2026-09-21T07:00:00+00:00", "summary": "[세종=뉴시스]임하은 기자 = 주병기 공정거래위원장은 21일 쿠팡에 대한 현장조사가 법원의 집행정지 결정으로 중단된 것과 관련해 \"공정위 현장조사가 실질적으로 이뤄지지 못하게 된 상황은 매우 중대한 일\"이라고 말했다. 주병기 위원장은 이날 정부세종청사 공정위 기자실에서 열린 취임 1주년 기자간담회에서 이같이 말했다. 주 위원장은 \"공정위 현장조사는 피조사자의 동의를 구해 이뤄지는 것으로 경찰이나 검찰의 압수수색과는 전혀 다른 방식\"이라며 \"현장조사로 기업의 영업이나 생산 활동이 중단되는 일도 없다\"고 설명했다. 이어 \"대규모유통업법", "language": "ko"}, {"title": "혁신당, 민형배 시장에게 초당적 '반도체 공동협의체' 제안", "url": "https://www.newsis.com/view/NISX20260921_0003798687", "source": "뉴시스", "published": "2026-09-21T06:36:51+00:00", "summary": "[전남광주=뉴시스]송창헌 기자 = 조국혁신당이 800조원대 호남 반도체 메가프로젝트 성공을 위해 민형배 전남광주통합특별시장에게 초당적 공동협의체 구성을 공식 제안했다. 물과 전력, 부지만 내주고 정작 양질의 일자리는 얻지 못하는 최악의 시나리오를 막고, 정부와 지자체, 군 당국과 정치권이 공동 대응하자는 취지다. 신 url": "https://www.yna.co.kr/view/AKR20260921094900704", "source": "연합뉴스", "published": "2026-09-21T04:18:06+00:00", "summary": "(서울=연합뉴스) 대만이 초음속 대함 미사일로 퇴역 함정을 격추하는 영상을 공개했습니다.", "language": "ko"}, {"title": "헌재 \"개정 전 기초자치단체장 예비후보 후원회 금지법 합헌\"", "url": "https://www.newsis.com/view/NISX20260921_0003798221", "source": "뉴시스", "published": "2026-09-21T03:00:00+00:00", "summary": "[서울=뉴시스]김정현 기자 = 시·군·구 기초지방자치단체장 선거에 출마한 예비후보자가 후원회를 지정할 수 없도록 정했던 개정 전 옛 정치자금법 조항이 헌법에 어긋나지 않았다는 헌법재판소의 판단이 나왔다.  헌재는 최근 문준희 전 합천군수가 옛 정치자금법 제6조 6호 등에 대한 위헌을 주장하며 낸 헌법소원을 재판관 9명 중 6명 의견으로 합헌 결정했다고 21일 밝혔다.  문 전 군수의 청구를 받아들이지 않은 것이다. 문 전 군수는 2014년 당시 새누리당(국민의힘 전신) 합천군수 경선에서 낙선하고 나서 500만원, 2018년 6·13", "language": "ko"}, {"title": "전략경제자문단 \"국산 반도체 활용 인센티브·소부장 실증 지원 필요\"", "url": "https://www.newsis.com/view/NISX20260921_0003798056", "source": "뉴시스 경제", "published": "2026-09-21T03:00:00+00:00", "summary": "[세종=뉴시스]여동준 기자 = 재정경제부 전략경제자문단이 국산 반도체 활용을 확대하기 위한 인센티브 도입과 반도체 소재·부품·장비 기업의 실증 지원 필요성을 제안했다. 재경부 전략경제자문단은 21일 경기 판교에 위치한 인공지능(AI) 반도체 기업 딥엑스를 방문해 현장에서 반도체 분과위원회 회의를 개최했다고 밝혔다.  이날 현장 방문에는 박영선 전략경제자문단 위원장과 김성수 연세대 공과대학 특임교수, 김정호 한국과학기술원(KAIST) 전기및전자공학부 교수, 차정훈 전 카이스트홀딩스 대표이사 등이 참석했다. 딥엑스와 퓨리오사AI 관계자", "language": "ko"}, {"title": "中에 관세 압박하던 트럼프, 시진핑 '국빈 환대'…달라진 대중 전략", "url": "https://www.newsis.com/view/NISX20260921_0003797766", "source": "뉴시스 경제", "published": "2026-09-21T02:40:35+00:00", "summary": "[서울=뉴시스]박미선 기자 = 도널드 트럼프 미국 대통령이 과거 고율 관세를 앞세운 대중국 압박에서 벗어나 시진핑 중국 국가주석과의 관계를 중시하는 방향으로 접근법을 바꾸고 있다는 분석이 나온다. 중국의 희토류 지배력 등을 앞세운 대응으로 관세 압박이 기대했던 효과를 거두지 못한 가운데 24일 미·중 정상회담에서 실질적인 합의가 나올지 주목된다. 20일(현지 시간) AP통신에 따르면 트럼프 대통령은 최근 시 주석에 대해 \"훌륭한 신사이며 우리는 매우 잘 지낸다\"며 \"중국은 경쟁자이지만 시 주석과 매우 좋은 관계를 유지하고 있다\"고 ", "language": "ko"}, {"title": "국기연, 韓방산기업-美연구기관 간 초소형위성 기술협력 주선", "url": "https://www.yna.co.kr/view/AKR20260921079900504", "source": "연합뉴스", "published": "2026-09-21T02:27:34+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 국방기술진흥연구소는 방산혁신기업으로 선정된 '스텝랩'과 미국 우수 비영리 연구기관 'SRI' 간 초소형위성 분...", "language" const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
