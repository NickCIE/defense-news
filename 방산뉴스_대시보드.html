www.newsis.com/view/NISX20260929_0003806682", "source": "뉴시스", "published": "2026-09-29T01:37:14+00:00", "summary": "[서울=뉴시스]한은진 우지은 전상우 기자 = 국민의힘은 29일 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 \"정부와 여당은 이번 사태를 계기로 대북 굴종 노선의 폐기를 선언해야 한다\"고 말했다. 장동혁 대표는 이날 자신의 페이스북에 \"'한국 군인' 발목 앗아간 북한 김정은, 패가망신 시켜야 하지 않는가\"라며 \"'우리 군인' 지뢰로 공격한 북한에 즉각 항의하고, 김정은 체포를 지시해야 하지 않는가\"라고 적었다. 장 대표는 \"사방팔방 큰소리 뻥뻥 치던 이재명 대통령은 북한 지뢰 도발에는 초지일관 입을 닫고 있다\"며 ", "language": "ko"}, {"title": "트럼프 \"이란전쟁 끝나면 휘발윳값 크게 내려갈 것\"", "url": "https://www.newsis.com/view/NISX20260929_0003806375", "source": "뉴시스 경제", "published": "2026-09-29T01:31:23+00:00", "summary": "[서울=뉴시스] 신효령 기자 = 도널드 트럼프 미국 대통령이 이란과의 전쟁이 끝나면 휘발윳값이 크게 내려갈 것이라고 주장했다. 전쟁으로 높아진 미국인의 생활비 부담도 줄어들 것이라는 전망이다. 28일(현지시간) 영국 가디언에 따르면 트럼프 대통령은 이날 기자들로부터 전쟁이 끝날 때까지 소비자들이 높은 비용을 감당해야 하느냐는 질문을 받았다.  그는 이란의 핵무기 보유를 막는 것이 중요하다고 강조한 뒤, 전쟁이 끝나면 물가가 크게 낮아질 것이라고 말했다. 이어 \"휘발윳값이 크게 내려갈 것\"이라며 가격이 이미 내려가고 있다고 주장했다.", "language": "ko"}, {"title": "[연합뉴스 이 시각 헤드라인] - 10:30", "url": "https://www.yna.co.kr/view/AKR20260929060100011", "source": "연합뉴스 경제", "published": "2026-09-29T01:30:00+00:00", "summary": "■ 靑 \"지뢰사고 현장조사, 군사적 판단…대통령 유엔 연설과 무관\"", "language": "ko"}, {"title": "이 대통령 \"지뢰 사고 투명하게 밝혀야…진상에 따라 필요 조치\"", "url": "https://www.newsis.com/view/NISX20260929_0003806651", "source": "뉴시스", "published": "2026-09-29T01:27:58+00:00", "summary": "[서울=뉴시스]조재완 김경록 기자 = 이재명 대통령은 29일 최근 경기 파주시 남측 비무장지대(DMZ) 내에서 발생한 지뢰 폭발 사건과 관련해 \"진상에 따라 필요한 조사를 취해나갈 것\"이라고 밝혔다.  이 대통령은 이날 오전 청와대에서 제42회 국무회의를 열고 \"군 당국은 유엔사와의 긴밀한 협조를 바탕으로 신속하고 철저한 조사를 통해 사건의 진상을 투명하게 밝혀야 할 것\"이라며 이같이 말했다.  이 대통령은 \"부상 장병들과 가족들에게 깊은 위로 말씀을 드리고 쾌유를 기원한다\"고 했다.  이 대통령은 \"안보에 여야가 따로 있을 수 없", "language": "ko"}, {"title": "與 \"北지뢰 확인되면 정부가 상응조치 해야…국힘, 안보를 정쟁 몰고 가\"", "url": "https://www.newsis.com/view/NISX20260929_0003806614", "source": "뉴시스", "published": "2026-09-29T01:17:02+00:00", "summary": "[서울=뉴시스] 김난영 권신혁 기자 = 더불어민주당이 비무장지대(DMZ) 폭발과 관련해 국민의힘이 안보를 정쟁화하고 있다고 비판했다. 한병도 민주당 원내대표는 29일 원내대책회의에서 \"북한이 매설한 지뢰로 최종 확인된다면 정부가 그에 합당하고 상응하는 조치를 해야 할 것\"이라면서도 \"국민의힘은 최종 결과가 나오기도 전에 사고를 은폐했다고 국가 안보를 정쟁의 제물로 몰고 가고 있다\"고 했다. 한 원내대표는 \"국정조사와 청문회 개최까지 운운하며 진상규명을 요구하던 국민의힘 국방위원들은 정작 어제 현장 방문에는 참여하지도 않았다\"며 \"현", "language": "ko"}, {"title": "한병도 \"조희대, 법원행정처 의견 묵살·재제청 거부 의혹…국감서 설명해야\"", "url": "https://www.newsis.com/view/NISX20260929_0003806598", "source": "뉴시스", "published": "2026-09-29T01:14:55+00:00", "summary": "[서울=뉴시스]정금민 권신혁 기자 = 한병도 더불어민주당 원내대표는 29일 조희대 대법원장이 청와대의 대법관 후보 재제청 요청을 거부한 데 대해 \"민주당은 국정감사를 통해 재제청 거부 결정의 경위와 책임을 철저히 밝히겠다\"고 했다. 한 원내대표는 이날 국회에서 열린 원내대책회의에서 \"조 대법원장의 제청 지연과 협의 없는 제청, 재제청 거부로 인해 역대 최장기 대법관 공백 사태가 무려 210일째 이어지고 있다\"며 이같이 말했다. 그는 \"사법부 수장이 제청권을 권력 투쟁의 무기로 삼는 사이 모든 피해는 재판 지연에 시달리는 우리 국민께", "language": "ko"}, {"title": "진성준, DMZ 폭발사고에 \"군사 대응에 신중 필요…군 상해 목적 단정 어려워\"", "url": "https://www.newsis.com/view/NISX20260929_0003806541", "source": "뉴시스", "published": "2026-09-29T00:59:19+00:00", "summary": "[서울=뉴시스]정금민 기자 = 더불어민주당 소속 진성준 국회 국방위원장은 29일 비무장지대(DMZ)에서 발생한 폭발 사고와 관련해 \"우리 군을 상해할 목적으로 심었다라고 단정하기 어려운 측면이 있다\"고 했다. 진 위원장은 이날 KBS 라디오 '전격시사'에 출연해 \"북한 김정은 (국무)위원장이 적대적 2개의 국가 노선을 채택하면서 이른바 군사분계선(MDL) 부근을 국경선으로 두고 그 국경선 부근을 요새화하겠다는 작업이 계속 진행되어 왔다\"며 이같이 말했다. 진 위원장은 민주당 소속 국회 국방위원들과 함께 육군 25사단 관할 비무장지대", "language": "ko"}, {"title": "靑 \"지뢰사고 현장조사, 군사적 판단…대통령 유엔 연설과 무관\"", "url": "https://www.newsis.com/view/NISX20260929_0003806567", "source": "뉴시스", "published": "2026-09-29T00:55:17+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 청와대는 29일 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 \"이번 지뢰 사고에 대한 군의 현장조사는 대통령의 유엔연설과 전혀 관련이 없다\"고 밝혔다. 청와대 관계자는 이날 지뢰 사고 조사 관련 보도에 대한 취재진의 물음에 \"군의 현장조사는 합참과 유엔사가 현장지휘관들의 건의를 고려해 순전히 군사적 판단에 의해 계획하고 결정한 것\"이라며 이같이 말했다. 합동참모본부는 전날 지난 21일 경기 파주시 육군 25사단 관할지역 내 남측 DMZ에서 발생한 지뢰 폭발 사고에 대해 \"북한군 지뢰일 가능", "language": "ko"}, {"title": "국힘 \"DMZ 지뢰 사고, 北 도발 드러나…대북 굴종 노선 폐기해야\"", "url": "https://www.newsis.com/view/NISX20260929_0003806535", "source": "뉴시스", "published": "2026-09-29T00:50:06+00:00", "summary": "[서울=뉴시스]한은진 우지은 전상우 기자 = 국민의힘은 29일 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 \"정부와 여당은 이번 사태를 계기로 대북 굴종 노선의 폐기를 선언해야 한다\"고 말했다.  정점식 원내대표는 이날 오전 국회에서 원내대책회의를 열고 \"어제 합참에서 DMZ 지뢰 폭발 사고에 대한 1차 합동 현장조사 결과를 발표했다. 예상했던 대로 북한의 저열한 도발행위임이 사실상 확실하게 드러났다\"고 했다. 정 원내대표는 \"다만 합참이 제시한 근거를 보면 북한 매설 지뢰가 확실한데도 최종조사를 언급하면서 북한", "language": "ko"}, {"title": "정점식, 與 '조작기소 특검법' 추진에 \"스스로 탄핵 문 여는 것\"", "url": "https://www.newsis.com/view/NISX20260929_0003806513", "source": "뉴시스", "published": "2026-09-29T00:42:32+00:00", "summary": "[서울=뉴시스]하지현 전상우 기자 = 정점식 국민의힘 원내대표는 29일 여당이 대장동·쌍방울 대북송금 사건 등 윤석열 정부 검찰의 조작기소 의혹을 수사하는이른바 '조작기소 특검법' 처리를 검토하는 것을 두고 \"즉각 중단하지 않으면 스스로 탄핵의 문을 열게 될 것\"이라며 \"공소취소가 곧 정권 취소\"라고 비판했다. 정 원내대표는 이날 오전 국회 원내대책회의에서 \"대법관 제청권 침해, 조희대 대법원장 겁박, 이정현 대검찰청 차장 임명, 공소취소 특검까지 최근 일련의 모든 일들이 이재명 대통령 재판취소 빌드업\"이라고 말했다. 그는 전날 민", "language": "ko"}, {"title": "EU, 北 송도원야영소 제재…\"우크라 아동 이송·사상 교육 관여\"", "url": "https://www.newsis.com/view/NISX20260929_0003806388", "source": "뉴시스", "published": "2026-09-29T00:39:16+00:00", "summary": "[서울=뉴시스]신정원 기자 = 유럽연합(EU)이 우크라이나 전쟁과 관련해 북한 송도원국제소년단야영소를 제재했다. 미국 매체 미국의소리(VOA)에 따르면 EU 이사회는 28일(현지 시간) 관보를 통해 \"러시아의 우크라이나 전쟁과 관련해 개인 10명과 단체 17곳을 추가 제재한다\"고 밝혔다. 이번 대(對)러시아 제재 대상에는 북한 강원도 원산시 송도원구역에 위치한 송도원국제소년단야영소가 포함됐다. 이 외에 러시아 타타르스탄자치공화국의 루스탐 민니하노프 대통령과 우크라이나 점령지의 교육 당국 고위 관리들, 모스크바시 관광위원회, 블라디보", "language": "ko"}, {"title": "與, 미래대응기금 당정협의…\"지방정부 지원 얇아지지 않을 것\"(종합)", "url": "https://www.newsis.com/view/NISX20260929_0003806435", "source": "뉴시스", "published": "2026-09-29T00:30:20+00:00", "summary": "[서울=뉴시스] 이창환 신재현 기자 = 더불어민주당과 정부는 29일 당정협의를 열고 미래대응기금 추진 현황을 보고받고 운용 관련 의견을 공유했다.  김민석 민주당 대표는 이날 오전 국회 의원회관에서 열린 '미래대응기금 관련 당정협의'에 참석해 \"세수가 예상되는 일정한 일시적인 시기에 늘어난 상황에서 그 재원을 어떻게 활용해 세입 변동에 대비하고 국가의 중장기 투자 수요를 뒷받침할 것인가 하는 고민을 당·정이 함께 해야되는 상황\"이라고 말했다. 이어 \"당정 그리고 우리 당에서 함께 중요한 역할을 해오셨고, 앞으로도 해가실 지방자치단체", "language": "ko"}, {"title": "김민석 \"서울시, 지하철 차량기지 인력 더 줄이려 해…안전 우려\"", "url": "https://www.newsis.com/view/NISX20260929_0003806447", "source": "뉴시스", "published": "2026-09-29T00:27:24+00:00", "summary": "[서울=뉴 let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
