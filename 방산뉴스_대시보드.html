적이 나왔다. 22일(현지 시간) 폴리티코는 4명의 소식통을 인용해 \"새 AI 안전 통보 체계(notification mechanism)는 용어가 암시하는 것보다 훨씬 단순하다\"며 \"경제 수장 간 열린 소통 채널을 구축하는 것일 뿐\"이라고 보도했다. 앞서 스콧 베선트 미국 재무장관은 20일 허리펑 중국 국무원 부총리와 회담 후 \"미국이 국가 안보와 관련", "language": "ko"}, {"title": "9월 유로존 소비자 신뢰지수 -16.5·1.0P↓…\"5개월 만에 악화\"", "url": "https://www.newsis.com/view/NISX20260923_0003801757", "source": "뉴시스 경제", "published": "2026-09-23T01:43:31+00:00", "summary": "[서울=뉴시스]이재준 기자 = 유로존 21개국 체감경기를 보여주는 9월 소비자 신뢰지수는 4개월 연속 개선 흐름을 끝내고 시상 예상보다 큰 폭 하락했다. RTT 뉴스와 마켓워치는 23일 유럽연합(EU) 집행위원회 경제금융사무국 전날 발표를 인용, 9월 유로존 소비자 신뢰지수(속보치)가 마이너스 16.5로 전월 마이너스 15.5에서 1.0 포인트 저하했다고 전했다. 시장에서는 마이너스 16.0으로 예상했는데 실제로는 0.5 포인트나 낮았다. 소비자 신뢰지수는 경기 전망과 관련한 가계 심리를 나타내는 주요 선행 지표로, 수치가 높을수록", "language": "ko"}, {"title": "이 대통령, 트럼프와 정상회담…\"핵잠·농축재처리·전작권 협력 의지 확인\"", "url": "https://www.newsis.com/view/NISX20260923_0003801703", "source": "뉴시스", "published": "2026-09-23T01:30:05+00:00", "summary": "[뉴욕·서울=뉴시스]조재완 김지은 기자 = 미국을 방문 중인 이재명 대통령이 22일(현지시간) 도널드 트럼프 대통령과 정상회담을 갖고 핵추진잠수함과 사용후핵연료 재처리, 전시작전권 전환 등 양국 현안을 논의했다.  이 대통령은 이날 오후 유엔총회 참석을 계기로 트럼프 대통령과 30분간 양자회담을 가졌다고 위성락 국가안보실장이 현지 브리핑을 통해 전했다.  위 실장은 \"양 정상은 양국 간 전략투자사업 논의가 큰 진전을 이룬 것을 환영했다\"며 \"또 양 정상은 작년 11월에 발표한 한미정상 공동설명자료를 토대로 핵잠수함 연료, 농축·재처", "language": "ko"}, {"title": "[속보]靑 \"한미 정상, 핵잠·농축재처리·전작권 전환 협력 심화…후속 협의하기로\"", "url": "https://www.newsis.com/view/NISX20260923_0003801688", "source": "뉴시스", "published": "2026-09-23T01:21:54+00:00", "summary": "후속기사가 이어집니다 \n◎공감언론 뉴시스 kje1321@newsis.com", "language": "ko"}, {"title": "[속보]위성락 \"이 대통령·트럼프, 전략투자사업 논의 큰 진전 환영\"", "url": "https://www.newsis.com/view/NISX20260923_0003801660", "source": "뉴시스", "published": "2026-09-23T01:16:21+00:00", "summary": "후속기사가 이어집니다 \n◎공감언론 뉴시스 kje1321@newsis.com", "language": "ko"}, {"title": "[속보] 한미 정상, 핵잠·농축재처리·전작권 협력 등 논의", "url": "https://www.yna.co.kr/view/AKR20260923065900001", "source": "연합뉴스", "published": "2026-09-23T01:15:47+00:00", "summary": "(", "language": "ko"}, {"title": "[속보]위성락 \"이 대통령, 유엔총회 계기 트럼프와 정상회담 진행\"", "url": "https://www.newsis.com/view/NISX20260923_0003801647", "source": "뉴시스", "published": "2026-09-23T01:12:01+00:00", "summary": "후속기사가 이어집니다 \n◎공감언론 뉴시스 kje1321@newsis.com", "language": "ko"}, {"title": "국힘, 이 대통령 '제재 완화-핵 동결 맞교환'에 \"국민 목숨은 협상 카드인가\"", "url": "https://www.newsis.com/view/NISX20260923_0003801531", "source": "뉴시스", "published": "2026-09-23T00:39:01+00:00", "summary": "[서울=뉴시스]한은진 기자 = 국민의힘은 23일 이재명 대통령이 뉴욕타임스(NYT)와의 인터뷰에서 '핵 동결'을 전제로 한 미국의 대북 제재 완화 필요성을 주장하자 \"국민 목숨은 협상 카드인가\"라고 했다.  박충권 수석대변인은 이날 논평을 내고 \"이 대통령이 대한민국 국민의 생명을 흥정 테이블에 올렸다\"며 \"방미 기간 공개된 NYT 인터뷰에서 '제재는 어차피 효과가 없다'며 대북제재와 핵·ICBM 개발 중단을 맞바꾸자고 제안한 것\"이라고 주장했다.  박 수석대변인은 \"김대중 정부의 햇볕정책은 결국 북한에 핵개발 시간만 벌어줬고, 2", "language": "ko"}, {"title": "영화 '실미도' 자막 수정…\"공작원들, 사형수 아닌 일반 민간인\"", "url": "https://www.yna.co.kr/view/AKR20260923049500504", "source": "연합뉴스", "published": "2026-09-23T00:36:51+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 실미도 부대 북파공작원들을 사형수나 무기수 등 범죄자 출신으로 묘사했던 영화 '실미도'의 안내자막이 개봉 23...", "language": "ko"}, {"title": "장동혁 \"추석 밥상 최고의 반찬은 '李 재판 재개'…민심 역류에 '내란' 꺼내\"", "url": "https://www.newsis.com/view/NISX20260923_0003801516", "source": "뉴시스", "published": "2026-09-23T00:33:31+00:00", "summary": "[서울=뉴시스] 이승재 기자 = 장동혁 국민의힘 대표는 23일 추석 연휴를 앞두고 \"국민의 추석 밥상에 올라갈 최고의 반찬은 '이재명 재판 재개'\"라고 했다. 장 대표는 이날 페이스북에 \"이번 추석 국민이 가장 받고 싶은 선물은 '이재명 탄핵'\"이라며 이같이 적었다. 그는 한 언론 보도를 인용해 \"이 대통령, 내란 사건 특별수사본부 구성을 검토한다고 한다\"며 \"김민석 더불어민주당 대표는 '내란 잔불' 운운하며 거들고 나섰다. 이재명과 김민석 환장의 콜라보\"라고 했다. 이어 \"정책이란 정책은 모두 실패했다. 왼쪽도 오른쪽도 모두 등을", "language": "ko"}, {"title": "한화에어로-KAI, 장거리 공대공 유도탄 국산화 '맞손'", "url": "https://www.yna.co.kr/view/AKR20260923045500003", "source": "연합뉴스", "published": "2026-09-23T00:26:29+00:00", "summary": "(서울=연합뉴스) 장하나 기자 = 한화에어로스페이스와 한국항공우주산업(KAI)이 장거리 공대공 유도탄 등 국산 항공무장의 KF-21 보라매 통합...", "language": "ko"}, {"title": "나경원 \"DMZ 폭발에도 '체제 존중' 평화 구걸\" 李대통령 연설 비판", "url": "https://www.newsis.com/view/NISX20260923_0003801499", "source": "뉴시스", "published": "2026-09-23T00:25:34+00:00", " 시스]이종성 기자 = 경기 과천시 '과천 푸르지오 벨라르테'에서 전용면적 99㎡ 1가구가 9억원대에 다시 공급된다. 인근 동일 면적 아파트가 최근 22억원 안팎에 거래된 점을 고려하면 최소 10억원가량의 시세차익이 기대된다. 23일 청약홈에 따르면 과천 푸르지오 벨라르테는 불법행위로 계약이 취소된 전용면적 99㎡B형 1가구를 재공급한다. 공급금액은 9억5218만원이다. 여기에 기존 계약자가 선택했던 발코니 확장과 추가선택품목 2088만원, 시스템에어컨 등 가전옵션 1167만원을 승계해야 한다. 옵션비 3255만원을 포함하면", "language": "ko"}, {"title": "이 대통령, 유엔총회서 \"북미대화 조속 재개\"…남북미중 '당사자 간 대화' 제안도", "url": "https://www.newsis.com/view/NISX20260923_0003801199", "source": "뉴시스", "published": "2026-09-22T22:01:48+00:00", "summary": "[뉴욕=뉴시스] 김지은 기자 = 이재명 대통령이 22일(현지시간) 세계 최대 다자외교 무대인 유엔총회에서 북미 대화의 재개 가능성을 한반도 전쟁 종식과 평화 체제 전환을 위한 대화로 발전시키겠다는 의지를 밝혔다.  이 대통령은 도널드 트럼프 미국 대통령이 언급한 북미 대화가 성사될 수 있는 여건을 조성하는데 집중하면서도 남북한과 미국, 중국 등을 당사자로 한 다자간 대화도 촉구하고 나섰다. 이 대통령은 이날 미국 뉴욕에서 열린 제81차 유엔총회 기조연설을 통해 \"다행히 최근 트럼프 대통령의 결단으로 (대북 대화에 있어) 변화의 가능", "language": "ko"}, {"title": "Fate of Air Force’s China Aerospace Studies Institute up in air", "url": "https://breakingdefense.com/2026/09/air-force-says-china-aerospace-studies-institute-will-continue-despite-civilian-cuts/", "source": "Breaking Defense", "published": "2026-09-22T21:46:08+00:00", "summary": "The China Aerospace Studies Institute will carry on by “leveraging assigned military service members to accomplish its objectives,” according to an Air Force spokesperson.", "language": "en"}, {"title": "U.K. Sending Voyager Tanker To Help Defend Saudi Airspace", "url": "https://www.twz.com/air/u-k-sending-voyager-tanker-to-help-defend-saudi-airspace-trump-tells-un-iran-deal-likely-after-election", "source": "The War Zone", "published": "2026-09-22T21:39:24+00:00", "summary": "The tanker deployment will support Saudi Arabia's defense against Houthi missiles and drones. \n The post  U.K. Sending Voyager Tanker To Help Defend Saudi Airspace  appeared first on  TWZ .", "language": "en"}, {"title": "F-16 fighter jet crashes at US air base in western Germany - Reuters", "url": "https://news.google.com/rss/articles/CBMitgFBVV95cUxQc0FlV0xFS2dRb3p2QnVVUWYweUhEUDhzWUZS };

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
