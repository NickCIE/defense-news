ps://www.newsis.com/view/NISX20260708_0003700182", "source": "뉴시스 경제", "published": "2026-07-08T00:18:23+00:00", "summary": "[세종=뉴시스]임소현 기자 = 농촌진흥청이 국내 최초 농업·산림 관측위성인 농림위성의 영상을 활용해 작황과 재배면적, 병해충, 농업재해 등을 분석하는 농업위성정보 서비스를 본격 추진한다. 인공지능(AI) 기술을 접목해 생산한 위성정보를 농산물 수급관리와 공익직불, 농업재해 대응 등에 활용한다는 계획이다. 농진청은 우주항공청, 산림청과 공동 개발한 차세대중형위성 4호(농림위성)가 성공적으로 발사됨에 따라 농업위성정보 생산과 활용 체계를 본격 가동한다고 8일 밝혔다. 농림위성은 국내 최초의 농업·산림 분야 국가 관측위성으로 전국 농경지", "language": "ko"}, {"title": "재경부, 국고채 장기물 발행비중 조정…원화 국제화 이달 발표", "url": "https://www.newsis.com/view/NISX20260708_0003700155", "source": "뉴시스 경제", "published": "2026-07-08T00:08:33+00:00", "summary": "[세종=뉴시스]여동준 기자 = 재정경제부가 금융·외환시장 안정을 위해 국고채 장기물 발행비중을 조정하고 원화 국제화 로드맵을 이달 중 발표한다. 구윤철 경제부총리 겸 재경부 장관은 8일 오전 서울정부청사에서 관계기관 합동 시장상황점검회의를 열고 최근 금융·외환시장 동향과 대응방향을 논의했다. 회의에는 신현송 한국은행 총재, 권대영 금융위원회 부위원장, 이세훈 금융감독원 수석부원장 등이 참석했다. 참석자들은 수출과 경상수지가 역대 최고 수준을 기록하는 등 경기 호조가 이어지고 있지만 글로벌 정책금리 상승 기대와 외국인 자금 유출 지속", "language": "ko"}, {"title": "22일부터 내년도 '현역병 입영일자 본인선택' 접수", "url": "https://www.newsis.com/view/NISX20260708_0003700154", "source": "뉴시스", "published": "2026-07-08T00:06:02+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 병무청은 오는 22일부터 '2027년도 현역병 입영일자 본인선택' 접수를 시작한다고 8일 밝혔다. 신청대상은 ▲올해 병역판정검사를 받고 현역대상으로 판정받은 2007년생 ▲대학(원) 재학 또는 휴학 사유로 재학생 입영 연기 중인 사람 ▲국외 장기체류로 국외 입영 연기 중인 사람이다. 지역별로 접수일정이 다르고 선착순 마감인 만큼, 사전에 병무청 누리집 공지사항을 확인해야 한다. 병무청 누리집 또는 앱(App)에 접속해 본인 인증 후 '현역병 입영 본인선택원(다음연도 입영일자 선택)'에서 입영일자를 ", "language": "ko"}, {"title": "이재명 대통령, NATO 정상회의 데뷔…“한-NATO 방위산업 파트너십 2.0” 제안 - 외교문화뉴스", "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE91S24xZmJzYWdQd3JHMlpVZ19pZTRzUVpOMVJKRzZKX2tEUHEtMXBMdzJiZWRoVDdvV0Rxc0hMUzJfbnlNWWZoUWdRcnFkTG51MXpTRUMwLXlMMEI2UkJTdE1CMWI?oc=5", "source": "방산 뉴스", "published": "2026-07-07T23:54:54+00:00", "summary": "이재명 대통령, NATO 정상회의 데뷔…“한-NATO 방위산업 파트너십 2.0” 제안    외교문화뉴스", "language": "ko"}, {"title": "Poor B-52 Readiness Creating Testing Challenges For New AGM-181A Nuclear Cruise Missile", "url": "https://www.twz.com/air/poor  협력 강화 방안을 논의하는 한편, 우크라이나 전쟁이 조기 종결돼야 한다고 강조했다.  이 대통령은 이날 오후 앙카라에 도착한 뒤 곧바로 뤼터 사무총장과 회담을 시작했다. 면담으로 닷새 간의 정상외교 일정에 돌입했다", "language": "ko"}, {"title": "지난해 외국인의 대미 순투자 오히려 줄었다", "url": "https://www.newsis.com/view/NISX20260708_0003699934", "source": "뉴시스 경제", "published": "2026-07-07T22:21:18+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 도널드 트럼프 미 대통령이 지난해 관세 정책으로 다른 나라들의 미국 투자를 크게 늘리겠다고 장담했으나 지난해 외국인의 대미 순투자가 오히려 줄었다고 미 뉴욕타임스(NYT)가 7일(현지시각) 보도했다.  미 경제분석국에 따르면 지난해 미국에 대한 신규 외국인 직접 투자가 크게 반등했다. 2024년 1550억 달러에서 지난해 2320억 달러로 증가해 3년 동안 이어진 하락세를 반전시켰다.  이 데이터에는 외국기업의 미국 기업 인수와 외국기업이 새 회사를 설립하고 기존 회사를 확장하는데 쓴 돈도 포함된다.", "language": "ko"}, {"title": "북한 주요 도시 중심에 김정은 찬양 벽화 설치", "url": "https://www.newsis.com/view/NISX20260708_0003699916", "source": "뉴시스", "published": "2026-07-07T21:39:24+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 북한이 김정은 국무위원장을 찬양하는 대형 벽화를 전국 도시 중심부에 세우는 등 개인 숭배를 강화하고 있다고 미국의 북한 전문 매체 NK뉴스(NK NEWS)가 7일(현지시각) 보도했다.  북한은 벽화가 위치한 광장에서 대규모 관제 집회를 열고 있으며 일부 도시의 경우 과거 지도자들의 동상이 있는 광장에서 김정은 찬양 벽화가 있는 광장으로 집회 장소를 옮겼다.   김정은이 미소를 지으며 인민을 이끄는 모습을 담은 이 벽화들은 2024년 이후 14개 도 소재지 및 특별시 가운데 8곳의 번화한 지역 공공 거", "language": "ko"}, {"title": "상반기 수출 반도체·비반도체 '질주'…하반기도 청신호", "url": "https://www.newsis.com/view/NISX20260706_0003696791", "source": "뉴시스 경제", "published": "2026-07-07T21:03:00+00:00", "summary": "[세종=뉴시스]김동현 기자 = 올해 하반기 수출 전망도 맑음이라는 분석이다. 하반기에도 빅테크 기업들의 인공지능(AI) 인프라 투자 확대에 따른 반도체, 정보기술(IT) 품목의 호조세가 예상되는 가운데 반도체 외 품목들의 수출도 양호한 흐름이 기대된다는 관측이 제기된다. 특히 중동전쟁이 마무리 국면에 돌입한 것도 우리나라 수출에 호재다. 중동 전쟁 이후 뚜렷한 감소세를 보였던 중동 지역 수출이 회복될 수 있는데다, 전후 재건이 본격화될 경우 또 다른 수출 기회를 얻을 수 있다는 예상도 나온다. 8일 산업통상부가 발표한 2026년 상", "language": "ko"}, {"title": "Strait of Hormuz threat level raised to 'severe' after Iran attacks tankers using U.S. Navy route", "url": "https://www.cnbc.com/2026/07/07/iran-strait-hormuz-oil-tanker-lng.html", "source": "CNBC", "published": "2026-07-07T20:39:22+00:00", "summary": "Iran's military has warned it will target ships that do not use a northern route approved by Tehran.", " const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
