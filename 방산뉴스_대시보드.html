 몸살을 앓으면서 정작 현역 장병들은 시설 이용에서 소외되고 있다는 지적이 나온다. 국회 국방위원회 소속 김병주 더불어민주당 의원은 20일 충남 계룡대에서 열린 공군본부에 대한 국감에서 공군이 최근 홈페이지를 통해 '매크로 및 비정상적인 행위 금지 공시'를 게시하고 관련 행위에 대한 수사 및 처벌 방침을 안내한 것으로 확인됐다고 밝혔다. 김 의원은 \"군 당국이 체력단련장 예약 시스템이 민간인들의 불법 예약 투기장으로 변질", "language": "ko"}, {"title": "육군 39사단, 호국훈련서 국지도발 대비 실전 대응능력 강화", "url": "https://www.newsis.com/view/NISX20261020_0003833551", "source": "뉴시스", "published": "2026-10-20T06:28:00+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 육군 제39보병사단은 2026년 호국훈련의 일환으로 지난 19일부터 20일까지 경남 일대에서 국지도발 대비 철야훈련을 실시했다고 밝혔다. 이번 훈련은 부대의 전·평시 작전 수행능력을 높이고, 경찰·소방 등 유관기관과 연계한 실전적인 통합방위태세를 확립하는 데 중점을 뒀다. 훈련에서 39사단은 해상과 공중으로 침투하는 적을 조기에 탐지하고 격멸하는 상황을 가정해 지·해·공 합동자산 활용과 통합화력 운용, 민·관·경·소방 합동작전 등을 진행했다. 또 차단선·봉쇄선 점령과 탐색·격멸작전을 실시하며 실제 작", "language": "ko"}, {"title": "與 \"브런슨 사령관 영토주권 훼손 발언에 강한 유감\"", "url": "https://www.newsis.com/view/NISX20261020_0003833563", "source": "뉴시스", "published": "2026-10-20T06:26:41+00:00", "summary": "[서울=뉴시스]권신혁 기자 = 더불어민주당은 20일 \"브런슨 주한미군사령관의 대한민국 영토주권 훼손 발언에 강한 유감을 표한다\"고 밝혔다.  김성회 민주당 원내대변인은 이날 오후 서면브리핑에서 \"브런슨 사령관이 '유엔군사령부 관점에서 볼 때 한국은 비무장지대 남쪽 철책선에서 시작한다'고 발언했다\"며 이같이 말했다.  김 원내대변인은 \"대한민국의 영토·주권에 대한 명백히 잘못된 브런슨 사령관의 발언에 대해 국민적 비판이 쏟아지고 있다\"며 \"우리 정부의 우려 전달에 대해 미국 측도 문제의식에 공감한다는 답변을 보내 온 것으로 알려졌다\"", "language": "ko"}, {"title": "국힘 \"강훈식·김용범·김현지·정진상 국감 나와야\"…내일 운영위서 논의", "url": "https://www.newsis.com/view/NISX20261020_0003833518", "source": "뉴시스", "published": "2026-10-20T06:19:55+00:00", "summary": "[서울=뉴시스] 이승재 전상우 기자 = 국민의힘은 20일 국회 운영위원회 국정감사에 강훈식 전 대통령 비서실장과 김용범 전 청와대 정책실장, 김현지 제1부속실장, 정진상 전 더불어민주당 정무조정실장 등을 증인으로 채택할 것을 요구했다. 김승수 원내운영수석부대표는 이날 국회에서 기자들과 만나 \"강 전 실장은 국정 지지율 하락과 인사 검증 실패에 책임을 지겠다며 물러났다\"며 \"사표 한 장 내는 것으로 책임이 끝나지 않는다\"고 말했다. 김 원내운영수석은 \"인천 흉기 사건, 비무장지대(DMZ) 지뢰 폭발 사고, 해군 장병 실종, 대구 상가", "language": "ko"}, {"title": "전북 490억 방산사업 조건부 통과…탄소기업에 새 기회 - 뉴스프리존", "url": "https://news.google.com/rss/articles/CBMic0FVX3lxTE1SQVZOLWNndmxXMkJ6NmRKbE52V2plaktXN3BjQVdsVXBaQnRJZUk1SW1Ha09NV1BjbkJxWE9nMVotN3JCMmYzc3FmeUV3eDEzVW5tZ2t const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
