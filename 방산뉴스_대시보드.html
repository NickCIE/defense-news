 국민의힘 유용원 의원은 18일 우리 군 미사일방어체계의 핵심 자산인 국산 중거리지대공유도무기 '천궁-Ⅱ'를 러...", "language": "ko"}, {"title": "\"예술강사 예산 증액 약속 이행하라\"…학비노조 단식농성", "url": "https://www.newsis.com/view/NISX20260818_0003752440", "source": "뉴시스", "published": "2026-08-18T05:00:00+00:00", "summary": "[서울=뉴시스]정예빈 기자 = 전국학교비정규직노동조합(학비노조)은 18일 \"이재명 대통령은 학교예술강사 예산 증액 약속을 이행하라\"며 무기한 단식농성에 돌입했다. 학비노조는 이날 오후 2시 기자회견을 열고 \"지난 몇 년간 계속된 국고 삭감으로 학교예술강사지원사업은 심각한 위기에 놓였다\"며 \"청와대는 문화체육관광부·교육부·기획예산처가 참여하는 범정부 협의를 즉각 추진하고, 2027년 정부예산안에 학교예술강사지원사업 예산 증액과 예술강사 처우개선 예산을 반드시 반영하라\"고 촉구했다. 학교예술강사지원사업은 예술가가 직접 학교를 찾아 학생", "language": "ko"}, {"title": "[쇼츠] 핵어뢰 '포세이돈' 6발 탑재…러 잠수함 '하바롭스크' 시험운항", "url": "https://www.yna.co.kr/view/AKR20260818088200704", "source": "연합뉴스", "published": "2026-08-18T04:53:09+00:00", "summary": "(서울=연합뉴스) 초장거리 무인 핵어뢰 '포세이돈'을 운용할 수 있는 러시아의 신형 핵잠수함이 처음으로 시험 운항에 나선 것으로 전해졌습니다.", "language": "ko"}, {"title": "이재명 대통령,\"견고한 한미동맹과 자주적인 국방 역량 강화는 서로 필요충분 조건\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260818_0003752582", "source": "뉴시스", "published": "2026-08-18T04:17:30+00:00", "summary": "[서울=뉴시스]조성봉 김지은 김진아 김경록 기자 = 이재명 대통령이 18일 \"우리 자신의 힘을 키워야 동맹으로서의 가치와 필요성도 더 커지게 된다\"며 임기 내 전시 작전권 환수와 국군사관학교 창설 준비 등을 차질 없이 진행할 것을 지시했다. 이 대통령은 이날 청와대에서 주재한 을지국무회의에서 \"견고한 한미동맹과 자주적인 국방 역량 강화는 서로 필요충분 조건\"이라며 이같이 말했다. 최근 도널드 트럼프 미국 대통령이 한미 연합훈련인 '을지 자유의 방패(UFS)' 축소를 미 국방부에 지시한 가운데 한미동맹과 함께 자주국방의 중요성을 강조", "language": "ko"}, {"title": "中 \"'훈련 축소' 트럼프, 北과 '직접 외교' 복귀 신호\"…반론도", "url": "https://www.newsis.com/view/NISX20260818_0003752447", "source": "뉴시스", "published": "2026-08-18T04:01:30+00:00", "summary": "[베이징=뉴시스]박정규 특파원 = 한국과 미국의 정례 연합훈련인 '을지 자유의 방패'(을지프리덤실드·UFS) 연습 축소를 도널드 트럼프 미국 대통령이 언급한 것은 북한과의 직접 외교에 복귀하겠다는 뜻을 내비친 것이라는 분석을 중국 관영매체가 보도했다. 다만 한편으로는 이 같은 트럼프의 언급이 실제 지역 정세 완화를 위한 제스처가 아니라 외교적 수법일 수 있다는 분석도 나온다. 중국 관영 영문매체 글로벌타임스는 17일 \"이날 시작될 예정인 미국과 한국의 군사훈련을 몇 시간 앞두고 트럼프 대통령은 핵심 지역 동맹국인 한국과의 군사훈련을", "language": "ko"}, {"title": "Liverpool's new-look defence will take time to gel, says Van Dijk - Reut const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
