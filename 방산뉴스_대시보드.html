 후 첫 국회 교섭단체 대표 연설을 진행했다. 정 원내대표는 이날 국회 본회의 교섭단체 대표연설에서 이재명 정부를 '국민암장정부'라고 규정하며 전방위적 공세를 이어갔다. 정부 부동산 정책과 단일종목 레버리지 ETF(상장지수펀드), 호남 반도체 메가프로젝트와 내년도 820조 예산안, 한미연합훈련 축소 및 대북 정책 등을 놓고 '국민 약탈' '대국민 인질극'이라며 비판을 쏟아냈다. 전날 김민석 더불어민주당 대표가 개헌 필요성을 언급한 것에는 \"이번 정부에서 개헌은", "language": "ko"}, {"title": "정부, 독도 등 '국토외곽 먼섬' 43곳에 5년간 1.1조 투입", "url": "https://www.newsis.com/view/NISX20260908_0003780645", "source": "뉴시스", "published": "2026-09-08T03:00:00+00:00", "summary": "[서울=뉴시스] 강지은 기자 = 정부가 육지로부터 멀리 떨어진 섬 43곳에 대해 5년간 식수원 개발 등 약 1조1000억원을 투입한다. 행정안전부는 국경에 위치한 국토외곽 먼섬 43곳 주민의 정주 여건 개선을 위해 이러한 내용의 '국토외곽 먼섬 종합발전계획'을 수립·확정했다고 8일 밝혔다. 이는 올해 1월 '울릉도·흑산도 등 국토외곽 먼섬 지원 특별법'을 제정한 데 이은 후속 조치이기도 하다. 이번 계획은 국토외곽 먼섬을 대상으로 하는 첫 국가 계획이다. 올해부터 2030년까지 5년간 138개 사업에 1조942억원을 투입하며, 향후", "language": "ko"}, {"title": "정점식 \"이번 정부에서 개헌 없다…레버리지 ETF 특검으로 윗선 밝혀야\"(종합)", "url": "https://www.newsis.com/view/NISX20260908_0003780722", "source": "뉴시스", "published": "2026-09-08T02:55:16+00:00", "summary": "[서울=뉴시스]김지훈 하지현 우지은 전상우 기자 = 정점식 국민의힘 원내대표는 8일 \"지금 정부와 여당의 국정과제 1호는 대통령의 자기 죄 지우기\"라며 \"이번 정부에서 개헌은 없다\"고 했다. 단일종목 레버리지 ETF에 대해서는 \"특검으로 상품 도입에 권력의 압박이 있었는지, 윗선이 따로 있는지, 왜 지방선거 직전에 출시됐는지 밝혀야 한다\"고 했다.   정 원내대표는 이날 국회 본회의 교섭단체 대표 연설에서 \"최근 개각에서 대통령 공소취소 모임의 수장이자, 신약 사기 의혹의 관련자가 법무부 장관 후보자가 됐다\"라며 이같이 말했다.  ", "language": "ko"}, {"title": "폴란드 집결하는 K방산… ‘한국산 방공망’으로 유럽 뚫는다 - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxPaVJrQ0tUUV82NzlsVTFIUFFHWHdfWFl5dEVnTVA4UWlnMUU4djFSWFpqWnJwcDZON3ZZQUQ5ZFZyNXhzeC1KalJ1XzJoM2RjWWswQ3pJUnRFVzZ5dERFaGVka291RjFvMXNLMTB0ZlJKM0dfNGlsakNXUi1ubWdZeDA0MTHSAZgBQVVfeXFMTUViNVdZVGxPUG5VRUx3UjRENDVnOWprTnRZQXlzZkdJVGt3bjZFa0M5aE1hdV9UWTZmRFdpdTdzV2xJV1FUQkdta0Jnckl6QTNjTkc3MndkYk42TjlCeFJCQ1dtbUVkdFVhdng1c2JURnVyVzdhVDFQcWhmQlNXcUtVSzlVNHhKaDJkQ3FBWmE5T01jRVNIN0I?oc=5", "source": "조선비즈", "published": "2026-09-08T02:35:13+00:00", "summary": "폴란드 집결하는 K방산… ‘한국산 방공망’으로 유럽 뚫는다 - 조선비즈    Chosunbiz", "language": "ko"}, {"title": "필리핀 국방장관 만난 HD현대 정기선, 조선· 43+00:00", "summary": "(서울=연합뉴스) 미국 캘리포니아주의 한 공항에서 조종석이 없는 검은색 대형 비행체가 포착됐습니다.", "language": "ko"}, {"title": "美 해상봉쇄에 이란 '돈줄' 마른다…원유 수출 막히고 경제 압박 가중", "url": "https://www.newsis.com/view/NISX20260908_0003780276", "source": "뉴시스 경제", "published": "2026-09-08T01:41:32+00:00", "summary": "[서울=뉴시스]박미선 기자 = 미국의 해상 봉쇄로 이란의 원유 수출이 사실상 중단되면서 이란 경제에 대한 압박이 커지고 있다. 중국에 공급할 수 있는 해상 비축 원유도 빠르게 줄어 이르면 다음 달 소진될 것으로 전망된다. 7일(현지 시간) 월스트리트저널(WSJ)에 따르면 선박 추적업체 케이플러는 미국 해군이 지난 7월 중순 이란에 대한 해상 봉쇄를 재개한 이후 봉쇄선을 통과한 이란산 원유가 한 건도 없다고 밝혔다. 이란은 여전히 일부 원유를 유조선에 싣고 있지만 봉쇄로 인해 페르시아만 밖으로 운송하지 못하고 있다. 지난 8월 이란이", "language": "ko"}, {"title": "정점식 \"국민 삶 약탈하는 李 부동산 정책 전면 폐기해야…레버리지 ETF 특검\"", "url": "https://www.newsis.com/view/NISX20260908_0003780478", "source": "뉴시스", "published": "2026-09-08T01:36:29+00:00", "summary": "[서울=뉴시스]하지현 우지은 권신혁 기자 = 정점식 국민의힘 원내대표는 8일 이재명 정부를 향해 \"국민의 삶을 약탈하는 부동산 정책을 전면 폐기하라\"고 촉구했다.  최근 급격한 주가 변동의 원인으로 지목되는 단일종목 레버리지 ETF 등을 두고도 \"국민이 피눈물을 흘리고 있다\"며 국정조사와 특검을 촉구했다. 정 원내대표는 이날 오전 국회 교섭단체 대표연설에서 \"우리 국민이 부동산으로 대장동 일당처럼 1000배 수익을 원하는 것이 아니다\"라며 \"열심히 일해서 내 집 마련하고, 더 좋은 환경에서 아들딸 키우고 노후 대비 좀 하겠다는 것이", "language": "ko"}, {"title": "체코 부총리 겸 국방장관, LIG D&A 판교 사옥 방문 - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxPd0FHOUxSS2g0dzVaQ2dGWGdOZUFkakw3SFF4dWlmaG9uNElkSnNSTHU0NTNkS2xNd0Z4RlZDM2g2VGw4OWdmcGZfQUpEZDJmWnNBOWN4RHF3Z2UtZFVmZlpPX194VURDSElkdzZMZW5QTUVwU0Q5VHFuV3A2ZVBKTzBQZzDSAZgBQVVfeXFMT1Q0b3dJZTZ3MWlnTjhUZjcxbHpoLS1ZWk82cUQwbkJCcms4VVBxMVZyUnp2anVjUTR2V0dHOUQ0QWtDWWE5T2daSi1WWHlud3ZJYm9KYmdRb2o3bjZIQVR3MjZUSnd0ckU5RXNwaTJkM1FKVTV2YktmZW5XVFZuRE5ScjR0WXRWazYxVDc0aFcyaUFnTzRXQWg?oc=5", "source": "조선비즈", "published": "2026-09-08T01:35:00+00:00", "summary": "체코 부총리 겸 국방장관, LIG D&A 판교 사옥 방문 - 조선비즈    Chosunbiz", "language": "ko"}, {"title": "이 대통령 \"확고한 억제력 기반 대화 통해 한반도 평화공존 노력 흔들림 없이 지속\"", "url": "https://www.newsis.com/view/NISX20260908_0003780509", "source": "뉴시스", "published": "2026-09-08T01:32:22+00:00", "summary": "[서울=뉴시스]김경록 기자 = 이재명 대통령은 8일 \"확고한 억제력에 기반한 신뢰와 대화를 통해 한반도 평화 공존과 공동 번영을 위한 노력도 흔들림 없이 지속해나갈 것\"이라고 밝혔다. 이 대통령은 이날 서울에서 열린 '2026 서울안보대화' 영상 축사를 통해 \"대한민국은 자주국방 역량을 바탕으로 상호 존중과 협력을 통해 평화와 번영을 위한 대화의 지평을 더욱 넓혀가고 있다\"며 이같이 말했다. 이 대통령은 \"오늘날 국제안보환경은 전례없는 복합위기에 직면해있다\"며 \"이러한 문제들은 어느 한 국가의 노력만으로 해결하긴 어렵다\"고 했다. ", "language": "ko"}, {"title": "생수업체 부담금 40% 낮춘 정부, 제도 다시 손질…인상·대상 확대도 검토", "url": "https://www.newsis.com/view/NISX20260908_0003780015", "source": "뉴시스 경제", "published": "2026-09-08T01:29:31+00:00", "summary": "[세종=뉴시스]임소현 기자 = 정부가 생수업체 등에 부과하던 수질개선부담금을 지하수이용부담금으로 통합해 요율을 40% 낮춘 데 이어 지하수 보전·관리 재원 체계 전반을 다시 손질한다. 부담금 인상이나 부과 대상 확대 가능성까지 열어놓고 전국 지방정부의 징수·집행 실태를 점검한다. 8일 관계부처에 따르면 기후에너지환경부는 '지하수 보전·관리 재원 확보 방안 마련 연구'를 추진해 내년 중 제도 개선안을 발표할 전망이다. 정부는 현재 지하수의 적정한 개발·이용과 보전·관리, 먹는 물 수질관리에 필요한 재원을 확보하기 위해 지하수이용부담금", "language": "ko"}, {"title": "코오롱글로벌, AI·드론 등 혁신기술 6건 현장 실증", "url": "https://www.newsis.com/view/NISX20260908_0003780258", "source": "뉴시스 경제", "published": "2026-09-08T01:25:29+00:00", "summary": "[서울=뉴시스]이종성 기자 = 코오롱글로벌이 인공지능(AI), 드론, 토공 자동화부터 친환경 건축기술까지 외부 혁신기술 6건을 실제 건설현장에서 실증한다. 코오롱글로벌은 올해 오픈 이노베이션을 통해 총 6건의 외부 혁신기술에 대한 실증과 개념검증을 진행한다고 8일 밝혔다. 외부 기술기업의 혁신기술과 코오롱글로벌이 축적한 현장 경험 및 인프라를 결합해 현장 적용성과 사업화 가능성을 검토한다는 계획이다.  이번 실증은 국토교통부의 '스마트건설 기술실증 지원사업' 4건과 창업진흥원이 주관하는 초격차 스타트업 프로젝트 '이노웨이브' 2건으", "language": "ko"}, {"title": "ETRI-육사, 'AI 인글라스' 등 미래 국방기술 개발 맞손", "url": "https://www.yna.co.kr/view/AKR20260908057900063", "source": "연합뉴스", "published": "2026-09-08T01:23:50+00:00", "summary": "(대전=연합뉴스) 김준호 기자 = 한국전자통신연구원(ETRI)은 육군사관학교와 인공지능(AI) 기반 미래 국방기술 공동연구와 군 운용개념 정립·...", "language": "ko"}, {"title": "해군, 첨단과학기술 기반 해양 무인체계 발전 방안 모색", "url": "https://www.newsis.com/view/NISX20260908_0003780471", "source": "뉴시스", "published": "2026-09-08T01:20:33+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 해군이 인공지능(AI)과 첨단과학기술을 기반으로 유·무인 전력을 통합 운용하는 '네이비 씨 고스트(Navy Sea GHOST)' 발전 방안을 논의했다. 해군은 8일 대전 카이스트(KAIST) 문지캠퍼스에서 카이스트, 국방과학연구소(ADD), 선박해양플랜트연구소(KRISO)와 공동으로 '네이비 씨 고스트 발전 콘퍼런스'를 개최했다고 밝혔다. '네이비 씨 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
