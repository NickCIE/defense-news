자가 언론 앞에 선 것은 이번이 처음이다.  강 후보자는 우선 사관학교 통합", "language": "ko"}, {"title": "Iran strikes Kuwait as Trump says renewed Mideast hostilities will not last 'too long'", "url": "https://www.cnbc.com/2026/09/03/us-iran-war-trump-hormuz-israel-middle-east-europe-kuwait.html", "source": "CNBC", "published": "2026-09-03T06:33:19+00:00", "summary": "On Thursday, Kuwait's army said it was confronting hostile missile and drone attacks from Iran.", "language": "en"}, {"title": "[영상] 美 차기 호위함 '3파전'… 한국·일본·튀르키예 '불꽃 경쟁'", "url": "https://www.yna.co.kr/view/AKR20260903128500704", "source": "연합뉴스", "published": "2026-09-03T06:20:11+00:00", "summary": "(서울=연합뉴스) 미국이 해외 발주할 해군 함정에 한국, 일본, 튀르키예의 유도미사일 호위함이 검토 대상이라고 미 해군 전문매체 USNI 뉴스가...", "language": "ko"}, {"title": "美상무 \"앤트로픽, 요구한 것 다 이행해…이제 신뢰\"", "url": "https://www.newsis.com/view/NISX20260903_0003775013", "source": "뉴시스 경제", "published": "2026-09-03T06:19:45+00:00", "summary": "[서울=뉴시스]고재은 기자 = 하워드 러트닉 미국 상무장관이 인공지능(AI) 안전장치 등을 두고 수개월 동안 갈등을 벌였던 앤트로픽을 이제 신뢰한다고 밝혔다.  러트닉 장관은 2일(현지 시간) 공개된 액시오스와 인터뷰에서 다리오 아모데이 앤트로픽 최고경영자(CEO)를 신뢰하느냐는 질문에 \"신뢰한다\"고 답했다.  그는 \"그들은 우리가 요구한 것을 이행했다\"며 \"다시 올바른 방향으로 돌아왔다. 따라서 답은 '그렇다' 이다\"라고 말했다.  이번 발언은 국가 안보와 AI 안전 규제를 둘러싸고 격렬하게 갈등을 빚었던 앤트로픽과 도널드 트럼프", "language": "ko"}, {"title": "강신철, 사관학교 통합 동의 여부에 \"다양한 의견·우려 안다\"(종합)", "url": "https://www.yna.co.kr/view/AKR20260903043451504", "source": "연합뉴스", "published": "2026-09-03T06:05:02+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 강신철 국방부 장관 후보자는 3일 육·해·공군 3군 사관학교 통합 문제에 대해 \"다양한 의견과 우려가 있는 것...", "language": "ko"}, {"title": "29년간 헌혈 400회…육군 39사단 진기주 상사 '생명나눔' 귀감", "url": "https://www.yna.co.kr/view/AKR20260903120600052", "source": "연합뉴스", "published": "2026-09-03T06:03:10+00:00", "summary": "(함안=연합뉴스) 박영민 기자 = 육군 제39보병사단 소속 진기주 상사가 29년간 헌혈을 이어오며 400회 헌혈을 달성해 귀감이 되고 있다.", "language": "ko"}, {"title": "국방차관, 병영생활전문상담관 만나 \"정신건강, 첨단무기 개발만큼 중요\"", "url": "https://www.newsis.com/view/NISX20260903_0003775157", "source": "뉴시스", "published": "2026-09-03T05:52:37+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 이두희 국방부 차관이 병영생활전문상담관을 만나 이들의 업무가 첨단 무기 개발 이상으로 중요하다는 점을 강조했다.  국방부는 이두희 차관이 3일 국방컨벤션에서 병영생활전문상담관 9명을 초청해 격려 행사를 개최하고 국방부장관 명의의 감사장을 수여했다고 밝혔다.  병영생활전문상담관 제도는 2005년 장병의 기본권 보장 등을 위해 도입됐다. 현재 각 군에 740명(정원 기준)을 배치해 운영 중이다.  이 차관은 이날 각 부대에서 장병 인권 향상과 고충해소를 위한 든든한 버팀목이 돼주고 있는 병영생활전문상담관", "language": "ko"}, {"title": "러 교통장관 \"북러 첫 도로 교량 조만간 개통 예정\"", "url": "https://www.newsis.com/view/NISX20260903_0003774919", "source": "뉴시스", "published": "2026-09-03T05:23:24+00:00", "summary": "[서울=뉴시스] 이재우 기자 = 북한과 러시아를 연결하는 첫 도로 교량이 조만간 개통될 것으로 보인다. 양국을 직접 잇는 육상 통로는 현재 철도교인 '우정의 다리'가 유일하다. 안드레이 니키틴 러시아 교통장관은 3일 블라디보스톡에서 열린 동방경제포럼(EEF) 행사에서 타스통신과 한 인터뷰에서 북한과 러시아를 잇는 교량과 하산 도로 국경검문소가 매우 가까운 시일 내에 개통될 것으로 예상된다고 밝혔다. 그는 \"우리는 러시아와 북한을 잇는 교량과 이에 수반되는 하산 도로 국경검문소를 매우 가까운 시일 내에 개통할 계획\"이라며 \"이를 통해", "language": "ko"}, {"title": "'남로당 총책' 김삼룡 유족 \"불법 군사재판에 처형…진상규명 요청\"", "url": "https://www.newsis.com/view/NISX20260903_0003775017", "source": "뉴시스", "published": "2026-09-03T05:17:26+00:00", "summary": "[서울=뉴시스]이태성 기자, 김혜림·이지우 인턴기자 = 남로당 조직총책으로 활동하다가 한국전쟁 발발 이후 국군에 의해 총살된 김삼룡씨의 유족이 민간인에 대한 군사재판은 불법이라며 진실·화해를위한과거사정리위원회(진실화해위)에 진상규명을 요청했다. 국내에 거주하는 김씨의 조카 김광영씨, 충북역사문화연대 등 단체는 3일 오전 서울 중구 진실화해위 앞에서 기자회견을 열고 이같이 밝혔다. 유족 등에 따르면 김씨는 1910년 충북 충주군 엄정면 용산리에서 출생했다. 일제강점기 경성 트로이카에 참여하고, 경성 콤그룹을 조직했다. 광복 후에는 남", "language": "ko"}, {"title": "해경·육군, 야간 밀입국 합동훈련…해상 이중 감시 점검", "url": "https://www.yna.co.kr/view/AKR20260903109900062", "source": "연합뉴스", "published": "2026-09-03T05:15:42+00:00", "summary": "(동해=연합뉴스) 유형재 기자 = 동해해양경찰서는 지난 2일 육군 제23경비여단과 야간 해상 밀입국 차단을 위한 군·경 합동훈련을 실시했다고 3...", "language": "ko"}, {"title": "제78주년 국군의 날 행사 내달 1일 계룡대서 개최…시가행진 안 열려", "url": "https://www.newsis.com/view/NISX20260903_0003775003", "source": "뉴시스", "published": "2026-09-03T05:10:17+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부는 10월 1일 충남 계룡대 활주로에서 제78주년 국군의 날 기념행사를 개최한다고 3일 밝혔다.  올해 행사는 '자주국방 실현! 대체불가 국군'을 주제로 열린다. 국방부는 우리 군의 자주국방 역량과 국민에게 신뢰받는 대체불가 국군의 모습을 국민에게 보여줄 예정이다.  국방부는 \"올해는 특히 국민과의 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
