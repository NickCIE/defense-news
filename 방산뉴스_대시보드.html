mbers", "url": "https://breakingdefense.com/2026/09/eu-chief-calls-for-new-hybrid-response-protocol-increased-defense-ties-to-non-members/", "source": "Breaking Defense", "published": "2026-09-16T13:32:14+00:00", "summary": "The security protocol could offer a solution when a state faces a significant security threat that is not clearly armed aggression, including cyberattacks, the severing of undersea cables, or the protection of critical infrastructure.", "language": "en"}, {"title": "軍 주관 무인기 시연행사서 '첨단드론' 추락 속출(종합)", "url": "https://www.yna.co.kr/view/AKR20260916061551504", "source": "연합뉴스", "published": "2026-09-16T12:58:42+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 국방부가 개최한 첨단드론 기술 시연회에서 민간 업체들이 개발한 드론들이 잇따라 추락해 군 당국이 원인 조사에 ...", "language": "ko"}, {"title": "How the industrial base is responding to Air Force, Space Force needs", "url": "https://breakingdefense.com/2026/09/how-the-industrial-base-is-responding-to-air-force-space-force-needs/", "source": "Breaking Defense", "published": "2026-09-16T12:34:00+00:00", "summary": "[Sponsored] Demand signals from leadership are shaping investments in design, engineering and manufacturing.", "language": "en"}, {"title": "\"해외파견 北노동자 최대 10만명…러 공장서 군용드론 생산도\"", "url": "https://www.yna.co.kr/view/AKR20260916134800504", "source": "연합뉴스", "published": "2026-09-16T12:00:01+00:00", "summary": "(서울=연합뉴스) 민선희 기자 = 북한이 러시아의 드론 공장에 노동자를 파견해 러시아를 위한 군용 드론을 생산하고 있는 것으로 조사됐다.", "language": "ko"}, {"title": "\"해외 北노동자, 지난해 최대 1조 수익 창출…러 드론공장 파견\"", "url": "https://www.newsis.com/view/NISX20260916_0003792412", "source": "뉴시스", "published": "2026-09-16T12:00:00+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 지난해 해외에 파견된 북한 노동자들이 최소 17개국에서 최대 1조700억원 규모의 수익을 창출한 것으로 파악된다는 보고서가 나왔다. 또 북한 노동자들의 러시아 파견이 확대되는 가운데, 드론 제조 공장과 무기 공장 등으로도 파견이 이뤄지고 있다.  외교부는 16일 '다국적제재모니터링팀(MSMT)'이 이같은 내용의 북한 해외 노동자 파견 관련 보고서를 발간했다고 밝혔다.  MSMT는 유엔 안보리 대북제재 이행을 지원하기 위한 다자간 모니터링 메커니즘으로, 한국·미국·일본 등 11개국이 참여하고 있다.  ", "language": "ko"}, {"title": "Russia says there is still time to stop an arms race in space after US orbital weapons admission - Reuters", "url": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxQT0lqRVFBdVlKZ2cyTnN4NXFrb1VKa0ZKUHVWVWhqVHBIdHBPR3UtQnlfWnBCTzVTZE5PcUxTQVlQaXAxcmJaQno5WUlVY3JQSVZkX0JkemVFY1R2ZFhWendZRkF6SHVJYmVHVEVJb25FcmdvcEpzdXIzZklUSUxCV2ZKS25YcVFlcDNMX2thNk5ab2tqVEJNS2JqcENVeXhvMTF0b1d0RWE4NUlWeTVvczhfQm11SGdwOS1TNWpOZW53dkpIbkN3U1gtRG42WjRlWE1uMTZORmRlUWc?oc=5", "source": "Reuters", "published": "2026-09-16T11:59:44+00:00", "summary": "Russia says there is still time to stop an arms race in space after US orbital weapons admission    Reuters", "language": "en"}, {"title": "\"목에 칼 들어와도 주적이라 할 줄\"…국방장관 청문회 장군 출신들 설전", "url": "https://www.newsis.com/view/NISX20260916_0003792779", "source": "뉴시스", "published": "2026-09-16T11:29:07+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 국회 국방위원회 인사청문회에서 과거 육군대학 시절 스승과 제자 사이였던 강선영 국민의힘 의원과 강신철 국방부 장관 후보자가 대립하며 강 의원이 강 후보자의 자진사퇴를 공식 요구했다. 강 의원은 16일 열린 국방부 장관 후보자 인사청문회에서 \"오늘 하루만 12시까지 시간을 보내면 이 어려운 시간이 지나가리라 생각하느냐\"며 \"진심으로 말씀드리는데 사퇴하라\"고 촉구했다. 강 의원은 육군대학 시절 자신의 공격교관이었던 강 후보자와의 인연을 언급하며 안타까움을 나타냈다.강 의원은 \"제가 기억하는 자랑스러운 모", "language": "ko"}, {"title": "北, 한미 대량살상무기 회의 반발…\"핵무력법 발동 요건 간주될 수도\"", "url": "https://www.newsis.com/view/NISX20260916_0003792777", "source": "뉴시스", "published": "2026-09-16T11:25:20+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한 국방성은 16일 한미 대량살상무기대응위원회(CWMDC)에 반발하며 자국 '핵무력정책법' 발동 요건에 해당하는 것으로 간주할 수 있다고 위협했다. 북한 국방성 대변인은 이날 대외매체 조선중앙통신에 발표한 입장문에서 \"간과할 수 없는 것은 미국과 한국이 그 누구의 '대량살육무기 위협'을 전면에 내걸고 대조선(북한) 군사력 사용을 전제로 하는 연합방위태세의 강화에 대해 떠든 것\"이라고 했다. 대변인은 \"이는 조선반도 유사시 우리 국가에 대한 핵 및 생화학무기 사용을 기정사실화하고 그 실행을 위한 실", "language": "ko"}, {"title": "靑, 3실장 동시교체 보도에 \"결정된 바 없어…추측 기사 신중해달라\"", "url": "https://www.newsis.com/view/NISX20260916_0003792770", "source": "뉴시스", "published": "2026-09-16T11:08:49+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 청와대는 16일 이재명 대통령이 다음 달 중 '청와대 3실장'을 새로 임명하는 인적쇄신 방안을 검토하고 있다는 보도에 대해 \"결정된 바 없다\"고 밝혔다. 청와대는 이날 입장문을 내고 \"인사 관련 사안은 결정된 바 없으며 확인이 어렵다 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
