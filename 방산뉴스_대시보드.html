", "published": "2026-10-08T06:54:01+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 대한민국재향군인회(향군)가 8일 북한의 서부전선 비무장지대(DMZ) 지뢰도발을 규탄하고 책임자 처벌과 즉각적인 사과를 촉구했다. 향군은 이날 서울 코엑스 마곡 컨벤션센터에서 제74주년 재향군인의 날 기념식을 개최한 데 이어 ‘북한 DMZ 지뢰도발 규탄 결의대회’를 열었다. 향군은 결의대회에서 지난달 21일 서부전선 DMZ에서 발생한 지뢰 폭발 사고와 관련해 \"북한이 대한민국 영토를 침범해 매설한 지뢰에 의한 것\"이라며 \"한반도 평화를 해치는 결코 용납할 수 없는 중대한 무력도발\"이라고 규정했다. 이어", "language": "ko"}, {"title": "김여정, 韓 대북의료지원 구상에 \"정치적 도발…관계 되돌리려면 존중·배려 보여야\"(종합)", "url": "https://www.newsis.com/view/NISX20261008_0003819417", "source": "뉴시스", "published": "2026-10-08T06:35:59+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 김여정 북한 노동당 총무부장은 8일 한국 정부의 대북 의료장비 지원 구상을 \"정치적 도발\"로 규정했다. 또 남북 관계를 복원하려면 \"최대한의 존중\"을 보이라고 밝혔다.  김 부장은 이날 대외매체 조선중앙통신을 통해 공개한 담화에서 통일부가 북한 평양 강동군병원에 약 93억원 상당의 의료장비를 발송하는 계획과 관련해 유엔 안전보장이사회 대북제재위원회로부터 제재 면제를 승인 받은 사실을 언급했다. 김 부장은 \"조선반도 정세를 중태에 빠뜨리는 자작 광대극으로 세상을 소란케 한 불량배들이 이번에는 갑자기 ", "language": "ko"}, {"title": "이 대통령 \"한-이집트, CEPA 협상 개시\"…전략적 동반자 관계 격상 [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20261008_0003819376", "source": "뉴시스", "published": "2026-10-08T06:25:12+00:00", "summary": "[서울=뉴시스]김진아 김지은 기자 = 이재명 대통령은 8일 국빈 방한한 압델 파타 알시시 이집트 대통령과 정상회담을 하고 양국 관계를 전략적 동반자 관계로 격상하는 한편 포괄적 경제동반자협정(CEPA) 협상을 개시하기로 합의했다. 이 대통령은 이날 청와대에서 열린 '한-이집트 정상회담' 직후 공동 언론 발표를 통해 \"그간의 합의를 양국 국민이 체감할 수 있는 실질적인 성과로 구체화해 나가기로 했다\"며 이같이 말했다. 이어 \"이번 회담을 계기로 양국은 크게 다섯 가지 분야에서 의미 있는 성과를 거두었으며, 총 12건의 협력 문건을 체", "language": "ko"}, {"title": "강신철, 맥코믹 美 상원의원 접견…조선 협력 확대 논의", "url": "https://www.newsis.com/view/NISX20261008_0003819384", "source": "뉴시스", "published": "2026-10-08T06:21:26+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철 국방부 장관은 8일 오전 데이브 맥코믹 미국 연방 상원의원을 접견하고, 한미동맹과 역내 안보정세 및 주요 동맹현안에 대해 논의했다.  강 장관은 우선 한미동맹이 역내 평화와 안정을 지켜온 핵심축이라는 점을 강조했다. 또한 우리 군이 국방역량 지속 강화를 통해 보다 많은 책임과 역할을 해 나갈 것이라며 앞으로도 미 의회가 한미동맹의 굳건한 지지자의 역할을 해주기를 당부했다.  강 장관은 한화 필리조선소가 맥코믹 의원의 지역구인 펜실베이니아에 위치한 것을 언급하며 한미 조선 협력에 지속적인 관심과", "language": "ko"}, {"title": "노종면 '부평 캠프마켓 日군용동굴' 공개…\"유산가치 평가해야\"", "url": "https://www.yna.co.kr/view/AKR20261008134300001", "source": "연합뉴스", "published": "2026-10-08T06:13:48+00:00", "summary": "(서울=연합뉴스) 박경준 기자 = 일제 강점기 당시 일본군의 무기공장으로 쓰였던 인천 부평미군기지(캠프마켓)와 그 일대에 일제가 만든 지하시설 ...", "language": "ko"}, {"title": "인천공항공사, '장애인 자립 지원' 굿윌스토어 5호점 개소", "url": "https://www.newsis.com/view/NISX20261008_0003819205", "source": "뉴시스 경제", "published": "2026-10-08T05:49:24+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 인천국제공항공사는 발달장애인의 일자리 창출과 자립을 지원하기 위해 굿윌스토어 밀알인천검단점을 개소했다고 8일 밝혔다. 이 곳은 공사의 후원으로 건립된 5호 매장이다. 발달장애인 직원 4명을 포함해 총 8명이 채용됐다. 이로써 1~4호점을 합쳐 고용된 인원은 발달장애인 29명 등 총 57명이다. 공사는 임직원들이 자발적으로 모은 물품도 전달해 나눔의 의미를 더했다. 기부 물품 판매 금액은 발달장애인 직원의 자립 지원금으로 쓰인다. 신가균 공사 경영본부장은 \"공사의 지속적인 후원을 통해 인천 지역의 다섯", "language": "ko"}, {"title": "전북도, 제2기 방위산업발전협의회 출범…동부권 방산 국가사업 발굴 본격화 - 뉴스홈(newshome)", "url": "https://news.google.com/rss/articles/CBMibkFVX3lxTE1BYjcyYkUwT21vN3kzelBkcGwyNG1pdHhjTW9KaXU1VE1CdjJqazZ4azQ3WXNnUWxXRmtINXV5MU1VRUFlMWs5bFVGeFBGa1lGSm5LM003MW05Z2ZuTVF6M19WNGJsQ3I0N09rMkx3?oc=5", "source": "방산 뉴스", "published": "2026-10-08T05:26:30+00:00", "summary": "전북도, 제2기 방위산업발전협의회 출범…동부권 방산 국가사업 발굴 본격화    뉴스홈(newshome)", "language": "ko"}, {"title": "농어촌 기본소득 18개 군 추가 선정…국비 지원 확대", "url": "https://www.newsis.com/view/NISX20261008_0003819214", "source": "뉴시스 경제", "published": "2026-10-08T05:21:52+00:00", "summary": "[세종=뉴시스]이수정 기자 = 정부가 주민에게 매월 15만원을 지급하는 농어촌 기본소득 시범사업 대상 지역을 내년 18개 군가량 추가 선정한다. 지방정부의 재정 부담을 줄이기 위해 국비 지원율도 기존 40%에서 50%로 높일 계획이다. 농림축산식품부는 다음 달 3일까지 2027년 농어촌 기본소득 시범사업 신규 참여지역을 공모한다고 8일 밝혔다. 농어촌 기본소득 시범사업은 인구감소지역으로 지정된 군에 일정 기간 이상 거주한 주민에게 매월 15만원 상당의 지역사랑상품권을 지급하는 사업이다. 주민 소득 안정을 도모하고 지역 내 소비를 활", "language": "ko"}, {"title": "강신철, 맥코믹 美상원의원 접견…한미 조선협력 등 논의", "url": "https://www.yna.co.kr/view/AKR20261008112500504", "source": "연합뉴스", "published": "2026-10-08T05:06:43+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 강신철 국방부 장관이 8일 한국을 방문 중인 데이브 맥코믹 미 상원의원(공화·펜실베이니아)을 만나 동맹 현안과...", "language": "ko"}, {"title": "송미령 \"투기 아니면 농지 처분 없다\"…양성화 특례 2~3년 검토(종합)", "url": "https://www.newsis.com/view/NISX20261008_0003818982", "source": "뉴시스", "published": "2026-10-08T05:06:00+00:00", "summary": "[세종=뉴시스]임소현 기자 = 송미령 농림축산식품부 장관이 농지 전수조사 후속조치에 대해 \"이번 조사 결과로 처분을 하지 않는다\"며 명백한 투기가 아닌 농지는 농지은행 위탁 여부와 관계없이 처분하지 않도록 특별조치법을 추진하겠다고 밝혔다. 관행 임대차와 미허가 시설 등을 적법하게 전환할 양성화 특례기간은 2~3년을 검토한다. 이 기간에 양성화를 신청하지 않았다는 이유로 조사에 따른 처분을 진행하지 않겠다는 방침도 명확히 했다. 송 장관은 8일 정부세종청사에서 열린 농지 조사 후속조치 브리핑에서 \"현재 농지법 규정과 맞지 않는 부분이", "language": "ko"}, {"title": "국힘, 한미일 안보회의 국정원 배제 논란에 \"李, 외교안보라인 전면 교체해야\"", "url": "https://www.newsis.com/view/NISX20261008_0003819124", "source": "뉴시스", "published": "2026-10-08T04:46:49+00:00", "summary": "[서울=뉴시스]김지훈 전상우 기자 = 국민의힘은 8일 한미일 사이버 안보회의에 국가정보원의 참석이 미측 요청으로 배제된 것으로 알려진 데 대해 \"한미동맹이 흔들리고 있다\"며 이를 자초한 외교안보 라인의 교체를 촉구했다.  임이자 정책위의장은 이날 오전 국회에서 열인 최고위원회의에서 \"기밀 누설 우려를 이유로 한미일 사이버 회의에서 우리 국정원이 배제되는 초유의 패싱이 벌어졌다\"라며 \"통일부 장관의 설익은 발언 이후 대북 군사정보 공유는 끊겼고, 국정원장 입국 거부설과 직원 비자 보류까지 터져 나왔다\"고 했다.  임 의장은 또한 \"안", "language": "ko"}, {"title": "합참의장 \"美 정보공유 일부 제한…대비태세엔 문제 없어\"", "url": "https://www.newsis.com/view/NISX20261008_0003819093", "source": "뉴시스", "published": "2026-10-08T04:33:39+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 진영승 합참의장은 8일 미국의 대북 정부 공유와 관련해 \"일부는 제한되지만, 우리가 전체적인 대비태세에 임하는 데는 문제가 없다\"고 말했다.  진 의장은 이날 국회 국방위원회 합동참모본부(합참) 대상 국정감사에서 '북한 핵과 관련해 지금 합참과 미국이 핵심 정보가 공유되고 있느냐'는 국민의힘 성일종 의원의 질의에 이같이 답했다.  진 의장은 또 '대북 정보 공유가 제한되고 있는데 대비태세가 어떻게 완벽할 수 있냐'는 지적에 \"상황 관리는 수준이 있는데 그 수준에 있어 우리가 임박한 징후라든지 여러 사", "language": "ko"}, {"title": "논산 내동에 10년 만 새 아파트…'엘리프 논산 디에디션' 11월 분양", "url": "https://www.newsis.com/view/NISX20261008_0003819043", "source": "뉴시스 경제", "published": "2026-10-08T04:33:28+00:00", "summary": "[서울=뉴시스]이종성 기자 = 충남 논산시 내동에 약 10년 만에 새 아파트가 공급된다. 계룡건설은 오는 11월 '엘리프 논산 디에디션'을 분양할 예정이다. 8일 계룡건설에 따르면 엘리프 논산 디에디션은 논산시 내동3지구에 지하 3층~지상 26층, 8개동, 전용면적 84㎡ 총 499세대 규모로 조성된다. 부린개발이 위탁하고 한국자산신탁이 시행하며 계룡건설이 시공한다. 단지는 논산 내동에서 약 10년 만에 공급되는 신규 분양 단지다. 계룡건설이 논산에서 '엘리프' 브랜드를 선보이는 것도 이번이 처음이다. 내동3지구는 내동1·2지구와 ", "language": "ko"}, {"title": "이 대통령 \"한-이집 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
