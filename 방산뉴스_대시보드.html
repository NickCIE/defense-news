상승해 배럴당 88.52 달러로 거래를 마쳤고, 미국 서부 텍사스산 원유 선물은 1.4% 올라 82.40 달러에 거래를 마감했다. 두 기준유 가격은 전날 2% 하락했으나 이날 상승해 이번 주 약 5% 이상 상승했다.  14일 상승세는 스콧 베선트 미국 재무장관이 이란을 “경제적으로 고립", "language": "ko"}, {"title": "Army picks M1 to lead $10B helicopter-school transformation", "url": "https://www.defenseone.com/business/2026/08/army-picks-m1-lead-10b-helicopter-school-transformation/415439/", "source": "Defense One", "published": "2026-08-14T21:10:13+00:00", "summary": "The aviation-services firm beat out Bell and Lockheed Martin.", "language": "en"}, {"title": "美재무 \"다음주 이란 고강도 경제제재\"…국제유가, 1%대 상승", "url": "https://www.newsis.com/view/NISX20260815_0003750405", "source": "뉴시스 경제", "published": "2026-08-14T21:00:46+00:00", "summary": "[서울=뉴시스]고재은 기자 = 미국이 이란에 대한 경제적 고립을 재차 위협한 가운데 국제 유가가 14일(현지 시간) 1%대 상승 마감했다. CNBC 등에 따르면 이날 유럽 ICE선물거래소에서 브렌트유 10월 인도분 종가는 전장 대비 1.7% 오른 배럴당 88.52달러를 기록했다. 뉴욕상품거래소에서 미국 서부텍사스원유(WTI) 9월 인도분도 전장보다 1.4% 오른 배럴당 82.40달러에 마감했다. 두 지수 모두 주간 기준으로 5% 넘게 오른 것으로, 특히 이날 상승세는 미국이 이란을 향한 고강도 경제 제재를 추가 예고하며 나타났다. ", "language": "ko"}, {"title": "\"온겨레가 독립 부르짖어\"…보신각 타종으로 기리는 광복의 기쁨", "url": "https://www.yna.co.kr/view/AKR20260814128200004", "source": "연합뉴스", "published": "2026-08-14T21:00:00+00:00", "summary": "(서울=연합뉴스) 김준태 기자 = 일제강점기 고양군수 등을 지낸 친일관료 민원식은 조선인에게도 참정권을 줘야 한다는 '참정권 운동'을 벌인 것으...", "language": "ko"}, {"title": "작아진 원전, 보안 새로 짠다…한수원, SMR 테러 대응체계 마련", "url": "https://www.newsis.com/view/NISX20260814_0003749437", "source": "뉴시스 경제", "published": "2026-08-14T21:00:00+00:00", "summary": "[세종=뉴시스]임소현 기자 = 기존 원전보다 크기가 작고 여러 지역에 분산 설치될 수 있는 소형모듈원자로(SMR)에 맞춰 새로운 '보안체계'가 마련된다. 한국수력원자력은 테러와 외부 침입, 핵물질 탈취, 드론 공격 등 SMR과 해체 원전에서 발생할 수 있는 위협에 대비하기 위해 오는 9월 물리적 방호 대응방안 수립에 나선다. 15일 한수원에 따르면 한수원 보안정보부는 오는 9월 '신규 원자력사업 관련 물리적방호 이행방안 용역'을 발주할 예정이다. 계약은 일반경쟁 방식으로 진행되며 용역 규모와 구체적인 과업 내용은 추후 확정된다. 물", "language": "ko"}, {"title": "U.S. to use economic tactics on Iran 'that have never been seen'; Navy works to relieve troubled carrier USS Abraham Lin", "url": "https://www.cnbc.com/2 로 전환을 본격화한다는 구상이다.  산업부는 14일과 오는 18일 정부세종청사에서 과장급 이상 간부를 대상으로 AX 강연을 개최한다고 밝혔다. 산업부는 지난해 9월 제조기업과 AI기업, 대학, 연구기관 등이 참여하는 'M.AX 얼라이언스'를 출범한 이후 공정과 제품, 지", "language": "ko"}, {"title": "엔화, 미일 금리차 축소 난망에 1달러=159엔대 중반 하락 출발", "url": "https://www.newsis.com/view/NISX20260814_0003749046", "source": "뉴시스 경제", "published": "2026-08-14T00:57:15+00:00", "summary": "[서울=뉴시스]이재준 기자 = 엔화 환율은 14일 벌어진 미일 금리차가 지속된다는 관측에 엔 매도, 달러 매수 선행으로 1달러=159엔대 중반으로 내려 시작했다. 도쿄 외환시장에서 엔화 환율은 이날 오전 8시30분 시점에 1달러=159.47~159.49엔으로 전일 오후 5시 대비 0.11엔 하락했다. 국제 유가 고공행진도 엔에 부담을 주는 가운데 미일 양국의 합동 엔 매수 시장 개입에 대한 경계감을 추가 하락을 제한하고 있다. 다카이치 사나에(高市早苗) 정부가 협조 개입의 효과를 유지하는 측면에서 조기 금리인상을 지지하고 있어 일본", "language": "ko"}, {"title": "트럼프 \"해군선박 최대 2척 해외 건조 한시 허용 지시\"(종합)", "url": "https://www.newsis.com/view/NISX20260814_0003748679", "source": "뉴시스 경제", "published": "2026-08-13T23:11:48+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 13일(현지 시간) 해외 조선업체가 모기업 조선소에서 건조한 선박을 최대 2척까지 미 해군이 구매할 수 있도록 한시 허용하라고 지시했다. 미국 해군 함정은 원칙적으로 해외 건조가 금지되지만, 트럼프 대통령이 일정기간 예외를 적용하겠다고 밝힌 것이다. 한국 조선업체들이 수혜를 누릴 가능성이 있으며, 한미가 역점을 두고 있는 조선협력에도 한층 힘이 실릴 전망이다. 백악관은 이날 발표한 '트럼프 대통령은 미 해군과 미국 조선산업 기반을 재건한다'는 제목의 팩트시트(설명자료)", "language": "ko"}, {"title": "트럼프 \"美투자한 조선업체, 모국서 최대 2척 해군선박 건조 허용\"", "url": "https://www.newsis.com/view/NISX20260814_0003748665", "source": "뉴시스 경제", "published": "2026-08-13T22:20:50+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 13일(현지 시간) 해외 조선업체가 모기업 조선소에서 건조한 선박을 최대 2척까지 미 해군이 구매할 수 있도록 한시 허용하라고 지시했다.  백악관은 이날 발표한 '트럼프 대통령은 미 해군과 미국 조선산업 기반을 재건한다'는 제목의 팩트시트(설명자료)에서 \"트럼프 대통령은 오늘 해군 조선 및 선박 수리 프로그램의 중대한 장기 문제들을 해결하고, 해양산업 기반의 역량과 경쟁력을 회복하기 위한 국가안보 대통령 각서(National Security Presidential Me", "language": "ko"}, {"title": "Meet MORFIUS: The Drone Designed To Zap Other Drones", "url": "https://www.twz.com/news-features/meet-morfius-the-drone-designed-to-zap-other-drones", "source": "The War Zone", "published": "2026-08-13T21:41:10+00:00", "summary": "Lockheed Martin's new MORFIUS X-Rotor counter-UAS system let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
