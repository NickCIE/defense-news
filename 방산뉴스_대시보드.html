시대이던 1950년 제정된 법률로 대통령에게 경제 활동에 개입할 수 있는 광범위한 권한을 부여한다.", "language": "ko"}, {"title": "무기징역 받은 아베 살해범…항소심서 '징역 10년 이하' 요구", "url": "https://www.newsis.com/view/NISX20261126_0003884337", "source": "뉴시스", "published": "2026-11-26T04:00:00+00:00", "summary": "[서울=뉴시스]문은주 기자 = 아베 신조 전 일본 총리를 총격해 숨지게 한 야마가미 테쓰야 피고인의 변호인단이 항소심에서 최대 10년 이하의 형이 적당하다고 주장할 것으로 보인다.  25일 요미우리신문 등의 보도에 따르면 야마가미 피고인의 변호인단은 이날 항소이유서를 통해 1심 판결에서 피고인의 성장 배경과 범행의 연관성이 충분히 고려되지 않았다고 밝혔다.  야마가미 피고인과 가족이 일본 세계평화통일가정연합(옛 통일교·이하 가정연합)으로부터 막대한 피해를 입은 것이 범행의 배경인데도, 1심에서는 교단의 불법 활동에 관한 심리가 충분", "language": "ko"}, {"title": "박성주 전 국수본부장, 기업 고문행 불발…과기·중기부 고위직도 불승인", "url": "https://www.newsis.com/view/NISX20261126_0003883858", "source": "뉴시스", "published": "2026-11-26T03:00:00+00:00", "summary": "[세종=뉴시스]성소의 기자 = 박성주 전 경찰청 국가수사본부장이 전자부품업체 포톤 고문으로 재취업하려 했지만 취업심사를 통과하지 못했다. 과학기술정보통신부와 중소벤처기업부 출신 고위공무원도 협회 재취업 심사를 통과하지 못했다. 정부공직자윤리위원회는 이 같은 내용을 포함한 총 62건의 '2026년 11월 퇴직공직자 취업심사' 결과를 26일 공개했다. 이에 따르면 박 전 본부장은 포톤 고문으로 취업하기 위해 심사를 받았지만 '취업 제한' 통보를 받았다. 포톤은 경기도 용인에 본사를 둔 코스닥 상장사로, 스마트폰 카메라 부품 등을 제조·", "language": "ko"}, {"title": "국방부, 北김정은 핵시설 현지지도에 \"핵개발 정당화 시도 즉각 중단해야\"(종합)", "url": "https://www.newsis.com/view/NISX20261126_0003884406", "source": "뉴시스", "published": "2026-11-26T02:57:52+00:00", "summary": "[서울=뉴시스] 옥승욱 남빛나라 기자 = 국방부가 김정은 북한 국무위원장의 핵시설 현지지도와 관련해 핵개발 정당화 시도를 즉각 중단할 것을 촉구했다.  정빛나 국방부 대변인은 26일 정례브리핑에서 관련 질문을 받고 \"우리 군은 북한이 한반도에서 전술핵 운용 확대 의지를 밝힌 점에 대해서 엄중하게 보고 있다\"며 \"북한은 한반도와 영내 평화를 위해 핵 개발을 정당화하려는 시도를 즉각 중단하고 유엔 안보리 결의를 이행해야 한다\"고 강조했다.  북한 대외매체 조선중앙통신은 김 위원장이 25일 핵물질생산 및 핵무기연구부문의 사업을 현지에서 ", "language": "ko"}, {"title": "김정은, 핵시설 시찰…\"전술핵 다영역 활용화, 중요하고도 절실한 과제\"(종합)", "url": "https://www.newsis.com/view/NISX20261126_0003884378", "source": "뉴시스", "published": "2026-11-26T02:56:13+00:00", "summary": "[서울=뉴시스] 남빛나라 임승규 기자 = 김정은 북한 국무위원장은 핵시설을 방문해 핵보유국 지위의 불가역성(되돌릴 수 없음)을 강조하고 한국을 겨냥해 전술핵을 여러 영역에서 활용해야 한다고 밝혔다. 북한 대외매체 조선중앙통신은 김 위원장이 25일 핵물질생산 및 핵무기연구부문의 사업을 현지에서 지도했다고 26일 보도했다. 통신은 구체적인 지명이나 시설명을 공개하지 않았다.  통신은 김 위원장이 \"무기급 핵물질 생산기지와 핵동력 관련 설비 생산기지, 핵무기연구소를 방문\"하고 \"새로 생산된 핵동력 관련 설비, 장치들의 성능을 료해(파악)", "language": "ko"}, {"title": "완/ 손실과 위험부담 큰 방산 수출산업화 전략 재고해야 - 세상을 바꾸는 시민언론 민들레", "url": "https://news.google.com/rss/articles/CBMibEFVX3lxTFBaMDlIUlg2ZV9RNVg4VnFGZUNQd2dWN21IeEpjZ29LRlVBUDRfS0Q0ekQxNnR0LTVLb3ZXeDkxYXBCUGJjVUVHMXZNN0pzak9aMnlySWRlbWtMSjhGX1ZqUUo2T2I1LTk1bkM2aw?oc=5", "source": "방산 뉴스", "published": "2026-11-26T02:52:08+00:00", "summary": "완/ 손실과 위험부담 큰 방산 수출산업화 전략 재고해야    세상을 바꾸는 시민언론 민들레", "language": "ko"}, {"title": "美, 韓 반도체 육성 정조준…관세 25% 경고, 호남 증설 겨냥했나", "url": "https://www.newsis.com/view/NISX20261126_0003883854", "source": "뉴시스 경제", "published": "2026-11-26T02:37:36+00:00", "summary": "[서울=뉴시스] 김승민 기자 = 도널드 트럼프 미국 행정부가 한국과의 공식 합의 사항인 '총 관세율 15% 상한'을 지키겠다면서도, 협의가 만족스럽지 않을 경우 25%로 올릴 수 있다는 언급을 덧붙였다. 연방대법원에서 위법 판결을 받은 전방위 관세 정책 실패 여파로 중간선거에서 참패하고도, 통상을 무기화해 타국의 일방적 양보를 압박하는 미국 우선주의 기조를 그대로 이어가는 기류다. 트럼프 행정부는 특히 'K-반도체 벨트 전략' 등 한국의 산업 정책을 직접적으로 언급하며 미국 경제에 손실을 입히고 있다고 주장했다. 사실상 관세 10%", "language": "ko"}, {"title": "전남광주 기초단체장협의회 \"국민의힘, 통합지원금 삭감 멈춰야\"", "url": "https://www.yna.co.kr/view/AKR20261126088300054", "source": "연합뉴스", "published": "2026-11-26T02:30:09+00:00", "summary": "(전남광주=연합뉴스) 정회성 기자 = 전남광주 시장·군수·구청장 협의회는 26일 \"국민의힘은 전남광주 통합 정부 지원금 5조원에 대한 삭감 시도...", "language": "ko"}, {"title": "[쇼츠] 드론서 바다속으로 '풍덩'…튀르키예 '아킨지' 경어뢰 투하 성공", "url": "https://www.yna.co.kr/view/AKR20261126086200704", "source": "연합뉴스", "published": "2026-11-26T02:23:15+00:00", "summary": "(서울=연합뉴스) 튀르키예의 무인 전투기 '바이락타르 아킨지'(AKINCI)가 자국산 경어뢰 '오르카'(ORKA)를 바다에 떨어뜨리는 시험에 성...", "language": "ko"}, {"title": "美국방장관 내달 방일…주일미군 분담금·방위비 증액 논의", "url": "https://www.newsis.com/view/NISX20261126_0003884158", "source": "뉴시스", "published": "2026-11-26T02:20:51+00:00", "summary": "[서울=뉴시스]문은주 기자 = 피트 헤그세스 미국 국방장관이 12월8일께 일본을 방문해 고이즈미 신지로 일본 방위상과 회담하는 방안을 조율 중인 것으로 알려졌다. 26일 지지통신에 따르면 이번 회담의 주요 의제는 주일미군 주둔 경비의 일본 측 분담금(배려 예산)과 안보 관련 3개 문서의 연내 개정에 따른 방위비 증액 문제 등이 될 것으로 보인다.  배려 예산은 일본 정부가 주일미군의 안정적인 주둔을 위해 부담하는 비용을 말한다. 일본은 주일미군 기지에서 근무하는 일본인 직원의 인건비와 미군 훈련 이전 비용 등을 지원하고 있다. 미일", "language": "ko"}, {"title": "서울시, 직접 고른 집에 보증금 최대 7천만원 무이자 지원", "url": "https://www.newsis.com/view/NISX20261126_0003884202", "source": "뉴시스 경제", "published": "2026-11-26T02:15:00+00:00", "summary": "[서울=뉴시스]권혜인 기자 = 서울시가 중장년층과 등록임대주택의 임대의무기간 만료로 주거불안을 겪는 가구를 위해 특별공급을 신설한다. 신혼부부 특별공급 대상도 예비 신혼부부까지 확대한다. 서울시는 2026년 제2차 보증금지원형 장기안심주택 지원 대상 7000가구를 모집한다고 밝혔다. 보증금지원형 장기안심주택은 입주자가 원하는 집을 직접 고르면 서울시가 전세보증금 일부를 무이자로 지원하는 제도다. 보증금이 1억5000만원을 초과하면 보증금 40% 이내에서 최대 7000만원을, 1억5000만원 이하면 50% 이내에서 최대 6000만원을", "language": "ko"}, {"title": "與, '조희대 탄핵' 판사들 반발에 \"탄핵 대상은 사법부 전체 아닌 대법원장 한 사람\"(종합)", "url": "https://www.newsis.com/view/NISX20261126_0003884227", "source": "뉴시스", "published": "2026-11-26T02:00:49+00:00", "summary": "[서울=뉴시스]신재현 김난영 김윤영 기자 = 더불어민주당이 26일 조희대 대법원장 탄핵 추진과 관련해 \"탄핵은 사법부 전체가 아닌 조 대법원장 행태에 대한 것\"이라고 밝혔다.  한병도 원내대표는 이날 국회 본청에서 열린 정책조정회의에서 \"탄핵의 대상은 사법부 전체가 아니라 조 대법원장 한 사람\"이라며 \"국민의힘은 사법부를 방패막이로 삼아 내란 청산을 가로막지 말라\"고 말했다.  한 원내대표는 \"대법관 공백 장기화와 계엄 당일 심야 간부회의 논의 등 조 대법원장을 둘러싼 의혹은 하나둘이 아니다\"라며 \"12·3 내란 2년이 일주일 앞으", "language": "ko"}, {"title": "[영상] 지상타격 넘어 대잠전까지…튀르키예 드론서 경어뢰 투하 성공", "url": "https://www.yna.co.kr/view/AKR20261126079400704", "source": "연합뉴스", "published": "2026-11-26T02:00:25+00:00", "summary": "(서울=연합뉴스) 튀르키예의 무인 전투기 '바이락타르 아킨지'(AKINCI)가 자국산 경어뢰 '오르카'(ORKA)를 바다에 떨어뜨리는 시험에 성...", "language": "ko"}, {"title": "정부, 국토·환경계획 연계 강화…5극3특 균형성장 뒷받침", "url": "https://www.newsis.com/view/NISX20261126_0003883867", "source": "뉴시스 경제", "published": "2026-11-26T02:00:00+00:00", "summary": "[세종=뉴시스]이수정 기자 = 정부가 5극3특 국가 균형성장과 기후위기 대응을 위해 국토·환경계획 간 연계를 강화한다. 지역 성장거점 조성과 국가전략산업 육성을 위한 전력·용수 공급 등 부처 간 정책 협력도 확대한다. 기후에너지환경부와 국토교통부는 오는 27일 서울 종로구에서 제3차 국가계획수립협의회를 개최하고 '2026~2040 국토·환경계획 통합관리 추진방안'을 논의한다고 26일 밝혔다. 이번 추진방안은 현재 수립 중인 제5차 국토종합계획과 제5차 국가환경종합계획 수정계획(2026~2040년)의 연계성을 높이기 위해 마련됐다. ", "language": "ko"}, {"title": "외교부, 튀르키예와 정상회담 후속조치 점검…\"원전·방산 협력 심화\"", "url" const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
