": "군, 오늘 DMZ 현장조사서 北지뢰 1발 추가 발견…강신철 \"국경선 요새화 중 매설 추정\"(종합)", "url": "https://www.newsis.com/view/NISX20260929_0003807550", "source": "뉴시스", "published": "2026-09-29T08:00:41+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 우리 군이 지난 27일부터 진행한 서부전선 비무장지대(DMZ) 지뢰 추정 폭발사고에 대한 현장조사를 3일째 이어갔다. 이날 현장조사에서는 기존에 알려진 지뢰 3발 이외 또 다른 북한 지뢰 1발이 추가로 발견됐다. 합참은 29일 \"우리 군과 유엔사는 오늘 합동으로 25사단 DMZ 작전 간 지뢰 폭발 상황 관련, 합동 현장조사를 실시했다\"고 밝혔다. 이날 투입된 인원은 우리 군 작전병력, 유엔사 군정위(비서장 등), 조사기관 등 총 30여명으로 구성됐다. 현장조사팀은 폭발 현장 근처에서 북한의 수지반보병", "language": "ko"}, {"title": "주일석 해병대사령관, 필리핀서 군사·방산협력 강화 논의", "url": "https://www.newsis.com/view/NISX20260929_0003807538", "source": "뉴시스", "published": "2026-09-29T07:58:53+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 주일석 해병대사령관이 필리핀에서 길베르토 테오도로 필리핀 국방장관과 바야니 쿠라밍 필리핀 해병대사령관 직무대행을 만나 양국 해병대 간 군사협력 강화와 방산협력 확대 방안을 논의했다. 29일 해병대에 따르면 필리핀 해병대사령부의 초청으로 마닐라를 방문 중인 주 사령관은 28일 테오도로 국방 장관과의 대담을 통해 해병대의 미래 입체고속상륙작전 및 핵심전력 확보 추진현황을 소개하고 이와 연계한 군사교류 및 방산협력 확대방안에 대한 의견을 교환했다. 다음날에는 바야니 쿠라밍 필리핀 해병대사령관 직무대행과 대", "language": "ko"}, {"title": "한병도 \"정기국회, 이재명 정부 성공에 중요…野 정치공세 단호하게 대응\"", "url": "https://www.newsis.com/view/NISX20260929_0003807541", "source": "뉴시스", "published": "2026-09-29T07:51:50+00:00", "summary": "[서울=뉴시스]정금민 권신혁 김윤영 기자 = 한병도 더불어민주당 원내대표가 29일 \"이번 정기국회는 이재명 정부 성공을 위한 정말 중요한 순간\"이라며 \"의원들께서 남다른 각오로 신속한 입법과 확실한 성과 도출에 힘을 모아주기를 거듭 당부 말씀을 드린다\"고 했다. 한 원내대표는 이날 국회에서 열린 의원총회에 참석해 \"이번 정기국회에서 '정책 국감'과 '민생 국감'을 통해 국민 삶을 개선하고, 또 '민생 입법'과 '민생 예산'을 통해 국민의 신뢰를 제고하는 기회로 만들어야겠다\"며 이같이 말했다. 그는 \"지난 한달 정기국회에 임하는 국민", "language": "ko"}, {"title": "국회 국방위, DMZ 지뢰 폭발 '정전협정 위반' 규탄 결의문 채택 검토", "url": "https://www.newsis.com/view/NISX20260929_0003807494", "source": "뉴시스", "published": "2026-09-29T07:37:31+00:00", "summary": "[서울=뉴시스] 이승재 신재현 기자 = 국회 국방위원회는 29일 열린 전체회의에서 지난 21일 비무장지대(DMZ) 지뢰 폭발 사고를 '정전협정 위반'으로 보고 북한 규탄 결의문 채택을 검토하기로 했다. 여당 간사인 김병주 더불어민주당 의원은 이날 국회에서 열린 국방위 전체회의에서 \"결과가 최종적으로 나와야겠지만 정황 증거에 의하면 (이번 사고가) 북한의 지뢰로 인한 것이라고 저는 판단한다\"며 \"정전협정 위반이고 명백한 도발\"이라고 말했다.  김병주 의원은 \"북한이 어떤 의도를 갖고 3", "source": "뉴시스 경제", "published": "2026-09-29T06:39:14+00:00", "summary": "[세종=뉴시스]김동현 기자 = 지난해 농가 경영비가 9.2% 증가하면서 총 수입이 1.2%늘었음에도 불구하고 51개 농산물의 평균 소득이 7.7% 감소한 것으로 집계됐다.  농촌진흥청은 29일 이 같은 내용이 담긴 2025년도에 생산된 51개 농산물에 대한 농산물 소득 조사 결과를 발표했다. 농산물소득조사는 농산물의 생산량과 수취 가격, 농자재·노동 투입 비용 등을 조사해 농가의 경영 성과를 파악하는 통계다. 2025년 농산물 소득 조사는 전국 5300 농가를 대상으로 진행했다. 조사 결과에 따르면 49개 농산물의 평균 10a당 소", "language": "ko"}, {"title": "이낙연 \"성남 라인은 그대로…인사·안보 총체적 위기\"", "url": "https://www.newsis.com/view/NISX20260929_0003807055", "source": "뉴시스", "published": "2026-09-29T06:30:00+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 이낙연 전 국무총리가 현 정부의 주식·부동산 정책과 거시경제 엇박자, 인사 및 안보 부실을 둘러싼 총체적 국정 위기를 강하게 비판했다. 이 전 총리는 지난 27일 유튜브 채널 '이낙연의 사유' 영상에 출연해 현 국정 상황을 진단하며 정부의 시장 경시 태도를 지적했다. 그는 \"대통령은 지지율 하락을 끊으려고 긴급 기자회견을 열었다\"라며 \"증시와 부동산 실패는 시장을 이길 수 있다는 오만과 무지에서 비롯됐다\"라고 밝혔다. 특히 주식시장 정책과 관련해 정부가 인공지능 호황에 따른 착시 현상에 도취해 있다고", "language": "ko"}, {"title": "김민석 \"경남, 제조업 강국으로 가는 핵심 기반 전환점\"", "url": "https://www.newsis.com/view/NISX20260929_0003807293", "source": "뉴시스", "published": "2026-09-29T06:19:46+00:00", "summary": "[서울=뉴시스]권신혁 기자 = 김민석 더불어민주당 대표는 29일 \"경남은 대한민국이 제조업 강국으로 가는데 있어서 핵심 기반이 되는 전환점에 있다\"며 \"김경수 전 지사님이 단단하게 잘 지켜주시고 계신 것 같다\"고 했다.  김민석 대표는 이날 오후 국회에서 열린 민주당·경남 예산정책협의회에 참석해 \"피지컬 AI, 우주항공, 방산 등 모든 분야에서 전략적인 도약을 하고 성장 전환을 하는데 있어 집중력을 발휘해야 할 시점\"이라며 이같이 말했다.  김 대표는 \"경상남도에서 김경수라는 이름이 중앙에서는 대통령의 특보를 하시고 경남 지역에서는", "language": "ko"}, {"title": "[게시판] 재경부 전략경제자문단, 방산 AI기업 찾아가 정책지원 논의", "url": "https://www.yna.co.kr/view/AKR20260929126700002", "source": "연합뉴스 경제", "published": "2026-09-29T06:15:08+00:00", "summary": "▲ 재정경제부 전략경제자문단은 29일 방산 인공지능(AI) 기업 ㈜네비웍스를 방문해 방위산업분과위원회 회의를 열었다. 자문단은 회의에서 K-방산...", "language": "ko"}, {"title": "장동혁, 백령도 찾아…\"장병 안전 지키는 건 대한민국 책무\"", "url": "https://www.newsis.com/view/NISX20260929_0003807270", "source": "뉴시스", "published": "2026-09-29T06:14:11+00:00", "summary": "[서울=뉴시스]하지현 기자 = 장동혁 국민의힘 대표가 국군의날을 앞둔 29일 인천 백령도를 찾아 최전방 대비 태세를 점검했다. 그는 최근 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고를 언급하며 \ 한 지뢰 폭발 사고와 관련해 \"군 당국은 유엔사와 긴밀한 협조를 바탕으로 신속하고 철저한 조사를 통해 사건의 진상을 투명하게 밝혀야 한다\"며 \"진상에 따라서 필요한 조치를 해 나갈 것\"이라고 밝혔다. 이 대통령은 이날 오전 청와대 주재한 국무회의에서 \"지난주 군사분계선 인근 지뢰 사고로 3명의 장병이 큰 부상을 입었다. 부상 장병과 가족들에게 깊은 위로의 말씀을 드리고 쾌유를 기원한다\"며 이같이 말했다. 이 대통령은 \"안보에 여야", "language": "ko"}, {"title": "핵추진잠수함 신속 전력화…'핵잠 획득·운영 특별법' 등 국무회의 통과", "url": "https://www.newsis.com/view/NISX20260929_0003807171", "source": "뉴시스", "published": "2026-09-29T05:47:30+00:00", "summary": "[서울=뉴시스]조재완 기자 = 핵추진잠수함의 신속한 도입과 전력화를 위한 특별법이 29일 국무회의를 통과했다. 이재명 대통령이 이날 청와대에서 주재한 제42회 국무회의에서는 이 같은 내용의 '핵추진잠수함 등의 획득·운영 및 안전관리 등 핵추진잠수함 사업에 관한 특별법안'을 포함한 법률안 1건과 대통령령안 14건, 일반안건 2건이 심의·의결됐다.  핵추진잠수함 특별법은 급변하는 안보 환경에 대응해 핵추진잠수함을 새로운 국가전략자산으로 도입하고, 이를 신속히 획득·전력화하기 위한 제도적 기반을 마련하는 내용을 담고 있다. 핵잠은 무기체", "language": "ko"}, {"title": "장동혁, 이 대통령 'DMZ 사고 음모론 자제'에 \"정부여당, 존재 자체로 안보에 위협\"", "url": "https://www.newsis.com/view/NISX20260929_0003807146", "source": "뉴시스", "published": "2026-09-29T05:32:27+00:00", "summary": "[서울=뉴시스]한은진 기자 = 장동혁 국민의힘 대표는 29일 이재명 대통령이 국무회의에서 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 '음모론을 부추기면서 국가안보를 위태롭게 하는 일이 없었으면 좋겠다'고 하자 \"이 대통령과 더불어민주당은 존재 자체로 우리 안보의 위협\"이라고 말했다. 장 대표는 이날 자신의 페이스북에 \"이 대통령이 국무회의에서 '지뢰 폭발 사고'에 대한 입장을 내놓았다. 늦어도 한참 늦었다\"고 적었다. 장 대표는 \"북한에 대해서는 단 한 마디도 없었다. 국민의 분노와 불안을 달랠 말도 단 한 줄", "language": "ko"}, {"title": "핵잠 도입·운영 특별법 제정안 국무회의 통과…국회 제출 예정", "url": "https://www.yna.co.kr/view/AKR20260929078900001", "source": "연합뉴스", "published": "2026-09-29T04:59:04+00:00", "summary": "(서울=연합뉴스) 설승은 기자 = 국가전략사업으로서 핵추진잠수함의 신속한 도입 및 사업 추진을 위한 특별법 제정안이 29일 국무회의를 통과했다....", "language": "ko"}, {"title": "[영상] 루마니아 거리서 포착된 'K-무기'…K9·K10·K12 첫 도착", "url": "https://www.yna.co.kr/view/AKR20260929098300704", "source": "연합뉴스", "published": "2026-09-29T04:42:12+00:00", "summary": "(서울=연합뉴스) 우리 군의 K9 자주포와 K10 탄약운반장갑차, K12 구난차량으로 추정되는 장비가 루마니아 도로에서 나란히 포착됐습니다.", "language": "ko"}, {"title": "국방부-우주청, 국방위성 발사에 국내 발사체 적극 활용키로", "url": "https://www.yna.co.kr/view/AKR20260929052600504", "source": "연합뉴스", "publishe 어들 것이라는 전망이다. 28일(현지시간) 영국 가디언에 따르면 트럼프 대통령은 이날 기자들로부터 전쟁이 끝날 때까지 소비자들이 높은 비용을 감당해야 하느냐는 질문을 받았다.  그는 이란의 핵무기 보유를 막는 것이 중요하다고 강조한 뒤, 전쟁이 끝나면 물가가 크게 낮아질 것이라고 말했다. 이어 \"휘발윳값이 크게 내려갈 것\"이라며 가격이 이미 내려가고 있다고 주장했다.", "language": "ko"}, {"title": "이 대통령 \"지뢰 사고 투명하게 밝혀야…진상에 따라 필요 조치\"", "url": "https://www.newsis.com/view/NISX20260929_0003806651", "source": "뉴시스", "published": "2026-09-29T01:27:58+00:00", "summary": "[서울=뉴시스]조재완 김경록 기자 = 이재명 대통령은 29일 최근 경기 파주시 남측 비무장지대(DMZ) 내에서 발생한 지뢰 폭발 사건과 관련해 \"진상에 따라 필요한 조사를 취해나갈 것\"이라고 밝혔다.  이 대통령은 이날 오전 청와대에서 제42회 국무회의를 열고 \"군 당국은 유엔사와의 긴밀한 협조를 바탕으로 신속하고 철저한 조사를 통해 사건의 진상을 투명하게 밝혀야 할 것\"이라며 이같이 말했다.  이 대통령은 \"부상 장병들과 가족들에게 깊은 위로 말씀을 드리고 쾌유를 기원한다\"고 했다.  이 대통령은 \"안보에 여야가 따로 있을 수 없", "language": "ko"}, {"title": "與 \"北지뢰 확인되면 정부가 상응조치 해야…국힘, 안보를 정쟁 몰고 가\"", "url": "https://www.newsis.com/view/NISX20260929_0003806614", "source": "뉴시스", "published": "2026-09-29T01:17:02+00:00", "summary": "[서울=뉴시스] 김난영 권신혁 기자 = 더불어민주당이 비무장지대(DMZ) 폭발과 관련해 국민의힘이 안보를 정쟁화하고 있다고 비판했다. 한병도 민주당 원내대표는 29일 원내대책회의에서 \"북한이 매설한 지뢰로 최종 확인된다면 정부가 그에 합당하고 상응하는 조치를 해야 할 것\"이라면서도 \"국민의힘은 최종 결과가 나오기도 전에 사고를 은폐했다고 국가 안보를 정쟁의 제물로 몰고 가고 있다\"고 했다. 한 원내대표는 \"국정조사와 청문회 개최까지 운운하며 진상규명을 요구하던 국민의힘 국방위원들은 정작 어제 현장 방문에는 참여하지도 않았다\"며 \"현", "language": "ko"}, {"title": "한병도 \"조희대, 법원행정처 의견 묵살·재제청 거부 의혹…국감서 설명해야\"", "url": "https://www.newsis.com/view/NISX20260929_0003806598", "source": "뉴시스", "published": "2026-09-29T01:14:55+00:00", "summary": "[서울=뉴시스]정금민 권신혁 기자 = 한병도 더불어민주당 원내대표는 29일 조희대 대법원장이 청와대의 대법관 후보 재제청 요청을 거부한 데 대해 \"민주당은 국정감사를 통해 재제청 거부 결정의 경위와 책임을 철저히 밝히겠다\"고 했다. 한 원내대표는 이날 국회에서 열린 원내대책회의에서 \"조 대법원장의 제청 지연과 협의 없는 제청, 재제청 거부로 인해 역대 최장기 대법관 공백 사태가 무려 210일째 이어지고 있다\"며 이같이 말했다. 그는 \"사법부 수장이 제청권을 권력 투쟁의 무기로 삼는 사이 모든 피해는 재판 지연에 시달리는 우리 국민께", "language": "ko"}, {"title": "靑 \"지뢰사고 현장조사, 군사적 판단…대통령 유엔 연설과 무관\"", "url": "https://www.yna.co.kr/view/AKR20260929051300001", "source": "연합뉴스", "published": "2026-09-29T00:58:37+00:00", "summary": "(서울=연합뉴스) 고동욱 기자 = 청와대는 29일 서부전선 비무장지대(DM const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
