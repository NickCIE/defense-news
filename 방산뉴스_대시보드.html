rl": "https://www.newsis.com/view/NISX20260915_0003789824", "source": "뉴시스 경제", "published": "2026-09-15T01:16:22+00:00", "summary": "[서울=뉴시스]이재준 기자 = 엔화 환율은 15일 미국 연방준비제도(Fed 연준)와 일본은행의 금융정책 결정을 앞두고 관망 분위기가 퍼지면서 1달러=154엔대 전반으로 소폭 올라 시작했다. 도쿄 외환시장에서 엔화 환율은 이날 오전 8시30분 시점에 1달러=154.36~154.37엔으로 전날 오후 5시 대비 0.03엔 상승했다. 미국 채권시장에서 14일 10년채 금리는 일시 5.01%로 2023년 10월 이래 고수준을 기록했다. 중동전쟁 장기화로 고유가에 의한 미국 인플레 우려에서 금리가 더 오른다는 관측이 강하다. 연준이 15~16", "language": "ko"}, {"title": "US Navy, Boeing ink first MQ-25A Stingray production contract", "url": "https://www.defensenews.com/industry/techwatch/2026/09/15/us-navy-boeing-ink-first-mq-25a-stingray-production-contract/", "source": "Defense News", "published": "2026-09-15T01:13:26+00:00", "summary": "The U.S. Navy awarded a $562 million fixed-price incentive contract to Boeing on Monday to start Lot 1 Low Rate Initial Production of the MQ-25A Stingray.", "language": "en"}, {"title": "권칠승 \"실거주 유예조치 연장, 임대차계약 갱신 허용 방안 검토해야\"", "url": "https://www.newsis.com/view/NISX20260915_0003789794", "source": "뉴시스", "published": "2026-09-15T01:11:03+00:00", "summary": "[서울=뉴시스]신재현 한재혁 기자 = 권칠승 더불어민주당 정책위의장이 15일 \"임차인 주거 안정에 영향을 주는 측면이 있다\"며 내년까지 실거주 유예조치를 연장하는 방안 등을 정부에 제안했다.  권 정책위의장은 이날 원내대책회의에서 \"임차인 주거 불안을 해소하고 전월세 시장 안정을 위해 현재 실거주 유예조치를 내년까지 연장하고 임대차계약 갱신도 허용하는 방안을 검토할 필요가 있다\"고 말했다.  권 정책위의장은 \"토지거래허가구역 내 실거주 의무 유예 확대 조치는 올해 연말까지만 신청가능해, 세제 개편안에 따라 내년에 주택을 매도하고자 ", "language": "ko"}, {"title": "GS건설, 플랜트 기자재 품질검사 디지털화…AR 활용", "url": "https://www.newsis.com/view/NISX20260915_0003789733", "source": "뉴시스 경제", "published": "2026-09-15T01:00:56+00:00", "summary": "[서울=뉴시스]이연희 기자 = GS건설이 플랜트 기자재 품질검사의 효율성과 정확도를 높이기 위해 증강현실(AR) 기술을 도입하기로 했다. GS건설은 독일 AR 전문기업 비조메트리(Visometry)사의 디지털 검사 솔루션 '트윈(Twyn)'을 플랜트 현장에 도입해 품질검사 디지털화를 추진한다고 15일 밝혔다. 3D 설계모델과 실제 제작 기자재를 현장 설치 전에 비교 및 검사하는 방식이다. 플랜트 공사 기자재는 현장에 설치하기 전 설계도면과 실제 제작품이 일치하는지 확인하는 품질검사를 거친다. 기존에는 담당자가 설계도면과 제작품을 직", "language": "ko"}, {"title": "U.S. Admits It Has Weapons In Orbit", "url": "https://www const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
