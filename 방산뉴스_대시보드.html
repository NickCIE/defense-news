uage": "ko"}, {"title": "국방부, 'GP 실탄 미삽탄·美무인기 보고누락' 1군단장 직무배제", "url": "https://www.newsis.com/view/NISX20260803_0003734221", "source": "뉴시스", "published": "2026-08-03T05:03:12+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부가 최근 최전방 소초(GP) 화기 실탄 미삽탄과 미측 무인기 보고 누락 의혹이 제기된 한기성(중장) 육군 1군단장을 직무배제 조치했다.  국방부는 3일 \"최근 1군단 관련 사안에 대한 점검 및 조사와 관련해 현 군단장을 오늘부로 직무배제했다\"고 밝혔다.  1군단장이 직무배제되는 기간 동안 육군교육사령관이 1군단장 직무를 대리할 예정이다.  서부전선을 관할하는 1군단은 올해 상반기부터 GP·GOP 경계작전 중 K6 중기관총에 실탄을 장착하지 않고, 실탄이 든 탄통을 옆에  비치해 둔 채 경계근무에", "language": "ko"}, {"title": "'Winter is coming': Ukraine fears its toughest test since Russia's full-scale invasion", "url": "https://www.cnbc.com/2026/08/03/ukraine-russia-war-putin-zelenskyy-winter.html", "source": "CNBC", "published": "2026-08-03T05:00:01+00:00", "summary": "Russian forces have ramped up the number of missile strikes on Ukrainian cities, likely seeking to exploit Kyiv's shortage of ballistic missile interceptors.", "language": "en"}, {"title": "탄탄한 데이터 기반으로 더 크게 성장하는 K-방산 생태계 - 전체 | 카드/한컷 | 멀티미디어 - 대한민국 정책브리핑", "url": "https://news.google.com/rss/articles/CBMiiwFBVV95cUxOYXU2NV8tV1RDYWdEb0s2VFJpRmw0WVQ3Q045YmRsWUhHbmw4X0hjVndDZ1FJWTB6ODB6UWpsX0t3ZU1jZ21vSXloc2lLV0g1Ml9Cd3k0MlhGSzZ1QzhPR24wdVBpVWkxZGk3dmJZRFc5RFpGVkN5T1lXNDdqNkctSWkyVWdiNW9vY1dB?oc=5", "source": "방산 뉴스", "published": "2026-08-03T04:53:38+00:00", "summary": "탄탄한 데이터 기반으로 더 크게 성장하는 K-방산 생태계 - 전체 | 카드/한컷 | 멀티미디어    대한민국 정책브리핑", "language": "ko"}, {"title": "[속보] 국방부, '실탄 미장착'·'美무인기 소동' 1군단장 직무배제", "url": "https://www.yna.co.kr/view/AKR20260803089200504", "source": "연합뉴스", "published": "2026-08-03T04:42:30+00:00", "summary": "(", "language": "ko"}, {"title": "[속보]국방부, '美무인기 보고 누락' 1군단장 직무배제", "url": "https://www.newsis.com/view/NISX20260803_0003734177", "source": "뉴시스", "published": "2026-08-03T04:40:44+00:00", "summary": "후속기사가 이어집니다 \n◎공감언론 뉴시스 okdol99@newsis.com", "language": "ko"}, {"title": "올해 추가배치된 천궁-Ⅱ 임무시작…軍 \"다층방어체계 완비할것\"", "url": "https://www.yna.co.kr/view/AKR20260803080700504", "source": "연합뉴스", "published": "2026-08-03T04:35:11+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 우리 군의 미사일방어체계에서 하층 방어를 담당하는 국산 중거리지대공유도무기 '천궁-Ⅱ'의 올해 전력화 계획 물...", "language": "ko"}, {"title": "모건스탠리 \"韓 증시 36% 상승 여력\"…중립→비중확대로 상향", "url": "https://www.newsis.com/view/NISX20260803_0003734090", "source": "뉴시스 경제", "published": "2026-08-03T04:32:55+00:00", "summary": "[서울=뉴시스]신정원 기자 = 글로벌 투자은행 모건스탠리는 2일(현지 시간) 최근 큰 폭으로 조정받은 한국 증시에 대해 투자의견을 '중립'에서 '비중확대'로 상향 조정했다. 최근 과도한 레버리지 청산이 마무리 단계에 접어들면서 인공지능(AI)과 산업 슈퍼사이클에 다시 진입할 기회가 열렸다는 분석이다. 대니얼 블레이크가 이끄는 전략가팀은 보고서에서 한국 증시에서 과도한 레버리지 투자와 쏠림 현상이 상당 부분 해소됐다면서 코스피가 목표치인 9000까지 약 36% 상승할 여력이 있다고 전망했다고 외신들이 블룸버그 통신을 인용해 보도했다.", "language": "ko"}, {"title": "軍, 보안수사 전담 '국방방첩본부' 창설…안규백 \"과거 악습과 단절\"", "url": "https://www.newsis.com/view/NISX20260803_0003734113", "source": "뉴시스", "published": "2026-08-03T04:13:06+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부는 3일 오전 안규백 국방부 장관 주관으로 과천 본부에서 국방방첩본부 창설식을 진행했다고 밝혔다.  안 장관은 이날 창설식에서 \"오늘 우리는 과거의 악습과 단절하고 대한민국 국방방첩의 새로운 미래를 여는 역사적인 자리에 함께하고 있다\"며 \"국방방첩본부의 창설은 권력의 도구로 얼룩졌던 지난한 역사를 끝내고 '국민의 군대' 재건을 완성하는 일대의 분수령\"이라고 말했다.  이어 부대원들에게 방첩본부의 투명성과 전문성, 국민의 신뢰 등을 당부하며 \"여러분이 오직 본연의 임무에만 전념할 수 있도록 끝까지", "language": "ko"}, {"title": "\"발전공기업·LH 본사 유치·존치, 해군사관학교 이전 반대\"", "url": "https://www.yna.co.kr/view/AKR20260803078300052", "source": "연합뉴스", "published": "2026-08-03T03:14:16+00:00", "summary": "(창원=연합뉴스) 이정훈 기자 = 경남도가 발전공기업 통합 본사 유치, 한국토지주택공사(LH) 본사 존치, 해군사관학교 이전 반대 입장을 공식적...", "language": "ko"}, {"title": "국립중앙극장장 등 11개 개방형 직위 공모…13일까지 접수", "url": "https://www.newsis.com/view/NISX20260803_0003733532", "source": "뉴시스", "published": "2026-08-03T03:00:00+00:00", "summary": "[세종=뉴시스]성소의 기자 = 정부가 국민권익위원회 중앙행정심판위원회 상임위원 등 11개 개방형 직위를 공개 모집한다. 인사혁신처는 공직 내·외부에서 우수 인재를 선발하는 '2026년 8월 개방형 직위'를 공개 모집한다고 3일 밝혔다. 이번 공모 직위는 11개로 권익위원회, 외교부 등 10개 부처에서 고위공무원단 6개, 과장급 5개 직위를 선발한다.  구체적으로 ▲국민권익위원회 중앙행정심판위원회 상임위원 ▲외교부 주인도대사관 공사참사관 ▲외교부 주러시아연방대사관 공사참사관 겸 문화원장 ▲문화체육관광부 국립중앙극장장 ▲경찰청 경찰병원", "language": "ko"}, {"title": "이 대통령, 서울공항 도착…7박11일 미국·남미 순방 종료", "url": "https://www.newsis.com/view/NISX20260803_0003733918", "source": "뉴시스", "published": "2026-08-03T02:57:08+00:00", "summary": "[서울=뉴시스]조재완 김지은 기자 = 이재명 대통령이 3일 7박11일간의 미국·남미 순방을 마치고 귀국했다. 이 대통령 내외와 참모진을 태운 공군 1호기(대통령 전용기)는 이날 오전 11시 43분께 성남 서울공항에 도착했다. 이 대통령은 남색 정장에 회색과 자주색, 남색이 교차된 무늬의 넥타이를 맸고 김 여사는 연보라색상의 투피스 정장 차림이었다. 김 여사는 이 대통령의 팔짱을 끼고 함께 트랩을 내려왔다. 정부에서는 윤호중 행정안전부 장관이, 당에서는 한병도 당대표 직무대행 겸 원내대표가 영접했고, 청와대에선 강훈식 대통령비서실장과", "language": "ko"}, {"title": "AI로 기뢰 탐지하고 무인수상정 투입…한화시스템 시연 성공", "url": "https://www.yna.co.kr/view/AKR20260803074300003", "source": "연합뉴스", "published": "2026-08-03T02:31:41+00:00", "summary": "(서울=연합뉴스) 홍규빈 기자 = 한화시스템은 부산 해군작전사령부 기지에서 '인공지능(AI) 기반 유무인 복합 전투체계 대(對)기뢰전'을 시연했...", "language": "ko"}, {"title": "국방부, 민통선 미확인 지뢰지대 단계적 제거…'민간 대행' 제도 시행", "url": "https://www.newsis.com/view/NISX20260803_0003733967", "source": "뉴시스", "published": "2026-08-03T02:20:39+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부는 민간인통제선 일대 미확인지뢰지대를 단계적으로 제거하는 내용 등을 담은 '제1차 지뢰대응활동 기본계획(2027~2031)'을 지뢰대응 활동위원회의 심의를 거쳐 최종 확정했다고 3일 밝혔다.  이 기본계획은 2024년 제정돼 지난해 2월 시행된 '지뢰의 제거 등 지뢰대응활동에 관한 법률'에 근거해 최초로 수립된 5년 주기 법정계획이다.  기본계획에는 그동안 군사작전의 일환으로 군이 전담해 온 지뢰제거 방식을 법령과 국제기준(IMAS)에 부합하는 지뢰대응활동 체제로 전환하겠다는 정부 의지가 담겼다", "language": "ko"}, {"title": "'바닷속 지뢰' 제거작전, AI 참모가 계획짜고 무인정 투입", "url": "https://www.yna.co.kr/view/AKR20260803067500504", "source": "연합뉴스", "published": "2026-08-03T02:18:27+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 해군이 '인공지능(AI) 전투참모'와 무인수상정을 활용해 바닷속 지뢰, 즉 기뢰를 탐색·제거하는 미래 전장 전...", "language": "ko"}, {"title": "천궁-Ⅱ, 올해 전력화 물량 첫 배치…8월 임무 시작", "url": "https://www.newsis.com/view/NISX20260803_0003733937", "source": "뉴시스", "published": "2026-08-03T02:07:53+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 국방부는 중거리 지대공 유도무기 '천궁-II'(M-SAM-II)의 올해 전력화 계획 물량 중 첫 장비가 지난 1일부터 본격적인 임무를 시작했다고 3일 밝혔다. 국방부에 따르면 지난 5월 M-SAM-II의 올해 전력화 계획 물량 첫 장비가 경기도 소재 미사일방어 포대에 배치됐고 실제 포대 작전 환경을 반영한 모의훈련 등을 거쳐 임무를 개시했다. 우리 군은 M-SAM-II를 2020년부터 순차적으로 배치해 운용 중이다.  국방부는 \"M-SAM-I const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
