기자 = 정부가 경북 구미 방산기업의 해외시장 진출을 돕기 위해 신규 거래처 발굴과 무역보험, 물류비 등 맞춤형 수출 지원을 강화한다. 수출플러스지원단은 12일 경북 구미에서 국방기술진흥연구소, 대한무역투자진흥공사(KOTRA), 한국무역보험공사, 중소벤처기업진흥공단, 한국방위산업진흥회 등과 함께 '방산혁신클러스터 수출기업 간담회'를 개최했다고 밝혔다. 이번 간담회는 지역의 정보통신기술(ICT)·전자산업 기반과 방산기술을 연계하고 있는 경북·구미 방산혁신클러스터 기업의 수출 현장 애로를 듣고 지원 방안을 찾기 위", "language": "ko"}, {"title": "대법, 부하 여군 성폭행하려 한 공군 대령 징역 5년 확정", "url": "https://www.newsis.com/view/NISX20260812_0003746098", "source": "뉴시스", "published": "2026-08-12T04:51:36+00:00", "summary": "[서울=뉴시스]김정현 기자 = 부하 여성 초급 장교를 성폭행하려다 다치게 한 혐의로 구속 기소된 공군 제17전투비행단(17전비) 소속 대령이 실형을 확정받았다. 대법원 2부(주심 엄상필 대법관)는 12일 전직 17전비 전대장 공군 대령 A(50)씨의 군인 등 강간치상, 강제추행 혐의 상고심에서 징역 5년을 선고한 원심을 확정했다.  40시간의 성폭력 치료프로그램 이수, 5년 간의 아동 및 장애인 관련기관 취업제한 명령 등도 함께 확정했다. A씨는 2024년 10월 24일 자신의 관사에서 소위 B씨에게 물리력을 행사하며 성폭행을 시도", "language": "ko"}, {"title": "독립유공자 묘소에 스마트 안내판 설치…QR코드로 공적 확인", "url": "https://www.newsis.com/view/NISX20260812_0003746070", "source": "뉴시스", "published": "2026-08-12T04:16:05+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국가보훈부가 국립묘지 외 전국에 흩어져 있는 독립유공자 묘소에 스마트 안내판을 설치한다. 국가보훈부는 제81주년 광복절을 맞아 전국에 산재한 독립유공자 묘소 3000여기 가운데 올해 우선 50여기를 선정해 스마트 안내판을 설치한다고 12일 밝혔다. ‘독립유공자 바로 봄’ 사업으로 추진되는 이번 사업은 국민들이 독립유공자의 공훈과 독립운동 역사를 보다 쉽게 접할 수 있도록 하기 위한 것이다. 안내판은 가로 20㎝, 세로 120㎝ 크기로 제작된다. 독립유공자의 이름과 출생·사망 연도, 본적, 훈격, 독립", "language": "ko"}, {"title": "검찰, '홍대 클럽서 한국인 폭행' 주한미군에 징역 6개월 구형", "url": "https://www.newsis.com/view/NISX20260812_0003746016", "source": "뉴시스", "published": "2026-08-12T02:55:25+00:00", "summary": "[서울=뉴시스]신유림 기자 = 홍대의 한 클럽에서 한국인 남성을 때려 다치게 한 혐의로 재판에 넘겨진 20대 주한미군 2명에게 검찰이 각각 징역 6개월을 구형했다. 서울서부지법 형사1단독 박지원 부장판사는 12일 공동상해 혐의로 기소된 주한미군 P씨(27)와 M씨(25)에 대한 첫 공판기일을 열고 변론을 종결했다. 검찰은 \"피고인들이 피해자와 합의하지 못한 점과 피해자의 상해 정도가 중한 점을 고려해 피고인들에게 각각 징역 6개월을 선고해달라\"고 재판부에 요청했다. 검찰에 따르면 이들은 지난 3월 21일 오전 3시께 서울 마포구의 ", "language": "ko"}, {"title": "이 대통령, 스틸 美대사 첫 대면…4개국 주한대사 신임장 받아", "url": "https://www.newsis.com/view/NISX20260812_0003745962", "source": "뉴시스", "published": "2026-08-12T02:29:31+00:00", "summary": "[ 고고도가 약 90㎞, 비행거리가 약 690㎞라고 밝혔다.  북한의 이번 미사일로 인한 일본 항공기, 선박에 대한 피해는 확인되지 않았다.  일본 정부는 총리 관저에 설치된 위기관리센터에 관계 부처 담당자로 구성된 긴급 소집팀", "language": "ko"}, {"title": "北 \"日 핵보유 시도, 싹부터 단호히 잘라버려야\"", "url": "https://www.newsis.com/view/NISX20260812_0003745859", "source": "뉴시스", "published": "2026-08-12T01:51:22+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 북한이 '비핵 3원칙' 개정 움직임을 보이는 일본을 겨냥해 \"핵보유 시도는 싹부터 단호히 잘라버려야 한다\"라고 비난했다.  북한 노동신문은 12일 '일본의 핵보유 시도는 싹부터 잘라버려야 한다'라는 제목의 기사를 통해 \"현 일본 정부는 출범한 지 얼마 안돼 핵무기 보유 야망을 공공연히 내비쳤다\"라며 이같이 밝혔다.  신문은 \"집권자인 다카이치는 물론이고 방위상인 고이즈미 등도 '비핵３원칙'의 개정 여부를 비롯해 핵 관련 정책을 토의해야 한다고 주장했다\"라며 \"일본이 핵보유 흉심을 노골적으로 드러낸 것", "language": "ko"}, {"title": "청년 취업자 45개월째 감소…실업률 5년6개월來 최대폭↑(종합2보)", "url": "https://www.newsis.com/view/NISX20260812_0003745759", "source": "뉴시스 경제", "published": "2026-08-12T01:30:50+00:00", "summary": "[세종=뉴시스] 안호균 박광온 기자 = 7월 취업자 수 증가폭이 두자릿 수를 회복했다. 하지만 아직 올해 초와 비교하면 증가세가 크게 부진했고 15~29세 청년층 실업률은 4년 만에 최고치를 나타냈다. 제조업, 건설업 등 업종에서 고용 한파도 지속됐다. 12일 국가데이터처가 발표한 7월 고용동향에 따르면 지난달 취업자는 2913만6000명으로 전년 동월 대비 10만8000명(0.4%) 증가했다. 월간 취업자 수 증가폭은 1월 10만8000명, 2월 23만4000명, 3월 20만6000명으로 두자릿수를 기록한 뒤 중동전쟁 여파로 4월", "language": "ko"}, {"title": "The lasers are coming, but don’t forget training", "url": "https://www.defenseone.com/technology/2026/08/lasers-are-coming-dont-forget-training/415357/", "source": "Defense One", "published": "2026-08-12T01:12:47+00:00", "summary": "Army space and missile defense leaders call for more emerging tech—and training—as new systems are developed.", "language": "en"}, {"title": "HD현대중공업·한화오션, 남미 함정 시장 개척 박차… 잠수함 수출 총력 - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMihAFBVV95cUxQMXVHY3pFN0xBSDlTTHVIaTdWY0ZYWjJoS1NuUWJReHc2bUZqaG1WOVcyMk9nTWNLVHJWWU4wbFBLWkVVZjdfLUJmOEhzMjhHZzNlZUZ4akZVRDFlZTFQLUlnNkxoSkRhUG1ScUpfd1dKd1dmbU80eUxvaWIxM3J0T1BYcVrSAZgBQVVfeXFMTlpNYlBUeU10RW90cHYtUTFXX3NNemlXV2U4MUotOTkwbldZVXRFYVBBUmtvSlVVbkRHUU9iRWc0ZGs3SktpRWtoMXQ0RkU5TWc4cEFld29RSnUwcFlXNjRLWGNDQTc4b2w5N2c4YXk0TGhmZWxtZFF const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
