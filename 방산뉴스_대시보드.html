ared their perspective this week while visiting a high-profile airshow in the UK.", "language": "en"}, {"title": "美국무, 韓 군함파견 요구 질문에 \"오늘은 논의 안했다\"", "url": "https://www.newsis.com/view/NISX20260722_0003719471", "source": "뉴시스", "published": "2026-07-22T14:15:25+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 마코 루비오 미국 국무장관은 22일(현지 시간) 한국 등 아시아 국가들에 군함 등 군사자산을 호르무즈 해협에 보내줄 것을 요구했느냐는 질문에 \"오늘은 그들에게 그런 요청을 하지 않았다\"고 말했다. 루비오 장관은 이날 필리핀 마닐라에서 아세안(ASEAN·동남아시아국가연합) 외교장관회의 참석을 계기로 한미일 외교장관회의 등을 개최한 뒤 취재진과 만나 이같이 말했다.  앞서 국내에서는 미국과 이란 전쟁이 전면전 양상으로 치달으면서, 미국이 다시금 한국 등 동맹국에 군함 등 군사자산 파견을 요구하고 있다", "language": "ko"}, {"title": "한·캐나다 외교장관회담 개최…\"국방·방산 협력 긴밀히 소통\"", "url": "https://www.newsis.com/view/NISX20260722_0003719473", "source": "뉴시스", "published": "2026-07-22T14:09:19+00:00", "summary": "[마닐라=뉴시스] 유자비 기자 = 조현 외교부 장관은 22일(현지시간) 필리핀 마닐라에서 아세안 관련 외교장관회의 계기 아니타 아난드 캐나다 외교장관과 회담을 갖고, 국방·방산, 에너지·핵심광물, 인공지능(AI) 등 전략 분야에서의 실질 협력 진전 방안에 대해 논의했다.  외교부에 따르면 조 장관은 회담에서 최근 다수의 한국 방산 기업들이 NATO 회원국들의 방위 역량 강화에 기여하고 있다고 설명했다.  양 장관은 기존의 외교·안보 협의체를 기반으로 한-캐 간 국방·방산 협력이 상호 호혜적인 방향으로 발전할 수 있도록 긴밀히 소통해", "language": "ko"}, {"title": "조현, 호주·뉴질랜드와 외교장관 회담…\"LNG 등 에너지 안정적 수급 협조 당부\"", "url": "https://www.newsis.com/view/NISX20260722_0003719470", "source": "뉴시스", "published": "2026-07-22T14:08:18+00:00", "summary": "[마닐라=뉴시스] 유자비 기자 = 조현 외교부 장관은 아세안 관련 외교장관회의 참석을 위해 필리핀 마닐라를 방문한 계기에 22일(현지시간) 호주의 페니 웡 외교장관, 뉴질랜드의 윈스턴 피터스 외교장관과 각각 양자 회담을 개최했다.  외교부에 따르면 양 장관은 한-호주 외교장관회담에서 지난 4월 '한-호주 에너지자원 안보 공동성명'을 토대로 양국간 에너지 협력을 지속 강화해 나가기로 했다.  조 장관은 호주가 우리의 최대 LNG 공급국인 만큼 주요 에너지자원의 안정적 수급을 위한 호주측의 관심과 협조를 당부했다.  같은 날 오후에 개", "language": "ko"}, {"title": "Collaborative Combat Aircraft need to be more than a flying weapons magazine", "url": "https://breakingdefense.com/2026/07/collaborative-combat-aircraft-need-these-systems-to-be-more-than-a-flying-weapons-magazine/", "source": "Breaking Defense", "published": "2026-07-22T14:00:40+00:00", "summary": "[Sponsored] Capabilities, cost and autonomy are top of mind c : "(춘천=연합뉴스) 이재현 기자 = 강원특별자치도는 국방부가 속초·고성 용촌통신부대 주변의 제한 보호구역을 해제한 것에 대해 환영의 뜻을 밝혔다.", "language": "ko"}, {"title": "'상관모욕죄' 26년만에 판례 변경…\"'소수 앞에서'는 처벌 못해\" 취지", "url": "https://www.newsis.com/view/NISX20260722_0003718782", "source": "뉴시스", "published": "2026-07-22T05:40:27+00:00", "summary": "[서울=뉴시스]김정현 기자 = 소수의 부하가 있는 자리에서 지휘관을 비난했다는 것만으로는 군형법상 상관모욕죄로 처벌할 수 없다는 대법원의 판단이 나왔다. 1999년 12월 정했던 판례를 26년여 만에 바꾼 것이다. 대법원 전원합의체(주심 이흥구 대법관)는 22일 해군 함정 전탐장(상사) A씨의 상관모욕 혐의 상고심에서 징역 6개월에 집행유예 1년을 선고한 고등군사법원의 원심 판결을 무죄 취지로 깨고 서울고법으로 이송했다. A씨는 2019년 10월 기지로 입항하던 함정 내 조타실에서 상관인 대위 B씨가 권고를 듣지 않자 하사 등 3명", "language": "ko"}, {"title": "靑, '美 군함 파견 요청' 보도에 \"특정 자산 파견 요청받은 바 없어\"", "url": "https://www.newsis.com/view/NISX20260722_0003718716", "source": "뉴시스", "published": "2026-07-22T05:07:35+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 청와대는 22일 도널드 트럼프 미국 행정부가 최근 정부에 호르무즈 해협 내 군함 파견 등을 요청했다는 보도와 관련해 \"구체적인 특정 자산 파견을 요청받은 바는 없다\"고 밝혔다. 청와대 관계자는 이날 해당 보도에 대한 입장을 묻는 취재진 질문에 \"정부는 국제해상교통로의 안전과 항행의 자유와 관련해 최근 미국 측으로부터 구체적인 특정 자산 파견을 요청받은 바는 없다\"고 말했다. 이어 \"미측과 관련 협력 방안을 지속 논의해온 바 호르무즈 해협의 통항 자유를 위한 실질적인 기여 방안에 대해 한반도 대비태세와", "language": "ko"}, {"title": "정부, 안보리 대북제재 위반 혐의 '프라다호' 평택항 억류", "url": "https://www.newsis.com/view/NISX20260722_0003718719", "source": "뉴시스", "published": "2026-07-22T05:06:54+00:00", "summary": "[서울=뉴시스] 박준호 기자 = 한국 정부가 대북 제재 위반 혐의를 받고 있는 선박 한 척을 억류 중인 것으로 확인됐다. 외교부 당국자는 22일 \"정부는 프라다(Prada)호가 과거 안보리 대북제재 결의 위반 활동에 관여했다는 정보를 바탕으로 지난 3월 평택항에 입항한 이 선박에 대한 관계부처 합동조사를 진행했다\"고 밝혔다.  이어 \"정부 조사 결과 프라다호의 안보리 결의 위반 가담 사실이 밝혀져, 안보리 결의에 따른 후속조치로서 이 선박을 억류 중\"이라고 했다. 프라다호는 유엔 안보리 결의가 금지한 북한산 석탄과 철광석 수출에 연", "language": "ko"}, {"title": "Companies race to deliver autonomous uncrewed fighter jets - Reuters", "url": "https://news.google.com/rss/articles/CBMiugFBVV95cUxNWktOQjhLNlhnWmloeTZjN0JDRlVRVnhFMU1Mc2VvU25tRi1JeW96WlRRX1p0aUtHa1ltVElwWUdCdUJJeUJsY2tsVVhfMHJjSDdlV1hCVVp5dVZGMXYwQ3RRWElVV1V4TVRPTlJVbzBtSGt0UUlJYnQ3N2pWeWR6ako2TXlTSDJQR1dLU1pjemtpRTMzQUstVmhlcEtNbjBxLVVkZl9Na0dsVHRf const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
