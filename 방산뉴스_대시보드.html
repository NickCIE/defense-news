네팔 측과 협의해서 어느 정도 진행을 하고 추적을 지금 하고는 있다\"고 말했다. 당국자는 다만 \"정보가 더 필요한 부분도 있고 해서 그런 부분은 더 협의를 해나가야 될 부분이 있다\"며 \"위치 추적을 하려면 여러 요소가 필요한 것으로 보인다\"고 했다.", "language": "ko"}, {"title": "장하준 \"자유무역 최선 아냐…韓 산업화식 '관리무역'이 대안\"", "url": "https://www.newsis.com/view/NISX20260902_0003772881", "source": "뉴시스 경제", "published": "2026-09-02T02:49:54+00:00", "summary": "[세종=뉴시스]박광온 기자 = 미국발 관세 압박과 글로벌 통상 갈등이 이어지는 가운데, 개발경제학자 장하준 영국 런던대 아시아·아프리카대학원(SOAS) 교수는 자유무역이 경제 발전을 위한 최선의 방식이 아니라고 진단했다. 그는 한국의 산업화 과정처럼 신산업 보호와 수출 지원을 병행하는 방식의 '관리무역(managed trade)'을 대안으로 제시했다. 장 교수는 지난 1일(현지 시간) 국제통화기금(IMF) 홈페이지에 공개된 계간지 'Finance & Development(F&D)' 브루스 에드워즈와의 인터뷰에서 이 같은 의견을 내놨", "language": "ko"}, {"title": "박완수 경남지사 \"해군사관학교 이전, 진해시민 수용못해\"", "url": "https://www.yna.co.kr/view/AKR20260902083700052", "source": "연합뉴스", "published": "2026-09-02T02:22:35+00:00", "summary": "(창원=연합뉴스) 이정훈 기자 = 박완수 경남지사는 2일 \"군항인 진해에서 육군대학, 해군작전사령부에 이어 해군사관학교까지 떠난다면 진해시민 입...", "language": "ko"}, {"title": "[네팔 대홍수] 韓실종자 휴대전화 위치추적…헬기·드론·도보 수색도 지속", "url": "https://www.yna.co.kr/view/AKR20260902079000504", "source": "연합뉴스", "published": "2026-09-02T02:14:56+00:00", "summary": "(서울=연합뉴스) 김지헌 민선희 기자 = 정부가 네팔 대홍수로 실종된 한국인들의 위치 파악을 위해 휴대전화 정보 활용을 시도하고 있다.", "language": "ko"}, {"title": "'공포의 산악지형' 김해공항 비행기 착륙 더 안전해진다", "url": "https://www.newsis.com/view/NISX20260902_0003772368", "source": "뉴시스 경제", "published": "2026-09-02T02:01:50+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 부산 김해국제공항으로 도착하는 항공기의 착륙 안전성이 보다 높아질 전망이다.  국토교통부는 첨단위성항법절차(RNP-AR)를 오는 3일부터 발효한다고 2일 밝혔다. 첨단위성항법절차는 지형지물과 장애물 등으로 직진 착륙절차 수립이 어려워 조종사의 육안 판단 방식인 시계비행에 의존하는 공항에 적용 가능한 새로운 계기비행 절차다. 위성항법을 기반으로 사전에 설계된 일정한 경로를 정밀하게 비행해 안전하게 착륙할 수 있게 된다.  실제 운항은 항공사의 자체 운항 준비와 운항당국의 특별 승인을 거쳐 순차적으로 적", "language": "ko"}, {"title": "이란전쟁에 국가부채까지…글로벌 국채금리 수십년래 최고", "url": "https://www.newsis.com/view/NISX20260902_0003772529", "source": "뉴시스 경제", "published": "2026-09-02T01:43:58+00:00", "summary": "[서울=뉴시스]박미선 기자 = 이란전쟁 장기화에 따른 인플레이션 우려와 주요국의 막대한 국가부채가 맞물리면서 글로벌 채권시장이 흔들리고 있다. 여기 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
