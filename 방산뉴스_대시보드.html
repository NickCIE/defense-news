NISX20261028_0003845453", "source": "뉴시스", "published": "2026-10-28T10:54:17+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 신장식 조국혁신당 대표는 28일 더불어민주당 소속 진성준 국회 국방위원장이 미국 비자 발급을 거부당한 데 대해 \"대한민국 국회를 무시하고, 한미 동맹의 근간인 상호 존중과 신뢰를 훼손하는 미국 측의 조치에 강력한 유감을 표한다\"고 했다. 신 대표는 이날 오후 페이스북에 글을 올려 \"진성준 국회 국방위원장이 미국으로부터 비자 발급을 거부당했다. 앞서 정청래 의원도 비자 발급이 보류돼 미국 현지 국정감사에 참여하지 못했다\"며 이같이 말했다. 이어 \"국정감사에 이어 안보 협력을 위한 공식 방문까지 가로막혔", "language": "ko"}, {"title": "성평등장관 \"여성징병제 정책적 검토 필요…청년 의견 살펴볼 것\"(종합)", "url": "https://www.newsis.com/view/NISX20261028_0003845426", "source": "뉴시스", "published": "2026-10-28T10:17:51+00:00", "summary": "[서울=뉴시스] 고홍주 박정영 기자 = 원민경 성평등가족부 장관이 여성징병제에 대해 \"정책적 검토가 필요하다고 생각한다\"고 밝혔다. 임신중지 약물 도입과 관련해서는 청소년 지원단체들의 조속한 이용 요청이 많았다며 사용 가이드라인을 준비하고 있다고 설명했다. 원 장관은 28일 서울 여의도 국회에서 열린 성평등가족위원회 국정감사에서 이같이 말했다. 이날 임종득 국민의힘 의원은 병역자원 감소와 병역의무의 성별 형평성 문제를 언급하며 여성징병제에 대한 검토를 미뤄서는 안 된다고 지적했다. 최근 성평등부가 주최한 청년 공론장에서도 관련 의견", "language": "ko"}, {"title": "\"韓, 지나치게 친러 성향으로 기울고 있다\" 유럽 외교관들 우려", "url": "https://www.newsis.com/view/NISX20261028_0003845401", "source": "뉴시스", "published": "2026-10-28T10:08:26+00:00", "summary": "[서울=뉴시스] 유세진 기자 = 이재명 대통령은 최근 북극 횡단 항해를 마치고 돌아온 컨테이너선 팬스타 아크로호 선원들을 환영하며, \"먼 바다에서 보여준 선원들의 용기와 책임감에 변함없는 행동으로 보답하고 대한민국의 새로운 길을 열겠다\"고 약속했지만, 서울 주재 유럽 외교관들의 반응은 그다지 열광적이지 않았다고 파이낸셜 타임스(FT)가 28일 보도했다. 러시아 북극 해안을 따라 이어지는 북극 항로를 이용하면 수에즈 운하를 통한 유럽 여행보다 운항 기간을 열흘이나 단축할 수 있지만, 러시아의 광범위한 협력이 필요하다. 이달 돌아온 한", "language": "ko"}, {"title": "한미, 12월 美 워싱턴서 국방장관회담 개최키로…SCM은 내년 초로", "url": "https://www.newsis.com/view/NISX20261028_0003845419", "source": "뉴시스", "published": "2026-10-28T09:59:30+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 한미가 올 12월 미 워싱턴에서 국방장관회담을 개최하기로 했다. 통상 11월 초에 열리던 한미안보협의회의(SCM)은 내년으로 연기됐다.  국방부는 강신철 장관이 필리핀에서 개최된 제13차 아세안 확대 국방장관회의 참가를 계기로 28일 피트 헤그세스 미 전쟁부 장관과 첫 대면회담을 가졌다고 밝혔다.  이번 회담은 당초 15분으로 예정됐으나 40분으로 길어진 것으로 알려졌다. 순차가 아닌 동시통역으로 진행되면서 상당히 심도있는 논의가 이뤄진 것으로 전해졌다.  강 장관은 한미동맹이 지난 70여년 간 역내", "language": "ko"}, {"title": "野, '美 믿을 수 있나' 국방장관에 \"안보적 자해 발언…경질해야\" const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
