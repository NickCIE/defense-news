ublished": "2026-09-19T01:00:00+00:00", "summary": "[서울=뉴시스] 강세훈 기자, 신지아 인턴기자 = 18일 찾은 경기 평택시 고덕동 일대는 대규모 신도시가 만들어지는 과정을 한눈에 보여줬다. 왕복 8차선 도로를 따라 건설 장비와 공사 펜스가 이어졌고, 흙을 실은 대형 트럭도 쉴 새 없이 오갔다. 기존 아파트 단지가 들어선 구간을 지나자 곳곳에서 새로운 주거시설을 짓는 공사가 한창이었다.  오는 21일 특별공급을 시작으로 청약 일정에 돌입하는 '힐스테이트 고덕엘리스트'는 이곳에 들어선다. 평택고덕국제화계획지구 A12·A65블록에 각각 942가구와 837가구, 총 1779가구 규모로 ", "language": "ko"}, {"title": "김정은, 사흘간  군수공장 시찰…\"포병, 파괴적 공격력 갖춰야\"", "url": "https://www.newsis.com/view/NISX20260919_0003796499", "source": "뉴시스", "published": "2026-09-19T00:50:44+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 김정은 북한 국무위원장이 사흘에 걸쳐 군수공장을 시찰하며 포병무력 현대화를 강조했다. 북한 조선중앙통신은 김 위원장이 16일부터 18일까지 중요 군수공업 기업소들의 생산실태를 점검했다고 19일 보도했다. 김 위원장은 \"중요 군수공업 기업소들이 우리 군대의 포병 전투무력 개편 및 현대화 종합계획의 수요를 충족시키기 위하여 당에서 포치(지시)한 생산능력 확대 사업들도 드팀없이(끊임없이) 진척시키고 있는 데 대하여 평가\"했다고 통신은 전했다. 김 위원장은 \"우리 포병은 가장 집초적이고 가장 파괴적이며 대", "language": "ko"}, {"title": "한미 통합국방대화(KIDD) 이례적으로 부산에서 회의", "url": "https://www.newsis.com/view/NISX20260919_0003796492", "source": "뉴시스", "published": "2026-09-19T00:37:30+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 한미 국방부가 지난 16~18일 부산에서 제29차 한미 통합국방대화(KIDD)를 개최했다고 미 국방부가 18일(현지시각) 발표했다.  KIDD는 매년 2차례 열리는 실무급 고위협의체로 한미 국방 분야의 구체적인 과제를 검토하고 그 이행 결과를 한미국방장관회의(SCM)에 보고한다.  김홍철 국방부 정책담당 차관과 조지 르뫼르 미 국방부 동아시아 담당 부차관보가 대표로 참석한 이번 회의에서 양측은 지난해 한미 양국 대통령의 공동 팩트시트와 제57차 한미안보협의회의(SCM) 공동성명에 담긴 국방협력 분야의", "language": "ko"}, {"title": "북, IAEA 결의에 반발…\"핵보유국 지위에 아무 영향 못 미쳐\"", "url": "https://www.newsis.com/view/NISX20260919_0003796473", "source": "뉴시스", "published": "2026-09-19T00:17:12+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한은 19일 자국을 핵확산금지조약(NPT)상 핵보유국으로 인정할 수 없다는 사실을 재확인한 국제원자력기구(IAEA) 총회 결의에 김여정 노동당 총무부장, 외무성 대변인 담화로 반발했다. 김 부장은 이날 북한 대외매체 조선중앙통신을 통해 '국제원자력기구의 편견적 시각과 이중기준은 국제핵전파방지제도(NPT)의 붕괴를 초래한 기본 인자이다' 제목의 담화를 발표했다. 김 부장은 \"미국과 서방의 사촉 밑에 기구가 매해 조작하고 있는 이러한 무의미하고 비효율적인 '결의'는 우리에게 있어서 새로운 체험이 아니", "language": "ko"}, {"title": "“K방산 유럽 협력 기반 넓힌다” 한국방위산업진흥회, 에스토니아와 협력 확대 - v.daum.net", "url": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE9INVE4Ylc5M2x5WGU4dEhCOVJtZGhfUHhfZ3Z0Um1NUkZQRE1CMmYyV09hcl9ZdS13NWhBUDUtNDNwSUx4VTRjNU80SGYyRzQ?oc=5", "source": "방산 뉴스", "published": "2026-09-19T00:00:00+00:00", "summary": "“K방산 유럽 협력 기반 넓힌다” 한국방위산업진흥회, 에스토니아와 협력 확대    v.daum.net", "language": "ko"}, {"title": "2작전사, '불량 식자재 막는다'…추석 전 군 급식 점검 강화", "url": "https://www.newsis.com/view/NISX20260918_0003796357", "source": "뉴시스", "published": "2026-09-18T23:00:00+00:00", "summary": "[대구=뉴시스]정재익 기자 = 육군 제2작전사령부는 추석을 앞두고 장병들의 안전한 급식을 위해 군납 식자재 관리를 강화한다고 19일 밝혔다. 점검은 식자재의 조달부터 검수, 검사, 급식 현장까지 전 과정의 안전성을 확보하기 위해 마련됐다. 2작사는 전날 대구·경상권역 군 급식유통센터에서 국립농산물품질관리원 경북지원과 군납 식자재 합동검수를 진행했다. 합동검수는 수입 농산물 유입과 원산지 표시 위반을 막기 위해 매월 한 차례 실시한다. 2작사는 양배추 등 채소류 12개 품목과 삼겹살 등 축산물 5개 품목, 김치·두부 등 가공품을 대상", "language": "ko"}, {"title": "조현·루비오, 北비핵화 공감…\"북미대화 진전은 아직\"(종합)", "url": "https://www.newsis.com/view/NISX20260919_0003796426", "source": "뉴시스", "published": "2026-09-18T22:54:59+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 김정은 북한 국무위원장과 연내 회담을 추진 중인 가운데, 한미 외교수장들이 18일(현지 시간) 만나 양국 현안을 논의하면서 한반도 비핵화에 대한 공감대를 확인했다. 다만 북미대화와 관련해 별다른 진전사항은 없다고 미국 측이 밝힌 것으로 전해졌다. 회담에서는 한국의 호르무즈 해협 파병 문제 역시 논의 테이블에 올랐는데, 미국 측이 구체적인 요구를 하지는 않았다고 정부 관계자가 설명했다. 미국 측은 구글과 쿠팡 등 미국 기업들에 대한 한국 정부의 차별 문제도 제기했다. 조", "language": "ko"}, {"title": "Cape Canaveral is building up its counter-drone defenses, Space Force says", "url": "https://www.defenseone.com/defense-systems/2026/09/cape-canaveral-building-its-counter-drone-defenses-space-force-says/416096/", "source": "Defense One", "published": "2026-09-18T22:51:54+00:00", "summary": "The Florida facility is key to the Pentagon’s plans to launch a thousand rockets a year.", "language": "en"}, {"title": "이번주 국회에는 무슨 일이? [뉴시스국회토pic]", "url": "https://www.newsis.com/view/NISX20260917_0003794395", "source": "뉴시스", "published": "2026-09-18T22:20:00+00:00", "summary": "[서울=뉴시스]고범준 기자 = 9월 12일부터 9월 18일까지의 국회 이슈를 사진으로 풀어본다. [뉴시스국회토pic]은 국회에서 일어난 중요 이슈를 사진으로 풀어보는 '이번주 국회에는 무슨 일이?'로 매주 토요일 여러분을 찾아 갑니다. function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
