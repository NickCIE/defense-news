1억5000만원 이하면 50% 이내에서 최대 6000만원을", "language": "ko"}, {"title": "與, '조희대 탄핵' 판사들 반발에 \"탄핵 대상은 사법부 전체 아닌 대법원장 한 사람\"(종합)", "url": "https://www.newsis.com/view/NISX20261126_0003884227", "source": "뉴시스", "published": "2026-11-26T02:00:49+00:00", "summary": "[서울=뉴시스]신재현 김난영 김윤영 기자 = 더불어민주당이 26일 조희대 대법원장 탄핵 추진과 관련해 \"탄핵은 사법부 전체가 아닌 조 대법원장 행태에 대한 것\"이라고 밝혔다.  한병도 원내대표는 이날 국회 본청에서 열린 정책조정회의에서 \"탄핵의 대상은 사법부 전체가 아니라 조 대법원장 한 사람\"이라며 \"국민의힘은 사법부를 방패막이로 삼아 내란 청산을 가로막지 말라\"고 말했다.  한 원내대표는 \"대법관 공백 장기화와 계엄 당일 심야 간부회의 논의 등 조 대법원장을 둘러싼 의혹은 하나둘이 아니다\"라며 \"12·3 내란 2년이 일주일 앞으", "language": "ko"}, {"title": "[영상] 지상타격 넘어 대잠전까지…튀르키예 드론서 경어뢰 투하 성공", "url": "https://www.yna.co.kr/view/AKR20261126079400704", "source": "연합뉴스", "published": "2026-11-26T02:00:25+00:00", "summary": "(서울=연합뉴스) 튀르키예의 무인 전투기 '바이락타르 아킨지'(AKINCI)가 자국산 경어뢰 '오르카'(ORKA)를 바다에 떨어뜨리는 시험에 성...", "language": "ko"}, {"title": "정부, 국토·환경계획 연계 강화…5극3특 균형성장 뒷받침", "url": "https://www.newsis.com/view/NISX20261126_0003883867", "source": "뉴시스 경제", "published": "2026-11-26T02:00:00+00:00", "summary": "[세종=뉴시스]이수정 기자 = 정부가 5극3특 국가 균형성장과 기후위기 대응을 위해 국토·환경계획 간 연계를 강화한다. 지역 성장거점 조성과 국가전략산업 육성을 위한 전력·용수 공급 등 부처 간 정책 협력도 확대한다. 기후에너지환경부와 국토교통부는 오는 27일 서울 종로구에서 제3차 국가계획수립협의회를 개최하고 '2026~2040 국토·환경계획 통합관리 추진방안'을 논의한다고 26일 밝혔다. 이번 추진방안은 현재 수립 중인 제5차 국토종합계획과 제5차 국가환경종합계획 수정계획(2026~2040년)의 연계성을 높이기 위해 마련됐다. ", "language": "ko"}, {"title": "美 10월 코어 자본재 수주 1.2%↑…\"AI 투자 둔화 우려에도 설비투자 견조\"", "url": "https://www.newsis.com/view/NISX20261126_0003884247", "source": "뉴시스 경제", "published": "2026-11-26T01:59:50+00:00", "summary": "[서울=뉴시스]이재준 기자 = 미국 경기동향을 선행 파악할 수 있는 2026년 10월 코어 자본재(비국방 자본재에서 항공기 제외) 수주가 인공지능(AI) 투자 지속으로 시장 예상을 웃돌며 견조한 흐름을 이어갔다. 마켓워치와 RTT 뉴스, 트레이딩 이코노믹스는 26일 미국 상무부 인구조사국이 전날 발표한 관련 통계를 인용해 10월 코어 자본재 수주가 전월 대비 1.2% 늘어났다고 보도했다. 시장에서는 0.7% 증가한다고 예상했는데 실제로는 이를 0.5% 포인트 상회했다. 9월 코어 자본재 수주 증가율도 애초 0.6%에서 0.8%로 0", "language": "ko"}, {"title": "외교부, 튀르키예와 정상회담 후속조치 점검…\"원전·방산 협력 심화\"", "url": "https://www.newsis.com/view/NISX20261126_0003884205", "source": "뉴시스", "published": "2026-11-26T01:55:07+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 외교부는 지난 3일 이뤄진 한-튀르키예 정상회담 후속조치 점검을 위해 박형철 외교부 유럽국장이 지난 24~25일 튀르키예를 방문했다고 26일 밝혔다.  박 국장은 튀르키예에서 코르쿳 균겐 외교부 아태국장, 아지즈 악수 교통인프라부 대외관계 담당 국장대리, 살리흐 사르 에너지천연자원부 원자력 담당 국장 등을 각각 면담하고 양국 관계 증진 방안에 대해 협의했다.  균겐 아태총국장과의 면담에서 박 국장은 올해 정상회담 계기 에너지, 과학기술, 천연자원 및 광업 등 전략적 분야에서 양국간 MOU를 체결한 것", "language": "ko"}, {"title": "SNT다이내믹스, 국가품질경영대회서 금탑산업훈장 수훈", "url": "https://www.yna.co.kr/view/AKR20261126077100052", "source": "연합뉴스", "published": "2026-11-26T01:50:13+00:00", "summary": "(창원=연합뉴스) 박정헌 기자 = 경남 창원국가산업단지에 본사를 둔 방위산업체 SNT다이내믹스는 '제52회 국가품질경영대회'에서 산업계 최고 영...", "language": "ko"}, {"title": "조국혁신당 \"與, 예산안 합의 안 되면 曺탄핵 연기? 조속히 발의·의결하라\"", "url": "https://www.newsis.com/view/NISX20261126_0003884175", "source": "뉴시스", "published": "2026-11-26T01:49:48+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 조국혁신당은 26일 더불어민주당이 조희대 대법원장 탄핵소추안을 오는 3일 발의하고 9일 처리하는 방안을 검토한다는 보도와 관련해 \"국민의힘과의 예산안 합의 처리가 불발되면 탄핵 일정도 다시 연기할 것인가\"라고 했다. 신장식 조국혁신당 대표는 이날 오전 국회 본관 앞 농성장에서 열린 최고위원회의에서 \"'말과 발이 따로 노는 것은 아닌가' 하는 걱정되는 소식도 있다. 민주당이 국민의힘과의 예산안 합의 처리를 위해 (오는) 12월 2일 이후인 12월 3일 소추안 발의, 9일 의결 방안을 검토하고 있다는 보", "language": "ko"}, {"title": "[테크스냅] 인핸스, 국방정보본부 'AI 민간자문기업' 위촉", "url": "https://www.yna.co.kr/view/AKR20261126065100017", "source": "연합뉴스", "published": "2026-11-26T01:39:22+00:00", "summary": "(서울=연합뉴스) 오지은 기자 = 엔터프라이즈 에이전틱 인공지능(AI) 기업 인핸스가 국방정보본부 AI 민간자문기업으로 위촉됐다고 26일 밝혔다...", "language": "ko"}, {"title": "일본, 원거리 타격 능력 강화 속도…장사정 미사일 전력 확대", "url": "https://www.newsis.com/view/NISX20261126_0003883944", "source": "뉴시스", "published": "2026-11-26T01:36:12+00:00", "summary": "[서울=뉴시스]문은주 기자 = 일본이 '전수방위' 위주의 기존 안보 전략에서 벗어나 적의 군사 거점을 원거리에서 타격할 수 있는 반격 능력 확보에 속도를 내고 있다.  25일 아사히신문에 따르면 집권 자민당은 이날 연내 개정을 앞둔 안보 관련 3문서 중 하나인 '방위력 정비 계획'의 기본 방향을 공개했다. 내용 중에는 반격 능력을 뒷받침할 신형 장사정 대함 미사일 도입 방침이 담겼다.  수송용 컨테이너 같은 상자형 발사 장치에 탑재해 향후 자위대 함정 등에서 발사할 수 있게 개발한다는 구상이다.  자국 영토와 주변 해역을 방어하던 ", "language": "ko"}, {"title": "철도노조 투쟁 첫 function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
