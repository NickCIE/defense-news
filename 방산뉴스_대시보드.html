험과 전문성을 갖춘 인재만", "language": "ko"}, {"title": "드론·AI로 '도시 출몰 멧돼지' 실시간 감시…생물자원관, 기술 개발", "url": "https://www.newsis.com/view/NISX20261001_0003809958", "source": "뉴시스 경제", "published": "2026-10-01T03:00:00+00:00", "summary": "[세종=뉴시스]손차민 기자 = 기후에너지환경부 소속 국립생물자원관이 생활주변 멧돼지 출몰에 따른 국민 불안에 대응하기 위해 인공지능(AI) 기반 감시기술을 개발했다고 1일 밝혔다. 국립생물자원관은 무인기(드론)와 무인 카메라를 활용해 멧돼지의 출몰·이동·포획 정보를 수집하고, 이를 통합 감시 프로그램으로 연계했다. 무인기는 인공지능 딥러닝 기술을 활용해 반경 3㎞ 지역의 멧돼지를 자동으로 탐지하고, CCTV와 포획틀에 설치된 무인 카메라는 멧돼지의 이동과 포획 상황을 실시간으로 감시한다. 특히 멧돼지 사진 약 1만2000장을 학습한", "language": "ko"}, {"title": "폭약 터지고 산 깎이고…'세계 최대' 용인 반도체 산단 이달 첫 삽[르포]", "url": "https://www.newsis.com/view/NISX20261001_0003810522", "source": "뉴시스 경제", "published": "2026-10-01T03:00:00+00:00", "summary": "[용인=뉴시스]정유선 기자 = 지난달 30일 찾은 경기 용인시 처인구 이동읍 일대. 누렇게 익은 들녘 너머 달봉산 자락 곳곳이 나무 없이 벌건 흙바닥을 드러내고 있었다. 벌목을 마친 이 산은 곧 폭약으로 발파돼 깎여 나간다. 삼성전자 반도체 공장(팹)이 들어설 용인 첨단시스템반도체 클러스터 국가산업단지 부지 중 일부다.  용인 반도체 산단은 처인구 일원 약 778만㎡ 부지에 반도체 팹 6기와 소재·부품·장비 기업, 발전시설 3기, 산업용 가스 공급시설 등이 들어서게 될 단지로, 정부 3대 메가프로젝트의 핵심으로 꼽힌다. 이곳에 짓는", "language": "ko"}, {"title": "\"난 기어갈테니 대대장님 모셔라\"…'DMZ 폭발' 보디캠 본 의원들 \"울컥했다\"", "url": "https://www.newsis.com/view/NISX20261001_0003810606", "source": "뉴시스", "published": "2026-10-01T02:59:21+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 서부전선 비무장지대(DMZ) 지뢰 폭발 사고 당시 부상을 입은 중사가 부대원들에게 대대장을 챙기라고 한 뒤 자신은 기어서 현장을 빠져나오는 모습이 장병들 보디캠에 담긴 것으로 전해졌다.  해당 영상은 지난달 29일 국회 국방위원회 전체회의에서 비공개로 재생됐다.  더불어민주당 소속 진성준 국방위원장은 이튿날인 9월 30일 CBS 라디오 '박성태의 뉴스쇼'에 나와 \"사고 당일인 9월 21일 새로운 수색로를 개척하기 위해 우리 장병들이 통문 안쪽으로 진입하고 지뢰를 탐지하는 장면, 폭발이 일어나서 부상을", "language": "ko"}, {"title": "李대통령, 국방색 타이 매고 사관생도와 국군의날 행사 동반입장", "url": "https://www.yna.co.kr/view/AKR20261001097000001", "source": "연합뉴스", "published": "2026-10-01T02:58:25+00:00", "summary": "(서울=연합뉴스) 설승은 기자 = 이재명 대통령은 1일 3군(軍) 지휘부가 있는 충남 계룡대를 찾아 제78주년 국군의날 기념식에 참석했다.", "language": "ko"}, {"title": "시민단체 \"침략전쟁 지원 파병 안 돼\"…국회에 반대 결의안 촉구", "url": "https://www.newsis.com/view/NISX20261001_0003810584", "source": "뉴시스", "published": "20 ished": "2026-10-01T01:12:46+00:00", "summary": "(서울=연합뉴스) 김연정 노선웅 기자 = 국민의힘 정점식 원내대표는 1일 '고교생 살해범' 장윤기가 1심에서 무기징역을 선고받은 것에 대해 \"만...", "language": "ko"}, {"title": "與 \"北 정전협정 위반 도발 강력 규탄…국힘, 규탄결의 채택 협조하라\"", "url": "https://www.newsis.com/view/NISX20261001_0003810248", "source": "뉴시스", "published": "2026-10-01T01:12:13+00:00", "summary": "[서울=뉴시스] 김난영 김윤영 기자 = 더불어민주당이 서부전선 비무장지대(DMZ) 폭발 사건과 관련해 \"한반도 평화를 위협하는 북한의 도발 행위를 강력히 규탄한다\"고 밝혔다. 국민의힘을 향해서는 국방위 규탄 결의안 채택 협조를 요구했다. 한병도 민주당 원내대표는 1일 오전 국회 정책조정회의 모두발언에서 \"한반도 평화를 위협하는 북한의 도발 행위를 강력히 규탄한다\"며 \"책임 있는 사과와 재발 방지 조치에 나설 것을 촉구한다\"고 말했다. 그는 \"부상을 입은 25사단 장병들과 가족 여러분께 다시 한번 깊은 위로를 전한다\"며 \"이번 사고는", "language": "ko"}, {"title": "\"日다카이치, 5일 소신표명 연설서 '납북 해결 위해 북일회담도 배제안해'\"", "url": "https://www.newsis.com/view/NISX20261001_0003810019", "source": "뉴시스", "published": "2026-10-01T01:11:20+00:00", "summary": "[서울=뉴시스] 김예진 기자 = 다카이치 사나에(高市早苗) 일본 총리는 오는 5일 소신표명 연설에서 북한 납치 문제 해결을 위해 정상회담도 고려하겠다는 취지의 입장을 표명할 전망이다.  1일 지지통신은 다카이치 총리가 임시 국회 소집 첫날인 5일 실시할 소신표명의 초안을 입수해, 그가 북한의 핵·미사일 개발에 대해 \"결코 용인할 수 없다\"고 언급할 것이라고 전했다. 또한 초안에 따르면 다카이치 총리는 북한의 일본인 납치 문제 해결을 위해 \"정상회담도 포함해 모든 선택지를 배제하지 않겠다\"고 표명할 예정이다.  마이니치신문, 니혼게이", "language": "ko"}, {"title": "현무·천궁에 KF-21까지…국군 핵심무기, 국군의날 계룡대 집결", "url": "https://www.yna.co.kr/view/AKR20261001061000504", "source": "연합뉴스", "published": "2026-10-01T01:04:53+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 국방부는 1일 계룡대 활주로에서 '자주국방 실현! 대체불가 국군'을 주제로 제78주년 국군의날을 개최했다.", "language": "ko"}, {"title": "국군의 날 행사, 계룡대서 개최…레이저 무기 '드론 요격' 첫 시연", "url": "https://www.newsis.com/view/NISX20261001_0003810190", "source": "뉴시스", "published": "2026-10-01T01:00:00+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 국방부는 1일 충남 계룡대 활주로에서 제78주년 국군의 날 기념행사를 개최한다고 밝혔다.  '자주국방 실현! 대체불가 국군'을 주제로 진행되는 이날 행사에는 내·외빈, 초청인사. 장병·가족, 국민참관인 등 총 3600여명이 참석한다. 행사는 식전행사와 기념식, 식후행사, 기념오찬 순으로 진행된다. 식전행사에서는 민군 통합 태권도 시범과 전통공연, 의장대 시범 등이 펼쳐진다. 기념식에서는 각 군 지휘부와 간부·생도, 병사 대표가 함께 입장한 뒤 국민의례와 열병, 훈장·표창 수여, 기념사 등이 이어진다.", "language": "ko"}, {"title": "정점식 \"정부, 대북 굴종 노선 폐기하라…지원 중단·확성기 설치는 당연\"", "url": "https://www.newsis.com/view/NISX20261001_0003810152", "source": "뉴시스", "published": "2026-10-01T00:40:29+00:00", "summary": "[서울=뉴시스] 이승재 전상우 기자 = 정점식 국민의힘 원내대표는 1일 서부전선 비무장지대(DMZ)에서 발생한 지뢰 폭발 사고와 관련해 정부의 적극적인 대응을 촉구하면서 \"대북 굴종 노선 폐기를 선언하라. 주적은 북한이라고 선언하라\"고 했다. 정 원내대표는 이날 오전 국회에서 열린 최고위원회의에 참석해 \"대북 지원 중단과 대북 확성기 설치는 당연한 기초 단계일 뿐이다. 이것마저 거부한다면 국가의 자존을 포기하는 것\"이라며 이같이 말했다. 그는 \"국회 국방위원회에서는 더불어민주당의 몽니 때문에 '북한 규탄 결의문' 채택이 불발됐다\"며", "language": "ko"}, {"title": "장동혁 \"李, 북한 지뢰도발 책임 묻지 않는다면 불법 대북송금 자백하는 것\"", "url": "https://www.newsis.com/view/NISX20261001_0003810141", "source": "뉴시스", "published": "2026-10-01T00:38:54+00:00", "summary": "[서울=뉴시스]김지훈 우지은 전상우 기자 = 장동혁 국민의힘 대표는 1일 \"오늘 국군의날 기념식에서 이재명 대통령이 연설을 한다. 북한 지뢰 도발에 대해 확고한 책임을 묻지 않는다면 다시 한번 불법 대북송금을 자백하는 것\"이라고 했다.  장 대표는 이날 오전 국회에서 열린 최고위원회의에서 \"어제 유엔사는 북한이 지뢰를 매설했고, 이는 정전협정 위반임을 분명하게 밝혔다. 이는 어떤 말로도 용서받지 못할 명백한 침략행위\"라며 이같이 말했다.  장 대표는 \"이 대통령은 지금까지도 북한이라는 단어 자체를 아예 입에 올리지 않고 있다. 청와", "language": "ko"}, {"title": "k채널/순천시, 광양만권 이차전지 특화단지 지정...방위산업 생태계구축 가속 - K채널", "url": "https://news.google.com/rss/articles/CBMiakFVX3lxTFBQbGFBODh2SUV1Y3lxNUd6VFRVUWxEaVlJX1JNZG5hY3RwV2JWNXViUkRKRDVQYUk5OGhBNEI4bVVtcF9QLVVJUWpKdi1SaGUwMzUxVDI3QlU3RG1QVjg5V2lJb2ZWYzN4bmc?oc=5", "source": "방산 뉴스", "published": "2026-10-01T00:38:04+00:00", "summary": "k채널/순천시, 광양만권 이차전지 특화단지 지정...방위산업 생태계구축 가속    K채널", "language": "ko"}, {"title": "\"수해 복구 장병들에 햄버거 600인분\" 맥도날드, 국군의 날 응원", "url": "https://www.newsis.com/view/NISX20261001_0003810028", "source": "뉴시스", "published": "2026-10-01T00:17:22+00:00", "summary": "[서울=뉴시스]김상윤 기자 = 한국맥도날드가 국군의 날을 맞아 수해 복구 대민 지원에 참여한 육군 제39보병사단 장병들에게 햄버거 600인분을 전달하며 감사와 응원의 뜻을 전했다고 1일 밝혔다. 한국맥도날드에 따르면 이번 '행복의 버거 서프라이즈'는 경남 거제 지역 수해 복구에 참여한 아들과 동료 장병들을 응원하고 싶다는 한 장병 어머니의 사연을 계기로 마련됐다. 옥포SK DT점과 거제점, 통영죽림 DT점, 창원내서 DT점, 마산석전 DT점 등 인근 5개 매장이 메뉴 준비에 참여했다. 올해로 14년째를 맞은 '행복의 버거'는 한국맥", "language": "ko"}, {"title": "열아홉에 산화한 형, 여든일곱 동생 곁으로…75년 만의 귀환 [국군의 날]", "url": "https://www.newsis.com/view/NISX20260929_0003806451", "source": "뉴시스", "published": "2026-10-01T00:01:00+00:00", "summary": "[서울=뉴시스]안재현 기자 = 열여덟에 입대한 형이 돌아왔다. 형을 기다리던 동생은 여든일곱 살이 됐다. 1951년 2월 강원 횡성전투에서 전사한 고(故) 김하동 일병. 75년 만에 돌아온 것은 고작 뼈 몇 조각이었다. 무릎뼈와 정강뼈, 발목뼈와 발등뼈. 국방부 유해발굴감식단(국유단)은 일부만 남은 유해에서 그의 이름을 확인했다. 지난 8월 31일 경기 용인에 있는 동생 김하준 옹의 집에서 ‘호국의 영웅 귀환행사’가 열렸다. 국유단은 유가족에게 신원확인 통지서와 유품을 전달했다. 김 일병은 1932년 1월 경북 경주에서 태어났다. ", "language": "ko"}, {"title": "유용원 \"北, MDL 넘어 수백발 매설 추정\"…목함지뢰 실물 공개", "url": "https://www.newsis.com/view/NISX20261001_0003810001", "source": "뉴시스", "published": "2026-09-30T23:55:17+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 북한군이 서부전선 비무장지대(DMZ) 일대 군사분계선(MDL) 남쪽 지역에 수백발 이상의 지뢰를 매설한 것으로 추정되어 우리 군의 작전 활동 위축이 우려된다. 국회 국방위원회 소속 유용원 국민의힘 의원은 1일 CBS라디오 '박성태의 뉴스쇼'에 출연해 \"육군 25사단 관할 지역에서만 MDL 남쪽 10~15m 지점까지 북한군 지뢰지대 6곳이 조성된 것으로 보인다\"고 밝혔다.  유 의원은 \"북한군은 보통 2~3m 간격으로 지뢰를 매설하는데, 지뢰지대의 폭이 수십m에서 수백m에 달한다\"며 \"이러한 밀도를 고", "language": "ko"}, {"title": "정동영 \"DMZ 지뢰폭발, 정쟁 아닌 근본 대안 모색해야”", "url": "https://www.newsis.com/view/NISX20261001_0003809951", "source": "뉴시스", "published": "2026-09-30T23:47:09+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 정동영 통일부 장관은 1일 서부전선 비무장지대(DMZ) 지뢰폭발 사건과 관련해 \"소모적인 정쟁이 아니라, 왜 이러한 불행한 일이 반복되는지 깊이 성찰하고 근본적인 대안을 모색해야 한다\"고 밝혔다. 정 장관은 이날 페이스북에 올린 글에서 \"철저한 조사에 따른 진상 규명과 함께, 최종 조사 결과에 따른 조치가 필요할 것\"이라며 \"다만, 그것이 한반도 평화를 향한 우리의 노력을 폄훼하거나 왜곡하는 빌미가 되어서는 안 될 것\"이라고 했다. 이어 1998년 북아일랜드 벨파스트에서 체결된 벨파스트 협정을 언급", "language": "ko"}, {"title": "Vision For New Autonomous Warfare Command Laid Out By Pentagon", "url": "https://www.twz.com/news-features/vision-for-new-autonomous-warfare-command-laid-out-by-pentagon", "source": "The War Zone", "published": "2026-09-30T23:39:32+00:00", "summary": "The new command, slated to stand up late next year, will focus on advancing operational autonomous and robotic capabilities across the services. \n The post  Vision For New Autonomous Warfare Command Laid Out By Pentagon  appeared first on  TWZ .", "language": "en"}, {"title": "Heg "}, {"title": "'사회복무요원 102일 결근' 송민호, 오늘 1심 선고…징역 1년6개월 구형", "url": "https://www.newsis.com/view/NISX20260930_0003809354", "source": "뉴시스", "published": "2026-09-30T21:00:00+00:00", "summary": "[서울=뉴시스]신유림 기자 = 사회복무요원으로 근무하면서 복무 관리 책임자와 공모해 총 102일간 무단결근한 혐의로 재판에 넘겨진 그룹 '위너' 송민호(33)씨의 1심 결론이 1일 나온다.  서울서부지법 형사10단독 성준규 판사는 이날 오전 10시 병역법 위반 등 혐의를 받는 송씨와 복무 관리 책임자 이모씨에 대한 1심 선고기일을 연다. 검찰은 지난 4월 열린 결심공판에서 송씨에게 징역 1년6개월을 구형했다. 함께 기소된 이씨에게는 징역 1년을 선고해달라고 요청했다. 송씨는 2023년 5월 30일부터 2024년 12월 2일까지 마포", "language": "ko"}, {"title": "식품업계, 국군의 날 맞아 할인·증정 행사로 감사 전한다", "url": "https://www.newsis.com/view/NISX20260930_0003809261", "source": "뉴시스", "published": "2026-09-30T20:30:00+00:00", "summary": "[서울=뉴시스]이주혜 기자 = 식품업계가 국군의 날을 맞아 국군 장병을 대상으로 감사와 응원을 전하는 행사를 마련했다. 매장을 찾은 군인에게 제품 할인과 무료 증정 등 혜택을 제공하고 군부대를 찾아 물품을 전달한다.  1일 업계에 따르면 파파이스, 도미노피자, 테라로사 등 식음료 브랜드가 국군의 날을 맞아 감사의 마음을 전한다. 파파이스는 오는 5일까지 전국 매장을 방문하는 국군 장병에게 치킨샌드위치 세트를 무료로 증정한다. 해당 기간 매장을 찾아 군인 신분을 확인받으면 치킨샌드위치 클래식이나 스파이시 중 원하는 메뉴 1종과 케이준", "language": "ko"}, {"title": "Crude oil exports through the Strait of Hormuz hit prewar levels, but fuel shipments remain constrained", "url": "https://www.cnbc.com/2026/09/30/iran-war-strait-hormuz-gulf-oil-fuel.html", "source": "CNBC", "published": "2026-09-30T20:16:17+00:00", "summary": "It is unclear how long the recovery can be sustained given that it relies on the U.S. military protecting tankers in the Persian Gulf.", "language": "en"}, {"title": "[오늘의 주요일정]정치(10월1일 목요일)", "url": "https://www.newsis.com/view/NISX20260930_0003809680", "source": "뉴시스", "published": "2026-09-30T20:00:00+00:00", "summary": "[서울=뉴시스] ◇청와대【대통령】 15:00 대통령 주재 수석보좌관회의(청와대 여민관) ◇총리실【총리】 14:00 AI 행정혁신 우수공직자 간담회(정부서울청사 9층) 16:00 해외 기술유출 방지 대책 회의(정부서울청사 9층) ◇국방부【장관】 10:00 국군의 날 기념행사 【차관】 09:00 차관회의 ◇외교부【장관】 통상일정 【2차관】 09:00 차관회의 ◇통일부【장관】 통상일정 【차관】 09:00 차관회의 참석 13:30 「DMZ자생식물원 개원 10주년 국제심포지엄」 축사(경기 포천 국립수목원) 19:20 ｢2026 통일정책최고위", "language": "ko"}, {"title": "Poland to set quicker air defence procedures, defence   "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
