38+00:00", "summary": "[전남광주=뉴시스]송창헌 기자 = 조국혁신당 초대 전남광주통합특별시당위원장에 서왕진 국회의원이 선출됐다. 서 신임 위원장은 '당원 주권 시당'을 전면에 내걸고 조직 정비와 정책 역량 강화에 나서는 한편 민형배 통합시장과 더불어민주당에 협치와 상생을 제안했다. 혁신당 전남광주통합특별시당은 22일 광주음악산업진흥센터에서 당원대회를 열고 단독 입후보한 서 의원을 찬반투표 결과 97% 찬성으로 초대 시당위원장으로 선출했다. 이날 당원대회에는 온·오프라인으로 3000여 명의 당원이 참여했고 신장식 당대표를 비롯한 중앙당 지도부와 사순문 장흥", "language": "ko"}, {"title": "이란, 美 '역사상 최대 규모 경제 고립' 예고에 \"불법 경제전쟁\" 반발", "url": "https://www.newsis.com/view/NISX20260822_0003758571", "source": "뉴시스 경제", "published": "2026-08-22T11:29:47+00:00", "summary": "[서울=뉴시스]박미선 기자 = 미국이 이란을 상대로 전례 없는 수준의 경제 제재를 예고한 가운데 이란이 이를 '불법적인 경제전쟁'이라고 규정하며 강하게 반발했다.  22일(현지 시간) CNBC에 따르면 에스마일 바가이 이란 외무부 대변인은 이날 엑스(X·옛 트위터)에 \"미국의 새로운 대이란 경제 제재 발표는 한 국가를 상대로 불법적인 '경제전쟁'을 지속하는 것 이상의 의미가 있다\"고 밝혔다. 그는 \"이는 모든 독립적인 유엔 회원국에 대해 역외 주권을 행사하겠다는 주장\"이라며 미국의 제재 방침을 비판했다. 미국은 대규모 군사작전 대신", "language": "ko"}, {"title": "Ahead of tough new U.S. sanctions, Iran criticizes 'extraterritorial sovereignty'", "url": "https://www.cnbc.com/2026/08/22/iran-criticizes-us-sanctions-extraterritorial-sovereignty.html", "source": "CNBC", "published": "2026-08-22T10:34:23+00:00", "summary": "U.S. Treasury Secretary Scott Bessent told CNBC on Thursday that the proposed economic measures will likely negate the need for major U.S. military operations.", "language": "en"}, {"title": "전쟁 6개월·경제난 심화에…이란 지도부 \"전쟁 끝내야\"", "url": "https://www.newsis.com/view/NISX20260822_0003758553", "source": "뉴시스 경제", "published": "2026-08-22T10:23:09+00:00", "summary": "[서울=뉴시스]박미선 기자 = 6개월째 이어지는 전쟁과 미국의 제재로 경제난이 심화하자 이란 지도부 내에서 전쟁을 끝내고 경제 회복에 집중해야 한다는 목소리가 나오고 있다.  21일(현지 시간) 월스트리트저널(WSJ)에 따르면 마수드 페제시키안 이란 대통령은 이날 \"전쟁은 어느 시점에는 끝나야 한다\"며 \"지금 우리의 힘과 존엄성을 보여주고 세계에 우리가 승리했으며 전쟁을 끝내겠다고 말하는 것이 더 낫다\"고 밝혔다. 모하마드 바게르 갈리바프 이란 의회 의장도 경제 위기를 방치해서는 국가 안보를 확보할 수 없다고 강조했다. 갈리바프 의", "language": "ko"}, {"title": "국힘 \"안규백 경질해야\"…'탈영 의혹·방사청 비리' 앞세워 공세", "url": "https://www.yna.co.kr/view/AKR20260822040400001", "source": "연합뉴스", "published": "2026-08-22T09:30:30+00:00", "summary": "(서울=연합뉴스) 류미나 기자 = 국민의힘은 주말인 22일에도 군무이탈 의혹, 방사청 비리 의혹, 한미연합훈련 축소 등을 연결고리로 안규백 국방...", "language": "ko"}, {"title": "나경원 \"이진숙 징계요구안은 헌법 조롱하는 다수결 폭정\"", "url": "https://www.newsis.com/view/NISX20260822_0003758502", "source": "뉴시스", "published": "2026-08-22T08:11:55+00:00", "summary": "[서울=뉴시스]전민영 인턴 기자 = 나경원 국민의힘 의원이 더불어민주당의 이진숙 의원 징계요구안 제출과 국회의원 직무정지 관련 법안 발의를 두고 \"의회 전체주의\"라며 비판했다. 나 의원은 22일 자신의 사회관계망서비스(SNS)에 \"민주당 의원들이 이진숙 의원에 대한 징계요구안을 제출했다\"며 \"김민석 대표는 '제명이 어려우면 자격정지라도 하자'고까지 하더니, 민주당은 '의원 1년 직무정지법'까지 발의하고 나섰다\"고 적었다. 그러면서 \"(민주당의 행보가) 의회 전체주의이자, 헌법을 조롱하는 다수결의 폭정\"이라고 주장했다. 이어 \"우리 ", "language": "ko"}, {"title": "국립창원대 거창캠퍼스, 지역 청소년과 방위산업 미래 빚는 ‘3D메이커 리더’ 키웠다 - 시사의창", "url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTE5kQkFVajN5WHN1VXVvYkdnMVYxRVZfN2lrTGZIY3dTeUNtWko2amxEZWlROTRsN1Jicm5EN1lkUmU3d0FfMHl5UWlOSTVWQzZ4OE9oVQ?oc=5", "source": "방산 뉴스", "published": "2026-08-22T02:37:10+00:00", "summary": "국립창원대 거창캠퍼스, 지역 청소년과 방위산업 미래 빚는 ‘3D메이커 리더’ 키웠다    시사의창", "language": "ko"}, {"title": "공사비 상승에 커지는 분양 부담…신규 분양단지 눈길", "url": "https://www.newsis.com/view/NISX20260821_0003757919", "source": "뉴시스 경제", "published": "2026-08-22T02:30:00+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 분양가와 공사비가 지속 상승하는 가운데 입지와 상품성을 갖춘 단지들이 신규 분양에 나서 눈길을 모은다.   22일 부동산 전문 리서치업체 리얼투데이에 따르면 대우건설은 이달중 '검암역 푸르지오 프라베뉴'를 분양한다.  검암역 푸르지오 프라베뉴는 대우건설의 올해 첫 민간참여 공공분양 단지다. 인천검암역세권 공공주택지구 B-1BL에 지하 2층~지상 25층, 3개 동, 전용면적 60~84㎡ 총 441가구 규모로 조성된다. 전체 물량의 약 75%를 특별공급으로 배정하며, 특별공급과 일반공급 모두 부부 중복 ", "language": "ko"}, {"title": "국힘 \"정부, 안보 현실 엄중한데 한가한 낙관론…국민은 불안\"", "url": "https://www.newsis.com/view/NISX20260822_0003758363", "source": "뉴시스", "published": "2026-08-22T01:57:10+00:00", "summary": "[서울=뉴시스] 이승재 기자 = 국민의힘은 22일 정부의 안보 인식을 비판하면서 \"지금 정부가 해야 할 일은 한가한 낙관론을 내놓는 것이 아니라 견고한 안보 체제를 재건하고 북한 문제에 대한 확고한 주인의식으로 무장하는 일\"이라고 했다. 박성훈 수석대변인은 이날 논평을 내고 \"안보 현실이 그 어느 때보다 엄중한 상황이다. 북한은 연이은 탄도미사일 발사로 도발을 이어가고 김여정은 대통령 실명까지 거론하며 거친 비난을 쏟아냈다\"며 이같이 말했다. 박 수석대변인은 \"이런 와중에도 이재명 대통령은 '평화 공존'이라는 말만 되풀이한다\"며 \"", function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
