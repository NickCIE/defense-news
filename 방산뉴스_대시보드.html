정인 보도교가 하늘다람쥐와 담비 등 보호종의 서식에 악영향을 끼칠 수 있다며 낙동강유역환경청에 보도교 건설계획 철회를 촉구하고 나섰다. 낙동강유역환경청은 대구 수성구 매호동에서 동구 망우당공원까지 5.5㎞ 구간에 제방 보강과 팔현습지 인근 산책로·보도교 신설 등을 포함한 420억원 규모의 하천환경정비사업을 추진하고 있다.  사업에 포함된 보도교는 길이 886m로 사업비 174억원을 투입해 추진했지만 지역 환경단체의 반발로 2022년", "language": "ko"}, {"title": "국방부, 공군 군악대 동원 음주회식에 \"엄중 사안…필요한 조치 시행\"", "url": "https://www.newsis.com/view/NISX20261102_0003851262", "source": "뉴시스", "published": "2026-11-02T06:16:42+00:00", "summary": "[서울=뉴시스]옥승욱 기자 = 국방부는 공군 일선 부대에서 장성들이 참석한 가운데 군악대를 동원해 과도한 음주 회식을 벌였다는 보도와 관련해 \"매우 엄중한 사안으로 인식하고 있다\"고 밝혔다.  정빛나 국방부 대변인은 2일 정례브리핑에서 관련 질문에 대해 \"국방부 장관은 감사관실에 사실관계를 엄정하게 확인하도록 지시했다\"며 이같이 말했다.  정 대변인은 이어 \"사실관계 확인을 거쳐 필요한 조치를 엄정하게 시행하겠다\"고 덧붙였다.  전날 한 매체는 지난 4월 29일 경남 사천 공군 제3훈련비행단에서 공군 교육사령관(중장)과 제3훈련비행", "language": "ko"}, {"title": "이형일, 주한미국대사 접견 \"동맹 강화 위해 경제협력 확대해야\"", "url": "https://www.newsis.com/view/NISX20261102_0003851114", "source": "뉴시스", "published": "2026-11-02T06:00:00+00:00", "summary": "[세종=뉴시스] 안호균 기자 = 이형일 경제부총리 겸 재정경제부 장관은 2일 정부서울청사에서 미셸 박 스틸 주한미국대사를 접견하고 한미 경제협력 발전 방향 등에 대해 의견을 교환했다.  이 부총리는 스틸 대사의 부임을 축하하면서, 70년 넘게 발전해 온 한미동맹이 안보를 넘어 첨단산업·에너지·공급망 등 경제 분야로 심화되고 있다고 평가했다. 이어 서울에서 태어나 한국과 미국 모두를 깊이 이해하는 스틸 대사가 양국 경제 협력의 든든한 가교가 돼 줄 것을 기대한다고 밝혔다. 양측은 한미 전략투자와 통상 등 현안에 대해서도 의견을 나눴다", "language": "ko"}, {"title": "소설가 김홍신 \"악한 자 글로 벌 주는 것, 문학 소명\"", "url": "https://www.newsis.com/view/NISX20261102_0003851095", "source": "뉴시스", "published": "2026-11-02T05:38:45+00:00", "summary": "[서울=뉴시스]조기용 기자 = \"제가 우리 아이들에게 유언을 미리 남겼습니다. 죽을 때 손에 만년필과 머리맡에 원고지를 놔달라고요. 젊어서부터 등단도 늦었지만, 그때부터 꿈꾼 것이 죽는 날까지 원고지에 글을 쓰자는 것이었습니다.\" 대하소설 '인간시장'으로 한국 출판사상 최초 밀리언셀러 작가 김홍신(79)이 올해로 등단 50주년을 맞았다. 작가는 이를 기념해 장편 '유다의 어머니'(해냄출판사)를 펴냈다. 소설 '죽어 나간 시간을 위한 애도' 이후 3년 만에 선보이는 작품이다. 김홍신은 2일 서울 중구 한국프레스센터에서 열린 신간 출간", "language": "ko"}, {"title": "The Pentagon’s IT agency wants to bridge network gaps in the Pacific", "url": "https://www.defenseone.com/technology/2026/11/pentagons-it-agency-wants-bridge-network-gaps-pacific/416963/", "source":   "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
