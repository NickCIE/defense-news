99", "source": "뉴시스 경제", "published": "2026-08-06T09:27:14+00:00", "summary": "[서울=뉴시스]이재준 기자 = 인도네시아 정부가 중국 자본으로 건설한 자카르타-반둥 고속철도의 경영권을 인수하기로 했다고 태보(太報)와 자유시보, 경제통이 6일 보도했다. 매체는 관련 사정에 밝은 소식통들과 외신을 인용해 인도네시아 정부가 고속철도 운영사 지분 60%를 넘겨 받기로 했다고 전했다. 인도네시아 정부는 고속철도 사업의 남은 부채도 인수하지만 국가 예산을 투입하지는 않을 방침이라고 소식통들은 밝혔다.  푸르바야 유디 사데와 인도네시아 재무장관은 국부펀드 다난타라 측과 공동 기자회견을 열고 재무부 산하 기관을 지정해 고속철", "language": "ko"}, {"title": "北, 동해상으로 단거리탄도미사일 발사…42일 만에 도발 재개", "url": "https://www.newsis.com/view/NISX20260806_0003739578", "source": "뉴시스", "published": "2026-08-06T09:07:23+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 북한이 6일 오후 단거리탄도미사일(SRBM)을 발사하며, 지난 6월 이후 한달여 만에 미사일 도발을 재개했다.  합동참모본부에 따르면 우리 군은 6일 오후 5시께 북한 원산 일대에서 동해상으로 발사된 단거리 탄도미사일을 포착했다. 이날 북한이 미사일을 몇 발 발사했는지는 아직 확인되지 않고 있다.  한미 정보당국은 미사일의 정확한 제원과 사거리 등을 분석 중에 있다.  합참은 \"우리 군은 추가 발사에 대비해 감시 및 경계를 강화하고 있다\"며 \"한·미·일은 '북 탄도미사일' 관련 정보를 긴밀하게 공유하", "language": "ko"}, {"title": "與 \"北, 미사일 도발 강력 규탄…무력 도발 정당화될 수 없어\"", "url": "https://www.newsis.com/view/NISX20260806_0003739569", "source": "뉴시스", "published": "2026-08-06T09:04:06+00:00", "summary": "[서울=뉴시스] 이창환 기자 = 더불어민주당은 6일 북한의 탄도미사일 도발에 대해 \"어떠한 명분으로도 무력 도발은 결코 정당화될 수 없다\"고 규탄했다. 강준현 민주당 수석대변인은 이날 오후 서면 브리핑을 내고 \"북한의 탄도미사일 도발을 강력히 규탄한다\"며 이같이 말했다. 강 수석대변인은 \"북한이 42일 만에 또다시 군사적 움직임으로 한반도 평화와 안정을 위협하고 있다\"며 \"국제 정세가 불안정한 이 시점에서 감행된 이번 도발은 한반도의 긴장만 고조시킬 뿐\"이라고 했다. 이어 \"북한은 당장 무력 시위를 멈추고 한반도 평화와 신뢰 회복의", "language": "ko"}, {"title": "[연합뉴스 이 시각 헤드라인] - 18:00", "url": "https://www.yna.co.kr/view/AKR20260806141000011", "source": "연합뉴스 경제", "published": "2026-08-06T09:00:01+00:00", "summary": "■ 北, 한미훈련 앞두고 동해상으로 단거리 탄도미사일", "language": "ko"}, {"title": "한 총리 \"현대전, 국민 일상까지 위협…변화하는 안보환경 을지연습에 반영\"", "url": "https://www.newsis.com/view/NISX20260806_0003739557", "source": "뉴시스", "published": "2026-08-06T08:53:44+00:00", "summary": "[서울=뉴시스]김경록 기자 = 한성숙 국무총리는 오는 18일~21일로 예정된 을지연습을 앞두고 \"변화하는 안보환경을 연습에 적극 반영해야 한다\"고 당부했다. 한 총리는 6일 오후 정부서울청사 별관에서 '2026년 을지연습 준비 보고 회의'를 열고 \"러시아·우크라이나 전쟁과 중동지역의 무력 충돌은 현대전이 군사적 충돌을 넘어 국가 핵심 기반시설과 국민의 일상까지 직접 위협할 수 있음을 보여주고 있다\"며 이같이 말했다. 한 총리는 \"현재 안보환경에서 정부의 대응 역량은 군사작전 지원뿐 아니라 국민의 일상 유지와 국가 기능 지속까지 포괄", "language": "ko"}, {"title": "[속보]합참 \"北 발사체는 단거리탄도미사일…감시·경계태세 강화\"", "url": "https://www.newsis.com/view/NISX20260806_0003739559", "source": "뉴시스", "published": "2026-08-06T08:49:30+00:00", "summary": "후속기사가 이어집니다", "language": "ko"}, {"title": "[속보] 합참 \"北, 원산 일대서 단거리 탄도미사일 발사\"", "url": "https://www.yna.co.kr/view/AKR20260806142100504", "source": "연합뉴스", "published": "2026-08-06T08:48:19+00:00", "summary": "(", "language": "ko"}, {"title": "韓총리 \"을지연습, 보다 현실적이고 실효성 있는 훈련 준비\"(종합)", "url": "https://www.yna.co.kr/view/AKR20260806126151001", "source": "연합뉴스", "published": "2026-08-06T08:46:17+00:00", "summary": "(서울=연합뉴스) 이상현 기자 = 한성숙 국무총리는 6일 올해 을지연습과 관련 \"각 기관은 AI(인공지능)와 드론, 사이버 공격, 복합 재난 등...", "language": "ko"}, {"title": "日방위성, 北이 동해로 쏜 발사체는 탄도미사일 가능성", "url": "https://www.newsis.com/view/NISX20260806_0003739550", "source": "뉴시스", "published": "2026-08-06T08:42:30+00:00", "summary": "[서울=뉴시스] 유세진 기자 = 북한이 6일 동해로 발사한 발사체는 탄도미사일일 가능성이 았으며, 일본의 배타적경제수역(EEZ) 밖에 떨어진 것으로 추정된다고 일본 방위성이 밝혔다고 NHK가 보도했다. 방위성은 일본에 미칠 영향 등을 파악하기 위해 정보를 수집하고 있지만, 아직까지는 일본 주변에 영향을 미치지 않았다고 발표했다. 북한은 올해 탄도미사일 또는 탄도미사일일 가능성이 있는 물체를 발사한 것은 올 들어 6번째이며, 4월19일 이후 거의 3달 만이다. 앞서 한국 합참은 6일 오후 5시 직후 북한이 동해를 향해 미사일을 발사했", "language": "ko"}, {"title": "외교부, 통일부와 대북정책 이견에 진화…\"NSC서 조율, 원팀 추진\"", "url": "https://www.newsis.com/view/NISX20260806_0003739522", "source": "뉴시스", "published": "2026-08-06T08:27:49+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 외교부와 통일부가 대북정책을 둘러싸고 이견을 노출한 가운데 외교부는 6일 국가안전보장회의(NSC)를 중심으로 부처간 조율을 거치겠다는 입장을 밝혔다. 전날 조현 외교부 장관이 정동영 통일부 장관의 대통령 업무보고 내용을 공개적으로 비판하며 갈등이 불거지자 진화에 나선 것이다.  박두순 외교부 대변인은 이날 정례브리핑에서 통일부와 외교부간 대북 정책 견해차에 대한 질문에 \"정부는 NSC를 중심으로 유관부처간 긴밀한 조율하에 한반도 평화 공존을 위한 정책을 일관되게 추진해 오고 있다\"라고 밝혔다. 외교부", "language": "ko"}, {"title": "한동훈, 정동영 통일장관과 오찬 \"국익 위해 소통, 노력하겠다\"", "url": "https://www.newsis.com/view/NISX20260806_0003739529", "source": "뉴시스", "published": "2026-08-06T08:27:20+00:00", "summary": "[서울=뉴시스]김지훈 기자 = 한동훈 무소속 의원은 6일 정동영 통일부 장관과 오찬 회동을 가졌다고 했다.  한 의원은 페이스북을 통해 \"외교통일위원회 국회의원으로서 정동영 통일부 장관과 오찬을 함께 하며 외교통일 현안에 대한 의견을 폭넓게 나눴다\"고 했다.  그는 \"주적 개념, 북한 호칭, 전작권 전환 등에 대한 서로의 이견도 확인했지만, 앞으로 오로지 국익을 위해 소통하고 생산적인 정치를 할 수 있기를 기대한다\"고 했다. 아울러 \"저도 노력하겠다\"고 했다.  앞서 정 장관은 5일 청와대 업무보고에서 북한을 '주적'으로 표현하는 ", "language": "ko"}, {"title": "방위사업청, 대통령 주재 부처 업무보고를 통해 하반기 핵심 추진과제 발표 - 디펜스투데이", "url": "https://news.google.com/rss/articles/CBMibkFVX3lxTE1rMGd4TFd1ckhWckF2cGRLUHNfVjlKMkJUckJxU3Vyc2FBMm5VakVRVkpYZi14Sy1TbDlVcjFKVWgxdlJZYUltZnRGMXMxODFmZEk3a2tSbXRSS2FwU3hxSzNZVkxVbGFOQUFwd0J3?oc=5", "source": "방산 뉴스", "published": "2026-08-06T08:22:25+00:00", "summary": "방위사업청, 대통령 주재 부처 업무보고를 통해 하반기 핵심 추진과제 발표    디펜스투데이", "language": "ko"}, {"title": "北, 동해상으로 미상 발사체…탄도미사일이면 42일만", "url": "https://www.yna.co.kr/view/AKR20260806138500504", "source": "연합뉴스", "published": "2026-08-06T08:20:29+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 북한이 6일 동해상으로 미상 발사체를 발사했다고 합동참모본부가 밝혔다.", "language": "ko"}, {"title": "북, 동해상으로 미상 발사체 발사…두달여 만에 도발", "url": "https://www.newsis.com/view/NISX20260806_0003739506", "source": "뉴시스", "published": "2026-08-06T08:19:27+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 합동참모본부는 6일 \"북한이 동해상으로 미상 발사체를 발사했다\"고 밝혔다.  해당 발사체가 탄도미사일인지에 대해서는 아직 확인되지 않고 있다. 군은 발사체 종류와 제원 등을 분석 중에 있다.  앞서 북한은 지난 5월 26일 서해상으로 근거리 탄도미사일을 포함한 다종의 발사체를 발사한 바 있다. 당시 탄도미사일은 80여km를 비행해 탄착했다.  이날 발사체가 탄도미사일로 판명날 경우, 약 두 달여 만에 북한이 탄도미사일 도발을 재개한 것이다. \n◎공감언론 뉴시스 okdol99@newsis.com", "language": "ko"}, {"title": "[영상] 中 J-20 스텔스 전투기 고고도서 공대공미사일 발사 모습 포착", "url": "https://www.yna.co.kr/view/AKR20260806136000704", "source": "연합뉴스", "published": "2026-08-06T08:12:56+00:00", "summary": "(서울=연합뉴스) 중국군의 5세대 스텔스 전투기 J-20이 공대공 미사일을 발사하는 모습이 포착됐습니다.", "language": "ko"}, {"title": "北, 러 추가파병설에 미사일부대 동향까지…韓 안보영향 우려↑", "url": "https://www.yna.co.kr/view/AKR20260806123600504", "source": "연합뉴스", "published": "2026-08-06T08:04:40+00:00", "summary": "(서울=연합뉴스) const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
