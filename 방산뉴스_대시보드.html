ary": "(대전=연합뉴스) 김준호 기자 = 2027학년도 대학 수시모집에서 한국과학기술원(KAIST) 등 4대 과학기술원의 경쟁률이 역대 최고치를 기록한...", "language": "ko"}, {"title": "'사후 계엄선포문' 강의구 전 부속실장, 징역 1년6개월 확정", "url": "https://www.newsis.com/view/NISX20261027_0003842335", "source": "뉴시스", "published": "2026-10-27T01:48:53+00:00", "summary": "[서울=뉴시스]김정현 기자 = 12·3 비상계엄 당시 사후 계엄선포문을 작성한 혐의 등으로 기소된 강의구 전 대통령실 부속실장이 대법원에서 실형을 확정받았다. 대법원 1부(주심 천대엽 대법관)는 27일 강 전 실장의 허위공문서 작성, 공용서류손상, 대통령기록물법 위반 등 혐의 상고심에서 징역 1년 6개월을 확정했다. 강 전 실장은 윤석열 전 대통령의 비상계엄 해제 후인 2024년 12월 초 허위 계엄선포문 표지를 사후 작성하고, 이를 보관하다 파쇄했다는 혐의로 법정에 섰다. 계엄 선포가 윤 전 대통령의 서명과 한덕수 전 국무총리·김", "language": "ko"}, {"title": "임성근, '채상병 순직 책임' 징역 3년 확정…사고 3년 3개월만", "url": "https://www.newsis.com/view/NISX20261027_0003842265", "source": "뉴시스", "published": "2026-10-27T01:41:50+00:00", "summary": "[서울=뉴시스]김정현 기자 = '채상병 순직 사건' 책임자로 지목된 임성근 전 해병대 1사단장이 징역 3년을 확정받았다. 채모 상병이 순직한 지 3년 3개월만이다. 대법원 1부(주심 신숙희 대법관)는 27일 임 전 사단장의 업무상 과실치사상, 군형법상 명령 위반 등 혐의 상고심에서 징역 3년을 선고한 원심을 확정했다. 사고 당시 수해 현장을 총괄한 박상현 전 해병대 7여단장과 최진규 전 포11대대장에게는 각각 금고 1년 6개월을 확정했다. 채상병 부대 직속상관인 장모 전 포7대대 본부중대장은 금고 8월에 집행유예 2년을 확정받았다.", "language": "ko"}, {"title": "앤트로픽 \"AI, 인류에 실존적 위험 될 수도\"…IPO 신고서에 90여쪽 경고", "url": "https://www.newsis.com/view/NISX20261027_0003842206", "source": "뉴시스 경제", "published": "2026-10-27T01:35:58+00:00", "summary": "[서울=뉴시스]박미선 기자 = 인공지능(AI) 기업 앤트로픽이 기업공개(IPO)를 앞두고 자사 기술이 인류의 질병을 치료하고 경제성장을 촉진할 수 있지만, 동시에 인류의 존속을 위협하는 재앙을 초래할 수도 있다고 경고했다. 막대한 AI 인프라 투자 부담과 일반 주주의 경영 참여를 사실상 제한하는 이례적인 지배구조도 공개했다.  26일(현지 시간) 파이낸셜타임스(FT)와 뉴욕타임스(NYT), 월스트리트저널(WSJ) 등에 따르면 앤트로픽은 이날 공개한 IPO 증권신고서 가운데 90여 쪽을 위험 요인 설명에 할애했다. 여기에는 AI가 인", "language": "ko"}, {"title": "'비위 제재' LIG D&amp;A 법적 공방…'제2의 KDDX 사태' 우려에 K방산도 부담", "url": "https://www.newsis.com/view/NISX20261027_0003842332", "source": "뉴시스", "published": "2026-10-27T01:20:38+00:00", "summary": "[서울=뉴시스]박현준 기자 = 방위사업청으로부터 2년간 입찰참가자격 제한 처분을 받은 LIG 디펜스&에어로스페이스(LIG D&A)가 법적 대응에 나선 가운데, 이번 제재가 약 2조원 규모의 '한국형 전자전기' 등 주요 국방 연구개발(R&D) 사업의 향방을 가를 변수로 떠올랐다.  여기에 소형무인기 대응체계 사업의 방산업체 지정 취소 가능성까지 제기되면서 자칫 군 전력화 지연과 방산업계의 부담으로 이어질 수 있다는 우려가 나오고 있다. 27일 업계에 따르면 LIG D&A는 지난 22일 방위사업청(방사청)의 2년간 입찰참가자격 제한 처", "language": "ko"}, {"title": "\"전쟁 나면 어쩌지?\"…北 자주포 배치에 생필품 챙기는 누리꾼들", "url": "https://www.newsis.com/view/NISX20261027_0003842433", "source": "뉴시스", "published": "2026-10-27T01:07:05+00:00", "summary": "[서울=뉴시스]김혜경 기자 = 북한군이 서부전선 접경지역에 자주포를 배치한 것으로 알려지면서 온라인에서 전쟁 가능성에 대한 우려가 나오고 있다.  최근 사회관계망서비스(SNS)에는 김포 애기봉에서 포착된 것으로 알려진 자주포와 북한군 사진 등이 공유되면서, 이를 접한 일부 누리꾼은 전쟁에 대비해 생필품과 비상용품을 미리 마련하고 있다며 관련 경험과 계획을 공유했다. 지난 26일에는 비상식량 등을 구매하고 있다는 게시글이 올라왔다. 작성자 A씨는 \"왠지 전쟁이 날 것 같아서 달러와 원화 현찰을 뽑아오고 물과 비상식량, 재난용 라디오를", "language": "ko"}, {"title": "엔화, 주요국 금융회의 전 포지션 조정 엔 매도로 1달러=157엔대 중반 하락 출발", "url": "https://www.newsis.com/view/NISX20261027_0003842464", "source": "뉴시스 경제", "published": "2026-10-27T01:03:38+00:00", "summary": "[서울=뉴시스]이재준 기자 = 엔화 환율은 27일 미국과 일본, 유럽 중앙은행의 기준금리 발표를 앞두고 포지션 조정 엔 매도, 달러 매수가 선행하면서 1달러=157엔대 중반으로 내려 시작했다. 도쿄 외환시장에서 엔화 환율은 이날 오전 8시30분 시점에 1달러=157.54~157.55엔으로 전일 오후 5시 대비 0.42엔 하락했다. 연방준비제도(Fed 연준)는 27~28일 연방공개시장위원회(FOMC)를 연다. 기준금리 동결 관측이 대체적이다. 차기 12월 회의 이래 금리인상 시기와 속도 등에 관해 시장의 관심이 고조하고 있다. 일본은", "language": "ko"}, {"title": "전자복권 당첨권 분산배치 은폐…위약벌 3000만원에 감사 청구도", "url": "https://www.newsis.com/view/NISX20261027_0003842125", "source": "뉴시스 경제", "published": "2026-10-27T01:00:00+00:00", "summary": "[세종=뉴시스]여동준 기자 = 복권사업 수탁사업자인 동행복권이 전자복권의 1등 당첨권 분산배치 구조를 알고도 복권위원회에 보고하지 않고, 현장점검을 앞두고 관련 메일까지 삭제한 것으로 확인됐다. 복권위는 동행복권에 위약벌 3000만원을 추가로 부과하고 관련 책임자의 인사조치를 요구했다. 복권 발행·관리의 투명성을 확인하기 위해 감사원에 감사도 청구했다. 기획예산처 복권위원회는 27일 이 같은 내용의 수탁사업자 위약벌 부과안 등을 전날 전체회의에서 심의·의결했다고 밝혔다. 문제가 된 상품은 구매 즉시 당첨 여부를 확인하는 즉석식 전자", "language": "ko"}, {"title": "강신철, 필리핀서 美 전쟁부장관 첫 대면…전작권 논의 진전 주목", "url": "https://www.newsis.com/view/NISX20261027_0003842368", "source": "뉴시스", "published": "2026-10-27T00:46:21+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철 국방부 장관이 제13차 아세안 확대 국방장관회의(ADMM-Plus) 참석 차 필리핀을 방문하는 피트 헤그세스 미 전쟁부 장관과 취임 후 첫 대면한다.  통상 11월 초 개최되는 한미안보협의회의(SCM) 일정을 한미 양국이 아직 확정하지 못한 가운데, 헤그세스 장관과의 이번 만남에서 전시작전통제권(전작권) 전환 관련한 진전된 논의가 이뤄질 지 주목된다.  국방부는 강 장관이 29일 필리핀에서 개최되는 제13차 아세안 확대 국방장관회의에 참석하기 위해 27일 출국할 예정이라고 밝혔다.  이번 회의", "language": "ko"}, {"title": "스타벅스 창밖 北 122mm 자주포 직관?…김포 애기봉점 사진의 진실", "url": "https://www.newsis.com/view/NISX20261027_0003842351", "source": "뉴시스", "published": "2026-10-27T00:34:25+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 경기도 김포시의 한 접경 지역 스타벅스 매장에서 북한군의 최전방 군사 배치를 직접 목격할 수 있다는 사진과 영상이 확산되면서 온라인상에서 큰 관심을 모으고 있다.  자본주의의 상징인 글로벌 커피 브랜드 매장과 남북 분단의 현실이 한눈에 겹치는 이색적인 풍경이지만, 실제 상황과 확산된 이미지 사이에는 일부 과장과 가공 요소가 섞여 있는 것으로 나타났다. 지난 26일 여러 온라인 커뮤니티에는 '김포 애기봉 스타벅스 근황'이라는 제목의 게시물들이 잇따라 올라왔다. 글을 작성자는 \"북한이 122㎜ 자주포를 ", "language": "ko"}, {"title": "유승민 \"독자적 전작권 환수, 美에 일방적 이혼 통보하는 꼴\"", "url": "https://www.newsis.com/view/NISX20261027_0003842133", "source": "뉴시스", "published": "2026-10-27T00:30:00+00:00", "summary": "[서울=뉴시스]이지우 인턴 기자 = 유승민 전 국민의힘 의원이 미국과의 합의 없이 독자적으로 전시작전통제권(전작권) 환수를 선언해야 한다는 더불어민주당 의원들의 주장을 비판했다. 26일 유 전 의원은 소셜미디어(SNS)를 통해 \"국회 국방위에서 다수의 민주당 의원들이 '연말 한미안보협의회의(SCM)에서 미국과 합의가 안되면 독자적으로 전작권 환수를 선언하라'고 했다\"고 전했다. 유 전 의원은 \"무책임하고 위험하기 짝이 없는 발상\"이라며 \"미국에게 일방적으로 이혼을 통보하고 별거에 들어가자는 말\"이라고 비판했다. 그는 \"1953년 한", "language": "ko"}, {"title": "강신철, 아세안 국방장관회의 참석…美헤그세스와 첫 회동 조율", "url": "https://www.yna.co.kr/view/AKR20261027039500504", "source": "연합뉴스", "published": "2026-10-27T00:20:01+00:00", "summary": "(서울=연합뉴스) 김효정 기자 = 강신철 국방부 장관이 이달 29일 필리핀 세부에서 열리는 제13차 아세안 확대 국방장관회의(ADMM-Plus)...", "language": "ko"}, {"title": "USAF Orders ARRW Hypersonic Missile Into Production, The Same Weapon It Nearly Cancelled", "url": "https://www.twz.com/air/usaf-orders-arrw-hypersonic-missile-into-production-the-same-weapon-it-nearly-cancelled", "source": "The War Zone", "published": "2026-10-27T00:04:14+00:00", "summary": "The fortunes of the AGM-183A, which is now set to arm B-52 and B-1 bombers, have now been fully reversed. \n The post  USAF Orders ARRW Hypersonic Missile Into Production, The Same Weapon It Nearly Cancelled  appeared first on  TWZ .", "language": "en"}, {"title": "충남도 \"국방부 세종 오니 국방연구원도 논산·계룡으로\"", "url": "https://www.yna.co.kr/view/AKR20261027029300063", "source": "연합뉴스", "published": "2026-10-26T23:39:31+00:00", "summary": "(홍성=연합뉴스) 정윤덕 기자 = 충남도는 국방부의 세종시 이전 방침에 발맞춰 한국국방연구원(KIDA) 유치에 화력을 집중한다고 27일 밝혔다.", "language": "ko"}, {"title": "LIG D&A 입찰제한 임시집행정지 결정…\"성실하게 입장 소명\"", "url": "https://www.yna.co.kr/view/AKR20261027024700003", "source": "연합뉴스", "published": "2026-10-26T23:17:42+00:00", "summary": "(서울=연합뉴스) 장하나 기자 = LIG 디펜스&amp;에어로스페이스(이하 LIG D&amp;A)는 27일 방위사업청이 2년간 입찰 참가 자격 ...", "language": "ko"}, {"title": "90 Days No Help: Fortress America’s Goal To Make Bases Resilient Bastions In A Crisis", "url": "https://www.twz.com/nuclear/90-days-no-help-fortress-americas-goal-to-make-bases-resilient-bastions-in-a-crisis", "source": "The War Zone", "published": "2026-10-26T22:20:20+00:00", "summary": "Cyber threats against critical infrastructure are exploding, with worries enemies could neuter U.S. military units before they even leave their garrisons.  \n The post  90 Days No Help: Fortress America’s Goal To Make Bases Resilient Bastions In A Crisis  appeared first on  TWZ .", "language": "en"}, {"title": "스위스 외무, 29일 북한 방문…평양 외교사무소 개소 행사 참석", "url": "https://www.newsis.com/view/NISX20261027_0003841992", "source": "뉴시스", "published": "2026-10-26T21:44:12+00:00", "summary": "[서울=뉴시스] 김예진 기자 = 이냐치오 카시스 스위스 외무장관은 이달 29일(현지 시간) 북한을 방문할 예정이라고 스위스 정부가 26일 발표했다.  스위스 정부는 이날 홈페이지를 통해 보도자료를 내어 이같이 밝혔다. 29일부터 31일까지 한국과 북한을 방문한다.  카시스 장관은 우선 29~30일 북한 평양을 방문해 평양 주재 스위스 외교사무소 공식 개소 행사에 참석하고 북한 당국자들과 회담할 예정이다. 특히 30일에는 북한 당국자들과 만나 스위스 외교부와 북한 외무성 간 양자 협의 재개, 한반도 안보 정세, 국제 지정학적 문제 등", "language": "ko"}, {"title": "최선희 북한 외무상 이브생로랑 핸드백 애용", "url": "https://www.newsis.com/view/NISX20261027_0003842000", "source": "뉴시스", "published": "2026-10-26T21:27:03+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 최선희 북한 외무상이 지난 24일 중국을 방문하면서 3500 달러(약 464만 원)가 넘는 고가의 핸드백을 들고 있는 모습이 포착됐다고 미국의 북한 전문매체 let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
