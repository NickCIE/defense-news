s To Have Recovered Intact  appeared first on  TWZ .", "language": "en"}, {"title": "Taiwan 2027 conflict window remains valid, Army Pacific commander says - Breaking Defense", "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxPN1U2anNYZUYyMDQwZWQtZjdrVHdHWWRkTExtTGFvREtTNnZ6dHFmMmQ3ckdKSDd4ZlFwd1JMRDdXNGpCUEJtUWVpRlJZUGk3MF81ajlRQWVHVkJXTjlGZS1jY0hLN1hfRTYybHk3UE14NUFYY01PQmpUNUE0VkFCbFRHT0Frd3RKNF8tYmxsMzZYeXdQWHJTaHNHODhvdEhfWFhWRmFZMmxUQQ?oc=5", "source": "Breaking Defense (GNews)", "published": "2026-10-29T17:59:37+00:00", "summary": "Taiwan 2027 conflict window remains valid, Army Pacific commander says    Breaking Defense", "language": "en"}, {"title": "합참은 10여발이랬는데…美 \"北 탄도미사일 2발 발사\"", "url": "https://www.newsis.com/view/NISX20261030_0003847469", "source": "뉴시스", "published": "2026-10-29T17:18:31+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 29일 이뤄진 북한의 탄도미사일 도발과 관련해 한국 합동참모본부(합참)가 10여발이 포착됐다고 밝혔으나, 미군은 탄도미사일 두발이 발사됐다며 다른 수치를 내놨다.  한미간 대북 정보 공유가 제한된 것으로 알려져 우려가 높아지는 상황에서, 북한 미사일 도발을 두고 양국이 엇갈린 평가를 내놓은 것이다. 미국 태평양사령부(PACOM)는 이날 발표한 성명에서 \"북한이 10월29일 탄도미사일 2발을 발사했다\"면서 \"우리는 이번 미사일 발사 사실을 파악하고 있으며, 동맹국 및 파트너국들과 긴밀히 협의하고 있", "language": "ko"}, {"title": "US, Japan reach agreements for AMRAAM assembly, SM-3 production boost: Japanese MoD", "url": "https://breakingdefense.com/2026/10/us-japan-ink-agreements-for-amraam-production-sm-3-production-boost-japanese-mod/", "source": "Breaking Defense", "published": "2026-10-29T16:45:18+00:00", "summary": "The “groundbreaking agreement” on AMRAAM production “will not only ensure the acquisition of equipment needed by both Japan and the United States, but will also strengthen Japan’s defense industry base,” said Japanese Defense Minister Shinjiro Koizumi.", "language": "en"}, {"title": "美국무부, 진성준 비자 거부 배경에 \"미 국익이 우선\"", "url": "https://www.newsis.com/view/NISX20261030_0003847461", "source": "뉴시스", "published": "2026-10-29T16:18:38+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 행정부가 국회 국방위원장인 진성준 더불어민주당 의원의 비자 발급 윤영 전상우 기자 = 여야는 29일 국회 운영위원회 청와대 대상 국정감사에서 이른바 '경기·성남 라인 인사 개입' 의혹, 이재명 대통령 부부의 '황제 골프' 의혹, 단일종목 레버리지 ETF 등을 두고 공방을 벌였다. ◆국힘, '경기·성남 라인' 불출석, '레버리지 ETF' 등 공세 질의 시작 전 야당인 국민의힘은 국정감사에 핵심 증인들이 빠지면서 '경기·성남 라인 인사 개입' 의혹 해소에 차질이 있다고 지적했다. 김미애 국민의힘 의원은 \"김승원, 용혜인 의원이 장관 후보에서 낙마하고 강훈식 비서실장도 ", "language": "ko"}, {"title": "Pentagon will pick new US base location by June 2027, prioritizing 4 requirements", "url": "https://breakingdefense.com/2026/10/pentagon-will-pick-new-us-base-location-by-june-2027-prioritizing-4-requirements/", "source": "Breaking Defense", "published": "2026-10-29T12:45:00+00:00", "summary": "In an interview with Breaking Defense, Dale Marks, the assistant secretary of defense for Energy, Installations, and Environment, laid out new details on the effort.", "language": "en"}, {"title": "강신철, 싱가포르·베트남 국방장관 만나 국방·방산 협력 논의", "url": "https://www.newsis.com/view/NISX20261029_0003847396", "source": "뉴시스", "published": "2026-10-29T12:37:15+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철 국방부 장관은 29일 필리핀 세부에서 제13차 아세안 확대 국방장관회의(ADMM-Plus) 참석을 계기로 싱가포르, 베트남 국방부장관을 잇따라 만나 양자회담을 가졌다.  먼저 강 장관은 찬춘싱 싱가포르 국방장관과 회담을 갖고 양국 국방·방산 협력 방안을 논의했다.  두 장관은 양국이 '전략적 동반자 관계' 격상 이후 국방·방산 협력 발전을 위해 기울인 노력들을 긍정적으로 평가했다. 이와 함께 인적교류 활성화 및 사이버·인공지능(AI) 등 다양한 협력 분야들을 발굴, 양국 협력을 한층 강화해 나", "language": "ko"}, {"title": "이 대통령 \"독일은 정확, 한국은 빠르다…함께 협력의 시너지 낼 것\"", "url": "https://www.newsis.com/view/NISX20261029_0003847391", "source": "뉴시스", "published": "2026-10-29T12:16:11+00:00", "summary": "[서울=뉴시스]이인준 기자 = 이재명 대통령은 29일 공식 방한한 프리드리히 메르츠 독일 총리와 만찬을 갖고 \"앞으로 대한민국과 독일은 인공지능과 반도체를 비롯한 첨단산업부터 안보, 방산, 공급망, 과학기술에 이르기까지 다방면에 걸쳐 협력의 지평을 넓혀가게 될 것\"이라고 말했다.  이 대통령은 이날 오후 청와대 영빈관에서 만찬사를 통해 \"오늘 한국, 독일 양국은 강화된 전략적 동반자 관계 수립을 통해 함께 새로운 미래를 열어가기로 뜻을 모았다\"며 이같이 밝혔다.  이 대통령은 \"한국과 독일은 지리적으로 멀리 떨어져 있지만 전쟁과 분", "language": "ko"}, {"title": "이 대통령 \"한·독, 강화된 전략적 동반자 관계 수립…방산·첨단기술, 구체적 성과 기대\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20261029_0003847387", "source": "뉴시스", "published": "2026-10-29T12:13:31+00:00", "summary": "[서울=뉴시스]조성봉 김진아 김지은 이인준 기자 = 이재명 대통령은 29일 공식 방한한 프리드리히 메르츠 독일 총리와 정상회담을 하고 반도체·배터리·인공지능(AI) 등 핵심 산업의 공급망 안정화와 첨단기술 협력을 확대하기로 뜻을 모았다. 양국은 기업의 투자환경을 개선하기 위해 이중과세방지협정 개정의정서에 서명하고, 군사비밀정보보호협정 체결을 추진해 국방·안보 협력의 제도적 기반도 강화하기로 했다. 이 대통령은 이날 오후 청와대에서 한-독 정상회담을 마친 후 공동 언론발표를 통해 \"독일은 대한민국의 유럽 내 최대 교역국이자 자유와 민", "language": "ko"}, {"title": "변광용 거제시장, 정부예산 심의 앞두고 국회 방문", "url": "https://www.newsis.com/view/NISX20261029_0003847373", "source": "뉴시스", "published": "2026-10-29T12:07:07+00:00", "summary": "[거제=뉴시스] 신정철 기자 = 경남 거제시 변광용 시장이 2027년도 정부예산 국회 심의를 앞두고 지난 28일과 29일 이틀간 국회를 방문했다. 변 시장은 이광재 국회 예산결산특별위원장을 비롯해 예결위 허성무 의원, 국토교통위 염태영 의원, 국방위 김성회 의원을 잇따라 만나 주요 사업의 필요성을 설명하고 국회 차원의 적극적인 지원을 요청했다. 이번 방문에서 변 시장은 거제~통영 고속도로 건설과 한·아세안 국가정원 조성을 핵심 현안으로 집중 건의했다. 거제~통영 고속도로는 남해안권 광역 교통망 확충과 조선산업 물류 경쟁력 강화를 위", "language": "ko"}, {"title": "Hegseth reportedly fires U.S. top military planner as Trump downplays Iran peace talks", "url": "https://www.cnbc.com/2026/10/29/us-iran-war-trump-hormuz.html", "source": "CNBC", "published": "2026-10-29T12:06:03+00:00", "summary": "Lieutenant General Brett Sylvia was removed as head of strategy, plans and policy on the Joint Chiefs of Staff.", "language": "en"}, {"title": "강신철 \"이 시각에도 北은 미사일 다수 발사…역내 안보 위협\"(종합)", "url": "https://www.yna.co.kr/view/AKR20261029179251504", "source": "연합뉴스", "published": "2026-10-29T12:03:01+00:00", "summary": "(서울=연합뉴스) 전명훈 기자 = 아세안 확대 국방장관회의(ADMM-플러스)에 참석한 강신철 국방부 장관이 \"오늘 바로, 이 시각에도 북한은 미...", "language": "ko"}, {"title": "첫 우주항공방위산업전서 26조 원 수주상담… 사천에어쇼, 글로벌 우주항공 비즈니스 새 지평 열었다 - 세계환경신문", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE1DeUwtODc1dUZoT05rNjlyY1d0U280aUE4cFZKNDZ2cFlRak5HWUVzOGFPTmRJdk9PeFNlOVhRUnNJV3lTTnIxWEd1Q1htdHJYX3pmNS1BQ3NOd201cllv?oc=5", "source": "방산 뉴스", "published": "2026-10-29T11:48:51+00:00", "summary": "첫 우주항공방위산업전서 26조 원 수주상담… 사천에어쇼, 글로벌 우주항공 비즈니스 새 지평 열었다    세계환경신문", "language": "ko"}, {"title": "Philippines-China tensions resurface at the close of ASEAN published": "2026-10-29T08:08:42+00:00", "summary": "[서울=뉴시스]이인준 기자 = 이재명 대통령은 29일 \"장진호 전투는 대한민국이 가장 어려웠던 순간, 누가 우리 곁에 함께했는지를 일깨워 주는 혈맹의 역사\"라며 \"한 사람 한 사람의 삶으로 맺어진 인연, 우리 국민의 평범한 일상에 깃든 영웅들의 헌신은 앞으로도 한미동맹의 견고한 버팀목이 될 것\"이라고 했다. 이 대통령은 이날 오후 권오을 국가보훈부 장관이 대독한 '제76주년 장진호 전투 기념 및 추모행사'의 서면 추념사를 통해 이같이 밝혔다. 이 대통령은 \"76년 전, 자유와 평화를 위해 온몸을 던져 싸웠던 장진호의 영웅들을 기억한", "language": "ko"}, {"title": "국힘 \"北 탄도미사일, 명백한 불법 도발…단호한 대응 조치 내놓아야\"", "url": "https://www.newsis.com/view/NISX20261029_0003847136", "source": "뉴시스", "published": "2026-10-29T08:05:58+00:00", "summary": "[서울=뉴시스] 전상우 기자 = 국민의힘은 29일 북한의 탄도미사일 도발에 대해 \"유엔 안보리 결의를 정면으로 짓밟은 명백한 불법 도발이자 대한민국과 국제사회를 향한 노골적인 군사적 협박\"이라고 비판했다. 박성훈 수석대변인은 이날 오후 논평을 내고 \"올해 들어 17번째에 달하는 불법적이고 상습적인 도발이자, 최소한의 양심과 반성조차 결여된 심각한 대한민국 안보 위협이다\"며 이같이 말했다. 박 수석대변인은 \"이는 엄중하고 단호한 대응을 하지 못한 채 북한 심기만 살피다 대화와 협상을 구걸한 이재명 정부 스스로가 자초한 일\"이라며 \"북", "language": "ko"}, {"title": "국정원 \"APEC 전후 북미 국면전환 가능성…김주애 후계 내정 공고화\"(종합)", "url": "https://www.newsis.com/view/NISX20261029_0003847118", "source": "뉴시스", "published": "2026-10-29T08:02:53+00:00", "summary": "[서울=뉴시스]하지현 김난영 권신혁 우지은 기자 = 국가정보원(국정원)은 29일 북한과 미국이 대화 조건에 대한 입장 차로 아직 접점을 찾지 못했으나 아시아태평양경제협력체(APEC) 정상회의 전후로 국면이 전환될 가능성이 있다고 분석했다. 김정은 북한 국무위원장의 최근 중국 단둥 방문에 대해서는 북미 대화와 관련한 의중을 중국 지도부에 전달했을 가능성이 있다고 봤다. 김 위원장의 딸 김주애에 대해서는 후계자 내정 단계를 더욱 공고화하고 있다고 평가했다. 국정원은 이날 서울 서초구 청사에서 열린 국회 정보위원회 국정감사를 통해 이같이", "language": "ko"}, {"title": "美당국자 \"원자력협정, 韓 기업의 美 원전사업 참여 안 막아\"", "url": "https://www.newsis.com/view/NISX20261029_0003847116", "source": "뉴시스", "published": "2026-10-29T07:55:32+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 미국 정부 당국자가 29일 한미 원자력협정이 한국 기업의 미국 원전 사업 참여를 제한하지 않는다며 우리 기업들의 참여를 환영한다는 입장을 밝혔다.  미국 정부 당국자는 이날 서울 주한미국대사관에서 취재진과 만나 \"한국 기업들의 참여는 환영할 만한 일\"이라며 \"한국뿐 아니라 전 세계적으로 원전 르네상스에 도움이 될 것으로 본다\"라고 말했다.  이 당국자는 미국 원자력 사업이 도널드 트럼프 미국 대통령이 지난해 원자력 발전 안전 규제를 완화하는 4개 행정명령에 서명한 후 \"가속화되고 있다\"라고 평가했다.", "language": "ko"}, {"title": "국방부, 전작권 '적기' 전환 언급 관련 \"일정 늦춘다는 의미 아냐\"", "url": "https://www.newsi const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
