summary": "[세종=뉴시스] 안호균 기자 = 지난 7~8월 극심한 가뭄으로 헝가리, 루마니아, 불가리아 등 다뉴브강 인근 국가들이 전력난이 발생함에 따라 중동부 유럽 지역에서 신규 원전 건설이 가속화할 수 있다는 전망이 나왔다. 현재 중동부 유럽 지역에서는 중국과 러시아의 원전 사업 참여가 제한돼 한국과 미국, 프랑스가 3파전을 벌일 수 있다는 분석이다. 21일 대외경제정책연구원(KIEP)이 발표한 '가뭄 위기 이후 중동부 유럽의 원전 주요 정책과 시사점'에 따르면 지난 7~8월 가뭄으로 다뉴브강 등 중동부 유럽(CEE) 주요 하천 수위가 역대", "language": "ko"}, {"title": "시세 14억인데 분양가 7억…철산자이 6가구 '줍줍' 오늘 청약", "url": "https://www.newsis.com/view/NISX20260921_0003798981", "source": "뉴시스 경제", "published": "2026-09-21T20:30:00+00:00", "summary": "[서울=뉴시스]이연희 기자 = 경기도 광명시 '철산자이 더 헤리티지'에서 입주권 거래가격 대비 시세 차익이 약 6억~7억원에 달할 것으로 기대되는 무순위 청약 접수가 22일 오전 9시부터 오후 5시30분까지 진행된다.  인근 단지인 '철산자이 브리에르'에서는 시세차익 4억원이 예상되는 불법행위 재공급 물량도 2세대에 대한 청약이 22~23일 이틀에 걸쳐 이뤄진다.   이날 한국부동산원 청약홈에서는 '철산자이 더 헤리티지' 미계약 잔여 4세대에 대한 무순위(사후) 청약을 접수한다. 이 단지는 철산주공8·9단지를 재건축한 아파트로 지하", "language": "ko"}, {"title": "김민석, 인천서 예산협의…'전작권환수추진단' 출범식 참석도", "url": "https://www.yna.co.kr/view/AKR20260921174600001", "source": "연합뉴스", "published": "2026-09-21T20:00:04+00:00", "summary": "(서울=연합뉴스) 박재하 기자 = 더불어민주당 김민석 대표는 22일 인천시청에서 예산정책협의회를 열고 박찬대 인천시장 등과 지역 지원 방안을 논...", "language": "ko"}, {"title": "Navy selects captain as new chief of information", "url": "https://breakingdefense.com/2026/09/navy-selects-captain-as-new-chief-of-information/", "source": "Breaking Defense", "published": "2026-09-21T19:15:07+00:00", "summary": "Capt. Tamara Lawrence, the current acting chief of information, will take over the post traditionally held by a rear admiral.", "language": "en"}, {"title": "The US needs an information-warfare strategy for Iran — and beyond - Breaking Defense", "url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxQbDhuM1Bpb0ZJb2JEWXk2Ym9WZXV4VENOTVFXaDdtRnpIWmlfc1g3VDhod3pKWEtwVkh4Z08tRzY1WGtIbWV5N0JZUDdJNnQ4SDV3MXZTRmRydUdVU3M1N1lYbEJzV3h0eDQ2LTdRVEZwdGRoR25heUtaazdPb1hEczBxRHpCU202Rmg2OEltM3VpWmVpMWpGM1N4bk5LdXRscV9B?oc=5", "source": "Breaking Defense (GNews)", "published": "2026-09-21T18:46:49+00:00", "summary": "The US needs an inform const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
