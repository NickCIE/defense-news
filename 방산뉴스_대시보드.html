"published": "2026-08-15T04:43:27+00:00", "summary": "[서울=뉴시스]신재현 기자 = 조정식 국회의장이 81주년 광복절을 맞은 15일 \"일제 식민지배를 미화하는 역사 왜곡과 독립운동가의 명예를 훼손하는 일은 단호히 대응해야 한다\"고 말했다.  조 의장은 이날 페이스북에 \"우리가 해마다 광복절을 맞으며 되새겨야 할 것은 순국선열들의 애국심과 희생을 기리는 것과 다시는 나라를 뺏기지 않겠다고 다짐하는 일\"이라며 이같이 말했다.  조 의장은 \"우리가 누리는 자유롭고 풍요로운 대한민국의 일상은 수많은 선열들의 희생 위에서 꽃 피운 것\"이라며 \"국가는 독립유공자와 유족을 최고로 예우하고 그 숭고", "language": "ko"}, {"title": "통일부, '북한은 주적' 표현 대체 공론화 추진…남북 '적대 언어'부터 바꾼다", "url": "https://www.newsis.com/view/NISX20260815_0003750572", "source": "뉴시스", "published": "2026-08-15T03:57:50+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 통일부가 남북 간 상호 존중과 평화공존을 위해 '적대의 언어'부터 바꿔나가기로 했다.  통일부는 15일 이재명 대통령의 광복절 경축사에서 제시된 '3대 청사진'의 후속조치 추진방안을 공개하고, 남북 상호 존중의 이름부르기, '주적' 표현 대체 등을 공론화하겠다고 밝혔다. 이 대통령은 이날  오전 서울 세종문화회관에서 열린 제81주년 광복절 경축식 경축사에서 \"전쟁을 종식하고, 한반도의 불안정한 정전 체제를 평화 체제로 바꾸는 여정에 나설 것\"이라며, 구체적 방안으로 '포용적 평화 공존'과 '안정적 평", "language": "ko"}, {"title": "[전문]이재명 대통령 제81주년 광복절 경축식 경축사", "url": "https://www.newsis.com/view/NISX20260815_0003750549", "source": "뉴시스", "published": "2026-08-15T02:46:29+00:00", "summary": "[서울=뉴시스]김경록 기자 = 이재명 대통령은 15일 오전 서울 종로구 세종문화회관에서 열린 제81주년 광복절 경축식에 참석해 경축사를 낭독했다. 이번 경축사를 통해 이 대통령은 \"전쟁을 종식하고, 한반도의 불안정한 정전 체제를 평화 체제로 바꾸는 여정에 나설 것\"이라며 \"아주 오래된 전쟁을 끝내기 위한 당사자들 간의 논의를 시작하자\"고 제안했다. 또한 \"한일 협력이 어느 때보다 중요한 지금 한층 두터운 신뢰 위에서 평화와 번영의 새로운 60년을  함께 열어갈 수 있기를 기대한다\"며 미래지향적 한일 관계의 청사진도 제시했다. 아울러", "language": "ko"}, {"title": "국힘, 李 광복절 경축사에 \"화려한 말잔치…실소 금할 수 없어\"", "url": "https://www.newsis.com/view/NISX20260815_0003750539", "source": "뉴시스", "published": "2026-08-15T02:33:32+00:00", "summary": "[서울=뉴시스] 전상우 기자 = 국민의힘은 15일 이재명 대통령의 제81주년 광복절 경축사에 대해 \"화려한 말잔치로 국정 무능과 안보 불안을 결코 숨길 수 없다\"고 밝혔다. 박성훈 수석대변인은 이날 오전 논평을 내고 \"이 대통령의 광복절 경축사는 화려한 수식어와 거창한 담론으로 도배돼 있었다\"며 \"그러나 정작 그 어디에서도 국가를 책임지는 국정 최고 책임자로서의 뼈아픈 성찰이나 현실 타개책은 찾아볼 수 없었다\"고 말했다. 그는 \"지금 국민이 체감하는 현실은 참담함 그 자체\"라며 \"하지만 국정 최고 책임자인 대통령은 절박한 민생 현안", "language": "ko"}, {"title": "국힘 \"안규백, 말 바꾸기·안보 혼선 도 넘어…전형적인 '이중 정치'\"", "url": "https://www.newsis.com/view/NISX20260815_0003750509", "source": "뉴시스", "published": "2026-08-15T01:18:14+00:00", "summary": "[서울=뉴시스] 전상우 기자 = 국민의힘은 15일 안규백 국방부 장관을 향해 \"자질과 역량 자체를 묻지 않을 수 없는 지경\"이라고 밝혔다. 박성훈 수석대변인은 이날 오전 논평을 내고 \"안규백 국방부 장관의 말 바꾸기와 안보 혼선이 도를 넘었다\"며 \"대한민국 안보의 공식 입장은 무엇인가\"라고 말했다. 박 수석대변인은 \"유엔군사령부(유엔사)의 '경비·정전집행여단' 창설 문제를 두고 안 장관은 유엔사와 논의한 결과 '하지 않기로 합의했다', 창설 자체를 하지 않는 것이냐는 질문에 거듭 '그렇다'고 밝혔다\"며 \"그러나 정작 유엔사는 '기존", "language": "ko"}, {"title": "오늘 '제81주년 광복절 경축식'…독립유공자 유족 등 3천명 참석", "url": "https://www.newsis.com/view/NISX20260815_0003750477", "source": "뉴시스", "published": "2026-08-15T01:00:00+00:00", "summary": "[서울=뉴시스] 강지은 기자 = 행정안전부는 '내일이 더 빛나는, 대체불가 대한민국'을 주제로 15일 오전 10시 서울 종로구 세종문화회관 대극장에서 '제81주년 광복절 경축식'을 개최한다고 밝혔다. 이번 경축식에는 애국지사와 독립유공자 유족, 국가 주요 인사, 정당·종단 대표, 주한외교단, 사회 각계 대표를 비롯해 시민과 학생 등 3000여명이 참석한다. 경축식은 개식 선언을 시작으로 국민의례, 기념사, 독립유공자 포상, 경축사, 경축 공연, 광복절 노래 제창, 만세삼창 순으로 진행된다. 국민의례에서는 광복 80년 다큐멘터리 '모", "language": "ko"}, {"title": "국가소방동원령 연장 이틀째…군 차량 102대 경남 가뭄현장 투입", "url": "https://www.yna.co.kr/view/AKR20260815020800052", "source": "연합뉴스", "published": "2026-08-15T00:44:38+00:00", "summary": "(창원=연합뉴스) 박영민 기자 = 극심한 가뭄이 이어지는 경남에 소방 물탱크차에 이어 육·해·공군과 해병대 소속 차량 100여대까지 투입돼 농업...", "language": "ko"}, {"title": "내년 7월부터 국방·군사시설도 녹색건축 인증 가능해진다", "url": "https://www.newsis.com/view/NISX20260814_0003748765", "source": "뉴시스 경제", "published": "2026-08-15T00:00:00+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 내년 7월부터 군부대 주둔지 내 국방·군사시설도 녹색건축 인증을 받을 수 있게 된다.  15일 당국에 따르면 국토교통부는 최근 '녹색건축 인증에 관한 규칙' 개정안 입법예고와 '녹색건축 인증 기준'(고시) 개정안 행정예고를 각각 진행했다.  이번 개정은 2035 국가온실가스감축목표(NDC) 달성과 2050 탄소중립 이행에 대응하고 변화하는 건축환경과 사회적 요구를 반영하기 위해 추진된 것이다.  녹색건축 인증 대상에 군부대 주둔지 내 국방·군사시설을 제외하는 규정을 삭제한다. 지금까지는 녹색건축 인증", "language": "ko"}, {"title": "로또청약 '줍줍' 사라지나…공공임대 전환에 청약 기회 박탈 논란", "url": "https://www.newsis.com/view/NISX20260814_0003750092", "source": "뉴시스 경제", "published": "2026-08-14T22:00:00+00:00", "summary": "[서울=뉴시스]이종성 기자 = 정부가 수도권 규제지역에서 발생하는 민간 분양 잔여물량을 한국토지주택공사(LH) 등이 우선 매입해 공공임대주택으로 공급하는 방안을 추진한다.   다만 이미 무주택 실수요자에게 분양 방식으로 공급되는 물량을 임대로 전환하는 만큼 청약 기회 축소와 공공임대 공급의 실효성, LH의 재정 부담을 둘러싼 논란도 예상된다. 15일 국토교통부에 따르면 정부는 '전월세·매매시장 안정을 위한 주택 신속공급 방안'을 통해 수도권 규제지역에서 민간 분양 잔여물량이 발생할 경우 LH 등이 우선 매입해 '보편형 공공임대주택'", "language": "ko"}, {"title": "미 재무장관 \"이란 봉쇄 강화\"에 국제 유가 상승", "url": "https://www.newsis.com/view/NISX20260815_0003750412", "source": "뉴시스 경제", "published": "2026-08-14T21:42:41+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 미국이 이란 항구에 대한 해상 봉쇄를 “무기한” 계속할 수 있다고 밝힌 뒤 핵심 수송로인 호르무즈 해협을 통한 에너지 공급에 대한 우려가 다시 커지면서 14일(현지시각) 국제 유가가 상승했다. 브렌트유 선물이 1.7% 상승해 배럴당 88.52 달러로 거래를 마쳤고, 미국 서부 텍사스산 원유 선물은 1.4% 올라 82.40 달러에 거래를 마감했다. 두 기준유 가격은 전날 2% 하락했으나 이날 상승해 이번 주 약 5% 이상 상승했다.  14일 상승세는 스콧 베선트 미국 재무장관이 이란을 “경제적으로 고립", "language": "ko"}, {"title": "Army picks M1 to lead $10B helicopter-school transformation", "url": "https://www.defenseone.com/business/2026/08/army-picks-m1-lead-10b-helicopter-school-transformation/415439/", "source": "Defense One", "published": "2026-08-14T21:10:13+00:00", "summary": "The aviation-services firm beat out Bell and Lockheed Martin.", "language": "en"}, {"title": "美재무 \"다음주 이란 고강도 경제제재\"…국제유가, 1%대 상승", "url": "https://www.newsis.com/view/NISX20260815_0003750405", "source": "뉴시스 경제", "published": "2026-08-14T21:00:46+00:00", "summary": "[서울=뉴시스]고재은 기자 = 미국이 이란에 대한 경제적 고립을 재차 위협한 가운데 국제 유가가 14일(현지 시간) 1%대 상승 마감했다. CNBC 등에 따르면 이날 유럽 ICE선물거래소에서 브렌트유 10월 인도분 종가는 전장 대비 1.7% 오른 배럴당 88.52달러를 기록했다. 뉴욕상품거래소에서 미국 서부텍사스원유(WTI) 9월 인도분도 전장보다 1.4% 오른 배럴당 82.40달러에 마감했다. 두 지수 모두 주간 기준으로 5% 넘게 오른 것으로, 특히 이날 상승세는 미국이 이란을 향한 고강도 경제 제재를 추가 예고하며 나타났다. ", "language": "ko"}, {"title": "\"온겨레가 독립 부르짖어\"…보신각 타종으로 기리는 광복의 기쁨", "url": "https://www.yna.co.kr/view/AKR20260814128200004", "source": "연합뉴스", "published": "2026-08-14T21:00:00+00:00", "summary": "(서울=연합뉴스) 김준태 기자 = 일제강점기 고양군수 등을 지낸 친일관료 민원식은 조선인에게도 참정권을 줘야 한다는 '참정권 운동'을 벌인 것으...", "language": "ko"}, {"title": "작아진 원전, 보안 새로 짠다…한수원, SMR 테러 대응체계 마련", "url": "https://www.newsis.com/view/NISX20260814_0003749437", "source" const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
