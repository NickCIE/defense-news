조선 공격 소식에 유가 상승", "url": "https://www.newsis.com/view/NISX20260801_0003732393", "source": "뉴시스 경제", "published": "2026-07-31T21:30:32+00:00", "summary": "[서울=뉴시스] 강영진 기자 = 이란이 호르무즈 해협을 통과하던 유조선 2척을 공격했다고 밝힌 뒤 국제유가가 상승했다.  지난달 31일(현지시각) 서부텍사스원유(WTI) 선물은 1% 넘게 올라 배럴당 84.67달러에 마감했으며 브렌트유도 1% 넘게 올라 90.12달러에 거래를 마쳤다.  유가는 중동 분쟁이 완화될 것이라는 기대 속에 지난달 27일 이후 주간 기준으로 5% 넘게 하락했었다. 이란 국영 프레스TV에 따르면 이슬람혁명수비대는 유조선들이 미군의 호위를 받으며 호르무즈 해협을 통과하려 하자 이들을 타격했다고 밝혔다. 이 매체", "language": "ko"}, {"title": "\"핵심광물 협력 MOU 체결, 내년부터 아르헨티나산 원유 수입\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260801_0003732388", "source": "뉴시스", "published": "2026-07-31T20:59:10+00:00", "summary": "[서울=뉴시스]조성봉 김지은 김진아 김경록 기자 = 한국과 아르헨티나 정부가 핵심광물 공급망 협력체계를 마련하고 탐사, 채굴, 투자 등 핵심광물 리튬의 밸류체인 전반에 걸쳐 양국 기업의 공동 프로젝트를 추진하기로 했다. 또한 원유 수입선 다변화 측면에서 우리 정부는 내년부터 아르헨티나산 원유를 수입하기로 했다. 위성락 국가안보실장은 31일 오후(현지시간) 한-아르헨티나 정상회담을 마친 뒤 부에노스아이레스에 마련된 프레스센터에서 브리핑을 열고 \"양국은 핵심광물 협력 양해각서(MOU)를 체결해 핵심광물 관련 정책과 투자 제도에 관한 정", "language": "ko"}, {"title": "방위사업청, 방산 AI 경쟁력 강화 위해 중소벤처기업 간담회 개최 - 세계일보", "url": "https://news.google.com/rss/articles/CBMiWEFVX3lxTFBUZ1ZzRHFhOXJWZWJUSGR4RkFxcHJHbWVFMEFjZl8wNVBaNWx1a1NRdkdmdy1lS1hiZ3d2bTlzZWpRWTNNbENlSkVJSEM2T0k5dllJWUhqdGvSAVRBVV95cUxOVVo2UURmYm9QMktyY0FGZ3JrY2NjRlJRM3F4cXRUOFdfVW1NazhYN3lCcEVJTmUwY0NzTmNJb2ZKRmhlS1N0QmYxN3RmLXp2VjNXSE4?oc=5", "source": "방산 뉴스", "published": "2026-07-31T20:58:00+00:00", "summary": "방위사업청, 방산 AI 경쟁력 강화 위해 중소벤처기업 간담회 개최    세계일보", "language": "ko"}, {"title": "Thousands take to Kyiv's main street, firm on calls for defence minister's return - Reuters", "url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxPY0hRLTFHYVRnZ0J2eHo1WnNUMmFoUFRjNkhYdXRVQklqWkhReW44VV9xaWlJUDZuNXZBdkRONmp6WnZLLS1SME12RDZVSFE3bGM1U3Y0ajRZVXZnelVfV1hVdklDY25lcWdMUXVGWmFWdTZjWmJ0V0V1RUN3YnNBSmQ0NFUxaGVzTzU4UFZMTEhmRmxWUERaN3U2OVdCdE00SGhNQ09Hc2J6OS1IMzYyc0dxUXQza3luQ3k5eFlfZ1lWVVU2UFMxTlN2VXQ?oc=5", "source": "Reuters", "published": "2026-07-31T20:54:00+00:00", "summary": "Thousand const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
