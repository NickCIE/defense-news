느 자리든 국가를 위해 헌신하고 싶다\"며 부상 회복 후 군 복무를 이어가고 싶다는 의지를 밝혔다. 이어 이 대통", "language": "ko"}, {"title": "강신철, 부산 해작사 대비태세 점검…파병 앞둔 청해부대원 격려도", "url": "https://www.newsis.com/view/NISX20260930_0003808853", "source": "뉴시스", "published": "2026-09-30T04:48:44+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철국방부장관은 30일 부산에 위치한 해군작전사령부(해작사)를 방문해, 작전 대비태세를 점검하고 아덴만 해역 파병 임무를 앞둔 청해부대원을 격려했다.  강 장관은 해작사 지휘통제실에서 해양작전상황을 보고받고 \"여러분이 지키는 바다가 곧 대한민국의 국력이고 미래이며, 지금 이 바다는 선배 전우들이 피와 땀으로 지켜낸 승리의 바다\"라고 말했다. 또 \"적이 도발하면 장관이 바로 옆에 서 있다 생각하고, 주저하지 말고 단호하게 대응하라\"고 지시했다.  강 장관은 이어 10월 초 아덴만 해역에 투입되는 청해", "language": "ko"}, {"title": "[올댓차이나] 중국 9월 제조업 PMI 50.1…3개월 만에 확장국면 복귀", "url": "https://www.newsis.com/view/NISX20260930_0003808857", "source": "뉴시스 경제", "published": "2026-09-30T04:46:15+00:00", "summary": "[서울=뉴시스]이재준 기자 = 중국 9월 제조업 구매관리자 지수(PMI)가 50.1로 3개월 만에 경기확대 국면에 복귀했다. 생산지수가 큰 폭으로 상승한 가운데 비제조업 PMI와 종합 PMI도 전월보다 상승했다. 경제통과 신화망, 신랑재경, 홍콩경제일보에 따르면 중국 국가통계국은 30일 9월 제조업 PMI가 전월보다 0.3 포인트 상승한 50.1을 기록했다고 발표했다.  제조업 PMI가 50을 웃돈 건 6월 이후 3개월 만이다. 이번 조사는 제조업체 약 3천200곳을 대상으로 생산과 신규 주문, 고용 등을 조사해 집계했다. 세부 항", "language": "ko"}, {"title": "김민석, DMZ 폭발 사건 관련 \"北 정전협정 위반 규탄\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260930_0003808827", "source": "뉴시스", "published": "2026-09-30T04:45:20+00:00", "summary": "[서울=뉴시스] 류현주 최진석 김난영 권신혁 기자 = 김민석 더불어민주당 대표가 서부전선 비무장지대(DMZ) 폭발 사건에 관해 \"북한의 정전협정 위반을 규탄한다\"고 밝혔다. 김 대표는 30일 오전 국회에서 최고위원회의를 열고 \"DMZ 폭발 사건이 군사분계선 남쪽의 북한 측 지뢰 매설로 밝혀지고 있다\"며 이같이 말했다. 그는 특히 \"자작극 운운하면서 부인하는 북한 당국의 태도를 더욱 비판하고 규탄한다\"며 \"반드시 사과하고 시정해야 한다\"고 강조했다. 이어 \"우리 군의 대응 조치를 촉구한다\"며 \"윤석열 정부 때인 2024년 초에 시작된", "language": "ko"}, {"title": "李대통령, 지뢰사고 부상장병 위문 방문…\"충분히 예우\" 약속", "url": "https://www.yna.co.kr/view/AKR20260930109100001", "source": "연합뉴스", "published": "2026-09-30T04:44:01+00:00", "summary": "(서울=연합뉴스) 고동욱 기자 = 이재명 대통령은 30일 오전 국군수도병원을 방문, 최근 비무장지대(DMZ) 지뢰 폭발 사고로 다친 장병들과 가...", "language": "ko"}, {"title": "Pentagon update on National Defense Strategy cites progress, omits key threats", "url": "https://www.defenseone.com/threats/2026/09/pentagon-update-national-defense-strategy-cites-progress-omits-key-threats/416329/", "source": "Defense One", "published": "2026-09-30T04:41:40+00:00", "summary": "The report to Congress  notes accomplishments but masks depleted arsenals, strategic distractions, and a quiet retreat from European defense.", "language": "en"}, {"title": "전주 '삼천 하늘채 라비엘' 1순위 평균 경쟁률 15대1", "url": "https://www.newsis.com/view/NISX20260930_0003808418", "source": "뉴시스 경제", "published": "2026-09-30T04:34:29+00:00", "summary": "[서울=뉴시스] 강세훈 기자, 서윤주 인턴기자 = 코오롱글로벌이 전북 전주 완산구 삼천동 일원에 공급하는 '삼천 하늘채 라비엘'이 1순위 청약에서 평균 경쟁률이 14.8대 1을 기록했다. 30일 한국부동산원 청약홈에 따르면 전날 진행된 1순위 청약에서 이 단지는 51가구 모집에 754명이 신청했다. 최고 경쟁률은 전용 74A㎡ 타입에서 나왔다. 1가구 모집에 총 122명이 신청했다.  이어 전용 75B㎡은 18.4대 1(19가구 모집, 351명 신청), 전용 59㎡은 9.1대 1(31가구 모집, 281명 신청)로 집계되며 모든 주택", "language": "ko"}, {"title": "국정원 \"북미회담, APEC 전후 성사 가능성 50%…北 대미 담당자들 바쁘게 움직여\"", "url": "https://www.newsis.com/view/NISX20260930_0003808801", "source": "뉴시스", "published": "2026-09-30T04:26:04+00:00", "summary": "[서울=뉴시스]하지현 신재현 한은진 기자 = 국가정보원은 30일 북미 정상회담 가능성을 놓고 \"아시아태평양경제협력체(APEC) 정상회의 전후로 50% 정도의 성사 가능성이 있다\"며 \"북한도 이번 기회를 놓치지 않으려는 반응을 보인다\"고 밝혔다. 국회 정보위원회 여야 간사인 윤건영 더불어민주당 의원과 유영하 국민의힘 의원은 이날 오전 정보위원회 비공개 간담회에서 국정원이 이같이 보고했다고 기자들에게 밝혔다. 국정원은 \"도널드 트럼프 미국 대통령의 우호적인 메시지 속에서 북한은 북미대화 진전 가능성을 열어두는 한편, 핵보유국 인정과 적", "language": "ko"}, {"title": "합참, DMZ 지뢰폭발 사고 관련 \"향후 발생하는 상황 모든 책임 전적으로 北에 있어\" [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260930_0003808745", "source": "뉴시스", "published": "2026-09-30T03:40:58+00:00", "summary": "[서울=뉴시스] 류현주 김혜진 옥승욱 기자 = 합동참모본부가 지난 21일 서부전선 비무장지대(DMZ)에서 발생한 지뢰폭발 사고와 관련해 북한의 사과를 강력히 촉구했다. 강현우 합참 작전본부장(육군 중장)은 30일 용산 국방부 청사 브리핑룸에서 가진 현 상황 관련 입장 발표를 통해 \"북한은 우리 정부의 일관된 한반도 평화공존 노력에도 불구하고, 군사분계선 인근 지뢰매설 등 소위 '국경선 요새화'를 지속 추진해 왔다\"며 \"남북 간 접경지역에서 긴장을 고조시키는 원인이 되고 있다\"고 했다. 강 본부장은 \"이는 명백한 정전협정 위반이자 기", "language": "ko"}, {"title": "'北지뢰도발·정전협정 위반' 공식화…유엔사, 北에도 통보할 듯", "url": "h const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
