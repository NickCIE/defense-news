fecting millions of military members    Reuters", "language": "en"}, {"title": "Pentagon AI oversight office struggles to keep pace with department’s ambitions, GAO finds", "url": "https://www.defensenews.com/news/pentagon-congress/2026/10/21/pentagon-ai-oversight-office-struggles-to-keep-pace-with-departments-ambitions-gao-finds/", "source": "Defense News", "published": "2026-10-21T15:55:31+00:00", "summary": "The Pentagon office tapped in 2022 to oversee the military’s responsible use of AI had filled just three of 10 authorized positions as of February 2026.", "language": "en"}, {"title": "Turkey, Qatar, Indonesia, Pakistan ink defense cooperation MoU", "url": "https://breakingdefense.com/2026/10/turkey-qatar-indonesia-pakistan-ink-defense-cooperation-mou/", "source": "Breaking Defense", "published": "2026-10-21T14:46:36+00:00", "summary": "The countries will seek developing “solutions and industries compatible with the development of modern defense systems,” pointing that the capabilities of the four countries are complementary.", "language": "en"}, {"title": "北, 대남 확성기 가동 예고에 軍도 맞대응 거론…1년 4개월 만에 재개하나", "url": "https://www.newsis.com/view/NISX20261021_0003835856", "source": "뉴시스", "published": "2026-10-21T14:33:10+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 북한이 이달 중 대남 확성기 방송을 재개하겠다고 예고하면서 우리 군도 대북 확성기 방송 등 맞대응에 나설 가능성이 커지고 있다. 남북 간 확성기 심리전이 재개되면 지난해 6월 이후 중단됐던 대남·대북 방송이 1년 4개월여 만에 다시 시작되는 것이다. 이재명 정부가 추진해 온 남북관계 개선에도 상당한 부담으로 작용할 전망이다. 김여정 북한 노동당 총무부장은 21일 조선중앙통신을 통해 공개한 담화에서 “무장괴한들은 오늘도 적어도 두 곳에서 확성기 경고 도발방송과 경고사격을 가하며 갈개였다”며 “10월 중", "language": "ko"}, {"title": "German military raises sabotage threat level amid warning of Russian attacks: report", "url": "https://www.defensenews.com/global/europe/2026/10/21/german-military-raises-sabotage-threat-level-amid-warning-of-russian-attacks-report/", "source": "Defense News", "published": "2026-10-21T14:27:08+00:00", "summary": "German forces themselves could face attacks at home, according to a classified internal analysis reported by public broadcaster WDR and newspaper SZ.", "language": "en"}, {"title": "북 김여정 \"10월 중 전 국경선에서 대남 심리전 확성기 가동\"(종합)", "url": "https://www.newsis.com/view/NISX20261021_0003835850", "source": "뉴시스", "published": "2026-10-21T14:02:39+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 김여정 북한 노동당 총무부장은 21일 군사분계선(MDL) 월선에 대응한 한국 군의 경고 방송·사격에 반발하면서 이달 중으로 대남 확성기를 가동하겠다고 예고했다. 실제로 재개한다면 이재명 정부의 대북 확성기방송 중지에 호응해 대남 소음방송을 멈춘 지 1년 4개월 만이다.  김 부장은 대외매체 조선중앙통신에 공개한 담화에서 이날 박정천 국방성 고문과 함께 남부국경 요새화 공사현장 주요지점을 현지시찰한 사실을 언급했다. 통신은 담화가 나오기 약 4시간 전 현지시찰 소식을 별도 보도했다. 김 부장은 \"무장", "language": "ko"}, {"title": "Germany's military warns of 'significant' Russian sabotage threat - Reuters", "url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxOdVRoRl9JRkgwV2ZQYm5oMFAyOGVVXzItQUhZdXB3dDlCNVQ1RERQLVpYdGtWNHhFcWVLQktIQ0xRU1Y0N3R5VDNvYXFKdUI1ZUw2SDFvV3NEaVBkamtQYUNYZVVzQ1BqQzRHSVpfdlcwQkg0TFh4cldkNFNNbXhIbzhuT2JQeTZkc1J5MmR3TWlqeWg5MUxrWHJ2a0JLMGtZdzAxT0NOak44aXI0MFJ3T2pKTmJaWFZ2RXJWdFViSQ?oc=5", "source": "Reuters", "published": "2026-10-21T13:25:43+00:00", "summary": "Germany's military warns of 'significant' Russian sabotage threat    Reuters", "language": "en"}, {"title": "Australia marks missile, cyber ‘firsts’ in exercise with Indonesia", "url": "https://breakingdefense.com/2026/10/australia-marks-missile-cyber-firsts-in-exercise-with-indonesia/", "source": "Breaking Defense", "published": "2026-10-21T13:22:09+00:00", "summary": "The Keris Woomera exercise comes during a busy month for Australia’s military, as forces participate in drills from Singapore to Japan.", "language": "en"}, {"title": "Army’s tech chief talks autonomy, acquisition and the future of drones", "url": "https://breakingdefense.com/2026/10/armys-tech-chief-talks-autonomy-acquisition-and-the-future-of-drones/", "source": "Breaking Defense", "published": "2026-10-21T13:06:12+00:00", "summary": "CTO Alex Miller sits down with Breaking Defense’s Carley Welch to discuss the Army’s unmanned initiatives.", "language" .  헌재는 21일 이 의원이 국회 과방위가 자신을 방미통위 국정감사에서 제척하는 내용의 '국정감사 위원 제척의 건'을 가결선포한 행위에 대해 효력을 정지해 달라며 낸 가처분 신청을 재판관 9인 전원일치로 일부 인용했다. 구체적으로 오는 22일 종합국정감사와 관련해 신청을 기각한 일부 감사 영역을 뺴고는 본안 격인 권한쟁의심판의 결정", "language": "ko"}, {"title": "이 대통령, 유홍준 국립중앙박물관장 사직 재가…'부적절 처신' AI전략위원 해촉", "url": "https://www.newsis.com/view/NISX20261021_0003835758", "source": "뉴시스", "published": "2026-10-21T10:04:36+00:00", "summary": "[서울=뉴시스]김경록 기자 = 이재명 대통령이 21일 개인 소장품 '셀프 전시' 논란을 빚은 유홍준 국립중앙박물관장의 사직을 재가했다. 강유정 청와대 수석대변인은 이날 저녁 언론 공지를 통해 이 대통령이 유 관장의 사직안을 재가했다고 밝혔다. 국립중앙박물관은 지난 7월 개막한 전시에서 '일반시국은(一飯是國恩)' 문구 유묵을 애국지사 박원근의 작품으로 설명했으나, 외부 제보를 통한 검증 결과 친일반민족행위자 박중양의 글씨인 것으로 드러난 바 있다. 특히 이 과정에서 해당 유묵이 유 관장의 개인 소장품으로 드러나며 파장이 커졌다. 이에", "language": "ko"}, {"title": "\"선(先)비핵화 포괄적 합의보다 북핵 위협 단계적으로 낮춰야\"", "url": "https://www.yna.co.kr/view/AKR20261021116800504", "source": "연합뉴스", "published": "2026-10-21T10:00:00+00:00", "summary": "(서울=연합뉴스) 이은정 기자 = 북미 대화 재개를 위해 북한의 선(先) 비핵화를 전제로 한 포괄적 합의보다 핵·미사일 위협을 단계적으로 줄이는...", "language": "ko"}, {"title": "北박정천·김여정, 국경선 요새화 시찰…\"적 도발시 즉시 반격\"(종합)", "url": "https://www.yna.co.kr/view/AKR20261021128151504", "source": "연합뉴스", "published": "2026-10-21T09:15:15+00:00", "summary": "(서울=연합뉴스) 윤보람 기자 = 북한의 박정천 국방성 고문과 김여정 노동당 중앙위원회 부장이 지난 20일 남부국경 요새화 공사현장을 시찰했다고...", "language": "ko"}, {"title": "[쇼츠] 잠수 지원서 드론 운용 '뚝딱'…조립하는 '레고형' 보트 등장", "url": "https://www.yna.co.kr/view/AKR20261021155700704", "source": "연합뉴스", "published": "2026-10-21T08:40:51+00:00", "summary": "(서울=연합뉴스) 임무에 맞춰 갑판 구조를 자유롭게 바꿀 수 있는 이른바 '레고형' 모듈식 군용보트가 공개됐습니다.", "language": "ko"}, {"title": "공정위, 우진산전 현장조사…철도차량 입찰담합 의혹", "url": "https://www.newsis.com/view/NISX20261021_0003835642", "source": "뉴시스 경제", "published": "2026-10-21T08:27:26+00:00", "summary": "2022년 현대로템·다원시스와 담합 제재 전력\n\n[세종=뉴시스]임하은 기자 = 공정거래위원회가 철도차량 제조업체 우진산전의 입찰담합 의혹에 대한 조사에 착수했다. 21일 업계에 따르면 공정위는 최근 우진산전을 현장조사해 관련 자료를 확보하고 철도차량 입찰 과정에서 담합이 있었는지 들여다보고 있다. 우진산전 외에 다른 철도차량 부품업체도 현장조사를 받은 것으로 알려졌다. 국내 철도차량 제조시장은 현대로템과 우진산전, 다원시스 등이 주로 점유하고 있다. 최근 다원시스가 재무 상태 악화로 회생절차에 들어가면서 우진산전은 업계 2위 업체로", "language": "ko"}, {"title": "[영상] 잠수지원·드론운용·감시까지…임무 따라 바뀌는 '레고형' 보트", "url": "https://www.yna.co.kr/view/AKR20261021151000704", "source": "연합뉴스", "published": "2026-10-21T08:26:20+00:00", "summary": "(서울=연합뉴스) 임무에 맞춰 갑판 구조를 자유롭게 바꿀 수 있는 이른바 '레고형' 모듈식 군용보트가 공개됐습니다.", "language": "ko"}, {"title": "용산 아세아아파트 공사 무기한 중단…연내 분양 차질", "url": "https://www.newsis.com/view/NISX20261021_0003834882", "source": "뉴시스 경제", "published": "2026-10-21T08:18:34+00:00", "summary": "[서울=뉴시스] 변해정 기자 = 서울 용산구에 969가구 규모로 들어설 예정인 아세아아파트의 신축 공사가 무기한 중단됐다. 21일 건설업계와 용산구청에 따르면 부영주택은 지난 7월말 구청에 '한강로3가 아세아아파트 특별계획구역 신축공사 공사중지 통보서'를 보냈다.  이 통보서는 2024년 7월 착공에 들어간 아세아아파트의 공사를 9월 11일부로 중지한다는 내용이 담겼다.  중단 사유로 '사업계획변경 3차 진행 중 승인 지연에 따른 공사 일시 중지'로 명시했을 뿐, 공사 재개일은 '미정'으로 통보했다. 공사 중지에 따라 사면 보양막과", "language": "ko"}, {"title": "\"전북대 반도체공동연구소 설립 왜 늦어지나\" 국감 질타", "url": "https://www.newsis.com/view/NISX20261021_0003835540", "source": "뉴시스", "published": "2026-10-21T07:49:50+00:00", "summary": "[전주=뉴시스]최정규 기자 = 21일 진행된 국회 교육위원회의 전북대학교 등 국정감사에서 반도체 인력양성과 전북대 청렴도 문제 등이 도마에 올랐다. 이날 전남대학교에서 진행된 국정감사에서 강경숙(조국혁신당) 의원은 \"반도체는 우리나라의 핵심전략산업\"이라면서 \"전북대가 2024년 반도체공동연구소를 설립하기로 했지만 착공도 준공도 늦어지고 있다\"고 지적했다. 특히 \"전북대의 경우 건축 규모를 재검토하느라 중단이 됐다\"며 \"정부와 대학의 약속인데 기본적 준비 없이 설계만 하면 되는 것이냐\"고 질타했다. 이에 대해 양오봉 전북대 총장은 \"", "language": "ko"}, {"title": "스틸 美대사 \"한국 진출한 美기업, 공평한 환경에서 경쟁해야\"", "url": "https://www.newsis.com/view/NISX20261021_0003835534", "source": "뉴시스", "published": "2026-10-21T07:42:23+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 미셸 스틸 주한미국대사는 21일 \"한국에 진출한 미국 기업들이 공평한 환경에서 공정하고 차별없이 경쟁할 수 있어야 한다\"라고 밝혔다.  스틸 대사는 이날 서울 용산구 몬드리안호텔에서 주한미국상공회의소(암참)가 개최한 특별 오찬 간담회에서 \"우리 팀은 기업 환경 개선을 위해 매일 노력하고 있고 저희 문은 활짝 열려있다\"라며 이같이 말했다.  스틸 대사는 미국 기업이 겪는 디지털 규제에 대한 질문에 대해 \"한국 시장에 매우 큰 장벽들이 있었다. 특히 디지털 부분에서 압수수색과 감사, 과징금 조치들이 있었", "language": "ko"}, {"title": "육군 11사단, 호국훈련 맞아 대규모 기동훈련…K2 전차 등 1300여대 투입", "url": "https://www.newsis.com/view/NISX20261021_0003835517", "source": "뉴시스", "published le": "국방차관 \"전 장병 동료 생명지킴이 되는 전사공동체 구축해야\"", "url": "https://www.newsis.com/view/NISX20261021_0003835403", "source": "뉴시스", "published": "2026-10-21T06:53:06+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 이두희 국방부 차관이 군 내 자살사고를 방지하기 위해서 전 장병이 동료의 생명지킴이가 되는 전사 공동체를 구축해야 한다고 강조했다.  국방부는 21일 이 차관 주관으로 '군내 자살사고 예방체계 점검 회의'를 개최, 최근 군내 자살사고를 분석하고 예방체계를 점검했다고 밝혔다.  이번 회의는 지난 5월 구성된 자살예방·정신건강 증진 통합위원회를 병행해 자살예방과 정신건강 증진대책을 함께 점검했다.  회의에서는 최근 군에서 발생한 사고에 대한 면밀한 분석을 바탕으로 실질적인 자살예방대책이 정립될 수 있도록", "language": "ko"}, {"title": "Fighter jet crashes in northeast France, at least one person dead - Reuters", "url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxNbjRieTdHWUNzMHlHelpvbDNtSE91c1Z2LWVjNlN5djlBQWVraHByNkRRSEpZOE5raDloOE40ZWxUWXNDMmRoQXFEZVNwYzBmSEliSmo0eWxfam5SZ1FpdWFGZXpTWGRRMlJRZDlpRnBaUkdCTVExeXNFaFQtRkhBUS1aY0xGR3dBdjBJdFF2OEVnNGxZcGVkMlpwYnBhblF1YWRMOQ?oc=5", "source": "Reuters", "published": "2026-10-21T06:53:00+00:00", "summary": "Fighter jet crashes in northeast France, at least one person dead    Reuters", "language": "en"}, {"title": "[특징주] LIG D&A, 방사청 제재 소식에 9% 급락(종합)", "url": "https://www.yna.co.kr/view/AKR20261021034551008", "source": "연합뉴스", "published": "2026-10-21T06:37:31+00:00", "summary": "(서울=연합뉴스) 임은진 기자 = LIG디펜스앤에어로스페이스(이하 LIG D&amp;A)가 방위사업청으로부터 제재를 받았다는 소식에 21일 주가...", "language": "ko"}, {"title": "브런슨 \"대비태세, 연중 두차례 연습으론 안돼…1년 내내 훈련해야\"", "url": "https://www.newsis.com/view/NISX20261021_0003835325", "source": "뉴시스", "published": "2026-10-21T06:29:03+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 제이비어 브런슨 주한미군사령관은 21일 한반도 대비태세를 유지하기 위해서는 연중 두차례 한미 연합연습을 실시하는 것에 그치치 말고 연중 내내 훈련을 해야한다고 밝혔다. 브런슨 사령관은 21일 용산 몬드리안 서울 이태원에서 주한미국상공회의소(암참) 주최로 열린 특별 오찬간담회에서 \"이번주 진영승 합참의장과 만나 다가오는 FS 연습에서 어떻게 훈련할지 논의했다\"며 이같이 말했다.  그는 또 \"논의 과정에서 우리가 확인한 것은 대비태세를 연중 두차례 훈련에만 의존해서는 안 된다는 점\"이라며 \"우리는 1년 ", "language": "ko"}, {"title": "[게시판] 서울지역 6·25 전사자 유해발굴사업 설명회", "url": "https://www.yna.co.kr/view/AKR20261021109700504", "source": "연합뉴스", "published": "2026-10-21T05:43:46+00:00", const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
