무관리 역량 강화\"…노동부, 지자체 교육 확대", "url": "https://www.newsis.com/view/NISX20260706_0003696627", "source": "뉴시스 경제", "published": "2026-07-06T00:00:00+00:00", "summary": "[서울=뉴시스] 고홍주 기자 = 정부가 지방자치단체 등 공공부문의 불합리한 고용관행을 개선하고 인사노무관리 역량을 높이기 위해 노동교육을 확대한다. 고용노동부와 한국고용노동교육원은 이달부터 지자체 등 대상 교육과정을 개편·확대 운영한다고 6일 밝혔다. 그동안 고용노동교육원은 매년 중앙부처와 지자체 공무직(기간제 포함) 인사노무 담당자를 대상으로 노동관계법령교육을 실시해왔다. 지난해 총 12회, 240명을 대상으로 실시됐지만 지자체 참여도는 높지 않았다. 하지만 최근 노동부가 실시한 '지방정부 비정규직 노동조건 준수 기획감독' 결과 ", "language": "ko"}, {"title": "'천조국'도 진땀 뺀 수천만원 짜리 드론…예상 밖 '가성비 전쟁'", "url": "https://www.hankyung.com/article/202607066798i", "source": "한국경제 경제", "published": "2026-07-05T23:30:04+00:00", "summary": "", "language": "ko"}, {"title": "'유럽판 스페이스X' 출범 앞두고 반독점 논란…獨업계 \"경쟁 줄어\"", "url": "https://www.newsis.com/view/NISX20260706_0003696510", "source": "뉴시스 경제", "published": "2026-07-05T23:05:03+00:00", "summary": "[서울=뉴시스]고재은 기자 = 유럽판 '스페이스X'로 알려진 에어버스·레오나르도·탈레스 합병 사업이 추진되는 가운데, 3사 합병으로 경쟁이 줄어들 것이라는 반독점 논란이 제기됐다. 독일 위성 업체 OHB의 마르코 푹스 최고경영자(CEO)는 5일(현지 시간) 파이낸셜타임스(FT)에 \"공공 재정에 투입되는 우주프로그램에서 정부가 선택할 수 있는 공급업체가 줄어들어 결국 납세자의 비용 부담이 커진다\"고 지적했다.  그는 \"경쟁을 저해하는 조치\"라며 \"유럽 시민에게도, 납세자에게도, 유럽 시장의 공급 생태계에도 좋지 않다\"고 말했다. 앞서", "language": "ko"}, {"title": "당정, 반도체 추가 세수로 '미래대응기금' 추진[간추린 주말 뉴스]", "url": "https://www.newsis.com/view/NISX20260705_0003696371", "source": "뉴시스", "published": "2026-07-05T21:30:00+00:00", "summary": "[서울=뉴시스]박지혁 기자 = 더불어민주당과 정부, 청와대가 5일 반도체 호황 등으로 발생한 추가 세수를 활용해 미래대응기금을 신설하기로 했다. 기금은 미래 세대와 대한민국 성장동력, 양극화 대응 등에 활용될 예정이다. 20·30세대의 주거와 창업·일자리 지원 등도 사용처로 제시됐다. 강훈식 대통령 비서실장은 이날 종로구 국무총리 공관에서 열린 고위당정협의회 모두발언에서 \"대한민국의 미래를 좌우할 절체절명의 시기에 반도체 호황 등으로 발생한 추가 세수를 허투루 써선 안 될 것\"이라며 \"추가 세수로 '기금'을 조성해 3대 메가프로젝트", "language": "ko"}, {"title": "[오늘의 주요일정]정치(7월6일 월요일)", "url": "https://www.newsis.com/view/NISX20260705_0003696431", "source": "뉴시스", "published": "2026-07-05T20:00:00+00:00", "summary": "[서울=뉴시스] ◇청와대【대통령】 10:00 메가프로젝트 민관합동 점검회의(청와대 본관) ◇총리실【총리】 12:00 주례보고(청와대) 14:00 출입기자단 인사(서울청사 3층) ◇국방부【장관】 통상일정 ◇외교부【장관】 09:30 실국장회의 ◇통일부【장관】 통상일정 ◇더불어민주당【당대표 직무대행 겸 원내대표】 09:30 최고위원회의(국회 본관 당대표회의실) 14:00 해공 신익희 세계여행기 출간기념식(국회박물관 2층) ◇국민의힘【당대표】 09:00 최고위원회의(국회 본관 228호) 【원내대표】 09:00 최고위원회의(국회 본관 228", "language": "ko"}, {"title": "中, 저궤도 위성 20기 탑재 창정-8A 발사 성공…첸판 인터넷망 구축 가속", "url": "https://www.newsis.com/view/NISX20260706_0003696459", "source": "뉴시스 경제", "published": "2026-07-05T18:24:19+00:00", "summary": "[원창=신화/뉴시스]이재준 기자 = 중국 우주당국은 5일(현지시간) 저궤도 위성 인터넷망 구축을 위한 위성 20기를 탑재한 운반로켓 창정-8A(長征八號甲)를 성공리에 발사했다. 우주 당국은 이날 밤 하이난성 원창(文昌) 상업우주발사장에서 창정-8A 운반로켓을 이용해 첸판(千帆) 극궤도(북극과 남극 위) 15그룹 위성을 우주로 쏘아 올렸다.  발사 시각은 베이징 시간 기준 21시43분이며 위성 20기는 각자 예정 궤도에 정상 진입했다. 첸판 극궤도 15그룹 위성들은 중국이 자체적으로 구축 중인 저궤도 위성 인터넷 시스템의 구성 요소로", "language": "ko"}, {"title": "남유럽 동시다발 산불 확산…그리스·포르투갈·스페인 대규모 피해", "url": "https://www.newsis.com/view/NISX20260706_0003696455", "source": "뉴시스 경제", "published": "2026-07-05T17:31:38+00:00", "summary": "[아네테=AP/뉴시스]이재준 기자 = 남유럽에서 대형 산불이 동시 다발적으로 발생하면서 포르투갈, 그리스, 스페인 등에서 소방당국과 유럽연합(EU)이 총력 대응에 나섰다. 그리스에서는 아테네 서쪽 마을 마드나 인근 소나무 숲에서 발생한 산불이 강풍을 타고 빠르게 확산했다.  당국은 소방관 수백명과 항공기 29대를 투입해 진화 작업을 벌이고 있으며 해가 지기 전까지 화재 확산을 차단하는 데 주력하고 있다.  또한 테살로니키에서는 재활용 공장 화재와 산불이 겹치면서 유독성 연기가 발생해 지역 주민에게 실내 대피와 창문 폐쇄 지시가 내려", "language": "ko"}, {"title": "유조선 5척 이상, 오만 연안 항로 따라 호르무즈 해협 통과", "url": "https://www.newsis.com/view/NISX20260705_0003696444", "source": "뉴시스 경제", "published": "2026-07-05T14:24:13+00:00", "summary": "[서울=뉴시스]이재준 기자 = 최소한 5척의 선박이 5일 오만 연안을 따라 운항하는 항로를 이용해 호르무즈 해협을 통과했다고 CNN이 5일 보도했다.   CNN은 해운 위치 추적업체 마린 트래픽을 인용, 만재 상태의 라이베리아 선적 유조선 하피트를 선두로 하는 선단이 이날 오만만 방향으로 항해, 호르무즈 해협을 지났다고 전했다. 선단에는 액화석유가스(LPG) 운반선과 액화천연가스(LNG) 운반선 3척, 컨테이너선 1척이 포함됐다. 이번 호르무즈 해협 통항은 이란 혁명수비대(IRGC) 해군이 '오만 항로'를 차단하기 위해 순찰정을 배", "language": "ko"}, {"title": "중러, 서해서 해상 연합훈련…이어 태평양 공동 순찰", "url": "https://www.newsis.com/view/NISX20260705_0003696430", "source": "뉴시스 경제", "published": "2026-07-05T13:05:41+00:00", "summary": "[서울=뉴시스]이재준 기자 = 중국과 러시아가 산둥성 칭다오(青島)와 인근 서해에서 '해상연합(海上聯合)-2026' 훈련을 실시하고서 태평양 관련 해역으로 옮겨 공동 해상 순찰을 벌인다고 신화망과 중앙통신이 5일 보도했다' 매체는 중국 국방부 발표를 인용해 중러 해군이 연례 군사협력 계획에 따라 6~13일 연합훈련을 가진다며 러시아 해군 편대가 이날 칭다오 군항에 도착하는 등 양국 참가 전력이 모두 집결했다고 전했다. 국방부에 따르면 연합훈련 주제는 '해상 안보 위협에 대한 공동 대응'으로 양국이 안보 도전에 함께 대처하고 역내 평", "language": "ko"}, {"title": "與당권주자들, 주말에도 당심 잡기…金 '전북 공략'·鄭 '노사모'·宋 '호남 부각'(종합)", "url": "https://www.newsis.com/view/NISX20260705_0003696406", "source": "뉴시스", "published": "2026-07-05T11:09:42+00:00", "summary": "[서울=뉴시스] 정금민 한재혁 기자 = 더불어민주당 차기 당대표 선출을 위한 전당대회가 40여일 앞으로 다가온 가운데 주말 사이 당권주자들이 제각각 당심 잡기에 나섰다. 김민석 전 국무총리는 5일 당권 주자들 중 가장 먼저 출마를 공식화했다. 김 전 총리 측은 이날 언론 공지를 통해 오는 6일 오전 9시 국립 5·18 민주묘지 참배를 시작으로 광주에서 출마를 선언할 것이라고 밝혔다. 김 전 총리는 전날 X(엑스·구 트위터)에 \"총리 퇴임 후 첫 주말을 보내는 익산에서, 익산을 넘어 전북, 나아가 대한민국의 새로운 도약을 구상한다\"고", "language": "ko"}, {"title": "푸틴 다녀간 지 두 달 만에…중·러 해군 '칭다오 집결'", "url": "https://www.hankyung.com/article/2026070565147", "source": "한국경제 국제", "published": "2026-07-05T10:26:14+00:00", "summary": "", "language": "ko"}, {"title": "미방산기업․ 한중소기업 간 협력의 장 마련 - 디펜스투데이", "url": "https://news.google.com/rss/articles/CBMibkFVX3lxTFBranJHT18xejZkMEdCa3kxSElFMFJpYVV5M3BHcDJzUTZGTjVVaDRQLVlaUTlwbGVCM2RIX3FCTm1RSkw2TjVVdXQ5Y0lIVHc4NzZlODd5UlllYUVfV1o5QWVYMS1RU3ZYWjl1aU9n?oc=5", "source": "방산 뉴스", "published": "2026-07-05T09:05:55+00:00", "summary": "미방산기업․ 한중소기업 간 협력의 장 마련    디펜스투데이", "language": "ko"}, {"title": "\"5대5\" vs \"낙관\"…캐나다 잠수함 발표 임박", "url": "https://www.hankyung.com/article/2026070564681", "source": "한국경제 정치", "published": "2026-07-05T08:54:14+00:00", "summary": "", "language": "ko"}, {"title": "[쇼츠] 8조원대 무기구매…파키스탄 맞서 무장하는 인도", "url": "https://www.yna.co.kr/view/AKR20260705037900704", "source": "연합뉴스", "published": "2026-07-05T08:36:24+00:00", "summary": "(서울=연합뉴스) 지난해 이웃국 파키스탄과의 대규모 무력 충돌 후 군사력 강화에 나선 인도가 지대공 미사일과 자폭형 드론을 포함한 8조원대 군사...", "language": "ko"}, {"title": "[영상] 라팔 114대 이어 미사일·드론·기뢰까지…군사력 키우는 인도", "url": "https://www.yna.co.kr/view/AKR20260705037000704", "source": "연합뉴스", "published": "2026-07-05T08:20:46+00:00", "summary": "(서울=연합뉴스 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
