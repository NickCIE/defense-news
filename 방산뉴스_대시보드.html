026-09-25T01:38:21+00:00", "summary": "[서울=뉴시스] 한재혁 기자 = 더불어민주당은 25일 DMZ(비무장지대) 지뢰 추정 폭발 사고 이후 국민의힘 등 야권이 정부의 대처를 두고 공세를 가하자 \"도를 넘었다\"며 \"장병들의 희생마저 정쟁의 도구로 삼지 말라\"고 촉구했다. 신현영 대변인은 이날 서면브리핑에서 \"국민의힘이 DMZ 지뢰 추정 폭발 사고를 두고 정부가 일부러 현장조사를 늦추고 있다며 '증거 인멸', 심지어 이적행위와 탄핵까지 운운했다\"고 했다. 신 대변인은 \"군은 이미 사고 조사에 착수했다. 사고 직후 폭발물 잔해 등을 확보해 국과수에 감정을 맡겼고 장병들이 착용", "language": "ko"}, {"title": "與 \"명절 노동자 모두의 안전·정당한 보상 존중 돼야\"", "url": "https://www.newsis.com/view/NISX20260925_0003803325", "source": "뉴시스", "published": "2026-09-25T01:22:44+00:00", "summary": "[서울=뉴시스] 한재혁 기자 = 더불어민주당은 25일 추석을 맞아 \"명절에 일하는 모든 분의 안전과 정당한 보상, 충분한 휴식이 존중돼야 한다\"고 했다. 신현영 대변인은 이날 서면브리핑에서 \"국민 여러분과 일터를 지키는 모든 분, 그리고 그 가족 여러분께 행복한 추석을 기원한다\"고 했다. 신 대변인은 \"누군가에게는 고향으로 향하는 길이지만, 누군가에게는 일터로 향하는 길\"이라며 \"우리가 가족과 함께하고 편안히 쉴 수 있는 것은 명절에도 자신의 자리에서 묵묵히 일하는 수많은 분이 계시기 때문\"이라고 했다. 이어 \"가족과의 만남과 휴식", "language": "ko"}, {"title": "北 \"韓, 집단적 응징 목표 될 것\"…美 '집단방위 중심' 발언 비난", "url": "https://www.newsis.com/view/NISX20260925_0003803340", "source": "뉴시스", "published": "2026-09-25T01:11:04+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 북한은 25일 제이비어 브런슨 주한미군사령관이 한국을 '집단방위의 결정적 중심'이라고 표현한 발언을 문제 삼으며 한국을 향해 \"집단적 응징의 결정적 목표가 될 것\"이라고 위협했다.  조선중앙통신은 이날 대적연구원 강철수 실장의 '집단방위의 결정적 중심은 집단적응징의 결정적 목표가 될 것이다'라는 제목의 글을 공개했다.  강 실장은 브런슨 주한미군사령관이 최근 한미국제안보학술회의에서 한국을 '집단방위의 결정적 중심'이라고 역설했다며  \"한국을 세계 패권전략실현을 위한 침략적인 집단방위 체계에 철저히 얽", "language": "ko"}, {"title": "China Appears To Be Building A Mothership For Large Uncrewed Submarines", "url": "https://www.twz.com/sea/new-evidence-china-is-building-a-massive-mothership-for-drone-submarines", "source": "The War Zone", "published": "2026-09-25T00:07:25+00:00", "summary": "Recent satellite imagery shows a host of highly specialized features on the ship that's under construction, as well as a large cradle sitting beside it. \n The post  China Appears To Be Building A Mothership For Large Uncrewed Submarines  appeared first on  TWZ .", "language": "en"}, {"title": "North Korea says South Korea a target if i "https://www.newsis.com/view/NISX20260923_0003801388", "source": "뉴시스", "published": "2026-09-24T22:35:00+00:00", "summary": "[서울=뉴시스]이준형 인턴 기자 = 김정은 북한 국무위원장의 딸 김주애가 집권하더라도, 권력을 안정적으로 유지하기는 어려우며 조선시대 '단종'과 같은 비극적 운명을 맞이할 수 있다는 전문가의 분석이 나왔다. 유튜브 채널 '이야기 더'에 최근 출연한 조한범 통일연구원 석좌연구위원은 최근 김주애의 행보와 북한의 권력 승계 시나리오에 대해 진단했다. 조 위원은 최근 김주애의 공개 행보 중 약 70%가 군사 행보에 집중되고 있는 점을 짚으며, \"북한에서 후계자가 되려면 최고사령관 직함 등 군을 가장 먼저 장악해야 한다\"고 설명했다.  다만", "language": "ko"}, {"title": "이 대통령-셰인바움, 한-멕시코 2026~2030 공동행동계획 채택…경제공동위 연례 개최", "url": "https://www.newsis.com/view/NISX20260925_0003803272", "source": "뉴시스", "published": "2026-09-24T22:15:26+00:00", "summary": "[멕시코시티=뉴시스] 김지은 기자 = 멕시코를 국빈 방문한 이재명 대통령은 24일(현지시간) 클라우디아 셰인바움 멕시코 대통령과 정상회담을 하고 합의사항 이행을 위한 '2026-2030 한-멕시코 공동행동계획'을 채택했다. 이 대통령은 이날 한-멕시코 정상회담 후 공동언론발표를 통해 이같이 말하며 \"이제 양국은 통상, 개발 협력, 지식재산권, 우주, 문화유산, 교육 등 모든 방면에서 협력의 성과를 지속적으로 발굴해 나갈 것\"이라고 밝혔다. 성기홍 청와대 홍보소통수석은 이와 관련 \"양 정상은 이번 회담에서 합의한 사항들이 실질적인 성", "language": "ko"}, {"title": "하루만 쉬는 북한 추석…한때 '봉건잔재' 몰려 폐지했다 부활", "url": "https://www.newsis.com/view/NISX20260923_0003801610", "source": "뉴시스", "published": "2026-09-24T22:00:00+00:00", "summary": "[서울=뉴시스] 남빛나라 기자 = 북한도 추석을 명절로 챙기지만 한국처럼 민족최대명절은 아니다.  김정은 북한 국무위원장에 대한 독자 우상화가 강화되면서 예전만큼 부각되지는 않지만, 북한은 김일성 주석 생일(4월15일·태양절)과 김정일 국방위원장 생일(2월16·광명성절)을 '민족최대의 명절'로 챙겨왔다. 추석은 비교적 차분하게 보내는 분위기다. 한국의 경우 추석 당일 전후로 총 3일을 쉬지만, 북한은 추석 당일 하루만 공휴일이다. 북한은 해방 후 민속명절을 봉건 잔재로 간주해 1967년 추석, 음력설 등 민속명절을 폐지했다. 김일성", "language": "ko"}, {"title": "Pete Hegseth reports at least $3.1 million in cash, investments and bitcoin", "url": "https://www.cnbc.com/2026/09/24/pete-hegseth-financial-disclosure-cash-investments-bitcoin.html", "source": "CNBC World", "published": "2026-09-24T21:46:05+00:00", "summary": "Defense Secretary Pete Hegseth reported at least $3.1 million in assets as he faces an impeachment push in Congress over his handling of the Iran war.", "language": "en"}, {"title": "[미중정상회담]\"한반도 의견교환\"…트럼프·김정은 회담 논의했나", "url": "https://www.newsis.com/view/NISX20260925_0003803262", "source": "뉴시스", "published": "2026-09-24T21:11:05+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 24일(현지 시간) 미중 정상회담에서 한반도 문제 역시 의제로 다뤄졌다고 중국이 밝히면서, 도널드 트럼프 미 대통령이 추진 중인 북미대화 재개 방안이 논의됐을지 주목된다. 중국 외교부는 이날 트럼프 대통령과 시진핑 중국 국가주석의 백악관 회담 이후 발표한 성명에서 \"양국 정상은 중동 정세, 우크라이나 사태, 한반도 문제 등 주요 국제 및 지역 현안에 대해 의견을 교환했다\"고 밝혔다. 한반도는 성명 끄트머리에 언급돼 비중이 크지는 않았으나, 두 정상이 북한 문제에 대해서도 의견을 주고 받았음을 중국", "language": "ko"}, {"title": "Finnish leader pleads with Musk to help Ukraine hit Russian missile launchers - Reuters", "url": "https://news.google.com/rss/articles/CBMi0wFBVV95cUxNYVhWUGo1UzRrdV9OR0FEenhJZ0VPZ0dBT3lTRG5zSXlrbzQ2NS1fWmcxRC1GY1FWNTRGa3JuM3J3ZjFwUnRFR0Nkbm9HOWtRYVZsQ2tpc3AwYl9KbkxuenNtOFlsN0hINVFNRDZtejVsVGUxVkFRMFc4NEM0OXBCb0pZc01MZ19ERXVlYXpBYzA5aVZuZ2ZEUTZpVWtOb3FrcnE5ODRFYUpkZS1LQTJXTXVtamhDbWs0SDBNRjM0cnpZUnN3SVRWSUpBdkwzZ1FFaVZj?oc=5", "source": "Reuters", "published": "2026-09-24T21:06:00+00:00", "summary": "Finnish leader pleads with Musk to help Ukraine hit Russian missile launchers    Reuters", "language": "en"}, {"title": "이 대통령 \"한-멕시코, 원유 등 공급망 대화채널 출범…투자보장협정 개정 타결\"(종합)", "url": "https://www.newsis.com/view/NISX20260925_0003803255", "source": "뉴시스", "published": "2026-09-24T20:16:18+00:00", "summary": "[멕시코시티·서울=뉴시스] 김지은 조재완 기자 = 멕시코를 국빈 방문한 이재명 대통령은 24일(현지시간) 클라우디아 셰인바움 멕시코 대통령과 정상회담을 하고 에너지·핵심광물 공급망 협력을 논의할 대화 채널을 신설하고, 한국산 경공격기 FA-50 등 방산 협력을 확대하기로 했다. 두 정상은 또 한-멕시코 투자보장협정 개정에 합의하고 무역협정 체결을 논의하는 등 양국 기업이 보다 안정적으로 교류할 수 있는 환경을 만들어 가기로 뜻을 모았다. 이 대통령은 이날 오후 멕시코 대통령궁인 '팔라시오 나시오날'에서 한-멕시코 정상회담을 한 후 ", "language": "ko"}, {"title": "[오늘의 주요일정]정치(9월25일 금요일)", "url": "https://www.newsis.com/view/NISX20260924_0003803164", "source": "뉴시스", "published": "2026-09-24T20:00:00+00:00", "summary": "[서울=뉴시스] ◇청와대【대통령】 멕시코 순방 ◇총리실【총리】 공개일정 없음 ◇국방부【장관】 통상일정 ◇외교부【장관】 멕시코 출장 ◇통일부【장관】 통상일정 ◇더불어민주당【당대표】 공개일정 없음 【원내대표】 공개일정 없음 ◇국민의힘【당대표】 06:30 뉴데일리TV '배추도사의 새벽배송' 출연 09:00 매일신문 유튜브 '이동재의 뉴스캐비닛' 출연 【원내대표】 통상업무 ◇조국혁신당【당대표】 공개일정 없음 【원내대표】 공개일정 없음 ◇개혁신당【비상대책위원장】 통상일 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
