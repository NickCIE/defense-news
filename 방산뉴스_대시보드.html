무성 대변인 담화로 반발했다. 김 부장은 이날 북한 대외매체 조선중앙통신을 통해 '국제원자력기구의 편견적 시각과 이중기준은 국제핵전파방지제도(NPT)의 붕괴를 초래한 기본 인자이다' 제목의 담화를 발표했다. 김 부장은 \"미국과 서방의 사촉 밑에 기구가 매해 조작하고 있는 이러한 무의미하고 비효율적인 '결의'는 우리에게 있어서 새로운 체험이 아니", "language": "ko"}, {"title": "2작전사, '불량 식자재 막는다'…추석 전 군 급식 점검 강화", "url": "https://www.newsis.com/view/NISX20260918_0003796357", "source": "뉴시스", "published": "2026-09-18T23:00:00+00:00", "summary": "[대구=뉴시스]정재익 기자 = 육군 제2작전사령부는 추석을 앞두고 장병들의 안전한 급식을 위해 군납 식자재 관리를 강화한다고 19일 밝혔다. 점검은 식자재의 조달부터 검수, 검사, 급식 현장까지 전 과정의 안전성을 확보하기 위해 마련됐다. 2작사는 전날 대구·경상권역 군 급식유통센터에서 국립농산물품질관리원 경북지원과 군납 식자재 합동검수를 진행했다. 합동검수는 수입 농산물 유입과 원산지 표시 위반을 막기 위해 매월 한 차례 실시한다. 2작사는 양배추 등 채소류 12개 품목과 삼겹살 등 축산물 5개 품목, 김치·두부 등 가공품을 대상", "language": "ko"}, {"title": "조현·루비오, 北비핵화 공감…\"북미대화 진전은 아직\"(종합)", "url": "https://www.newsis.com/view/NISX20260919_0003796426", "source": "뉴시스", "published": "2026-09-18T22:54:59+00:00", "summary": "[워싱턴=뉴시스] 이윤희 특파원 = 도널드 트럼프 미국 대통령이 김정은 북한 국무위원장과 연내 회담을 추진 중인 가운데, 한미 외교수장들이 18일(현지 시간) 만나 양국 현안을 논의하면서 한반도 비핵화에 대한 공감대를 확인했다. 다만 북미대화와 관련해 별다른 진전사항은 없다고 미국 측이 밝힌 것으로 전해졌다. 회담에서는 한국의 호르무즈 해협 파병 문제 역시 논의 테이블에 올랐는데, 미국 측이 구체적인 요구를 하지는 않았다고 정부 관계자가 설명했다. 미국 측은 구글과 쿠팡 등 미국 기업들에 대한 한국 정부의 차별 문제도 제기했다. 조", "language": "ko"}, {"title": "Cape Canaveral is building up its counter-drone defenses, Space Force says", "url": "https://www.defenseone.com/defense-systems/2026/09/cape-canaveral-building-its-counter-drone-defenses-space-force-says/416096/", "source": "Defense One", "published": "2026-09-18T22:51:54+00:00", "summary": "The Florida facility is key to the Pentagon’s plans to launch a thousand rockets a year.", "language": "en"}, {"title": "이번주 국회에는 무슨 일이? [뉴시스국회토pic]", "url": "https://www.newsis.com/view/NISX20260917_0003794395", "source": "뉴시스", "published": "2026-09-18T22:20:00+00:00", "summary": "[서울=뉴시스]고범준 기자 = 9월 12일부터 9월 18일까지의 국회 이슈를 사진으로 풀어본다. [뉴시스국회토pic]은 국회에서 일어난 중요 이슈를 사진으로 풀어보는 '이번주 국회에는 무슨 일이?'로 매주 토요일 여러분을 찾아 갑니다. ◆ 성평등가족부 장관 후보자 사퇴 기자회견 마친 용혜인 ◆ 기자회견하는 한동훈 의원 ◆ 고위당정협의회 ted this November will be in office when Social Security's retirement trust fund is projected to run dry.", "language": "en"}, {"title": "스틸 美대사 \"피 나눈 한미동맹…조선·기술·역내 안보 협력 강화\"", "url": "https://www.newsis.com/view/NISX20260918_0003796347", "source": "뉴시스", "published": "2026-09-18T11:52:31+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 미셸 스틸 주한미국대사는 18일 한미동맹을 피를 나눈 동맹이라고 강조하며 한미가 안보를 비롯해 조선·기술·역내 안보 등 다양한 분야에서 협력을 강화하고 있다고 밝혔다. 스틸 대사는 이날 서울 중구 앰배서더 서울 풀만 호텔에서 열린 한미동맹 콘퍼런스 기조연설에서 \"한미동맹은 전쟁을 통해 만들어진 동맹\"이라며 양국 군인들이 자유를 수호하며 피를 나눈 덕에 만들어졌다고 말했다.  스틸 대사는 한미동맹에 대해 \"70년 넘게 한반도와 인도·태평양의 평화와 안보를 지탱하는 핵심축이었다\"라며 \"한미 상호방위조약은", "language": "ko"}, {"title": "[인사]감사원", "url": "https://www.newsis.com/view/NISX20260918_0003796342", "source": "뉴시스", "published": "2026-09-18T11:42:26+00:00", "summary": "[서울=뉴시스] ◆고위감사공무원 전보 ▲국토·안전감사국장 오준석 ▲행정·문화감사국장 김동석 ▲기후·환경감사국장 전형철 ▲전략기획관 김태성   ◆3급 승진 ▲산업·금융감사국 제2과장 전용진 ▲사회·복지감사국 제2과장 김규용 ▲사회·복지감사국 제4과장 박환대 ▲지방행정감사1국 제4과장 김남진 ▲적극행정공공감사지원관실 공공감사정책담당관 박정철 ▲감찰관실 감찰담당관 김혁   ◆3급 신규 채용 ▲외교·국방감사국 제1과장 윤희연(9월23일자)   ◆과장 신규 보임 ▲행정·문화감사국 제4과장 최진영 ▲행정·문화감사국 제5과장 백경희 ▲반부패조사", "language": "ko"}, {"title": "Latvia chooses Czech howitzers over Swedish Archer offer", "url": "https://www.defensenews.com/global/europe/2026/09/18/latvia-chooses-czech-howitzers-over-swedish-archer-offer/", "source": "Defense News", "published": "2026-09-18T11:01:43+00:00", "summary": "Latvia will buy Czech Morana 155 mm howitzers, reversing an earlier decision to by the rival Archer artillery weapon from Sweden's BAE Systems Bofors.", "language": "en"}, {"title": "벨 前주한미군사령관 \"전작권 전환 반대 소신 지금도 그대로\"", "url": "https://www.yna.co.kr/view/AKR20260918174000504", "source": "연합뉴스", "published": "2026-09-18T10:11:58+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 버웰 벨 전 주한미군사령관은 18일 \"북한을 억제하고 필요시 격멸하기 위해선 핵무기를 통제하는 국가가 연합사령...", "language": "ko"}, {"title": "대전역세권 개발 좌초 위기…한화에 최후통첩했지만 '묵묵부답'", "url": "https://www.yna.co.kr/view/AKR20260918165400063", "source": "연합뉴스 경제", "published": "2026-09-18T09:00: const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
