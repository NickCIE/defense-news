ucture    Reuters", "language": "en"}, {"title": "이형일 \"내년 관리재정수지 적자비율 0.1%…20년 만에 가장 양호\"", "url": "https://www.newsis.com/view/NISX20261103_0003853475", "source": "뉴시스", "published": "2026-11-03T10:06:41+00:00", "summary": "[세종=뉴시스]임하은 기자 = 이형일 경제부총리 겸 재정경제부 장관은 3일 내년 국내총생산(GDP) 대비 관리재정수지 적자 비율이 0.1%로 낮아질 전망이라며 \"20년 만에 가장 양호한 수준이 될 전망\"이라고 밝혔다. 이형일 부총리는 이날 자신의 엑스(X·옛 트위터)에 39조7000억원 규모의 내년도 재경부 예산안이 국회에 상정됐다는 소식을 전하며 이같이 말했다. 그는 \"국가채무 비율은 올해 51.6%에서 내년 48.3%로 개선되고, GDP 대비 나라살림 적자(관리재정수지) 비율도 3.9%에서 0.1%로 낮아져 20년 만에 가장 양", "language": "ko"}, {"title": "조정식 국회의장, 伊 하원 의장 회담…\"한국 기업 공정한 대우·지원 부탁\"", "url": "https://www.newsis.com/view/NISX20261103_0003853453", "source": "뉴시스", "published": "2026-11-03T09:30:20+00:00", "summary": "[서울=뉴시스] 한재혁 기자 = 조정식 국회의장은 2일 서울 여의도 국회의장 접견실에서 로렌초 폰타나 이탈리아 하원의장을 만나 양국 의회 간 교류 확대 및 미래산업 협력 강화 방안 등을 논의했다. 3일 국회에 따르면 조 의장은 전날 폰타나 의장에게 \"지난 10월 이탈리아 방문 당시 따뜻하게 환대해 주신 데 감사드린다\"며 \"당시 방한을 요청한 지 한 달 만에 다시 만나 뵙게 되어 대단히 뜻깊고 반갑다\"고 했다. 이어 \"이탈리아 하원의장의 대한민국 국회 방문은 26년 만으로, 양국 관계와 의회 간 교류･협력 발전에 큰 계기가 될 것으로", "language": "ko"}, {"title": "李대통령 \"튀르키예, 피를 나눈 형제…원전·방산 협력 심화\"", "url": "https://www.yna.co.kr/view/AKR20261103143800001", "source": "연합뉴스", "published": "2026-11-03T09:19:21+00:00", "summary": "(서울=연합뉴스) 임형섭 기자 = 이재명 대통령은 3일 \"튀르키예는 우리 국민의 마음속에서 '칸 카르데쉬', 즉 피를 나눈 형제로 자리 잡고 있...", "language": "ko"}, {"title": "이 대통령 \"튀르키예 원전 건설 협력 순조롭게 진행…韓기업 참여 선제적 지원\"", "url": "https://www.newsis.com/view/NISX20261103_0003853196", "source": "뉴시스", "published": "2026-11-03T09:14:44+00:00", "summary": "[서울=뉴시스] 김지은 기자 = 이재명 대통령은 3일 레제프 타이이프 에르도안 튀르키예 대통령과 정상회담을 하고 \"원전·방산·인프라 등 전략 분야에서 실질 협력을 더욱 내실화 해나가겠다\"고 밝혔다. 이 대통령은 이날 오후 청와대에 열린 한-튀르키예 정상회담 직후 공동 언론 발표를 통해 \"지난해 11월 합의한 사항들의 이행 성과를 점검하고, 양국 간 '전략적 동반자 관계'를 한층 더 심화시킬 방안에 대해 심도 있게 논의했다\"며 이같이 말했다. 이날 양국이 체결한 협력 문건은 원전과 에너지, 천연자원, 과학기술 분야 등 모두 4건이다.", "language": "ko"}, {"title": "日 방위에도 AI 바람…기대만큼 커지는 ‘해외 기술 의존’ 우려", "url": "https://www.newsis.com/view/NISX20261103_0003853361", "source": "뉴시스", " let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
</body>
</html>
