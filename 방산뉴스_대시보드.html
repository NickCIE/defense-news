 개발·해킹 자동화까지\"…北 김수키 AI 해킹 시뮬레이션 정황 포착", "url": "https://www.newsis.com/view/NISX20260810_0003742314", "source": "뉴시스", "published": "2026-08-10T00:50:49+00:00", "summary": "[서울=뉴시스]박은비 기자 = 북한 해커조직이 생성형 인공지능(AI)을 실제 해킹 과정에 활용하기 위한 기술 연구에 착수한 정황이 포착됐다. 단순 피싱 문구를 작성하는 수준을 넘어 악성코드 개발과 탈취 정보 자동 분석은 물론 공격 프로세스 전반의 자율화로 AI 활용 범위를 대폭 확대하려는 움직임을 보이고 있다는 설명이다.  10일 사이버 보안 전문기업 지니언스 시큐리티 센터(GSC)의 최신 위협 분석 보고서에 따르면, 북한 정찰정보총국 산하 해킹조직으로 추정되는 '김수키(Kimsuky)'는 최근 PC에서 직접 구동하는 온디바이스 A", "language": "ko"}, {"title": "[인사] 방위사업청", "url": "https://www.yna.co.kr/view/AKR20260810021100504", "source": "연합뉴스", "published": "2026-08-09T23:52:00+00:00", "summary": "◇ 고위공무원 신규임용", "language": "ko"}, {"title": "The Last Days Of The A-10 Warthog Weapons School", "url": "https://www.twz.com/air/the-last-days-of-the-a-10-warthog-weapons-school", "source": "The War Zone", "published": "2026-08-09T13:01:00+00:00", "summary": "The Weapons Instructor Course has been the center of excellence for the A-10 and its missions for nearly 50 years, but that's about to end. \n The post  The Last Days Of The A-10 Warthog Weapons School  appeared first on  TWZ .", "language": "en"}, {"title": "주한미군 방공부대, '제2도련선' 팔라우 전개해 실사격 훈련", "url": "https://www.yna.co.kr/view/AKR20260809051500504", "source": "연합뉴스", "published": "2026-08-09T12:38:49+00:00", "summary": "(서울=연합뉴스) 김철선 기자 = 주한미군 방공부대가 최근 서태평양 팔라우에서 미 태평양육군 주관으로 개최된 연합 훈련에 참여해 지대공미사일 실...", "language": "ko"}, {"title": "[쇼츠] '토마호크 40발' 美 버지니아급 SSGN 19척 건조 추진", "url": "https://www.yna.co.kr/view/AKR20260809035100704", "source": "연합뉴스", "published": "2026-08-09T07:56:53+00:00", "summary": "(서울=연합뉴스) 미 국방부가 건조 예정인 버지니아급 핵추진 공격잠수함(SSN) 19척을 핵추진 순항미사일잠수함(SSGN)으로 전환하기로 했다고...", "language": "ko"}, {"title": "스페이스X, 위성 100만기 띄운다는데…“우주쓰레기 걷잡을 수 없이 늘 수도” - 조선비즈 - Chosunbiz", "url": "https://news.google.com/rss/articles/CBMijAFBVV95cUxQWk1lWlY5cndvUjM5enduM0FSXzFKd3Y1YmlfdkpjOWtlOVVUYUoxUVpmUjJURjhDVFEyeW5IMVRRSVFzajNxSVN5TVVPTUVzamdrUkk2cTJhUjEta0UySG1MUTl1QldXRTlrdE9q const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
