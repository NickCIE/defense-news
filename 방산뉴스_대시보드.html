"language": "ko"}, {"title": "일본 7월 산업생산 0.2%↓…\"4개월 만에 감소\"", "url": "https://www.newsis.com/view/NISX20260914_0003788941", "source": "뉴시스 경제", "published": "2026-09-14T07:24:23+00:00", "summary": "[서울=뉴시스]이재준 기자 = 일본 제조업 경기 흐름을 파악할 수 있는 7월 산업생산은 4개월 만에 감소했다. 닛케이 신문과 지지(時事) 통신에 따르면 일본 경제산업성은 14일 7월 광공업 생산지수(2020년=100 계절조정 확정치)가 104.4로 전월 대비 0.2% 하락했다고 발표했다. 시장에서는 0.5% 하락한다고 예상했는데 실제로는 이를 0.3% 포인트 밑돌았다. 속보치 0.1% 증가에서 0.3% 포인트 하향 조정했다. 6월은 1.9%(조정치) 상승했다. 7월 산업생산은 전년 동월에 비해선 3.9% 늘어났다. 증가율은 6월 4", "language": "ko"}, {"title": "스틸 주한 美 대사 \"외교 2차관과 팩트시트 이행 논의\"", "url": "https://www.newsis.com/view/NISX20260914_0003788844", "source": "뉴시스", "published": "2026-09-14T06:52:31+00:00", "summary": "[서울=뉴시스] 유자비 기자 = 미셸 스틸 주한미국대사가 김진아 외교부 2차관을 만나 한미 조인트팩트시트(공동 설명자료) 이행에 대해 논의했다고 14일 밝혔다.  스틸 대사는 이날 소셜미디어 엑스(X·옛 트위터)를 통해 \"조인트 팩트시트에 담긴 우리 대통령들 간 합의의 이행에 대해 논의하기 위해 김 차관과 훌륭한 만남을 가졌다\"라고 적었다.  스틸 대사는 지난 11일 서울 외교부 청사를 찾아 김 차관과 만남을 가졌다. 이 자리에서 지난해 11월 발표된 조인트 팩트시트에 담긴 대미투자, 핵추진 잠수함 건조, 원자력 연료 농축·재처리 ", "language": "ko"}, {"title": "'김정은의 도박'…'북한군 5만명 추가 파병설' 이유 있다?", "url": "https://www.newsis.com/view/NISX20260914_0003788511", "source": "뉴시스", "published": "2026-09-14T06:47:19+00:00", "summary": "[서울=뉴시스]신정원 기자 = 북한이 러시아-우크라이나 전쟁에 투입했던 병력의 대규모 손실에도 불구하고 추가 파병을 단행할 가능성이 높다고 외신이 보도했다. 현대전 경험을 쌓는 한편, 러시아와의 협력을 통해 경제·군사적 이익을 얻고 있다는 분석에서다. 북한은 2024년 말 러시아 본토 쿠르스크 지역에 약 1만3000명을 파병했다. 우크라이나 국방부 산하 군사정보국(HUR)은 이 가운데 3000명이 전사하고 1500명이 부상한 것으로 추정한다.  북한군은 초기에 드론과 자동화기 공격에 노출된 상황에서 돌격 전술을 구사했고, 항복보다는", "language": "ko"}, {"title": "102기갑여단, 고성·속초·양양서 18일까지 화랑훈련 실시", "url": "https://www.yna.co.kr/view/AKR20260914127200062", "source": "연합뉴스", "published": "2026-09-14T06:39:44+00:00", "summary": "(양양=연합뉴스) 류호준 기자 = 육군 제102기갑여단은 오는 18일까지 강원 속초시와 양양군, 고성군 일대에서 화랑훈련 및 동시 통합훈련을 실...", "language": "ko"}, {"title": "농림위성, 종자 생산·관리 분야까지 활용 범위 넓힌다", "url": "https://www.newsis.com/view/NISX20260914_0003788692", "source": "뉴시스 경제", "published": "2026-09-14T06:27:05+00:00", "summary": "[세종=뉴시스]김동현 기자 = 농촌진흥청 국립농업과학원은 14일 농림위성 영상을 활용한 보급종 씨받이밭(채종포) 생산·관리 분야 협력 강화를 위해 국립종자원과의 업무협약을 개정했다고 밝혔다.  양 기관은 2024년 9월 농업유전자원의 안전한 보존과 국제 수준의 종자 연구 협력을 위해 업무협약을 체결했다.  협약에 따라 양 기관은 법적 종자 중복 저장, 작물 유전체 구조 분석, 품종 식별을 위한 분자표지(마커) 개발, 농작물 병해충 연구 등 다양한 분야에서 협력해 왔다. 이번 개정은 지난 7월 농림위성이 발사됨에 따라 위성정보를 종자", "language": "ko"}, {"title": "국힘, 용혜인 사퇴에 \"꼼수 비례가 문제\"…준연동형 비례제 폐지 추진", "url": "https://www.newsis.com/view/NISX20260914_0003788734", "source": "뉴시스", "published": "2026-09-14T06:17:03+00:00", "summary": "[서울=뉴시스]하지현 기자 = 국민의힘은 14일 용혜인 성평등가족부 장관 후보자가 장관·의원직 겸직 논란 끝에 사퇴한 것을 두고 \"비례대표 제도 악용을 막기 위한 재검토가 필요하다\"며 준연동형 비례대표제 폐지를 추진하겠다고 밝혔다. 나경원 의원과 강명구·김소희·김재섭·김태규·임종득·조지연 의원 등은 이날 국회에서 기자회견을 열고 \"이 사건의 본질은 의원·장관 겸직 문제가 아니라, 준연동형 비례제로 비례 의원이 원내에 꼼수로 진입하는 것\"이라고 말했다. 이들은 \"용혜인 후보자가 결국 사퇴했다\"며 \"준연동형 비례제라는 악법과, 민주당과", "language": "ko"}, {"title": "8기동사단, 17∼22일 포천·연천·철원서 전술훈련", "url": "https://www.yna.co.kr/view/AKR20260914118900060", "source": "연합뉴스", "published": "2026-09-14T06:10:05+00:00", "summary": "(양주=연합뉴스) 임병식 기자 = 육군 8기동사단은 17일부터 22일까지 경기 포천과 연천, 강원 철원 일대에서 전술훈련을 한다고 14일 밝혔다...", "language": "ko"}, {"title": "나경원 \"강신철, 철거민 딱지 일가족 4명…개인 사정? 이해 안 돼\"", "url": "https://www.newsis.com/view/NISX20260914_0003788690", "source": "뉴시스", "published": "2026-09-14T05:58:35+00:00", "summary": "[서울=뉴시스] 김종민 기자 = 용혜인 성평등가족부 장관 후보자 논란이 일단락 되면서 강신철 국방부 장관 후보자가 과거 일가족과 함께 철거민 특별공급 분양권을 받아 강남권 아파트를 사들였다는 의혹이 재부각되고 있다.  14일 TV조선 방송 프로그램 '강적들'에 출연한 나경원 국민의힘 의원은 강 후보자의 분양권 취득 과정을 두고 문제를 지적했다. 나 의원은 방송에서 \"강신철 국방장관 후보자는 일가족 철거민 딱지 분양 의혹을 받으면서 논란의 중심에 섰다\"라며 \"다른 장관 후보자들은 이런 개인 사정을 조금 이해해 줄 부분이 있는 것 같은", "language": "ko"}, {"title": "AI 개발 늦추려다 中에 주도권 내줄라…美 '안전 vs 속도' 딜레마", "url": "https://www.newsis.com/view/NISX20260914_0003788272", "source": "뉴시스 경제", "published": "2026-09-14T05:55:29+00:00", "summary": "[서울=뉴시스]박미선 기자 = 인공지능(AI)이 예상보다 빠르게 발전하면서 AI 업계가 딜레마에 빠졌다. 시험 중이던 AI 에이전트가 인간의 통제를 벗어나 외부 시스템을 공격하는 사례가 잇따르면서 주요 AI 기업 수장들이 개발 속도를 늦춰야 한다는 데 이례적으로 뜻을 모았지만, 미국이 속도 조절에 나설 경우 중국에 AI 주도권을 내줄 수 있다는 우려도 const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
