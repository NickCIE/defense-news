19T10:02:17+00:00", "summary": "[계룡대=뉴시스]곽상훈 기자 = 국회 국방위원회 여당 의원들은 19일 제이비어 브런슨 주한미군사령관의 영토주권 축소 발언에 대해 맹비난하고 나섰다. 여당 소속 국방위원들은 이날 충남 계룡대에서 김규하 육군참모총장이 출석한 가운데 열린 육군본부 국장감사에서 브런슨 사령관의 발언을 이구동성으로 비난했다. 브런슨 사령관은 지난 14일 비무장지대(DMZ) 관할 책임을 설명하면서 \"유엔사의 관점에서 보면 대한민국은 남쪽 철책선에서 시작한다\"고 말해 국민적 공분을 샀다. 더불어민주당 황명선 의원은 브런슨 사령관의 발언을 위헌적 영토주권 침해로", "language": "ko"}, {"title": "고양국제박람회재단·한국방위산업MICE협회, 방산 전시회 유치 업무협약 - 내외뉴스통신", "url": "https://news.google.com/rss/articles/CBMibEFVX3lxTE9fSGtEbno3WGNBcUt1MzdoVE5NQll2a3pTbFRuaTl3RkwzVG8wd3VXYVEzb19qSi1sSTdibGxJRFFaam1weF9kQm55WHhxNjUwLWt0TFByMHU1S1hDZXBzSXNEaG5jcjFXTGkzOA?oc=5", "source": "방산 뉴스", "published": "2026-10-19T09:50:35+00:00", "summary": "고양국제박람회재단·한국방위산업MICE협회, 방산 전시회 유치 업무협약    내외뉴스통신", "language": "ko"}, {"title": "\"2작사, 원전 등 국가시설 보호 레이더 부족\"…국감서 지적", "url": "https://www.yna.co.kr/view/AKR20261019166400053", "source": "연합뉴스", "published": "2026-10-19T09:35:35+00:00", "summary": "(대구=연합뉴스) 황수빈 기자 = 육군 제2작전사령부(2작사) 관할 지역의 국가중요시설을 보호할 군 방호체계가 부족하다는 지적이 국정감사에서 제...", "language": "ko"}, {"title": "Qatar will soon announce local defence production hub, minister of state says - Reuters", "url": "https://news.google.com/rss/articles/CBMixgFBVV95cUxOa1NSbS1JNV82NURyOVROZGxMc29reXNCU1RIdzlnVFFxbWhtMmdiV0w4TVFiXzJFRmZrREY0TzJDVGFjcUQteV9FVkRkT3VFRkd6TnY2Wk5pQVFZb3NSWHg1R1RDUkQ3UHFQRkpZUVA0ZGpJeEh0LW1uUmV6LVRHRm82eXZEbVlTWi1oeVFuZGdJalp6ZVplUDkwdE9CN2pqZmhrWlNMUzFYb2szTzdSLUNzR3dXRFhHTnR2VGJ5X2pGSnN6THc?oc=5", "source": "Reuters", "published": "2026-10-19T09:23:43+00:00", "summary": "Qatar will soon announce local defence production hub, minister of state says    Reuters", "language": "en"}, {"title": "美정부, 올해 순이자비용 1417조원 넘어…국방비보다 많아", "url": "https://www.newsis.com/view/NISX20261019_0003831979", "source": "뉴시스 경제", "published": "2026-10-19T09:08:33+00:00", "summary": "[서울=뉴시스]염준호 수습 기자 = 미국 연방정부의 연간 순이자비용(지급 이자 총액에서 이자 수입액을 뺀 금액)이 처음으로 1조달러를 넘어섰다. 국가채무가 늘고 금리도 오르면서 순이자 비용이 전년보다 800억달러(약 108조원) 더 늘었다.  16일(현지시간) 미국 CNN 등 외신에 따르 능하지 않아…정보 조작해 이라크 침략\"", "url": "https://www.newsis.com/view/NISX20261019_0003832094", "source": "뉴시스", "published": "2026-10-19T07:33:06+00:00", "summary": "[서울=뉴시스] 김난영 기자 = 대통령 평화외교특보인 송영길 더불어민주당 의원이 \"미국의 정보자산과 판단 능력이 절대 전지전능한 게 아니고 아주 잘못된 경우가 많다\"고 말했다. 송 의원은 19일 육군본부에서 열린 국방위 국정감사에서 김규하 육군참모총장을 상대로 질의 중 \"미국이 얼마나 잘못을 많이 저질렀나. 1964년 미국이 통킹만 사건 2차 공격을 거짓으로 해서 베트남전 확대 계기로 활용했다\"며 이같이 말했다. 송 의원은 이어 \"이라크에 핵무기가 없고 대량살상무기도 없는데 CIA가 정보를 조작해 이라크를 침공한 것 아닌가\"라며 \"", "language": "ko"}, {"title": "이 대통령 \"소방관의 헌신, '마지막 출동'으로 끝나지 않도록 대책 마련할 것\"", "url": "https://www.newsis.com/view/NISX20261019_0003832035", "source": "뉴시스", "published": "2026-10-19T07:09:50+00:00", "summary": "[서울=뉴시스]김경록 기자 = 이재명 대통령은 19일 \"소방관의 헌신이 비극적인 '마지막 출동'으로 끝나지 않도록 현장에서 체감할 수 있는 실효성 있는 대책을 마련하겠다\"고 밝혔다. 이 대통령은 이날 오후 X(옛 트위터)에 지난달 화재 진압 중 화상을 입은 소방관 남편을 간호 중인 아내가 경찰의 호위와 시민들의 협조로 당시 구급차가 병원에 빨리 도착한 데 대해 감사를 표했다는 내용의 기사를 공유하며 이같이 적었다. 이 대통령은 \"국민을 지키다 심각한 부상을 입으신 소방대원께 송구한 마음\"이라며 \"얼마나 고통스럽고 힘든 시간을 보내고", "language": "ko"}, {"title": "육해공사관학교 \"통폐합이냐 창설이냐\"…육본 국감 설전", "url": "https://www.newsis.com/view/NISX20261019_0003831860", "source": "뉴시스", "published": "2026-10-19T06:36:02+00:00", "summary": "[계룡대=뉴시스]곽상훈 기자 = 육군본부에 대한 국회국방위원회 국정감사에서 육해공군사관학교 통폐합 창설에 대한 설전이 이어졌다.  19일 충남 계룡대에서 열린 국감에서 김규하 육군참모총장은 대전 자운대에 신설할 국군사관학교는 육해공군사관학교 통폐합이 아니라 창설이라고 주장해 곤혹을 치렀다. 국민의힘 임종득 의원은 김 총장을 향해 육해공군사관학교 통폐합과 관련해 국방부에 의견을 개진한 적이 있느냐면서 \"의견을 제시했다면 육군본부 내 정식회의나 주요 지휘관 회의를 통해 의견을 내는 게 정상적 절차다\"라며 \"국방부는 공식적 의견 수렴 절", "language": "ko"}, {"title": "강신철, 주한일본대사 접견…한일 국방교류협력 발전 공감", "url": "https://www.newsis.com/view/NISX20261019_0003831892", "source": "뉴시스", "published": "2026-10-19T06:15:47+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 강신철 국방부 장관은 19일 오후 용산 국방부 청사에서 미즈시마 고이치 주한일본대사를 접견하고, 한반도 및 지역안보 정세와 주요 한일 국방교류협력 현안에 대해 의견을 교환했다.  강 장관은 미즈시마 대사의 방문을 환영하며, 한일 관계 발전을 위해 미즈시마 대사가 양국 간 신뢰와 협력을 잇는 든든한 가교 역할을 해주길 당부했다.  양측은 호혜적·미래지향적인 한일 국방교류협력의 안정적 추진 필요성에 대해 인식을 같이했다. 동시에 한일 협력의 긍정적 모멘텀을 지속해 나가기 위해 긴밀히 소통해 나가기로 했다", "language" const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
