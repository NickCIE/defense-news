ource": "뉴시스", "published": "2026-07-31T01:24:31+00:00", "summary": "[서울=뉴시스]조재완 기자 = 정부가 내달 1일부터 10월31일까지 3개월간 하반기 범정부 마약류 특별단속을 실시한다고 31일 밝혔다.  휴가철과 추석 연휴 등 마약류 범죄가 늘어날 가능성이 큰 시기에 해외 밀반입 차단, 유흥업소 단속, 의료용 마약류 불법유통 점검을 집중적으로 진행할 계획이다. 이번 특별단속은 대검찰청 주관으로 열린 마약류대책협의회 수사·단속·정보 실무분과협의회에서 관계기관 협의를 거쳐 마련됐다. 정부는 최근 마약류 사범이 매년 2만명을 웃돌고, 20·30대 비중이 전체의 약 60%에 이르는 점을 고려해 선제 대응", "language": "ko"}, {"title": "STX엔진-디노티시아, 창원 방산 AI 데이터센터 사업 협력 - koreasprint.com", "url": "https://news.google.com/rss/articles/CBMibkFVX3lxTFBPTmVxcUJOM1l3VDk2YlNodmhXbFQ3NFNicmk2NE55WU5DUXJqMDZ4aXVxUm1OUmFEcWs4Z3JjM09TY1FkQUVWTm9lTHVURzFYUnZRME5DTzQ5cnJoQXhiYzQzYjJQaGozZl9Jc0Rn?oc=5", "source": "방산 뉴스", "published": "2026-07-31T01:16:00+00:00", "summary": "STX엔진-디노티시아, 창원 방산 AI 데이터센터 사업 협력    koreasprint.com", "language": "ko"}, {"title": "육군 특전사, 30도 넘는 무더위 속 해상침투훈련 실시 [뉴시스Pic]", "url": "https://www.newsis.com/view/NISX20260731_0003731198", "source": "뉴시스", "published": "2026-07-31T01:14:44+00:00", "summary": "[서울=뉴시스] 류현주 기자 = 육군 특수전사령부는 특전대원들의 전시 해상침투 및 퇴출 능력 강화를 목표로 실전적이고 강도 높은 해상침투훈련을 진행했다. 특전사 예하 독수리부대는 지난 27일부터 31일까지 충남 보령 무창포 일대에서 해상침투훈련을 실시했다. 특전대원들은 본격적인 해상침투에 앞서 30도가 넘는 무더위에도 불구하고 PT체조, 보트 기동, 오리발 차기, 10km 해안 달리기 등으로 전투체력을 끌어올렸다. 이어 IBS보트(소형고무보트) 모터 조작과 고속침투 간 종·횡 대형 유지, 패들링을 활용한 은밀 침투 등 과제별 훈련을", "language": "ko"}, {"title": "젤렌스키 \"러, 최근 공격서 北미사일 사용\"", "url": "https://www.newsis.com/view/NISX20260731_0003730976", "source": "뉴시스", "published": "2026-07-31T01:02:32+00:00", "summary": "[서울=뉴시스]신정원 기자 = 볼로디미르 젤렌스키 우크라이나 대통령은 30일(현지 시간) 러시아가 최근 공격에서 북한산 탄도미사일을 사용한 정황이 포착됐다고 주장했다. 아나돌루 통신에 따르면 젤렌스키 대통령은 텔레그램을 통해 \"예비 분석 결과 라두슈네 마을 공격에 사용된 무기는 북한산 탄도미사일인 것으로 보인다\"며 \"현재 전문가들이 조사를 진행 중이며 모든 내용은 추가 검증을 거칠 것\"이라고 밝혔다. 젤렌스키 대통령은 이번 사례가 러시아와 북한 간 군사 협력이 더욱 강화되고 있음을 보여준다고 주장했다. 이어 북한이 러시아에 미사일과", "language": "ko"}, {"title": "한국형구축함 선도함 건조 본격 착수…방사청, 한화오션과 계약 체결", "url": "https://www.newsis.com/view/NISX20260731_0003731156", "source": "뉴시스", "published": "2026-07-31T01:00:34+00:00", "summary": "[서울=뉴시스] 옥승욱 기자 = 방위사업청은 31일 한화오션과 한국형구축함(KDDX) 상세설계 및 선도함건조 계약을 체결했다고 밝혔다.  이번 계약체결로 KDDX 사업은 '상세설계 및 선도함건조' 단계에 본격 진입하게 됐다. 해군 기동함대의 핵심전력 확보도 힘을 받게 됐다.  한국형구축함(KDDX) 사업은 그동안 축적된 함정 건조기술을 총집약하고, 대부분의 탑재 무기체계를 국산화하는 등 우리 기술로 국내 최초의 ‘한국형 이지스구축함’을 건조하는 사업이다.  약 7조8000억원을 투입해 6000t급 미니 이지스함 6척 실전 배치를 목", "language": "ko"}, {"title": "'AI 수상로봇 통합 관제' 해수부 비즈니스 공모전 대상", "url": "https://www.newsis.com/view/NISX20260731_0003730799", "source": "뉴시스 경제", "published": "2026-07-31T01:00:00+00:00", "summary": "[서울=뉴시스]정진형 기자 = 인공지능(AI) 분석과 드론 기술을 활용한 'AI 기반 수상로봇 통합관제 시스템'이 해양수산부가 주관하는 행정서비스 혁신 공모전에서 대상의 영예를 안았다. 해양수산부는 '2026년 해양수산 비즈니스·공공서비스 공모전'을 열고 총 11건의 수상작을 선정했다고 31일 밝혔다. 공모전은 2014년부터 개최돼 올해로 13회째를 맞았다. 이번 공모전에는 ▲아이디어 기획 ▲제품 및 서비스 ▲빅데이터 분석 등 3개 부문에 총 168건이 접수됐다. 서면 및 발표 심사를 거쳐 대상 1건, 최우수상 3건, 우수상 7건이", "language": "ko"}, {"title": "Tim Cook sees Apple's hybrid AI strategy as a 'competitive weapon'", "url": "https://www.cnbc.com/2026/07/30/tim-cook-sees-apples-hybrid-ai-strategy-as-a-competitive-weapon-.html", "source": "CNBC World", "published": "2026-07-31T00:23:53+00:00", "summary": "Ahead of the launch of Siri AI, Apple's outgoing CEO Tim Cook said the company will charge for artificial intelligence through iCloud.", "language": "en"}, {"title": "이 대통령, 칠레 방문 마치고 네번째 순방국 아르헨티나로 출발", "url": "https://www.newsis.com/view/NISX20260731_0003730726", "source": "뉴시스", "published": "2026-07-31T00:20:16+00:00", "summary": "[산티아고·서울=뉴시스] 김지은 조재완 기자 = 이재명 대통령이 30일(현지시간) 칠레 공식 방문 일정을 마치고 네 번째 순방국인 아르헨티나로 향했다. 이 대통령과 부인 김혜경 여사, 수행단을 태운 공군 1호기는 이날 오후 8시 10분께 산티아고 아르투로 메리노 베니테스 공항에서 아르헨티나 부에노스아이레스로 이륙했다. 우리 측에서는 김학재 주칠레대사 내외가, 칠레 측에서는 파트르시오 토레스 외교차관과 오스카르 푸엔테스 의전장 등이 나와 이 대통령 부부를 배웅했다. 이 대통령은 칠레에서 호세 안토니오 카스트 대통령과 정상회담을 하고 ", "language": "ko"}, {"title": "구윤철 \"전산업생산 6년 만 최대폭…경제 구조혁신 박차\"", "url": "https://www.newsis.com/view/NISX20260731_0003731004", "source": "뉴시스 경제", "published": "2026-07-31T00:16:50+00:00", "summary": "[세종=뉴시스]여동준 기자 = 구윤철 부총리 겸 재정경제부 장관이 \"6월 전산업생산이 6년 만에 가장 큰 폭으로 증 s In Army Wargame    breakingdefense.com", "language": "en"}];

const BADGE = {
  "Reuters":"b-reuters","CNBC":"b-cnbc","CNBC World":"b-cnbc",
  "Breaking Defense":"b-breaking-defense","Breaking Defense (GNews)":"b-breaking-defense",
  "The War Zone":"b-the-war-zone","Defense One":"b-defense-one",
  "Defense News":"b-defense-news","New York Times":"b-new-york-times",
  "연합뉴스":"b-연합뉴스","연합뉴스 경제":"b-연합뉴스",
  "뉴시스":"b-뉴시스","뉴시스 경제":"b-뉴시스",
  "조선비즈":"b-조선비즈","한국경제":"b-한국경제",
  "한국경제 정치":"b-한국경제","한국경제 경제":"b-한국경제","한국경제 국제":"b-한국경제",
  "방산 뉴스":"b-방산-뉴스",
};

let activeLang = "", activeSrc = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rel(iso){
  try {
    const d = (Date.now() - new Date(iso)) / 1000;
    if(d < 3600) return Math.floor(d/60)+"분 전";
    if(d < 86400) return Math.floor(d/3600)+"시간 전";
    if(d < 172800) return "어제";
    const dt = new Date(iso);
    return (dt.getMonth()+1)+"/"+ dt.getDate();
  } catch{ return ""; }
}

function render(){
  const q = document.getElementById("q").value.toLowerCase();
  const items = ALL.filter(a => {
    if(activeLang && a.language !== activeLang) return false;
    if(activeSrc  && a.source  !== activeSrc)  return false;
    if(q && !(a.title+a.summary).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("count").textContent = items.length;
  document.getElementById("meta").innerHTML =
    items.length ? `<span>${items.length}</span>건 표시 중` : "";
  const grid = document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="placeholder">표시할 기사가 없습니다.</div>'; return; }
  grid.innerHTML = items.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge ${BADGE[a.source]||"b-default"}">${esc(a.source)}</span>
        <span class="card-date">${rel(a.published)}</span>
      </div>
      <div class="card-title"><a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ""}
      <div class="card-footer"><a class="card-link" href="${a.url}" target="_blank" rel="noopener">원문 보기 →</a></div>
    </div>`).join("");
}

function buildSrcFilters(){
  const sources = [...new Set(ALL.map(a => a.source))].sort();
  document.getElementById("srcFilters").innerHTML = sources.map(s =>
    `<button class="filter-btn" data-src="${s}">${s}</button>`).join("");
  document.querySelectorAll("#srcFilters .filter-btn").forEach(b => {
    b.onclick = () => {
      activeSrc = b.dataset.src === activeSrc ? "" : b.dataset.src;
      document.querySelectorAll("#srcFilters .filter-btn").forEach(x => x.classList.remove("active"));
      if(activeSrc) b.classList.add("active");
      render();
    };
  });
}

document.querySelectorAll("#langFilters .filter-btn").forEach(b => {
  b.onclick = () => {
    activeLang = b.dataset.lang;
    document.querySelectorAll("#langFilters .filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});

buildSrcFilters();
render();
</script>
